  }

  window.addEventListener("keydown", function(e){
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (captureKeyBind(e)) return;           // Settings is waiting for a key to assign
    // While a full-screen surface is up it owns the keyboard — otherwise
    // typing in the character creator walks the player around behind it.
    if (!charEditorOverlay.hidden || !pauseOverlay.hidden){
      if (isAction("pauseMenu", e.code) && !e.repeat){ e.preventDefault(); onEscape(); }
      return;
    }
    // Modifier combos first, and they never leak into movement — Ctrl+D
    // used to walk you to the right while it duplicated.
    if (e.ctrlKey || e.metaKey){
      if (e.code === "KeyZ" && !e.repeat){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (e.code === "KeyY" && !e.repeat){ e.preventDefault(); redo(); return; }
      if (e.code === "KeyS"){ e.preventDefault(); doSave(); return; }
      if (e.code === "KeyL"){ e.preventDefault(); openLoad(); return; }
      if (e.code === "KeyN"){ e.preventDefault(); doNew(); return; }
      if (e.code === "KeyD" && !e.repeat){ e.preventDefault(); duplicateSelected(); return; }
      if (e.code === "Equal" || e.code === "NumpadAdd"){ e.preventDefault(); zoomAround(camCenterWorld(), 1.25); updateViewHud(); return; }
      if (e.code === "Minus" || e.code === "NumpadSubtract"){ e.preventDefault(); zoomAround(camCenterWorld(), 0.8); updateViewHud(); return; }
      return;
    }
    if ((e.code === "Delete" || e.code === "Backspace") && selected && mode === "build" && !e.repeat){
      e.preventDefault();
      /* Del removes the PIECE you clicked, not the whole object — draw a
         line of sponge through a wooden circle and Del takes the sponge,
         leaving the circle. Taking the whole object off a single click was
         the wrong default: the piece is what you were pointing at, and
         cutting was the only way to get rid of one before this.

         The whole object is still one gesture away — double-click it, or
         rubber-band it — and both of those leave selectedRegion null, which
         is exactly the condition below. regionIsWhole keeps a one-material
         object behaving as it always did, since there the piece and the
         object are the same thing. */
      if (selList().length === 1 && selectedRegion && selectedRegion.obj === selected &&
          regionValid(selectedRegion) && !regionIsWhole(selectedRegion)){
        deleteSelectedRegion();

        deleteSelected();
      }
      return;
    }

    if (isAction("right", e.code)) input.right = true;
    // Up/Down are recorded whatever you're doing; what they mean is up
    // to the movement code, which uses them for flying AND for swimming.
    if (isAction("up", e.code)){ input.up = true; e.preventDefault(); }
    if (isAction("down", e.code)){ input.down = true; e.preventDefault(); }
    if (isAction("jump", e.code)){
      e.preventDefault();
      if (!e.repeat) handleJumpOrFlyToggle();
    }
    if (isAction("pauseMenu", e.code) && !e.repeat){ e.preventDefault(); onEscape(); }
    if (isAction("layerDown", e.code) && !e.repeat) setBuildLayer(buildLayer - 1);
    if (isAction("layerUp", e.code) && !e.repeat) setBuildLayer(buildLayer + 1);
    if (isAction("menu", e.code) && !e.repeat){ e.preventDefault(); togglePersonalMenu(); }
    if (isAction("glue", e.code) && !e.repeat && mode === "build"){ e.preventDefault(); enterGlueMode(); }
    if (isAction("pause", e.code) && !e.repeat){ togglePause(); }
    if (isAction("reset", e.code) && !e.repeat){ resetCharacterPosition(); }
    if (isAction("recenter", e.code) && !e.repeat){ recenterCamera(); }
    if (isAction("grid", e.code) && !e.repeat && mode === "build"){ toggleGrid(); }

    if (isAction("brushUp", e.code)) nudgeBrush(1);
    // The number row means two different things depending on what you're

  function nudgeBrush(dir){
    var step = dir > 0 ? 1.18 : 1/1.18;
    var next = Math.max(PAINT_SCALE_MIN, Math.min(PAINT_SCALE_MAX, paintScale * step));
    if (Math.abs(next - paintScale) < 0.02) next = Math.max(PAINT_SCALE_MIN, Math.min(PAINT_SCALE_MAX, paintScale + dir*0.05));
    if (next === paintScale) return;
    paintScale = next; persistPaintBrush();
    if (pmOpen) renderPersonalMenu();
    sfx("tick");
    showToast("Brush: " + Math.round(paintScale*BRUSH_R*2) + "px");
  }

    if (!matOf(currentTool)) currentTool = id;

  function enterGlueMode(){
    glueMode = true; glueFirst = null;

  }
  function exitGlueMode(){
    if (!glueMode) return;

  }

  // ---- Physics-driven movement (runs inside Matter's own step, so it
  // only fires while the sim is unpaused — collisions resolve normally). ----
  onStep("beforeUpdate", function(){
    if (!player || !runner.enabled) return;
    var speed = flying ? FLY_SPEED : 4.2;
    var vx = 0;
    if (input.left) vx -= speed;
    if (input.right) vx += speed;
    if (vx !== 0) facing = vx > 0 ? 1 : -1;

    if (flying){
      var vy = 0;
      if (input.up) vy -= FLY_SPEED;
      if (input.down) vy += FLY_SPEED;
      Body.setVelocity(player, { x: vx, y: vy });
      var g = engine.gravity, gscale = (typeof g.scale !== "undefined") ? g.scale : 0.001;
      Body.applyForce(player, player.position, { x: -player.mass*g.x*gscale, y: -player.mass*g.y*gscale });
    } else {
      // Swimming. Buoyancy alone holds you at the surface with no way
      // back down, which reads as the game breaking — you drift left and
      // right and never fall. In water you get full directional control
      // instead: sink with Down, rise with Up, and Space is a stroke
      // upward that can breach the surface.
      var wet = playerWetness();
      if (wet > 0.35 && !ropeConstraint){
        var vy = player.velocity.y;
        if (input.up) vy = -SWIM_SPEED;
        else if (input.down) vy = SWIM_SPEED;
        if (input.jumpQueued){
          vy = -SWIM_SPEED*1.5;
          sfx("splash");
          puff(player.position.x, player.position.y, 6, { color:"#8FD3F0", speed:1.6, g:0.05 });
        }
        Body.setVelocity(player, { x: vx*0.74, y: vy });   // water drags on you
      } else {
        Body.setVelocity(player, { x: vx, y: player.velocity.y });
        if (input.jumpQueued && grounded && !ropeConstraint){
          Body.setVelocity(player, { x: player.velocity.x, y: -14 });
          grounded = false;
          sfx("jump");
          puff(player.position.x, player.position.y + PH/2, 5,
               { color:"#E8DCC0", speed:1.5, g:0.08, angle:Math.PI/2, spread:2.4, life:20 });
        }
      }
    }
    input.jumpQueued = false;

    if (mode === "play" && player.position.y > WORLD_H + 400){
      respawnPlayer("Whoa — resetting to start.");
    }
  });

  // ---- Manual, physics-independent movement for while the sim is
  // paused — "the player should be able to move around when the
  // physics are paused." Runner.run() never calls Engine.update while
  // disabled, so beforeUpdate above never fires; this runs straight
  // off the render loop instead and just translates the body directly. ----
  var lastFreeMoveT = performance.now();
  function freeMoveIfPaused(now){
    var dt = Math.min(50, now - lastFreeMoveT);
    lastFreeMoveT = now;
    if (!player || runner.enabled) return;
    var speed = (flying ? FLY_SPEED : 4.2) * (dt/16.666);
    var dx = 0, dy = 0;
    if (input.left) dx -= speed;
    if (input.right) dx += speed;
    if (dx !== 0) facing = dx > 0 ? 1 : -1;
    if (flying){
      if (input.up) dy -= speed;
      if (input.down) dy += speed;
    }
    if (dx || dy) Body.translate(player, { x:dx, y:dy });
  }

  /* ============================================================
     4b. World snapshots — one complete, restorable picture of the
     level: objects, bolts, flags, water, player. Undo keeps a stack of
     these, and switching modes stores the exact snapshot taken the
     instant you left Build, so Play never leaks back into it — step on
     a dissolve platform in Play and it's whole again the moment you go
     back to building.
     ============================================================ */
  /* An object as plain data: its regions' contours, delta-encoded at
     an eighth of a pixel, plus the frame they were measured in. This is
     both the save format and what undo keeps, and it is about a
     twentieth the size of the circle list it replaces. */
  function packObject(o){
    var d = {
      layer: o.layer, forcedStatic: !!o.forcedStatic,
      x: o.body.position.x, y: o.body.position.y, a: o.body.angle,
      pieces: o.pieces.map(function(pc){ return { m: pc.m, g: pgPack(pc.poly) }; })
    };
    if (o.glow != null && o.glow !== 1) d.glow = o.glow;
    if (o.lightSolid) d.lightSolid = 1;
    if (o.lightFalls) d.lightFalls = 1;
    return d;
  }
  /* Corners left in this load's budget. A level file is untrusted input
     — it can arrive from anyone once levels are shared — and an
     unbounded corner count is the cheapest way to lock up someone's
     browser, so a load spends from a fixed budget and simply stops
     when it runs out. */
  var loadBudget = 0;
  function unpackObject(os){
    if (!os || !Array.isArray(os.pieces)) return null;
    if (loadBudget <= 0) return null;
    var pieces = [], i;
    for (i = 0; i < os.pieces.length && i < 64; i++){
      var pc = os.pieces[i];
      if (!pc || !matOf(pc.m) || matOf(pc.m).isFluid) continue;
      var poly = pgClean(pgUnpack(pc.g, Math.min(loadBudget, MAX_OBJ_CORNERS)), GEOM_TOL);
      if (!poly.length) continue;
      loadBudget -= pgVertexCount(poly);
      pieces.push({ m: pc.m, poly: poly });
      if (loadBudget <= 0) break;
    }
    if (!pieces.length) return null;
    var made = spawnObjectFromPieces(pieces, os.layer,
      { a: +os.a || 0, x: +os.x || 0, y: +os.y || 0 }, !!os.forcedStatic);
    if (made && os.glow != null) made.glow = clampGlow(os.glow);
    if (made){
      made.lightSolid = !!os.lightSolid;
      made.lightFalls = !!os.lightFalls;
    }
    return made;
  }
  /* An old level stored every shape as the pile of circles it was
     painted with. Union each material's circles into one real contour,
     and let whatever was painted LAST own any overlap — which is what
     the old renderer drew on top, so the level comes back looking like
     itself, minus the scalloped edges. */
  function migrateDabObject(os){
    if (!os || !Array.isArray(os.parts) || !os.parts.length) return null;
    if (loadBudget <= 0) return null;
    var byMat = {}, order = [], i, j;
    for (i = 0; i < os.parts.length && i < 40000; i++){
      var p = os.parts[i];
      if (!p || !matOf(p.m) || matOf(p.m).isFluid) continue;
      var x = +p.x, y = +p.y, r = Math.max(1, Math.min(400, +p.r || BRUSH_R));
      if (!isFinite(x) || !isFinite(y)) continue;
      if (!byMat[p.m]){ byMat[p.m] = { rings: [], last: i }; order.push(p.m); }
      byMat[p.m].last = i;
      var shp = (p.s === "square" || p.s === "diamond") ? p.s : "circle";
      byMat[p.m].rings.push([[ brushRing(shp, x, y, r, 0, 0.3) ]]);
    }
    order.sort(function(a, b){ return byMat[a].last - byMat[b].last; });
    var pieces = [];
    order.forEach(function(m){
      var poly = pgUnionMany(byMat[m].rings, GEOM_TOL_MIG);
      if (poly.length) pieces.push({ m:m, poly:poly });
    });
    for (i = 0; i < pieces.length; i++)
      for (j = i + 1; j < pieces.length; j++)
        if (pieces[i].poly.length && pieces[j].poly.length &&
            pgIntersects(pieces[i].poly, pieces[j].poly))
          pieces[i].poly = pgDiff(pieces[i].poly, pieces[j].poly, GEOM_TOL_MIG);
    pieces = pieces.filter(function(p){ return p.poly.length; });
    if (!pieces.length) return null;
    pieces.forEach(function(p){ loadBudget -= pgVertexCount(p.poly); });
    return spawnObjectFromPieces(pieces, os.layer, { a:0, x:0, y:0 }, !!os.forcedStatic);
  }
  function snapshotFull(){
    var objIndex = {};
    var objSnaps = objects.map(function(o, i){
      objIndex[o.id] = i;
      return packObject(o);
    });
    var boltSnaps = bolts.map(function(b){
      return { a: objIndex[b.objA.id], b: objIndex[b.objB.id], x:b.point.x, y:b.point.y, tight:b.tight, mode:b.mode };
    });
    return {
      objects: objSnaps, bolts: boltSnaps,
      checkpoints: checkpoints.map(function(c){ return { x:c.x, y:c.y }; }),
      goal: goalPoint ? { x:goalPoint.x, y:goalPoint.y } : null,
      bubbles: bubbles.map(function(b){ return { x:b.x, y:b.y }; }),
      activeCheckpoint: activeCheckpoint,
      world: { gravity: worldSettings.gravity, waterLevel: worldSettings.waterLevel, ropeLength: worldSettings.ropeLength, motorSpeed: worldSettings.motorSpeed, light: worldSettings.light },
      // A byte per cell, but only when there IS water — otherwise every
      // snapshot of every dry level would carry 45KB of zeroes for
      // nothing, and undo takes a lot of snapshots.
      water: waterCount > 0 ? packWaterBytes() : null,
      player: player ? { x:player.position.x, y:player.position.y, vx:player.velocity.x, vy:player.velocity.y } : null
    };
  }
  function restoreFull(snap){
    if (!snap) return;
    clearAllObjects();
    beginBulk();
    loadBudget = MAX_LEVEL_CORNERS;
    var newObjs = snap.objects.map(unpackObject);
    loadBudget = MAX_LEVEL_CORNERS;
    endBulk();
    newObjs.forEach(function(o){ if (o) refreshObjectPhysics(o); });
    snap.bolts.forEach(function(bs){
      var oa = newObjs[bs.a], ob = newObjs[bs.b];
      if (oa && ob) addBolt(oa, ob, { x:bs.x, y:bs.y }, bs.mode || (bs.tight ? "tight" : "loose"));
    });
    checkpoints = snap.checkpoints.map(function(c){ return { x:c.x, y:c.y, reached:false }; });
    goalPoint = snap.goal ? { x:snap.goal.x, y:snap.goal.y } : null;
    bubbles = (snap.bubbles||[]).map(function(b){ return { x:b.x, y:b.y, collected:false }; });
    activeCheckpoint = snap.activeCheckpoint || 0;
    if (snap.world){
      worldSettings.gravity = snap.world.gravity; worldSettings.waterLevel = snap.world.waterLevel; worldSettings.ropeLength = snap.world.ropeLength;
      if (snap.world.motorSpeed != null) worldSettings.motorSpeed = snap.world.motorSpeed;
      if (snap.world.light != null) worldSettings.light = snap.world.light;
      applyWorldSettings();
    }
    unpackWaterBytes(snap.water);
    if (player && snap.player){
      Body.setPosition(player, { x:snap.player.x, y:snap.player.y });
      Body.setVelocity(player, { x:snap.player.vx, y:snap.player.vy });
    }
  }

  var buildFrozen = snapshotFull();

  /* ---- Undo / redo ---------------------------------------------------
     The thing a creative tool actually lives on: it takes back the last
     EDIT you made, however long ago, and it remembers what that edit
     was so the toast can tell you. Every action that changes the level
     pushes the state it is about to replace, and redo keeps whatever
     undo threw away until the next edit makes it meaningless.

     (A rolling three-second scrub of the physics used to sit alongside
     this. It was a different idea wearing similar buttons, and it
     earned its keep far less often, so it's gone.) ---------------- */
  var undoStack = [], redoStack = [], UNDO_MAX = 40;
  function pushUndo(label){
    if (mode !== "build") return;
    undoStack.push({ label: label || "that", snap: snapshotFull() });
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack.length = 0;
    updateTransport();
  }
  function clearUndo(){ undoStack.length = 0; redoStack.length = 0; updateTransport(); }
  function undo(){
    if (mode !== "build"){ showToast("Undo is a Build-mode tool."); sfx("deny"); return; }
    if (!undoStack.length){ showToast("Nothing left to undo."); sfx("deny"); return; }
    var e = undoStack.pop();
    redoStack.push({ label: e.label, snap: snapshotFull() });
    endPaintStroke(); clearSelection();
    restoreFull(e.snap);
    updateTransport();
    sfx("undo");
    showToast("↶ Undid " + e.label);
  }
  function redo(){
    if (mode !== "build"){ showToast("Redo is a Build-mode tool."); sfx("deny"); return; }
    if (!redoStack.length){ showToast("Nothing to redo."); sfx("deny"); return; }
    var e = redoStack.pop();
    undoStack.push({ label: e.label, snap: snapshotFull() });
    endPaintStroke(); clearSelection();
    restoreFull(e.snap);
    updateTransport();
    sfx("redo");
    showToast("↷ Redid " + e.label);
  }

  /* ---- Pause -------------------------------------------------------
     Pausing is a BUILD-mode tool. Play mode always runs live: a silently paused
     simulation there just looks like a broken game — you drift left and
     right and never fall — with nothing on screen to explain why. Play
     therefore can't enter the paused state at all, and entering Play
     always clears it. */
  function setPaused(v){
    v = !!v && mode === "build";
    if (runner.enabled === !v) return;
    runner.enabled = !v;
    updatePauseState();
  }
  function togglePause(){
    if (mode !== "build"){ showToast("Play mode always runs live — pause from Build."); sfx("deny"); return; }
    setPaused(runner.enabled);
    sfx("click");
    showToast(runner.enabled ? "▶ Resumed" : "❚❚ Paused — the world is frozen, you can still walk around");
  }

  function applyWorldSettings(){
    engine.gravity.y = BASE_GRAVITY * worldSettings.gravity;
  }

  /* ============================================================
     5. Canvas / camera / rendering
     ============================================================ */
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("canvasWrap");
  var camScale = 1, baseScale = 1, dpr = 1, viewRectW = 0, viewRectH = 0;
  var camX = 0, camY = 0;
  /* ---- Zoom & free camera ---------------------------------------------
     Building anything bigger than one screen with the camera welded to
     your character is miserable: you have to walk the thing you're
     drawing into view. So Build gets a proper editor camera — scroll to
     zoom around the cursor, middle-drag (or hold Space and drag) to
     pan — and the moment you pan, the camera stops chasing you until
     you ask it to come back. Play always follows. ------------------- */
  var camZoom = parseFloat(localStorage.getItem("pg_zoom") || "1") || 1;
  var CAM_ZOOM_MIN = 0.3, CAM_ZOOM_MAX = 3;
  var camFollow = true;

  function applyCamScale(){
    camZoom = Math.max(CAM_ZOOM_MIN, Math.min(CAM_ZOOM_MAX, camZoom));
    camScale = baseScale * camZoom;
    localStorage.setItem("pg_zoom", String(camZoom));
    if (zoomValEl) zoomValEl.textContent = Math.round(camZoom*100) + "%";
  }
  function resize(){
    var rect = wrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    viewRectW = rect.width;
    viewRectH = rect.height;
    baseScale = Math.min(viewRectW / VIEW_W, viewRectH / VIEW_H);
    applyCamScale();
  }
  window.addEventListener("resize", resize);
  resize();

  function clampCam(target, worldSize, visSize){
    if (worldSize <= visSize) return (worldSize - visSize) / 2;
    return Math.max(0, Math.min(target, worldSize - visSize));
  }
  function clampCamNow(){
    var visW = viewRectW / camScale, visH = viewRectH / camScale;
    camX = clampCam(camX, WORLD_W, visW);
    camY = clampCam(camY, WORLD_H, visH);
  }
  function updateCamera(){
    var visW = viewRectW / camScale, visH = viewRectH / camScale;
    if (camFollow && player){
      camX = clampCam(player.position.x - visW/2, WORLD_W, visW);
      camY = clampCam(player.position.y - visH/2, WORLD_H, visH);
    } else {
      clampCamNow();
    }
  }
  // Zoom about a fixed world point, so whatever is under the cursor
  // stays under the cursor.
  function zoomAround(worldPt, factor){
    var before = camZoom;
    camZoom *= factor;
    applyCamScale();
    if (camZoom === before) return;
    if (worldPt){
      var visW = viewRectW / camScale, visH = viewRectH / camScale;
      // keep worldPt at the same fraction across the viewport
      camX = worldPt.x - (worldPt.x - camX) * (before / camZoom);
      camY = worldPt.y - (worldPt.y - camY) * (before / camZoom);
      if (camFollow && player){
        camX = clampCam(player.position.x - visW/2, WORLD_W, visW);
        camY = clampCam(player.position.y - visH/2, WORLD_H, visH);
      } else clampCamNow();
    }
  }
  function recenterCamera(){
    camFollow = true;
    updateCamera();
    updateViewHud();
    showToast("📷 Camera back on your character");
    sfx("click");
  }
  function screenToWorld(clientX, clientY){
    var rect = wrap.getBoundingClientRect();
    var x = clientX - rect.left, y = clientY - rect.top;
    return { x: x / camScale + camX, y: y / camScale + camY };
  }
  function worldToScreen(x, y){
    return { x: (x - camX) * camScale, y: (y - camY) * camScale };
  }
  // Tracked continuously (not just on canvas clicks) so a Rig character's
  // head/body can react to the cursor even when it's just hovering.
  var mouseOnCanvas = false;
  window.addEventListener("pointermove", function(e){
    var w = screenToWorld(e.clientX, e.clientY);
    mouseWorld.x = w.x; mouseWorld.y = w.y;
    var r = canvas.getBoundingClientRect();
    mouseOnCanvas = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  });
  canvas.addEventListener("pointerleave", function(){ mouseOnCanvas = false; });

  /* ============================================================
     Drawing a material region.

     LittleBigPlanet doesn't outline its materials — it BEVELS them. The
     rim you read as an outline is a little swept profile running round
     the contour: a band that turns away from the light and so shades
     darker, with the flat face of the material inside it. That is why
     LBP material reads as a solid slab of something rather than a
     coloured shape with a line round it, and it is why a thin sliver
     looks like a thin sliver instead of disappearing under its own
     border.

     Here the same thing falls out of clipping to the region and
     stroking its own contour at twice the bevel width: the outer half
     of the stroke is clipped away, so what lands is a band of exactly
     the bevel's width lying INSIDE the edge, however sharp the corner.
     A second, lighter band nudged upwards catches the top edge the way
     a real bevel catches an overhead light, and a thin ink line on the
     silhouette keeps the hand-drawn feel.

     Materials are flat colour under that. The per-dab grain, rivets and
     speckles the old renderer scattered around belonged to a model
     where every dab was a thing in its own right; on a real polygon
     there is nothing to scatter them over, and solid colour is what
     was wanted anyway.
     ============================================================ */
  /* Depth is alpha and a side face — NOT a scale.

     The Back layer used to be drawn at 0.88x and the Front at 1.1x, a
     leftover from when depth was faked by shrinking and growing the
     dabs a shape was made of. On real geometry that is a lie: the
     drawn shape stopped matching the polygon underneath it, so a piece
     visibly shrank the moment you let go of the brush, and clicking
     where you could see it missed, because hit-testing and physics were
     using the true size all along. Everything is 1:1 now — what you
     see is exactly where the shape is. `off` is how far the slab's
     shaded side face is thrown, which is what carries the depth. */
  function layerDepth(layer){
    if (layer === 0) return { a: 0.72, s: 1, off: -1.8, shade: 0.20 };
    if (layer === 2) return { a: 1,    s: 1, off:  3.4, shade: 0.32 };
    // Mid is the plane you build on — the reference the other two read
    // as offset FROM — so it throws no side face at all. That also keeps
    // it at one drawing pass per region, which matters: a level's mid
    // layer is most of what is on screen, and the big shapes there are
    // the ones too large to cache as a bitmap when you zoom in.
    return { a: 1, s: 1, off: 0, shade: 0 };
  }
  var BEVEL_W = 3.4;        // world px of shaded rim inside every edge
  var INK_W = 1.6;          // the drawn line on the silhouette
  var INK = "rgba(43,27,18,.9)";

  function mpToPath(mp, p2){
    for (var i = 0; i < mp.length; i++){
      var poly = mp[i];
      for (var j = 0; j < poly.length; j++){
        var r = poly[j];
        if (r.length < 3) continue;
        p2.moveTo(r[0][0], r[0][1]);
        for (var k = 1; k < r.length; k++) p2.lineTo(r[k][0], r[k][1]);
        p2.closePath();
      }
    }
    return p2;
  }
  function mpPath(mp){ return mpToPath(mp, new Path2D()); }

  /* An object's shape never changes while it sits there — a compound
     body moves as one rigid piece — so each region's contour is traced
     once into a Path2D in the body's own frame and reused. geomRev is
     bumped whenever the geometry actually changes, which is the only
     time any of this needs rebuilding. */
  function objectPaths(obj){
    var rev = obj.geomRev || 0;
    var g = obj._paths;
    if (g && obj._pathsRev === rev) return g;
    g = { regions: [], box: null };
    for (var i = 0; i < obj.pieces.length; i++){
      var pc = obj.pieces[i], mat = matOf(pc.m) || MATERIALS.wood;
      g.regions.push({ m: pc.m, color: mat.color, dark: mat.dark, warn: !!mat.warn,
                       glass: !!mat.glass, glow: !!mat.emitter,
                       path: mpPath(pc.poly), box: pgBounds(pc.poly) });
    }
    g.box = objBoundsLocal(obj);
    obj._paths = g;
    obj._pathsRev = rev;
    return g;
  }

  /* ---- Object bitmaps -------------------------------------------------
     A shape's appearance in its own frame never changes while it sits
     there, so it is rasterised once into an offscreen bitmap and then
     blitted: one textured rectangle a frame instead of re-resolving
     every fill, clip and stroke. Compositing is associative, so baking
     the same passes in the same order and blitting the result is
     identical to drawing them straight onto the canvas.

     While you are mid-stroke the shape changes every frame, so painting
     falls back to drawing the paths directly and the bitmap is rebuilt
     when you let go.
     -------------------------------------------------------------------- */
  var BMP_MAX_PX = 5.0e6;        // per object, about 20MB of RGBA
  var BMP_BUDGET_PX = 14e6;      // across the level, about 56MB
  var bmpBudgetUsed = 0;
  var bmpFrame = 0;
  // Bake a little larger than the screen needs. Blitting at exactly 1:1
  // but on fractional offsets is the blurriest case there is; a slight
  // over-sample means the blit is always a minification, which stays
  // crisp, and it costs a third more memory rather than double.
  var BMP_OVERSAMPLE = 1.15;
  function bitmapScaleNow(){
    return Math.max(0.25, Math.min(2.4, camScale * dpr * BMP_OVERSAMPLE));
  }
  function dropBitmap(obj){
    if (!obj || !obj._bmp) return;
    bmpBudgetUsed -= obj._bmp.px;
    obj._bmp = null;
  }
  function localDrawBounds(obj, g, depth){
    var b = g.box;
    if (!b) return null;
    var pad = BEVEL_W + INK_W + Math.abs(depth.off || 0) + 6;
    return { ox: b.x - pad, oy: b.y - pad,
             w: (b.x2-b.x) + pad*2, h: (b.y2-b.y) + pad*2 };
  }
  // Paint the object's passes into a context already set up so that one
  // unit is one local unit. Shared by the bitmap and the direct-path
  // fallback so the two can never drift apart.
  function paintObjectPasses(c, g, depth, alpha){
    var i, reg;
    if (alpha == null) alpha = depth.a;
    c.save();
    c.lineJoin = "round"; c.lineCap = "round";
    c.globalAlpha = alpha;

    // 1. the slab's side face, so material reads as having thickness —
    //    thrown further the closer the layer is to you
    if (depth.off){
      c.save();
      c.translate(depth.off, depth.off);
      c.fillStyle = "rgba(43,27,18," + depth.shade + ")";
      for (i = 0; i < g.regions.length; i++){
        if (g.regions[i].glass || g.regions[i].glow) continue;   // nothing solid to cast
        c.fill(g.regions[i].path);
      }
      c.restore();
    }
    /* 2. Each region is finished before the next one starts — colour,
          bevel, then its own drawn line. Doing all the fills first and
          all the lines afterwards put an earlier region's outline on top
          of a later one: paint sponge into a socket cut in wood and the
          wood's hole was still outlined across the sponge sitting in it.
          Later material covers earlier material's edge, which is also
          the right answer at a seam between two materials. */
    for (i = 0; i < g.regions.length; i++){
      reg = g.regions[i];
      // Glass is mostly not there; light is a bloom rather than a slab.
      c.globalAlpha = alpha * (reg.glass ? 0.4 : 1);
      c.fillStyle = reg.color;
      c.fill(reg.path);
      if (reg.glass) paintGlassSheen(c, reg, alpha);
      if (reg.glow){
        c.save();
        c.clip(reg.path);
        c.globalAlpha = alpha * 0.75;
        c.fillStyle = shadeHex(reg.color, 0.55);
        var gb2 = reg.box;
        if (gb2) c.fillRect(gb2.x + 3, gb2.y + 3, Math.max(0, gb2.w - 6), Math.max(0, gb2.h - 6));
        c.restore();
      }
      // the bevel — two bands, the way a swept profile gives a rolled
      // edge: a wide soft shade, then a tighter darker one right against
      // the contour, then a light catch along the top
      c.save();
      c.clip(reg.path);
      if (reg.warn) paintWarningHatch(c, reg, alpha);
      c.globalAlpha = alpha * (reg.glass ? 0.16 : 0.34);
      c.strokeStyle = reg.dark;
      c.lineWidth = BEVEL_W * 2.6;
      c.stroke(reg.path);
      c.globalAlpha = alpha * (reg.glass ? 0.24 : 0.5);
      c.lineWidth = BEVEL_W * 1.1;
      c.stroke(reg.path);
      c.globalAlpha = alpha * (reg.glass ? 0.55 : (reg.glow ? 0.5 : 0.2));
      c.strokeStyle = "#FFFFFF";
      c.lineWidth = BEVEL_W * 1.6;

        ctx.beginPath(); ctx.ellipse(o[0]+ex*0.3, o[1], 6.5, 8, 0, 0, Math.PI*2);
        ctx.fillStyle="#fff"; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(o[0]+ex, o[1]+1, 3, 0, Math.PI*2);
        ctx.fillStyle="#2B1B12"; ctx.fill();
      });
      ctx.beginPath(); ctx.arc(0, 6, 7, 0.15*Math.PI, 0.85*Math.PI);
      ctx.strokeStyle="#2B1B12"; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer(){
    if (!player) return;
    var p = player.position;
    if (flying){ p = { x:p.x, y:p.y + Math.sin(performance.now()/260)*3 }; }
    var squish = flying ? -0.12 : Math.min(1, Math.abs(player.velocity.y)/16) * (player.velocity.y>0?-1:1);
    drawCharacter(p, squish, flying);
    if (ropeConstraint){
      var anchor = ropeAnchorWorld();
      ctx.save();
      ctx.strokeStyle = "rgba(43,27,18,.65)"; ctx.lineWidth = 2.4;
      ctx.beginPath();
      var midx = (player.position.x + anchor.x)/2;
      var midy = (player.position.y + anchor.y)/2 + 14; // a little floppy sag
      ctx.moveTo(player.position.x,player.position.y);
      ctx.quadraticCurveTo(midx, midy, anchor.x, anchor.y);
      ctx.stroke();
      // a little knot exactly where it grabbed
      ctx.beginPath(); ctx.arc(anchor.x, anchor.y, 3.4, 0, Math.PI*2);
      ctx.fillStyle = "#2B1B12"; ctx.fill();
      ctx.restore();
    }
  }

  function drawDragHighlight(){
    if (!dragging) return;
    ctx.save();
    ctx.strokeStyle = "rgba(242,183,5,.9)"; ctx.lineWidth = 3;
    if (dragging.type === "object"){
      dragging.objs.forEach(function(o){
        if (objects.indexOf(o) < 0) return;
        var b = o.body.bounds;
        ctx.strokeRect(b.min.x-4, b.min.y-4, (b.max.x-b.min.x)+8, (b.max.y-b.min.y)+8);
      });
    } else {
      var pos = dragging.type === "checkpoint" ? checkpoints[dragging.index] : bubbles[dragging.index];
      if (pos){ var r = BRUSH_R+3; ctx.strokeRect(pos.x-r, pos.y-r, r*2, r*2); }
    }
    ctx.restore();
  }

  /* ---- Cursor overlays ----------------------------------------------
     Build shows the exact footprint the next dab will lay down, in the
     current brush's shape and size, so nothing is a surprise. Play
     shows a grapple reticle: white when there is nothing to grab, green
     when a shot would land, red when the sponge you are aiming at is
     out of rope. ------------------------------------------------------ */
  function anyOverlayOpen(){
    return pmOpen || !pauseOverlay.hidden || !charEditorOverlay.hidden ||
           !confirmOverlay.hidden || !loadOverlay.hidden || !nameOverlay.hidden;
  }
  function isMaterialTool(){ return !!matOf(currentTool); }
  function drawCursorOverlay(){
    var showCustom = false;
    if (mouseOnCanvas && !anyOverlayOpen() && !camPan && !shapeDrag){
      if (mode === "play"){
        var t = grappleTargetAt(mouseWorld);
        var col = (t && t.near) ? (t.inReach ? "#5F9E5A" : "#D64545") : "#FFFFFF";
        // sized in screen pixels, so the reticle stays the same size to
        // the eye however far you're zoomed in or out
        var rr = 8/camScale;
        ctx.save();
        ctx.lineWidth = 2.2/camScale; ctx.strokeStyle = "rgba(43,27,18,.55)";
        ctx.beginPath(); ctx.arc(mouseWorld.x, mouseWorld.y, rr*1.08, 0, Math.PI*2); ctx.stroke();
        ctx.lineWidth = 2/camScale; ctx.strokeStyle = col;
        ctx.beginPath(); ctx.arc(mouseWorld.x, mouseWorld.y, rr, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = col; ctx.globalAlpha = 0.32;
        ctx.beginPath(); ctx.arc(mouseWorld.x, mouseWorld.y, rr, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        showCustom = true;
      } else if (isMaterialTool() && paintMode !== "brush"){
        // Shape mode: a crosshair, because the next thing you do is drag
        // a corner out from here rather than stamp a dab down.
        var k = 13/camScale;
        ctx.save();
        ctx.strokeStyle = "rgba(43,27,18,.75)"; ctx.lineWidth = 2/camScale;
        ctx.beginPath();
        ctx.moveTo(mouseWorld.x - k, mouseWorld.y); ctx.lineTo(mouseWorld.x - k*0.3, mouseWorld.y);
        ctx.moveTo(mouseWorld.x + k*0.3, mouseWorld.y); ctx.lineTo(mouseWorld.x + k, mouseWorld.y);
        ctx.moveTo(mouseWorld.x, mouseWorld.y - k); ctx.lineTo(mouseWorld.x, mouseWorld.y - k*0.3);
        ctx.moveTo(mouseWorld.x, mouseWorld.y + k*0.3); ctx.lineTo(mouseWorld.x, mouseWorld.y + k);
        ctx.stroke();
        ctx.fillStyle = matOf(currentTool).color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(mouseWorld.x, mouseWorld.y, 3/camScale, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        showCustom = true;
      } else if (isMaterialTool() || currentTool === "erase"){
        var r = paintRadius();
        var erasing = currentTool === "erase";
        var fluid = !erasing && matOf(currentTool).isFluid;
        ctx.save();
        ctx.beginPath();
        tracePartShape(ctx, mouseWorld.x, mouseWorld.y, erasing ? r + 8 : r,
                       (erasing || fluid) ? "circle" : paintShape);
        if (!erasing){
          ctx.globalAlpha = 0.28; ctx.fillStyle = matOf(currentTool).color; ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.lineWidth = 2/camScale; ctx.setLineDash(erasing ? [5/camScale,4/camScale] : []);
        ctx.strokeStyle = erasing ? "#D64545" : "rgba(43,27,18,.85)";
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        showCustom = true;
      }
    }
    canvas.classList.toggle("customCursor", showCustom);
  }

  /* ---- Water rendering ------------------------------------------------
     Painted water is drawn over the Mid layer (so anything floating in
     it is tinted by it) but under the Front layer. World Water goes over
     absolutely everything, because it floods every layer at once. ---- */
  function drawMaterialWater(){
    if (waterCount <= 0 || wMaxRow < 0) return;
    var t = performance.now()/620;
    // Every cell goes into ONE path and is filled in a single pass.
    // Filling them one rect at a time would overlap their edges, and at
    // this alpha each overlap paints twice — drawing a grid of seams
    // across what should look like a body of water.
    // Only walk the cells the camera can actually see. A world-sized
    // lake is tens of thousands of cells, and pathing all of them every
    // frame costs the same whether or not any of it is on screen.
    var visC0 = Math.max(wMinCol, Math.floor(camX / WATER_CELL) - 1);
    var visC1 = Math.min(wMaxCol, Math.floor((camX + viewRectW/camScale) / WATER_CELL) + 1);
    var visR0 = Math.max(wMinRow, Math.floor(camY / WATER_CELL) - 1);
    var visR1 = Math.min(wMaxRow, Math.floor((camY + viewRectH/camScale) / WATER_CELL) + 1);
    if (visC1 < visC0 || visR1 < visR0) return;
    // Each cell contributes a round blob rather than a square tile.
    // Neighbouring blobs overlap and merge in the single fill below, so
    // a body of water reads as one soft mass with a rounded meniscus
    // instead of a staircase of pixels.
    var TAU = Math.PI*2;
    var RFULL = WATER_CELL*0.74;
    ctx.save();
    ctx.beginPath();
    var surface = [];
    for (var row = visR0; row <= visR1; row++){
      for (var col = visC0; col <= visC1; col++){
        var i = row*WCOLS + col;
        var lv = waterLevels[i];
        if (lv <= W_MIN) continue;
        var cx = col*WATER_CELL + WATER_CELL/2;
        var covered = row > 0 && waterLevels[i-WCOLS] > W_MIN;
        if (covered || lv >= 0.985){
          var cy = row*WATER_CELL + WATER_CELL/2;
          ctx.moveTo(cx + RFULL, cy);
          ctx.arc(cx, cy, RFULL, 0, TAU);
        } else {
          // an open top cell: a smaller droplet whose crown sits at the
          // water line, which ripples
          var fill = Math.min(1, lv);
          var rr = Math.max(WATER_CELL*0.3, RFULL*(0.5 + fill*0.5));
          var topY = row*WATER_CELL + WATER_CELL*(1-fill) + Math.sin(t*1.6 + col*0.55)*1.3;
          var scy = topY + rr*0.82;
          ctx.moveTo(cx + rr, scy);
          ctx.arc(cx, scy, rr, 0, TAU);
          surface.push(cx, topY, rr);
        }
      }
    }
    ctx.globalAlpha = 0.76;
    ctx.fillStyle = MATERIALS.water.color;
    ctx.fill();
    // a brighter crest along the open surface so it reads as liquid
    if (surface.length){
      ctx.beginPath();
      for (var s = 0; s < surface.length; s += 3){
        ctx.moveTo(surface[s] + surface[s+2]*0.9, surface[s+1] + surface[s+2]*0.5);
        ctx.arc(surface[s], surface[s+1] + surface[s+2]*0.5, surface[s+2]*0.9, 0, TAU);
      }
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = "#EAF8FD";
      ctx.fill();
    }
    ctx.restore();

    // Water rounds off against whatever is holding it, so the blobs can
    // bleed a few pixels into the walls of their container. Painting the
    // anchored Mid-layer scenery back over the top trims them to exactly
    // the shape of the environment. Only static geometry is redrawn —
    // anything loose stays under the tint so it still looks submerged.
    for (var oi = 0; oi < objects.length; oi++){
      var o = objects[oi];
      if (o.layer !== MID_LAYER || !o.body.isStatic) continue;
      var b = o.body.bounds;
      if (b.max.x < visC0*WATER_CELL || b.min.x > (visC1+1)*WATER_CELL) continue;
      if (b.max.y < visR0*WATER_CELL || b.min.y > (visR1+1)*WATER_CELL) continue;
      drawObject(o);
    }
  }
  function drawWorldWaterOverlay(){
    if (worldSettings.waterLevel == null) return;
    var wl = worldSettings.waterLevel;
    var t = performance.now()/760;
    ctx.save();
    ctx.globalAlpha = 0.34;
    var grad = ctx.createLinearGradient(0, wl, 0, WORLD_H);
    grad.addColorStop(0, "#6FC3E0");
    grad.addColorStop(1, "#20627F");
    ctx.fillStyle = grad;
    ctx.fillRect(0, wl, WORLD_W, WORLD_H - wl);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var x = 0; x <= WORLD_W; x += 40){
      var y = wl + Math.sin(x*0.011 + t)*3.5;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  /* ---- Parallax scenery ----------------------------------------------
     Behind the three build layers sit four more that you can't paint on
     and that move at their own speeds: sun, clouds, far hills, near
     dunes. None of it is interactive — it exists so the world reads as
     having somewhere behind it, which is most of what makes a
     side-scroller feel like a place rather than a canvas. ---------- */
  function hash1(i){ var x = Math.sin(i*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  // The scenery is drawn in SCREEN space, not world space. Anchoring it
  // to world coordinates seems obvious and is wrong: this world is three
  // screens tall, so a hill placed two-thirds of the way down the world
  // and slowed to a third of the camera's speed ends up somewhere below
  // the floor and is never seen. Instead each layer sits at a fixed
  // fraction of the viewport and slides by its own share of the camera's
  // movement — which is what parallax actually means and what keeps a
  // horizon on the horizon however far you roam.
  function groundCamY(){ return WORLD_H - viewRectH/camScale; }
  // One rolling ridge across the viewport, filled down past the bottom.
  function ridge(c, W, H, baseY, amp, step, color, seed, scroll){
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(-40, H + 40);
    c.lineTo(-40, baseY);
    for (var x = -40; x <= W + 80; x += step){
      var t = x + scroll;
      var y = baseY
        - Math.sin(t*0.0016 + seed)*amp
        - Math.sin(t*0.0047 + seed*2.3)*amp*0.42
        - Math.sin(t*0.0111 + seed*4.1)*amp*0.16;
      c.lineTo(x, y);
    }
    c.lineTo(W + 80, H + 40);
    c.closePath(); c.fill();
  }
  function cloudPuff(c, x, y, s, alpha){
    c.globalAlpha = alpha;
    c.fillStyle = "#FFFFFF";
    c.beginPath();
    c.arc(x, y, s, 0, Math.PI*2);
    c.arc(x + s*0.95, y + s*0.16, s*0.78, 0, Math.PI*2);
    c.arc(x - s*0.9,  y + s*0.2,  s*0.66, 0, Math.PI*2);
    c.arc(x + s*0.25, y - s*0.55, s*0.7,  0, Math.PI*2);
    c.fill();
    c.globalAlpha = 1;
  }
  // The whole soft backdrop, painted into `c` for a W x H viewport at
  // world scale S. Nothing here has a hard edge, which is exactly why it
  // can be drawn small and blown up (see drawBackground).
  function paintBackdrop(c, W, H, S, now){
    // ---- sky: a depth gradient, mapped through the camera so the colour
    // you see depends on how high in the world you are ----
    var g = c.createLinearGradient(0, (0 - camY)*S, 0, (WORLD_H - camY)*S);
    g.addColorStop(0, "#8FD0E8");
    g.addColorStop(0.42, "#BFE2E6");
    g.addColorStop(1, "#F3E2AE");
    c.fillStyle = g; c.fillRect(0, 0, W, H);

    // how far the camera is above its resting place at the world floor;
    // background layers ride a fraction of that, so the horizon sinks as
    // you climb instead of being nailed to the glass
    var lift = (WORLD_H - H/S - camY) * S;

    // ---- a low sun ----
    var sunX = W*0.72 - camX*S*0.03;
    var sunY = H*0.16 + lift*0.05;
    var sunR = Math.max(120, H*0.6);
    var sg = c.createRadialGradient(sunX, sunY, 8, sunX, sunY, sunR);
    sg.addColorStop(0, "rgba(255,250,224,.95)");
    sg.addColorStop(0.3, "rgba(255,238,178,.34)");
    sg.addColorStop(1, "rgba(255,238,178,0)");
    c.fillStyle = sg;
    c.fillRect(sunX - sunR, sunY - sunR, sunR*2, sunR*2);

    // ---- clouds, sliding at a tenth of the camera and drifting on their own ----
    var span = W + 420;
    var drift = now/1000 * 6 * S;
    for (var i = 0; i < 18; i++){
      var cx = (((hash1(i)*span + drift - camX*S*0.1) % span) + span) % span - 210;
      var cy = H*0.05 + hash1(i+90)*H*0.3 + lift*0.1;
      if (cy > H*0.62) continue;
      cloudPuff(c, cx, cy, (14 + hash1(i+30)*22) * Math.max(0.7, Math.min(1.5, S)), 0.16 + hash1(i+60)*0.2);
    }

    // ---- three ranges, each nearer and darker than the last. They sit
    // low and stay hazy on purpose: this is a backdrop, and anything
    // bolder than this starts to read as ground you could stand on ----
    ridge(c, W, H, H*0.745 + lift*0.20, H*0.042, 22, "rgba(126,163,168,.3)",  1.3, camX*S*0.20);
    ridge(c, W, H, H*0.845 + lift*0.34, H*0.033, 20, "rgba(134,161,128,.32)", 4.7, camX*S*0.34);
    ridge(c, W, H, H*0.925 + lift*0.55, H*0.024, 18, "rgba(188,161,108,.38)", 2.1, camX*S*0.55);

    // ---- the near dune bank, in world space ----
    c.save();
    c.scale(S, S);
    c.translate(-camX, -camY);
    c.beginPath(); c.rect(0,0,WORLD_W,WORLD_H); c.clip();
    c.fillStyle = "rgba(180,150,90,.4)";
    c.beginPath(); c.moveTo(0,WORLD_H);
    c.lineTo(0, WORLD_H-90);
    for (var x=0;x<=WORLD_W;x+=160) c.lineTo(x, WORLD_H-90-Math.sin(x*0.01)*30);
    c.lineTo(WORLD_W, WORLD_H); c.closePath(); c.fill();
    c.restore();
  }

  /* The backdrop is soft gradients and hazy silhouettes with not one
     hard edge in it, and it covers every pixel on screen. Painted at
     full size it is the single most expensive thing in the frame —
     enough, on a big level, to push a comfortable 60fps down to 30,
     because the cost is fill rate rather than anything the profiler
     would show you in JS. So it is painted into a half-size buffer and
     blown back up: a quarter of the pixels, and at this softness nobody
     can tell. The buffer is also reused between frames while the camera
     is still, which is most of the time you spend building. */
  var bgBuf = null, bgKey = "", bgAt = 0;
  function drawBackground(){
    var W = Math.max(2, Math.round(viewRectW/2)), H = Math.max(2, Math.round(viewRectH/2));
    var S = camScale/2;
    var now = performance.now();
    var key = W + "x" + H + "|" + Math.round(camX) + "|" + Math.round(camY) + "|" + camScale.toFixed(3);
    if (!bgBuf) bgBuf = document.createElement("canvas");
    if (key !== bgKey || now - bgAt > 140){          // 140ms keeps the clouds drifting
      if (bgBuf.width !== W || bgBuf.height !== H){ bgBuf.width = W; bgBuf.height = H; }
      var bc = bgBuf.getContext("2d");
      bc.setTransform(1,0,0,1,0,0);
      bc.clearRect(0,0,W,H);
      paintBackdrop(bc, W, H, S, now);
      bgKey = key; bgAt = now;
    }
    ctx.drawImage(bgBuf, 0, 0, viewRectW, viewRectH);

    // The world's edge stays full resolution — it's the one crisp thing
    // back here, and a blurry dashed border looks like a mistake.
    ctx.save();
    ctx.scale(camScale, camScale);
    ctx.translate(-camX, -camY);
    // Zoomed far enough out you can see past the edge of the world;
    // shade whatever is outside it so the buildable area still reads as
    // the thing you're looking at.
    var vx0 = camX - 40, vy0 = camY - 40;
    var vx1 = camX + viewRectW/camScale + 40, vy1 = camY + viewRectH/camScale + 40;
    ctx.fillStyle = "rgba(67,39,20,.5)";
    if (vy0 < 0) ctx.fillRect(vx0, vy0, vx1-vx0, -vy0);
    if (vy1 > WORLD_H) ctx.fillRect(vx0, WORLD_H, vx1-vx0, vy1-WORLD_H);
    if (vx0 < 0) ctx.fillRect(vx0, Math.max(0,vy0), -vx0, Math.min(WORLD_H,vy1)-Math.max(0,vy0));
    if (vx1 > WORLD_W) ctx.fillRect(WORLD_W, Math.max(0,vy0), vx1-WORLD_W, Math.min(WORLD_H,vy1)-Math.max(0,vy0));
    // World Water is drawn as an overlay AFTER every layer instead of
    // here, so it visibly floods the back, middle and front alike.
    ctx.strokeStyle = "rgba(43,27,18,.35)"; ctx.setLineDash([10,8]); ctx.lineWidth=3;
    ctx.strokeRect(2,2,WORLD_W-4,WORLD_H-4);
    ctx.setLineDash([]);
    ctx.restore();
  }
  // The snap grid, drawn only where the camera can see it and faded out
  // when you're zoomed far enough that it would just be noise.
  function drawGrid(){
    if (!gridOn || mode !== "build") return;
    var step = gridSize;
    while (step * camScale < 9) step *= 2;      // never denser than legible
    var x0 = Math.floor(camX/step)*step, x1 = camX + viewRectW/camScale;
    var y0 = Math.floor(camY/step)*step, y1 = camY + viewRectH/camScale;
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.strokeStyle = "rgba(43,27,18,.5)";
    ctx.lineWidth = 1/camScale;
    ctx.beginPath();
    for (var x = x0; x <= x1; x += step){ ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (var y = y0; y <= y1; y += step){ ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    // every fifth line a touch stronger, so you can count squares
    ctx.globalAlpha = 0.34;
    ctx.lineWidth = 1.6/camScale;
    ctx.beginPath();
    var big = step*5;
    for (var bx = Math.floor(camX/big)*big; bx <= x1; bx += big){ ctx.moveTo(bx, y0); ctx.lineTo(bx, y1); }
    for (var by = Math.floor(camY/big)*big; by <= y1; by += big){ ctx.moveTo(x0, by); ctx.lineTo(x1, by); }
    ctx.stroke();
    ctx.restore();
  }

  // Water runs off the render loop at a steady ~60 steps a second, so it
  // flows at the same rate whatever the frame rate — and freezes with
  // everything else when the world is paused.
  var waterAccum = 0, lastWaterT = performance.now();
  function tickWater(now){
    var dt = now - lastWaterT;
    lastWaterT = now;
    if (!runner.enabled || waterCount === 0) return;
    waterAccum += Math.min(60, dt);
    var steps = 0;
    while (waterAccum >= 16.666 && steps < 3){ stepWater(); waterAccum -= 16.666; steps++; }
    if (waterAccum > 50) waterAccum = 0;
  }

  var lastFrameT = performance.now();
  // Anything wholly outside the view costs nothing to skip and quite a
  // lot to draw, and on a level built across the whole world most of it
  // is outside the view most of the time.
  function onScreen(o){
    // A batched object's body is stale by design, so its bounds can't be
    // trusted to cull with — draw it and sort the bounds out on flush.
    if (o._bulkPending) return true;
    var b = o.body.bounds, pad = 60;
    return b.max.x >= camX - pad && b.min.x <= camX + viewRectW/camScale + pad &&
           b.max.y >= camY - pad && b.min.y <= camY + viewRectH/camScale + pad;
  }
  function drawLayer(l){
    for (var i = 0; i < objects.length; i++){
      var o = objects[i];
      if (o.layer === l && onScreen(o)) drawObject(o);
    }
  }
  function drawFrame(now){
    var frameK = Math.max(0.2, Math.min(3, (now - lastFrameT)/16.666));
    lastFrameT = now;
    // Safety net: nothing should leave a rebuild batch open across a
    // frame, but if anything ever does, this flushes it rather than
    // letting the world quietly stop updating.
    if (bulkList && !painting && !shapeDrag) endBulk();
    updateCamera();
    freeMoveIfPaused(now);
    tickWater(now);
    stepParticles(frameK);
    bmpFrame++;
    sweepBitmaps();
    // A knock rather than a wobble: it decays fast and is applied to the
    // whole canvas transform, so nothing has to know it's happening.
    var sx = 0, sy = 0;
    if (shakeAmt > 0.05){
      sx = (Math.random()-0.5) * shakeAmt;
      sy = (Math.random()-0.5) * shakeAmt;
      shakeAmt *= Math.pow(0.86, frameK);
    } else shakeAmt = 0;
    shakeOffX = sx*dpr; shakeOffY = sy*dpr;
    ctx.setTransform(dpr, 0, 0, dpr, sx*dpr, sy*dpr);
    drawBackground();
    ctx.save();
    ctx.scale(camScale, camScale);
    ctx.translate(-camX, -camY);
    drawGrid();
    // Draw order: Back decoration, Mid (the actual level), the player
    // and its markers, THEN Front decoration on top — so anything you
    // paint on the front layer correctly covers the player, LBP-style.
    drawLayer(0);
    drawLayer(1);
    drawBolts();
    drawBubbles();
    checkpoints.forEach(function(cp, i){ drawFlag(cp, i===0 ? "#5F9E5A" : "#2F86A6", i===0 ? "start" : "checkpoint"); });
    drawFlag(goalPoint, "#F2B705", "goal");
    drawPlayer();
    drawParticles();
    drawMaterialWater();
    drawLayer(2);
    drawWorldWaterOverlay();

  /* One bad frame used to kill the game permanently: requestAnimationFrame
     was the last statement inside the frame body, so anything that threw
     skipped the reschedule and left the page a still image until reload.
     The reschedule now lives outside the try, and always runs.

     Unwinding the canvas matters as much as catching. drawFrame opens a
     save() and closes it at the bottom, and the draw calls in between nest
     their own; throwing halfway leaves entries on the state stack, and the
     next frame pushes more on top — the transform drifts and every
     subsequent frame is wrong. restore() on an empty stack is defined as a
     no-op, so unwinding generously costs nothing and the explicit reset
     afterwards puts the context back to a known base.

     This is a catch-all on purpose, the same way pruneObjCtxMenu is: no
     future drawing code has to remember the loop must survive it. */
  var renderFails = 0, renderFailsLogged = 0, renderFailToldUser = false;
  function render(now){
    try {
      drawFrame(now);
      renderFails = 0;
    } catch (e){
      renderFails++;
      try {
        for (var i = 0; i < 64; i++) ctx.restore();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      } catch (e2){ /* nothing left to salvage; still reschedule below */ }
      /* Loud for the first few, then quiet. A fault that repeats every frame
         would otherwise bury the console at sixty lines a second, which
         hides the first error — the only one that says where it started. */
      if (renderFailsLogged < 3){
        renderFailsLogged++;
        console.error("Planet Genesis: a frame failed to draw and was skipped.", e);
        if (renderFailsLogged === 3) console.error("Planet Genesis: further frame errors will not be logged.");
      }
      if (!renderFailToldUser){
        renderFailToldUser = true;
        try { showToast("Something went wrong drawing that frame — the game kept going."); } catch (e3){}
      }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // Saved the way it looks, not the way its body happens to be turned:
  // the regions are taken into world space first, so a stamp comes back

  function saveObjectToMyObjects(obj){
    var group = selList();
    if (group.length < 2) group = [obj];
    var world = [];
    group.forEach(function(o){
      o.pieces.forEach(function(pc){
        var w = objToWorld(o, pc.poly);
        var slot = null;
        for (var i = 0; i < world.length; i++) if (world[i].m === pc.m){ slot = world[i]; break; }
        if (slot) slot.poly = pgUnion(slot.poly, w, GEOM_TOL);
        else world.push({ m: pc.m, poly: w });
      });
    });
    var all = pgUnionMany(world.map(function(w){ return w.poly; }), GEOM_TOL);
    var c = all.length ? pgCentroid(all) : { x:0, y:0 };
    var snap = world.map(function(w){ return { m: w.m, g: pgPack(pgTranslate(w.poly, -c.x, -c.y)) }; });
    askName("Name this object", "My Object", function(name){
      savedObjects.push({ id:"u"+Date.now(), name:name, pieces:snap });
      persistSavedObjects();
      showToast("Saved '"+name+"' to My Objects");

  function savedObjectMaterial(s){

  // Objects saved before the geometry rework are still circle lists;
  // they migrate on the way out, exactly like an old level does.
  function savedObjectPieces(s){
    if (s.pieces){
      var out = [];
      s.pieces.forEach(function(pc){
        if (!matOf(pc.m) || matOf(pc.m).isFluid) return;
        var poly = pgClean(pgUnpack(pc.g), GEOM_TOL);
        if (poly.length) out.push({ m: pc.m, poly: poly });
      });
      return out;
    }
    if (!s.parts) return [];
    var byMat = {}, order = [];
    s.parts.forEach(function(p, i){
      if (!matOf(p.m) || matOf(p.m).isFluid) return;
      if (!byMat[p.m]){ byMat[p.m] = { rings:[], last:i }; order.push(p.m); }
      byMat[p.m].last = i;
      var shp = (p.s === "square" || p.s === "diamond") ? p.s : "circle";
      byMat[p.m].rings.push([[ brushRing(shp, p.dx, p.dy, Math.max(1, +p.r || BRUSH_R), 0, 0.3) ]]);
    });
    order.sort(function(a, b){ return byMat[a].last - byMat[b].last; });
    var pieces = order.map(function(m){ return { m:m, poly: pgUnionMany(byMat[m].rings, GEOM_TOL_MIG) }; })
                      .filter(function(p){ return p.poly.length; });
    for (var i = 0; i < pieces.length; i++)
      for (var j = i + 1; j < pieces.length; j++)
        if (pieces[i].poly.length && pieces[j].poly.length)
          pieces[i].poly = pgDiff(pieces[i].poly, pieces[j].poly, GEOM_TOL_MIG);
    return pieces.filter(function(p){ return p.poly.length; });
  }

  }

  /* ============================================================
     6b. Character creator — a full-screen studio with a real brush.
     The art model is smooth strokes rather than a pixel grid, so
     drawing a character feels the same as painting a level.
     ============================================================ */
  var myCharacters = [];
  try { myCharacters = JSON.parse(localStorage.getItem("pg_my_characters") || "[]"); } catch(e){ myCharacters = []; }
  function persistMyCharacters(){
    try { localStorage.setItem("pg_my_characters", JSON.stringify(myCharacters)); } catch(e){ showToast("Couldn't save — storage is full."); }
  }
  // The JSON round-trip also drops the render caches hanging off each
  // stroke array, which is exactly what we want in a saved character.
  function currentCharacterData(){
    return JSON.parse(JSON.stringify({
      mode: charMode, color: charColor, size: charSize,
      frameCounts: charFrameCounts, sprites: charSprites,
      rig: rigSprites, anchors: rigAnchors
    }));
  }
  function applyCharacterData(d){
    if (!d) return;
    charMode = d.mode || "preset";
    if (d.color) charColor = d.color;
    if (d.size && CHAR_SIZES[d.size]) setCharSize(d.size);
    ANIM_STATES.forEach(function(s){
      var n = (d.frameCounts && d.frameCounts[s.id]) || s.frames;
      charFrameCounts[s.id] = Math.max(1, Math.min(CHAR_MAX_FRAMES, n));
      var src = (d.sprites && d.sprites[s.id]) || [];
      charSprites[s.id] = [];
      for (var i = 0; i < charFrameCounts[s.id]; i++) charSprites[s.id][i] = normalizeDrawing(src[i], 10, 14);
    });
    RIG_PARTS.forEach(function(p){
      rigSprites[p] = normalizeDrawing(d.rig && d.rig[p], RIG_PART_DEFS[p].legacyW, RIG_PART_DEFS[p].legacyH);
    });
    Object.keys(RIG_ANCHOR_DEFAULTS).forEach(function(k){
      rigAnchors[k] = (d.anchors && typeof d.anchors[k] === "number") ? d.anchors[k] : RIG_ANCHOR_DEFAULTS[k];
    });
    localStorage.setItem("pg_char_color", charColor);
    persistCharMode(); persistCharFrameCounts(); persistCharSprites(); persistRigSprites(); persistRigAnchors();
  }
  function saveCurrentCharacter(){
    var data = currentCharacterData();
    askName("Name this character", "My Character", function(name){
      myCharacters.unshift({ id:"c"+Date.now(), name:name, data:data });
      myCharacters = myCharacters.slice(0, 24);
      persistMyCharacters();
      showToast("Saved '"+name+"' to My Characters");
      if (!charEditorOverlay.hidden) renderCharEditorPanels();
      else if (pmOpen) renderPersonalMenu();

  }

  // ---- the full-screen editor ----
  var charEditorOverlay = document.getElementById("charEditorOverlay");
  var ceCanvas = document.getElementById("ceCanvas");
  var ceCtx = ceCanvas.getContext("2d");
  var ceLeftEl = document.getElementById("ceLeft");
  var ceRightEl = document.getElementById("ceRight");
  var ceModeRowEl = document.getElementById("ceModeRow");
  var ceStageEl = document.getElementById("ceStage");
  var ceHintEl = document.getElementById("ceHint");
  var ceOnion = true;
  var cePrevCanvas = null;

  function ceIsRig(){ return charMode === "rig"; }
  function ceTargetDrawing(){
    if (ceIsRig()) return rigSprites[pmRigPart];
    return charSprites[pmEditState][pmEditFrame];
  }
  function ceSetTarget(d){
    if (ceIsRig()) rigSprites[pmRigPart] = d;
    else charSprites[pmEditState][pmEditFrame] = d;
  }
  function cePersist(){ if (ceIsRig()) persistRigSprites(); else persistCharSprites(); }
  function ceAspect(){
    if (ceIsRig()){ var d = RIG_PART_DEFS[pmRigPart]; return d.gameW / d.gameH; }
    return CHAR_ASPECT;
  }
  // Onion skin: the frame before this one, faint, underneath — so a walk
  // cycle can be drawn against the pose it has to flow out of.
  function ceOnionDrawing(){
    if (!ceOnion || ceIsRig() || charMode !== "animated") return null;
    var arr = charSprites[pmEditState];
    if (!arr || arr.length < 2) return null;
    var prev = (pmEditFrame - 1 + arr.length) % arr.length;
    return drawingHasArt(arr[prev]) ? arr[prev] : null;
  }

  function ceLayout(){
    if (charEditorOverlay.hidden) return;
    var availW = Math.max(80, ceStageEl.clientWidth - 8);
    var availH = Math.max(80, ceStageEl.clientHeight - 30);
    var a = ceAspect();
    var h = availH, w = h * a;
    if (w > availW){ w = availW; h = w / a; }
    var d2 = window.devicePixelRatio || 1;
    ceCanvas.style.width = Math.round(w) + "px";
    ceCanvas.style.height = Math.round(h) + "px";
    ceCanvas.width = Math.max(1, Math.round(w * d2));
    ceCanvas.height = Math.max(1, Math.round(h * d2));
    ceRedraw();
  }
  function ceRedraw(){
    var w = ceCanvas.width, h = ceCanvas.height;
    ceCtx.setTransform(1,0,0,1,0,0);
    ceCtx.clearRect(0, 0, w, h);
    var onion = ceOnionDrawing();
    if (onion){
      ceCtx.save(); ceCtx.globalAlpha = 0.2;
      ceCtx.drawImage(drawingCanvas(onion, w, h), 0, 0);
      ceCtx.restore();
    }
    // Composited from its own rasterisation rather than stroked straight
    // onto this canvas, so eraser strokes take out only this drawing and
    // leave the onion skin below them alone.
    ceCtx.drawImage(drawingCanvas(ceTargetDrawing(), w, h), 0, 0);
    ceRefreshPreview();
    ceRefreshFrameStrip();
  }

  // ---- freehand painting ----
  var ceStroke = null;
  function ceNorm(e){
    var r = ceCanvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / Math.max(1, r.width), y: (e.clientY - r.top) / Math.max(1, r.height) };
  }
  ceCanvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    ceCanvas.setPointerCapture(e.pointerId);
    var n = ceNorm(e);
    ceStroke = { c: pmPaintColor, w: ceBrushW, p: [n.x, n.y] };
    var d = ceTargetDrawing();
    d.push(ceStroke);
    touchDrawing(d);
    ceRedraw();
  });
  ceCanvas.addEventListener("pointermove", function(e){
    if (!ceStroke) return;
    var n = ceNorm(e);
    var p = ceStroke.p;
    var dx = n.x - p[p.length-2], dy = n.y - p[p.length-1];
    if (dx*dx + dy*dy < 0.00004) return; // skip jitter, keep the path light
    p.push(n.x, n.y);
    touchDrawing(ceTargetDrawing());
    ceRedraw();
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    ceCanvas.addEventListener(ev, function(){
      if (!ceStroke) return;
      ceStroke = null;
      cePersist();
      ceRedraw();
    });
  });

  function ceUndo(){
    var d = ceTargetDrawing();
    if (!d.length){ showToast("Nothing to undo."); return; }
    d.pop(); touchDrawing(d); cePersist(); ceRedraw();
  }
  function ceClear(){
    var d = ceTargetDrawing();
    d.length = 0; touchDrawing(d); cePersist(); ceRedraw();
  }
  function ceMirror(){
    var d = ceTargetDrawing();
    d.forEach(function(s){ for (var i = 0; i < s.p.length; i += 2) s.p[i] = 1 - s.p[i]; });
    touchDrawing(d); cePersist(); ceRedraw();
  }
  function ceCopyFrom(srcDrawing){
    if (!drawingHasArt(srcDrawing)){ showToast("That frame is empty."); return; }
    var copy = JSON.parse(JSON.stringify(srcDrawing));
    ceSetTarget(copy); touchDrawing(copy); cePersist(); ceRedraw();
    showToast("Copied.");
  }
