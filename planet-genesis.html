  /* The backdrop is soft gradients and hazy silhouettes with not one

  /* One bad frame used to kill the game permanently: requestAnimationFrame
     was the last statement inside the frame body, so anything that threw
     skipped the reschedule and left the page a still image until reload.
     The reschedule now lives outside the try, and always runs.

     Unwinding the canvas matters as much as catching. drawFrame opens a
     save() and closes it at the bottom, and the draw calls in between nest
     their own; throwing halfway leaves entries on the state stack, and the
     next frame pushes more on top — the transform drifts and every
     subsequent frame is wrong. restore() on an empty stack is defined as a
     no-op, so unwinding generously costs nothing and the explicit reset
     afterwards puts the context back to a known base.

     This is a catch-all on purpose, the same way pruneObjCtxMenu is: no
     future drawing code has to remember the loop must survive it. */
  var renderFails = 0, renderFailsLogged = 0, renderFailToldUser = false;
  function render(now){
    try {
      drawFrame(now);

      renderFails++;
      try {
        for (var i = 0; i < 64; i++) ctx.restore();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      } catch (e2){ /* nothing left to salvage; still reschedule below */ }
      /* Loud for the first few, then quiet. A fault that repeats every frame
         would otherwise bury the console at sixty lines a second, which
         hides the first error — the only one that says where it started. */
      if (renderFailsLogged < 3){
        renderFailsLogged++;
        console.error("Planet Genesis: a frame failed to draw and was skipped.", e);
        if (renderFailsLogged === 3) console.error("Planet Genesis: further frame errors will not be logged.");
      }
      if (!renderFailToldUser){
        renderFailToldUser = true;
        try { showToast("Something went wrong drawing that frame — the game kept going."); } catch (e3){}
      }
    }
    requestAnimationFrame(render);
  }

  function saveObjectToMyObjects(obj){

    });
    var all = pgUnionMany(world.map(function(w){ return w.poly; }), GEOM_TOL);
    var c = all.length ? pgCentroid(all) : { x:0, y:0 };
    var snap = world.map(function(w){ return { m: w.m, g: pgPack(pgTranslate(w.poly, -c.x, -c.y)) }; });

  // Objects saved before the geometry rework are still circle lists;
  // they migrate on the way out, exactly like an old level does.
  function savedObjectPieces(s){
    if (s.pieces){
      var out = [];
      s.pieces.forEach(function(pc){
        if (!matOf(pc.m) || matOf(pc.m).isFluid) return;
        var poly = pgClean(pgUnpack(pc.g), GEOM_TOL);
        if (poly.length) out.push({ m: pc.m, poly: poly });
      });
      return out;
    }
    if (!s.parts) return [];
    var byMat = {}, order = [];
    s.parts.forEach(function(p, i){
      if (!matOf(p.m) || matOf(p.m).isFluid) return;
      if (!byMat[p.m]){ byMat[p.m] = { rings:[], last:i }; order.push(p.m); }
      byMat[p.m].last = i;
      var shp = (p.s === "square" || p.s === "diamond") ? p.s : "circle";

    });
    order.sort(function(a, b){ return byMat[a].last - byMat[b].last; });
    var pieces = order.map(function(m){ return { m:m, poly: pgUnionMany(byMat[m].rings, GEOM_TOL_MIG) }; })
                      .filter(function(p){ return p.poly.length; });
    for (var i = 0; i < pieces.length; i++)

  /* Every slider in the game comes from here, so every slider gets the
     same three ways in: drag it; click it and nudge it with the arrow keys
     or A/D, a tenth of a notch at a time (a whole notch with Shift); or
     click the number and type one. Typed numbers are in the units shown —
     "45" on a percent slider means 45%, "20" on a motor means 20 rpm —
     which `sliderInverse` turns back into the raw value the slider holds. */
  function sliderRow(label, val, min, max, step, onChange, fmt){
    var row = document.createElement("div"); row.className = "settingRow";
    var top = document.createElement("div"); top.style.display="flex"; top.style.justifyContent="space-between"; top.style.alignItems="center";
    var lbl = document.createElement("label"); lbl.textContent = label;
    var valInp = document.createElement("input"); valInp.type = "text"; valInp.className = "val"; valInp.value = fmt(val);
    valInp.title = "Click and type a number";
    valInp.setAttribute("inputmode", "decimal"); valInp.spellcheck = false;
    top.appendChild(lbl); top.appendChild(valInp);
    var inp = document.createElement("input"); inp.type="range"; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    var cur = val;
    function apply(v){
      v = Math.max(min, Math.min(max, v));
      cur = v; inp.value = v;            // the thumb snaps to its notch; the value itself does not
      onChange(v); valInp.value = fmt(v);
    }
    inp.addEventListener("input", function(){ cur = parseFloat(inp.value); onChange(cur); valInp.value = fmt(cur); });
    inp.addEventListener("keydown", function(e){
      var dir = (e.code === "ArrowRight" || e.code === "KeyD" || e.code === "ArrowUp") ? 1 :
                ((e.code === "ArrowLeft" || e.code === "KeyA" || e.code === "ArrowDown") ? -1 : 0);
      if (!dir) return;
      e.preventDefault(); e.stopPropagation();
      var fine = e.shiftKey ? step : step / 10;
      apply(+(cur + dir * fine).toFixed(6));
    });
    valInp.addEventListener("focus", function(){ setTimeout(function(){ valInp.select(); }, 0); });   // after the click that focused it, or the click undoes the select
    valInp.addEventListener("keydown", function(e){
      e.stopPropagation();
      if (e.key === "Enter"){ valInp.blur(); }
      else if (e.key === "Escape"){ valInp.value = fmt(cur); valInp.blur(); }
    });
    valInp.addEventListener("blur", function(){
      var m = /-?\d*\.?\d+/.exec(valInp.value.replace(/,/g, "."));
      if (!m){ valInp.value = fmt(cur); return; }
      var v = sliderInverse(fmt, min, max, step, parseFloat(m[0]));
      if (v == null || Math.abs(v - cur) < 1e-9){ valInp.value = fmt(cur); return; }
      apply(v);
    });
    row.appendChild(top); row.appendChild(inp);
    return row;
  }
  /* The raw value whose display reads the typed number, or the nearest
     one the slider can show. The display is monotonic in the value for
     every slider here, so: sample it a notch at a time for the closest
     reading, then bisect between the neighbouring notches to land exactly
     (typing 123 on a rope with 10px notches gives 123, not 120). Ends of
     a range that show words instead of numbers — "loose", "night" — are
     simply skipped. */
  function sliderInverse(fmt, min, max, step, T){
    var num = function(v){ var m = /-?\d*\.?\d+/.exec(fmt(v)); return m ? parseFloat(m[0]) : NaN; };
    var n = Math.max(1, Math.min(3000, Math.round((max - min) / step))), best = null, bestD = Infinity;
    for (var i = 0; i <= n; i++){
      var v = min + (max - min) * i / n, d = Math.abs(num(v) - T);
      if (d < bestD){ bestD = d; best = v; }
    }
    if (best == null) return null;
    if (bestD > 0){
      var h = (max - min) / n, lo = Math.max(min, best - h), hi = Math.min(max, best + h);
      var nlo = num(lo), nhi = num(hi);
      if (!isNaN(nlo) && !isNaN(nhi) && nlo !== nhi){
        var inc = nhi > nlo;
        for (var k = 0; k < 40; k++){
          var mid = (lo + hi) / 2, nm = num(mid);
          if (isNaN(nm)) break;
          if (nm === T){ lo = hi = mid; break; }
          if ((nm < T) === inc) lo = mid; else hi = mid;
        }
        var v2 = (lo + hi) / 2;
        if (Math.abs(num(v2) - T) <= bestD){ best = v2; bestD = Math.abs(num(v2) - T); }
      }
    }
    // then the roundest number that still reads the same — 123, not 122.5;
    // 0.45 for 45%, not 0.4497
    var want = num(best);
    for (var dp = 0; dp <= 6; dp++){
      var r = +best.toFixed(dp);
      if (r >= min && r <= max && num(r) === want){ best = r; break; }
    }
    return +best.toFixed(6);
  }

    return cv;
  }

      { id:"gameplay", label:"Gameplay", render:function(el){ renderToolsTab(el, "gameplay"); } }
    ]},
    { id:"world", icon:"🌍", label:"World", pages:[
      { id:"world", label:"World Settings", render:renderWorldSettingsTab }
    ]},
    { id:"character", icon:"🧑", label:"Character", pages:[
      { id:"appearance", label:"Appearance", render:renderCharacterTab },
      { id:"menucolour", label:"Menu Colour", render:renderMenuColourTab }
    ]},
    { id:"resetpos", icon:"⤾", label:"Reset", action:true,
      run:function(){ resetCharacterPosition(); closePersonalMenu(); } }
  ];
  var MENU_SECTIONS_PLAY = [
    { id:"character", icon:"🧑", label:"Character", pages:[
      { id:"appearance", label:"Appearance", render:renderCharacterTab },
      { id:"menucolour", label:"Menu Colour", render:renderMenuColourTab }
    ]}
  ];

  /* Which object on `layer` is under the point — inside it, or within
     `slack` of its edge. */
  function objectUnderOn(x, y, layer, slack){
    var best = null, bestD = slack;
    objects.forEach(function(o){
      if (o.layer !== layer) return;
      var lp = worldPtToLocal(o, x, y);
      for (var i = 0; i < o.pieces.length; i++){
        var poly = o.pieces[i].poly;
        var d = pgContains(poly, lp.x, lp.y) ? -1 : pgEdgeDist(poly, lp.x, lp.y, slack + 1);
        if (d < bestD){ bestD = d; best = o; }
      }
    });
    return best;
  }
  /* What a bolt at this point would join: the object under it on the layer
     you are building on, and the object under it one layer behind (or, if
     nothing is behind, one in front). A bolt goes THROUGH — the two must be
     in different layers, as in LBP. Returns null if there is no pair. */
  function boltPairAt(x, y){
    var front = objectUnderOn(x, y, buildLayer, 6);
    if (!front) return null;
    var tries = [buildLayer - 1, buildLayer + 1, buildLayer - 2, buildLayer + 2], partner = null, pl = null;   // the layer behind, then in front, then two away — any two different layers can be bolted
    for (var i = 0; i < tries.length && !partner; i++){
      if (tries[i] < 0 || tries[i] > 2) continue;
      partner = objectUnderOn(x, y, tries[i], 6);
      if (partner) pl = tries[i];
    }
    if (!partner) return null;
    return { front: front, partner: partner, layer: Math.max(buildLayer, pl) };
  }
  /* Two clicks. The first picks an object and remembers the point; the
     second picks the other and makes the link. */
  function placeLinkAt(pt){
    var kind = LINK_TOOL_KIND[currentTool];
    var o = objectUnderAny(pt.x, pt.y, 6);
    if (!linkDraft){
      if (!o){ showToast("Start on something — click one object, then the other."); sfx("deny"); return; }
      linkDraft = { kind: kind, obj: o, pt: { x:pt.x, y:pt.y } };
      showToast("Now click the other object. Esc cancels.");
      sfx("tick");
      return;
    }
    if (!o || o === linkDraft.obj){ showToast(o ? "The other end has to be on a different object." : "Point at the other object."); sfx("deny"); return; }
    pushUndo("placing a " + LINK_LABEL[linkDraft.kind].toLowerCase());
    var l = addLink(linkDraft.kind, linkDraft.obj, linkDraft.pt, o, pt);
    linkDraft = null;
    if (l){ selectLink(l); showToast("🔗 " + LINK_LABEL[l.kind] + " placed — right-click it to set it up."); sfx("bolt"); }
  }
  function placeGadgetAt(pt){
    var kind = GADGET_TOOL_KIND[currentTool];
    if (moverDraft){
      // the second click: where the travel ends
      var dm = moverDraft; moverDraft = null;
      var st = gadgetWorld(dm), dx = pt.x - st.x, dy = pt.y - st.y;
      if (Math.hypot(dx, dy) < 12){ dx = 200; dy = 0; }   // a click on the spot: a default run to the right
      dm.line = { dx: dx, dy: dy };
      selectGadget(dm); renderSelBar();
      showToast("✨ Mover set — right-click it for speed and bounce. Drag the knob to change where it goes.");
      sfx("glue");
      return;
    }
    if (kind === "sticker"){
      if (!stickerPick){ showToast("Pick a sticker first — Build → Stickers."); sfx("deny"); return; }
      var sHost = objectUnderOn(pt.x, pt.y, buildLayer, 6);   // on the thing under the cursor — stickers stick to material, as LBP's do
      if (!sHost){ var anyHit = objectAt(pt.x, pt.y); sHost = anyHit ? anyHit.obj : null; }   // any layer's thing under the cursor
      if (!sHost){ showToast("Stickers stick to material — click on something you have built."); sfx("deny"); return; }
      pushUndo("placing a sticker");
      var gS = addGadget("sticker", sHost, pt, { skin: stickerPick.data, size: stickerSize, rot: stickerRot });
      selectGadget(gS);
      sfx("bolt");
      puff(pt.x, pt.y, 6, { color:"#F2B705", speed:1.4, g:0.05 });
      return;
    }
    if (kind === "anim" || kind === "creature"){
      // a drawn thing brings its own body: a plain box to start, on this
      // layer, that the hitbox step will reshape — then the studio opens
      pushUndo("placing a " + GADGET_LABEL[kind].toLowerCase());
      var hs = DRAWN_DEFAULT_SIZE / 2;
      var host0 = newObjectFromPoly(kind === "creature" ? "creaturebody" : "drawnbody", [[[[pt.x - hs, pt.y - hs], [pt.x + hs, pt.y - hs], [pt.x + hs, pt.y + hs], [pt.x - hs, pt.y + hs]]]], buildLayer);
      if (!host0){ showToast("No room for it there."); sfx("deny"); return; }
      host0.forcedStatic = kind === "anim";
      var g0 = addGadget(kind, host0, { x: pt.x, y: pt.y });
      g0.art = { x: -hs, y: -hs, w: DRAWN_DEFAULT_SIZE, h: DRAWN_DEFAULT_SIZE };
      g0.ghost = true; g0.ghostAuto = true;   // nothing touches it until a hitbox is drawn
      refreshObjectPhysics(host0);
      selectGadget(g0);
      sfx("bolt");
      openSkinStudio(g0);
      return;
    }
    var host = objectUnderOn(pt.x, pt.y, buildLayer, 6);
    if (!host && gadgetNeedsHost(kind)){ showToast("Put it on something on the " + LAYER_NAMES[buildLayer] + " layer."); sfx("deny"); return; }
    pushUndo("placing a " + GADGET_LABEL[kind].toLowerCase());
    var g = addGadget(kind, host, pt);
    selectGadget(g);
    if (kind === "mover"){ moverDraft = g; showToast("Now click where it should travel to (Esc to cancel)."); sfx("bolt"); return; }
    showToast("✨ " + GADGET_LABEL[kind] + " placed — right-click it to set it up and wire it.");
    sfx("bolt");
    puff(pt.x, pt.y, 8, { color:"#7FD4D9", speed:1.6, g:0.06 });
  }
  function placeBoltAt(pt){
    var pair = boltPairAt(pt.x, pt.y);
    if (!pair){
      var under = objectUnderOn(pt.x, pt.y, buildLayer, 6);
      showToast(under ? "A bolt goes through to the layer behind or in front — there is nothing there to pin to."
                      : "Point at something on the " + LAYER_NAMES[buildLayer] + " layer to bolt it.");
      sfx("deny"); return;
    }
    var kind = BOLT_TOOL_KIND[currentTool] || "bolt";
    pushUndo("placing a " + BOLT_KIND_LABEL[kind].toLowerCase());
    var nb = addBolt(pair.front, pair.partner, pt, "tight", { layer: pair.layer, kind: kind });
    selectBolt(nb);
    showToast("🔩 " + BOLT_KIND_LABEL[kind] + " placed — right-click it to set it up.");
    sfx("bolt");
    puff(pt.x, pt.y, 8, { color:"#98A3B3", speed:1.6, g:0.06 });
  }

  /* ============================================================
     Painting — a stroke is a swept polygon, not a row of stamps.

     Dragging a convex brush covers the Minkowski sum of the brush with
     the drag, and for a convex brush that is exactly the convex hull of
     the brush stamped at both ends. So a straight drag produces a
     mathematically straight edge, a curve produces a true offset curve,
     and the outline of the whole stroke is one contour rather than a
     chain of arcs. That is the difference between a cut that comes out
     clean and one that comes out scalloped.

     While you drag, the stroke's own polygon is grown segment by
     segment and drawn on top of the level — so the preview IS the
     geometry, and nothing changes shape when you let go. On release it
     is unioned into whatever it touched, cutting the other materials
     there, which is LBP's rule.
     ============================================================ */
  var painting = false, lastPaint = null;
  var stroke = null;                 // the drag in progress
  var FUSE_REACH = 4;                // how close counts as "touching"

  function strokeQuality(){ return camScale >= 1.6 ? 0.18 : 0.3; }
    /* `cut` is LittleBigPlanet's Triangle: the material brush, used the
     other way round. It takes exactly the footprint you can already see
     on the cursor — same shape, same size — and only on the layer you
     are building on, so a cut can't quietly eat the decoration behind
     what you are working on. The Erase tool is a slightly oversized
     round brush, and it too works only on the layer you are on (Carson:
     "the eraser only erases the layer you are in"); water is Mid's, so
     it mops water only from Mid. The Vacuum takes water and nothing else. */
  function beginStroke(pt, materialId, isErase, cut){
    var vacuum = currentTool === "vacuum";
    stroke = {
      mat: materialId, erase: !!isErase, cut: !!cut, layer: buildLayer, vacuum: vacuum,
      waterOnly: vacuum || !!(cut && matOf(currentTool) && matOf(currentTool).isFluid),
      r: (isErase && !cut) ? paintRadius() + 8 : paintRadius(),
      shape: (isErase && !cut) ? "circle" : paintShape,
      pts: [[pt.x, pt.y]], seg: 0, poly: null, done: null
    };
    strokeGrow();
  }
  function strokeAdd(pt){
    if (!stroke) return false;
    var last = stroke.pts[stroke.pts.length-1];
    var dx = pt.x - last[0], dy = pt.y - last[1];
    if (dx*dx + dy*dy < 1.6) return false;       // pointer noise
    stroke.pts.push([pt.x, pt.y]);
    strokeGrow();
    return true;
  }
  /* Only the segments drawn since last time are turned into geometry, so
     the live preview costs what you just moved rather than everything
     you have drawn so far. */
  function strokeGrow(){
    var pts = stroke.pts, n = pts.length, q = strokeQuality(), i;
    if (n === 1){
      stroke.poly = pgClean([[brushRing(stroke.shape, pts[0][0], pts[0][1], stroke.r, 0, q)]], GEOM_TOL);
      stroke.seg = 0;
      return;
    }
    var add = [];
    for (i = Math.max(1, stroke.seg + 1); i < n; i++){
      var ring = sweepRing(stroke.shape, pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], stroke.r, 0, q);
      if (ring.length >= 3) add.push([[ring]]);
    }
    stroke.seg = n - 1;
    if (!add.length) return;
    if (stroke.poly) add.unshift(stroke.poly);
    stroke.poly = pgUnionMany(add, GEOM_TOL);
    // A stroke that has wandered far enough to get genuinely complicated
    // is simplified harder rather than allowed to crawl.
    if (pgVertexCount(stroke.poly) > 2600) stroke.poly = pgClean(stroke.poly, 1.2);
  }
  // What the stroke would look like if it were committed right now.
  function drawStrokePreview(){
    if (!stroke || !stroke.poly || !stroke.poly.length) return;
    var path = mpPath(stroke.poly);
    ctx.save();
    if (stroke.erase){
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "rgba(20,14,10,.75)"; ctx.fill(path);
      ctx.globalAlpha = 0.9; ctx.lineWidth = 1.6/camScale;
      ctx.strokeStyle = "#F6ECD9"; ctx.setLineDash([6/camScale, 5/camScale]);
      ctx.stroke(path); ctx.setLineDash([]);
    } else {
      var mat = matOf(stroke.mat);
      var depth = layerDepth(stroke.layer);
      if (paintAlpha < 1) depth = { a: depth.a * paintAlpha, s: depth.s, off: depth.off, shade: depth.shade };
      ctx.globalAlpha = depth.a;
      ctx.fillStyle = mat.color; ctx.fill(path);
      ctx.save();
      ctx.clip(path);
      ctx.globalAlpha = depth.a*0.5; ctx.strokeStyle = mat.dark;
      ctx.lineWidth = BEVEL_W*2; ctx.lineJoin = "round"; ctx.stroke(path);
      ctx.restore();
      ctx.globalAlpha = depth.a; ctx.strokeStyle = INK; ctx.lineWidth = INK_W;
      ctx.stroke(path);
    }
    ctx.restore();
  }

  // How many separate islands the object's silhouette is in. Removing
  // material is the only thing that can raise this, and a rise is
  // exactly what "that cut it in two" means.
  function countIslands(obj){
    if (!obj.pieces.length) return 0;
    if (obj.pieces.length === 1) return obj.pieces[0].poly.length;
    var all = pgUnionMany(obj.pieces.map(function(p){ return p.poly; }), GEOM_TOL);
    return all.length;
  }
  /* Split an object whose silhouette has come apart. The biggest island
     keeps the original identity — its id, its bolts, whether it was
     anchored — and the rest are spawned beside it in the same frame.

     Only ever called after material has been REMOVED, and only when the
     island count actually went up. Painting can only ever join things
     together, and an object that arrived already in several pieces (an
     old level often has dozens welded into one) is left exactly as the
     player built it. */
  function splitObject(obj){
    if (objects.indexOf(obj) < 0 || !obj.pieces.length) return [obj];
    var all = pgUnionMany(obj.pieces.map(function(p){ return p.poly; }), GEOM_TOL);
    if (all.length <= 1) return [obj];
    if (all.length > 64) return [obj];        // not worth a hundred bodies
    var islands = all.map(function(poly){ return { mp:[poly], area: Math.abs(pgArea([poly])) }; });
    islands.sort(function(a,b){ return b.area - a.area; });
    var frame = { a: obj.body.angle, x: obj.body.position.x, y: obj.body.position.y };
    var made = [obj], keep = null, k, i;
    for (k = 0; k < islands.length; k++){
      var sub = [];
      for (i = 0; i < obj.pieces.length; i++){
        var inter = pgIntersect(obj.pieces[i].poly, islands[k].mp, GEOM_TOL);
        if (inter.length) sub.push({ m: obj.pieces[i].m, poly: inter });
      }
      if (!sub.length) continue;
      if (k === 0 || objects.length >= PLACED_CAP){
        keep = keep ? keep.concat(sub) : sub;
        continue;
      }
      var piece = { id:"o"+(objCounter++), body:null, parts:[], pieces:sub,
                    layer: obj.layer, darkMatter:false, decorative: obj.decorative,
                    forcedStatic: obj.forcedStatic, drawing:false, geomRev:0,
                    glow: (obj.glow == null ? 1 : obj.glow),
                    lightSolid: !!obj.lightSolid, lightFalls: !!obj.lightFalls };
      objects.push(piece);
      var hold = bulkList; bulkList = null;         // it needs a body right now
      var ok = rebuildFromPieces(piece, frame);
      bulkList = hold;
      if (ok) made.push(piece);
    }
    if (!keep){ return made; }
    obj.pieces = keep;
    var hold2 = bulkList; bulkList = null;
    rebuildFromPieces(obj);
    bulkList = hold2;
    // A bolt follows whichever piece its anchor actually sits on.
    bolts.slice().forEach(function(bo){
      ["objA","objB"].forEach(function(side){
        if (bo[side] !== obj) return;
        var best = null, bestD = Infinity;
        made.forEach(function(m){
          if (objects.indexOf(m) < 0) return;
          var lp = worldPtToLocal(m, bo.point.x, bo.point.y);
          for (var j = 0; j < m.pieces.length; j++){
            var d = pgContains(m.pieces[j].poly, lp.x, lp.y) ? 0
                  : pgEdgeDist(m.pieces[j].poly, lp.x, lp.y, 400);
            if (d < bestD){ bestD = d; best = m; }
          }
        });
        if (best && best !== obj) bo[side] = best;
      });
      if (bo.objA === bo.objB || objects.indexOf(bo.objA) < 0 || objects.indexOf(bo.objB) < 0) removeBolt(bo);
      else {
        bo.constraint.bodyA = bo.objA.body;
        bo.constraint.bodyB = bo.objB.body;
      }
    });
    return made;
  }
  function maybeSplit(obj, islandsBefore){
    if (objects.indexOf(obj) < 0) return 0;
    var after = countIslands(obj);
    if (after <= islandsBefore) return 0;
    return splitObject(obj).length - 1;
  }

  function commitStroke(){
    var st = stroke; stroke = null;
    if (!st || !st.poly || !st.poly.length) return;
    if (st.erase) return;                     // erasing commits as it goes
    if (matOf(st.mat) && matOf(st.mat).isMask){ endBulk(); commitMask(st.poly, true); return; }   // a creature's area, not the level
    beginBulk();
    var hits = objectsTouching(st.poly, st.layer, FUSE_REACH);
    var target = hits.length ? hits[0] : null, i;
    for (i = 1; i < hits.length; i++){
      if (objects.indexOf(hits[i]) < 0) continue;
      target = mergeObjects(target, hits[i]);
    }
    if (target){
      if (objCorners(target) > MAX_OBJ_CORNERS){
        endBulk();
        showToast("That shape is getting too complicated — try building it in separate pieces.");
        sfx("deny");
        return;
      }
      addPolyToObject(target, st.mat, st.poly, GEOM_TOL);
      target.drawing = false;
      if (stickPaint) target.forcedStatic = true;
      rebuildFromPieces(target);
    } else {
      target = newObjectFromPoly(st.mat, st.poly, st.layer);
      if (target && stickPaint){ target.forcedStatic = true; }
    }
    endBulk();
    if (!target || objects.indexOf(target) < 0) return;
    target.drawing = false;
    refreshObjectPhysics(target);
    Body.setVelocity(target.body, {x:0,y:0});
    Body.setAngularVelocity(target.body, 0);
  }

  function paintAt(rawPt){
    var pt = snapPt(rawPt);
    if (currentTool === "spawn"){ checkpoints[0].x = pt.x; checkpoints[0].y = pt.y; return; }
    if (currentTool === "checkpoint"){
      if (!lastPaint || dist(pt,lastPaint) > 60){
        checkpoints.push({ x:pt.x, y:pt.y, reached:false }); lastPaint = pt;
        sfx("place"); puff(pt.x, pt.y, 8, { color:"#2F86A6", speed:1.6, g:0.1 });
      }
      return;
    }
    if (currentTool === "bubble"){
      if (!lastPaint || dist(pt,lastPaint) > 40){
        bubbles.push({ x:pt.x, y:pt.y, collected:false }); lastPaint = pt;
        sfx("tick"); puff(pt.x, pt.y, 6, { color:"#F2B705", speed:1.4, g:0.02 });
      }
      return;
    }
    if (currentTool === "goal"){ goalPoint = pt; sfx("place"); return; }
    if (isBoltTool()){ if (!lastPaint){ placeBoltAt(pt); lastPaint = pt; } return; }
    if (isGadgetTool()){ if (!lastPaint){ placeGadgetAt(pt); lastPaint = pt; } return; }
    if (isLinkTool()){ if (!lastPaint){ placeLinkAt(pt); lastPaint = pt; } return; }
    if (currentTool.indexOf("stamp:") === 0){
      stampObject(currentTool.slice(6), pt);
      currentTool = "move"; canvas.dataset.tool = "move";
      return;
    }
    // Any cut already under way — the Erase tool, or a right-drag with a
    // material picked — keeps going through the same path.
    if (stroke && stroke.erase){
      if (!strokeAdd(pt)) return;
      eraseStep();
      lastPaint = pt;
      return;
    }
    if (currentTool === "erase" || currentTool === "vacuum"){
      beginStroke(pt, null, true, false);
      eraseStep();
      lastPaint = pt;
      return;
    }
    // Water is poured, not built. It never becomes a body, and it only
    // exists on the Mid layer — the Back and Front layers are painted
    // decoration with no physics for water to sit in.
    if (currentTool === "water"){
      if (buildLayer !== MID_LAYER){
        showToast("Water only works on the Mid layer — switch to Mid to pour it.");
        return;
      }
      addWaterAt(pt.x, pt.y, paintRadius(), 1);
      lastPaint = pt;
      sfx("pour");
      puff(pt.x, pt.y, 2, { color:"#8FD3F0", speed:0.8, g:0.14, r:2.4, jitter:paintRadius() });
      return;
    }
    if (!matOf(currentTool)) return;

    if (!stroke){
      beginStroke(pt, currentTool, false);
      sfx("paint");
    } else if (!strokeAdd(pt)) return;
    lastPaint = pt;
    if (Math.random() < 0.35){
      puff(pt.x, pt.y, 1, { color: matOf(currentTool).dark, speed:0.7, g:0.03, r:2,
                            jitter: stroke.r*1.2, life:20 });
    }
  }

  /* ---- Drag-out shapes -----------------------------------------------
     The other half of building: drag out a rectangle, ellipse or
     triangle and let go and it arrives as one solid piece — and now
     literally so. A dragged rectangle is a four-corner rectangle, not
     six hundred circles packed on a lattice hoping to look like one.
     Shift constrains to a square / circle / equilateral triangle.
     -------------------------------------------------------------- */
  var shapeDrag = null;      // { a, b, square }
  function shapeRect(d){
    var ax = d.a.x, ay = d.a.y, bx = d.b.x, by = d.b.y;
    if (d.square){
      var s = Math.max(Math.abs(bx-ax), Math.abs(by-ay));
      bx = ax + (bx < ax ? -s : s);
      by = ay + (by < ay ? -s : s);
    }
    return { x: Math.min(ax,bx), y: Math.min(ay,by), w: Math.abs(bx-ax), h: Math.abs(by-ay) };
  }
  function insideShape(mode, x, y, R){
    var u = R.w ? (x - R.x)/R.w : 0.5, v = R.h ? (y - R.y)/R.h : 0.5;
    if (mode === "ellipse"){
      var dx = u - 0.5, dy = v - 0.5;
      return dx*dx + dy*dy <= 0.25;
    }
    if (mode === "tri"){
      if (v < 0 || v > 1) return false;
      var halfW = v*0.5;
      return Math.abs(u - 0.5) <= halfW + 1e-6;
    }
    return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  }
  // The exact contour of a dragged shape.
  function dragShapeRing(mode, R){
    var pts = [], i, n;
    if (mode === "ellipse"){
      var rx = Math.max(0.5, R.w/2), ry = Math.max(0.5, R.h/2);
      n = Math.max(16, Math.min(160, Math.ceil(Math.PI * (rx + ry) / 2.2)));
      for (i = 0; i < n; i++){
        var a = i/n*Math.PI*2;
        pts.push([R.x + R.w/2 + Math.cos(a)*rx, R.y + R.h/2 + Math.sin(a)*ry]);
      }
    } else if (mode === "tri"){
      pts = [[R.x + R.w/2, R.y], [R.x + R.w, R.y + R.h], [R.x, R.y + R.h]];
    } else {
      pts = [[R.x, R.y], [R.x + R.w, R.y], [R.x + R.w, R.y + R.h], [R.x, R.y + R.h]];
    }
    return ringArea2(pts) > 0 ? pts : pts.reverse();
  }
  function tracePreviewShape(c2d, mode, R){
    if (mode === "ellipse"){
      c2d.ellipse(R.x + R.w/2, R.y + R.h/2, Math.max(0.5,R.w/2), Math.max(0.5,R.h/2), 0, 0, Math.PI*2);
    } else if (mode === "tri"){
      c2d.moveTo(R.x + R.w/2, R.y);
      c2d.lineTo(R.x + R.w, R.y + R.h);
      c2d.lineTo(R.x, R.y + R.h);
      c2d.closePath();
    } else {
      c2d.rect(R.x, R.y, R.w, R.h);
    }
  }
  function drawShapePreview(){
    if (!shapeDrag) return;
    var R = shapeRect(shapeDrag);
    var mat = matOf(currentTool);
    if (!mat) return;
    ctx.save();
    ctx.beginPath();
    tracePreviewShape(ctx, paintMode, R);
    ctx.globalAlpha = shapeDrag.erase ? 0.5 : 0.34;
    ctx.fillStyle = shapeDrag.erase ? "rgba(20,14,10,.8)" : mat.color;
    ctx.fill();
    ctx.globalAlpha = 0.95; ctx.lineWidth = 2.5/camScale;
    ctx.setLineDash([8/camScale, 6/camScale]);
    ctx.strokeStyle = shapeDrag.erase ? "#F6ECD9" : "rgba(43,27,18,.9)"; ctx.stroke();
    ctx.setLineDash([]);
    // live size readout, so you can build to a measurement
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(43,27,18,.85)";
    var fs = 13/camScale;
    ctx.font = fs + "px 'Baloo 2', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(Math.round(R.w) + " × " + Math.round(R.h), R.x + R.w/2, R.y - 8/camScale);
    ctx.restore();
  }
  /* ---- The fill: a bucket ----------------------------------------
     Click inside a closed outline and the inside fills. The inside is a
     HOLE in the union of everything solid on the build layer — a shape
     you drew round, a cave, the belly of a bottle — so anything of any
     material bounds it, and an area open to the map's edge is not
     enclosed at all. The union is cached by a key of the layer's objects
     (id, shape revision, position, angle) so hovering and clicking do not
     redo it unless something moved; a level's worth of pieces unions in
     tens of milliseconds. Pieces sitting inside the hole are cut out of
     the fill, so filling round an island leaves the island. */
  var fillCache = { key: null, union: [], ms: 0 }, fillHover = null, fillHoverAt = 0, fillHoverSlow = false, fillHoverFrom = null;
  /* The key that says the union is stale. A moving object (a creature, a
     falling crate) would change an exact key every frame and have the
     union — tens of milliseconds on a big level — redone every hover
     tick: that was Carson's "the game is very laggy now" after the fill
     landed with Fill left picked. Free objects go in at 24px and a tenth
     of a turn; still objects exactly. */
  function layerGeomKey(layer){
    var k = layer + ":" + objects.length;
    for (var i = 0; i < objects.length; i++){
      var o = objects[i];
      if (o.layer !== layer || !o.body) continue;
      var st = o.body.isStatic;
      k += "," + o.id + ":" + (o.geomRev || 0) + ":" + (st ? Math.round(o.body.position.x) + ":" + Math.round(o.body.position.y) + ":" + o.body.angle.toFixed(2)
                                                        : Math.round(o.body.position.x / 24) + ":" + Math.round(o.body.position.y / 24) + ":" + o.body.angle.toFixed(1));
    }
    return k;
  }
  function solidUnion(layer){
    var polys = [];
    objects.forEach(function(o){
      if (o.layer !== layer || !o.body) return;
      o.pieces.forEach(function(pc){ var m = matOf(pc.m); if (!m || m.isFluid || m.isMask) return; polys.push(objToWorld(o, pc.poly)); });
    });
    var t0 = performance.now();
    var u = polys.length ? pgUnionMany(polys, GEOM_TOL) : [];
    fillCache.ms = performance.now() - t0;
    return u;
  }
  function enclosedRegionAt(x, y, layer){
    var key = layerGeomKey(layer);
    if (fillCache.key !== key){ fillCache.key = key; fillCache.union = solidUnion(layer); }
    var u = fillCache.union;
    if (pgPieceAt(u, x, y) >= 0) return null;                // on material already
    for (var i = 0; i < u.length; i++){
      var poly = u[i];
      if (!ringContains(poly[0], x, y)) continue;
      for (var j = 1; j < poly.length; j++){
        if (!ringContains(poly[j], x, y)) continue;
        var hole = pgClean([[poly[j].slice().reverse()]], GEOM_TOL);
        if (!hole.length) return null;
        return pgDiff(hole, u, GEOM_TOL);                    // less any island sitting inside it
      }
    }
    return null;
  }
  function fillAt(pt){
    fillHoverSlow = false;
    var mat = matOf(currentTool);
    if (!mat || mat.isMask) return;
    if (mat.isFluid && buildLayer !== MID_LAYER){ showToast("Water only works on the Mid layer — switch to Mid to pour it."); sfx("deny"); return; }
    var region = enclosedRegionAt(pt.x, pt.y, buildLayer);
    if (!region || !region.length){
      showToast(pgPieceAt(fillCache.union, pt.x, pt.y) >= 0 ? "That is already material — click inside an empty enclosed space." : "Nothing closed round here — the fill needs material all the way round it (the map's edge does not count).");
      sfx("deny"); return;
    }
    var bb = pgBounds(region);
    if (mat.isFluid){
      pushUndo("filling with water");
      var wstep = WATER_CELL * 0.8, n = 0;
      for (var wy = bb.y + wstep/2; wy <= bb.y2; wy += wstep){
        for (var wx = bb.x + wstep/2; wx <= bb.x2; wx += wstep){
          if (pgContains(region, wx, wy)){ addWaterAt(wx, wy, WATER_CELL*0.6, 1); n++; }
        }
      }
      sfx("splash");
      puff(pt.x, pt.y, 14, { color:"#8FD3F0", speed:2, g:0.12, jitter:Math.min(bb.x2 - bb.x, bb.y2 - bb.y)*0.3 });
      return;
    }
    pushUndo("filling with " + mat.label);
    // fused with whatever the outline is made of: the fill's edge IS their
    // edge, so it welds to everything it lies against, as paint does
    paintPolyOnLayer(region, mat, { x: (bb.x + bb.x2)/2, y: (bb.y + bb.y2)/2, w: bb.x2 - bb.x, h: bb.y2 - bb.y }, objectsAlong(region, buildLayer));
    fillHover = null;
  }
  // the objects on `layer` whose edges the region's corners lie on (within 3px)
  function objectsAlong(region, layer){
    var pts = [];
    region.forEach(function(poly){ poly.forEach(function(ring){ for (var i = 0; i < ring.length; i++) pts.push(ring[i]); }); });
    var step = Math.max(1, Math.floor(pts.length / 300)), wb = pgBounds(region), hits = [];
    if (!wb) return hits;
    objects.forEach(function(o){
      if (o.layer !== layer || !o.body) return;
      var ob = o.body.bounds;
      if (ob.max.x < wb.x - 4 || ob.min.x > wb.x2 + 4 || ob.max.y < wb.y - 4 || ob.min.y > wb.y2 + 4) return;
      for (var k = 0; k < pts.length; k += step){
        var lc = worldPtToLocal(o, pts[k][0], pts[k][1]);
        for (var j = 0; j < o.pieces.length; j++){
          if (pgEdgeDist(o.pieces[j].poly, lc.x, lc.y, 3) < 3){ hits.push(o); return; }
        }
      }
    });
    return hits;
  }
  /* A finished polygon of the current material goes onto the build layer
     the way a drag-out shape does: fused into whatever it touches, or a
     new object of its own; selected when done. */
  function paintPolyOnLayer(poly, mat, at, hosts){
    beginBulk();
    var hits = hosts && hosts.length ? hosts : objectsTouching(poly, buildLayer, FUSE_REACH);
    var obj = hits.length ? hits[0] : null, i;
    for (i = 1; i < hits.length; i++){
      if (objects.indexOf(hits[i]) < 0) continue;
      obj = mergeObjects(obj, hits[i]);
    }
    if (obj) addPolyToObject(obj, currentTool, poly, GEOM_TOL);
    else obj = newObjectFromPoly(currentTool, poly, buildLayer);
    if (!obj){ endBulk(); return null; }
    obj.drawing = false;
    if (stickPaint) obj.forcedStatic = true;
    rebuildFromPieces(obj);
    endBulk();
    if (objects.indexOf(obj) < 0) return null;
    refreshObjectPhysics(obj);
    Body.setVelocity(obj.body, {x:0,y:0});
    Body.setAngularVelocity(obj.body, 0);
    sfx("shape");
    puff(at.x, at.y, 16, { color: mat.color, speed:2.6, g:0.05, jitter: Math.max(at.w, at.h)*0.4, r:3.4 });
    // Hand it over selected: nine times out of ten the next thing you
    // want is to anchor it, nudge it or copy it, and now all of that is
    // sitting right above the piece you just made.
    selected = obj;
    renderSelBar();
    return obj;
  }
  function commitShapeDrag(){
    var d = shapeDrag; shapeDrag = null;
    if (!d){ endBulk(); return; }
    var mat = matOf(currentTool);
    if (!mat) return;
    var R = shapeRect(d);
    var r = paintRadius();
    if (R.w < r*0.6 && R.h < r*0.6){ sfx("deny"); return; }   // a click, not a drag

    // A creature's area: the shape goes on (left) or comes off (right)
    if (mat.isMask){
      var mshape = pgClean([[dragShapeRing(paintMode, R)]], GEOM_TOL);
      if (mshape.length) commitMask(mshape, !d.erase);
      return;
    }
    // Right-dragged: punch this shape OUT of whatever is on this layer.
    if (d.erase){
      var hole = pgClean([[dragShapeRing(paintMode, R)]], GEOM_TOL);
      if (!hole.length){ sfx("deny"); return; }
      var touched = [], gone = false;
      beginBulk();
      removeWaterAt(R.x + R.w/2, R.y + R.h/2, Math.max(R.w, R.h)/2);
      if (!mat.isFluid){
        objectsTouching(hole, buildLayer, 0).forEach(function(o){
          touched.push({ obj:o, islands: countIslands(o) });
          if (!subPolyFromObject(o, hole, GEOM_TOL)) return;
          gone = true;
          if (!o.pieces.length) removeObject(o);
          else rebuildFromPieces(o);
        });
      }
      endBulk();
      var extraCut = 0;
      touched.forEach(function(t){ if (objects.indexOf(t.obj) >= 0) extraCut += maybeSplit(t.obj, t.islands); });
      sfx(gone ? "erase" : "deny");
      puff(R.x + R.w/2, R.y + R.h/2, 12, { color:"#8B8374", speed:2.2, g:0.1,
        jitter: Math.max(R.w, R.h)*0.35, r:2.8 });
      if (extraCut > 0) showToast("✂ That cut it into " + (extraCut+1) + " pieces.");
      return;
    }

    if (mat.isFluid){
      // water isn't a body — fill the region with fluid instead
      var wstep = WATER_CELL*0.8;
      for (var wy = R.y; wy <= R.y + R.h; wy += wstep){
        for (var wx = R.x; wx <= R.x + R.w; wx += wstep){
          if (insideShape(paintMode, wx, wy, R)) addWaterAt(wx, wy, WATER_CELL*0.6, 1);
        }
      }
      sfx("splash");
      puff(R.x + R.w/2, R.y + R.h/2, 14, { color:"#8FD3F0", speed:2, g:0.12, jitter:Math.max(R.w,R.h)*0.35 });
      return;
    }

    var poly = pgClean([[dragShapeRing(paintMode, R)]], GEOM_TOL);
    if (!poly.length){ sfx("deny"); return; }
    paintPolyOnLayer(poly, mat, { x: R.x + R.w/2, y: R.y + R.h/2, w: R.w, h: R.h });
  }
  // Nothing you are part-way through drawing should sag, roll or fall:
  // the shape stays frozen until the mouse comes up, then goes live.
  function endPaintStroke(){
    if (stroke && stroke.erase){
      stroke = null;
      endBulk();
      finishErase();
    } else if (stroke){
      commitStroke();
    } else {
      endBulk();
    }
    painting = false; lastPaint = null;
  }

  /* ============================================================
     Regions — one material area inside a welded object.

     LBP keeps every painted material as its own Thing even when it is
     glued into a bigger assembly, so you can right-click just the dark
     matter bar running through a plank and delete only that. Here a
     REGION is one connected island of one material, and because the
     materials never overlap it is unambiguous which one you clicked.
     ============================================================ */
  function regionAt(x, y, slack){
    var hit = objectAt(x, y, slack);
    if (!hit) return null;
    var o = hit.obj, lp = worldPtToLocal(o, x, y), i, j;
    for (i = 0; i < o.pieces.length; i++){
      var isl = pgPieceAt(o.pieces[i].poly, lp.x, lp.y);
      if (isl >= 0) return { obj:o, materialId:o.pieces[i].m, pieceIdx:i, island:isl };
    }
    var best = null, bd = (slack == null ? GRAB_SLACK : slack) + 2;
    for (i = 0; i < o.pieces.length; i++){
      for (j = 0; j < o.pieces[i].poly.length; j++){
        var d = pgEdgeDist([o.pieces[i].poly[j]], lp.x, lp.y, bd);
        if (d < bd){ bd = d; best = { obj:o, materialId:o.pieces[i].m, pieceIdx:i, island:j }; }
      }
    }
    return best;
  }
  function regionValid(reg){
    return !!(reg && reg.obj && objects.indexOf(reg.obj) >= 0 &&
              reg.obj.pieces[reg.pieceIdx] &&
              reg.obj.pieces[reg.pieceIdx].m === reg.materialId &&
              reg.obj.pieces[reg.pieceIdx].poly[reg.island]);
  }
  // Is this region the entire object? Then it isn't a "piece" worth
  // offering separately — it's just the object again.
  function regionIsWhole(reg){
    if (!regionValid(reg)) return true;
    var o = reg.obj;
    return o.pieces.length === 1 && o.pieces[0].poly.length === 1;
  }
  function regionPoly(reg){
    return regionValid(reg) ? [ reg.obj.pieces[reg.pieceIdx].poly[reg.island] ] : null;
  }
  // Remove a whole region and let whatever it was holding together fall apart.
  function deleteRegion(reg){
    if (!regionValid(reg)) return false;
    var o = reg.obj, pc = o.pieces[reg.pieceIdx];
    var before = countIslands(o);
    pc.poly = pc.poly.filter(function(_, i){ return i !== reg.island; });
    o.pieces = o.pieces.filter(function(p){ return p.poly && p.poly.length; });
    if (!o.pieces.length){ removeObject(o); return true; }
    rebuildFromPieces(o);
    maybeSplit(o, before);
    return true;
  }

  /* ---- Erasing --------------------------------------------------------
     Subtracting the brush's swept area, exactly like painting but the
     other way round, so the cut follows the cursor precisely instead of
     coming away in brush-sized chunks. It commits as you drag rather
     than on release, because an eraser you can't see working is no use.
     -------------------------------------------------------------------- */
  var eraseTouched = [];             // [{obj, islands}]
  function eraseNote(o){
    for (var i = 0; i < eraseTouched.length; i++) if (eraseTouched[i].obj === o) return;
    eraseTouched.push({ obj:o, islands: countIslands(o) });
  }
  function eraseStep(){
    if (!stroke) return;
    var pts = stroke.pts, n = pts.length, q = strokeQuality();
    // Just the sweep since the last step, in the stroke's OWN brush shape —
    // a right-click cut takes exactly the footprint the cursor was showing,
    // square or diamond included, while the Erase tool stays round.
    var seg;
    if (n === 1) seg = pgClean([[brushRing(stroke.shape, pts[0][0], pts[0][1], stroke.r, 0, q)]], GEOM_TOL);
    else {
      var ring = sweepRing(stroke.shape, pts[n-2][0], pts[n-2][1], pts[n-1][0], pts[n-1][1], stroke.r, 0, q);
      seg = pgClean([[ring]], GEOM_TOL);
    }
    if (!seg.length) return;
    var pt = { x: pts[n-1][0], y: pts[n-1][1] };
    beginBulk();
    if (stroke.cut && matOf(currentTool) && matOf(currentTool).isMask){ commitMask(seg, false); return; }   // a creature's area comes off
    var hadWater = false;
    if (stroke.layer === MID_LAYER || stroke.vacuum) hadWater = removeWaterAt(pt.x, pt.y, stroke.r);   // water is Mid's: the eraser mops it there, the vacuum anywhere
    var bit = false;
    (stroke.waterOnly ? [] : objectsTouching(seg, stroke.layer, 0)).forEach(function(o){
      eraseNote(o);
      if (!subPolyFromObject(o, seg, GEOM_TOL)) return;
      bit = true;
      if (Math.random() < 0.7){
        var m = o.pieces.length ? o.pieces[0].m : "dissolve";
        puff(pt.x, pt.y, 2, { color: matOf(m).dark, speed:1.3, g:0.08, r:2.4,
                              jitter: stroke.r*0.7, life:22 });
      }
      if (!o.pieces.length) removeObject(o);
      else rebuildFromPieces(o);
    });
    if (bit) sfx("erase");
    else if (stroke.vacuum && hadWater){ sfx("pour"); puff(pt.x, pt.y, 2, { color:"#8FD3F0", speed:1.2, g:-0.04, r:2.2, jitter: stroke.r*0.6, life:16 }); }
    if (!painting){ endBulk(); finishErase(); }
    if (stroke.vacuum) return;                 // water only: bubbles, checkpoints and bolts are none of its business
    bubbles = bubbles.filter(function(b){ return dist(b, pt) >= Math.max(24, stroke.r); });
    for (var i = checkpoints.length - 1; i >= 1; i--){
      if (dist(checkpoints[i], pt) < Math.max(34, stroke.r)) checkpoints.splice(i, 1);
    }
    bolts.slice().forEach(function(b){ if (dist(b.point, pt) < Math.max(20, stroke.r)) removeBolt(b); });
  }
  function finishErase(){
    if (!eraseTouched.length) return;
    var extra = 0;
    eraseTouched.forEach(function(e){ extra += maybeSplit(e.obj, e.islands); });
    eraseTouched = [];
    if (extra > 0) showToast("✂ That cut it into " + (extra+1) + " pieces.");
  }
  // Kept for the few callers that erase at a single point rather than
  // along a drag (the keyboard shortcut, mainly).
  function eraseAt(pt){
    var wasPainting = painting;
    painting = false;
    beginStroke(pt, null, true);
    eraseStep();
    stroke = null;
    painting = wasPainting;
  }

  /* ============================================================
     6d. Selection — pick a thing you've built and do something to it.

     Painting is only half of building; the other half is picking up
     what you made and turning it, mirroring it, copying it, locking it
     down or dropping it onto another layer. Clicking an object with the
     Move tool selects it, rings it, and floats a little bar of those
     actions beside it.
     ============================================================ */
  var selected = null;
  var selectedBolt = null;   // a bolt is selected instead of objects
  var opWanted = false;   // the object box is open — see renderSelBar
  /* The PIECE under the cursor, as opposed to the whole object: the run
     of one material you could pull out on its own. LittleBigPlanet lets
     you address these separately even while they are welded into one
     movable thing, and that is what makes cutting a plank in half with
     a line of Dark Matter work. */
  var selectedRegion = null;
  /* Everything currently picked. `selected` stays the one the toolbar
     reads for its own state (anchored or not, which layer); `selection`
     is what every action actually runs over, so a marquee drag and a
     plain click go through exactly the same code. */
  var selection = [];
  var objPanelEl = document.getElementById("objPanel");
  var opHeadEl = document.getElementById("opHead");
  var opTitleEl = opHeadEl.querySelector(".t");
  var opBodyEl = document.getElementById("opBody");
  function clearSelection(){
    selectedRegion = null;
    selection = [];
    selectedBolt = null;
    if (maskPaint && selectedGadget === maskPaint.g) endMaskPaint();
    selectedGadget = null;
    selectedLink = null;
    /* Hide first, bail second. removeObject nulls `selected` before it
       calls this, so an early return above the hide would leave the box
       open with nothing in it — which is exactly what happened. The guard
       is for boot: clearAllObjects runs before the box has been looked up. */
    if (objPanelEl) objPanelEl.hidden = true;
    opWanted = false;
    if (!selected) return;
    selected = null;
  }
  function selectBolt(b){
    clearSelection();
    selectedBolt = b;
    sfx("tick");
  }
  function selectGadget(g){
    clearSelection();
    selectedGadget = g;
    sfx("tick");
  }
  function selectLink(l){
    clearSelection();
    selectedLink = l;
    sfx("tick");
  }
  function deleteSelectedLink(){
    var l = selectedLink;
    if (!l || links.indexOf(l) < 0) return;
    pushUndo("removing a " + LINK_LABEL[l.kind].toLowerCase());
    var e = linkEnds(l);
    removeLink(l);
    puff((e.a.x+e.b.x)/2, (e.a.y+e.b.y)/2, 8, { color:"#98A3B3", speed:1.6, g:0.06 });
    clearSelection();
    sfx("delete");
  }
  function deleteSelectedGadget(){
    var g = selectedGadget;
    if (!g || gadgets.indexOf(g) < 0) return;
    pushUndo("removing a " + GADGET_LABEL[g.kind].toLowerCase());
    var pt = gadgetWorld(g);
    removeGadget(g);
    puff(pt.x, pt.y, 8, { color:"#7FD4D9", speed:1.6, g:0.06 });
    clearSelection();
    sfx("delete");
  }
  /* A wire is made by picking "Connect to…" on a gadget, then clicking the
     bolt (or gadget) it should drive. Anything that cannot take an input
     just cancels. */
  function finishWire(pt){
    if (!wiring) return false;
    var from = wiring.from;
    var tgt = boltAt(pt.x, pt.y, 22) || gadgetAt(pt.x, pt.y, 22) || linkAt(pt.x, pt.y, 14);
    wiring = null;
    if (!tgt || !canReceive(tgt)){ showToast("That cannot be driven — wire to a motor bolt, wobble bolt or piston."); sfx("deny"); return true; }
    pushUndo("wiring a " + GADGET_LABEL[from.kind].toLowerCase());
    if (addWire(from, tgt)){ showToast("Wired."); sfx("glue"); } else { showToast("Already wired to that."); }
    selectGadget(from); opWanted = true; renderSelBar();
    return true;
  }
  function deleteSelectedBolt(){
    var b = selectedBolt;
    if (!b || bolts.indexOf(b) < 0) return;
    pushUndo("removing a bolt");
    var pt = boltWorldPoint(b);
    removeBolt(b);
    puff(pt.x, pt.y, 8, { color:"#98A3B3", speed:1.6, g:0.06 });
    clearSelection();
    sfx("delete");
    showToast("Bolt removed.");
  }
  // Everything selected that still exists.
  function selList(){
    if (selection.length) return selection.filter(function(o){ return objects.indexOf(o) >= 0; });
    return (selected && objects.indexOf(selected) >= 0) ? [selected] : [];
  }
  function selectMany(list, additive){
    var out = additive ? selList() : [];
    list.forEach(function(o){ if (objects.indexOf(o) >= 0 && out.indexOf(o) < 0) out.push(o); });
    selection = out;
    selected = out[out.length - 1] || null;
    selectedRegion = null;
    if (!selected){ objPanelEl.hidden = true; return; }
    renderSelBar();
  }
  function toggleInSelection(o){
    var list = selList(), i = list.indexOf(o);
    if (i >= 0) list.splice(i, 1); else list.push(o);
    selection = list;
    selected = list[list.length - 1] || null;
    selectedRegion = null;
    if (!selected){ objPanelEl.hidden = true; return; }
    renderSelBar();
  }
  function selectionBounds(){
    var list = selList(), b = null;
    list.forEach(function(o){
      var ob = o.body.bounds;
      if (!b) b = { minX:ob.min.x, minY:ob.min.y, maxX:ob.max.x, maxY:ob.max.y };
      else {
        if (ob.min.x < b.minX) b.minX = ob.min.x;
        if (ob.min.y < b.minY) b.minY = ob.min.y;
        if (ob.max.x > b.maxX) b.maxX = ob.max.x;
        if (ob.max.y > b.maxY) b.maxY = ob.max.y;
      }
    });
    return b;
  }
  // Outline of the selected piece, cached in the body's own frame so it
  // follows the object around for free.
  function regionOutline(reg){
    if (!regionValid(reg)) return null;
    if (reg._path && reg._pathRev === (reg.obj.geomRev||0)) return reg._path;
    var pth = mpPath(regionPoly(reg));
    reg._path = pth; reg._pathRev = reg.obj.geomRev||0;
    return pth;
  }
  function selectObject(o){
    selectedBolt = null;
    selectedGadget = null;
    selectedLink = null;
    if (selected === o && selection.length <= 1){ selection = [o]; renderSelBar(); return; }
    selected = o;
    selection = [o];
    renderSelBar();
    sfx("tick");
  }
  function selBtn(label, title, fn, on){
    var b = document.createElement("button");
    b.textContent = label; b.title = title;
    if (on) b.className = "on";
    b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });

      if (dash){ ctx.setLineDash([dash[0]/camScale, dash[1]/camScale]); ctx.lineDashOffset = -performance.now()/70/camScale; }
      for (var pi = 0; pi < paths.regions.length; pi++) ctx.stroke(paths.regions[pi].path);
      ctx.setLineDash([]);
      ctx.restore();
    };
    if (h) shapeOutline(h, "#F6ECD9", 0.6, 2.4, [6, 5]);

        var rb = o.body;
        ctx.save();
        ctx.translate(rb.position.x, rb.position.y);
        ctx.rotate(rb.angle);
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 2.6/camScale;
        ctx.setLineDash([7/camScale, 5/camScale]);
        ctx.lineDashOffset = performance.now()/90/camScale;

        ctx.setLineDash([]);

         falling through each other, so there is a floor;
       - too large and the object crosses the size where it stops being
         cached as a bitmap and gets slower to draw, so there is a ceiling;
       - anything bolted to it has anchors that were positions ON it, and
         those have to move too or the joint drifts off the thing it was
         pinned to.

     The drag itself only previews. Rebuilding geometry and physics on every
     mouse move would be wasteful when the only thing that matters is where
     you let go. */
  var RESIZE_MIN_PX = 14;
  var RESIZE_MAX_PX = 4200;

  function scaleObjectAbout(o, cx, cy, k){
    var pieces = o.pieces.map(function(pc){
      var w = objToWorld(o, pc.poly);
      var sc = pgScale(w, k, k, cx, cy);
      return { m: pc.m, poly: pgClean(sc, GEOM_TOL) };
    }).filter(function(pc){ return pc.poly.length; });
    if (!pieces.length) return false;
    o.pieces = pieces;
    rebuildFromPieces(o, { a: 0, x: 0, y: 0 });
    afterObjectEdit(o);
    return true;
  }
  /* What the drag is allowed to do, given what is selected. Worked out from
     the selection's own box so a group scales as the thing you built. */
  function clampResize(k, box){
    var w = box.max.x - box.min.x, h = box.max.y - box.min.y;
    var small = Math.max(1, Math.min(w, h)), big = Math.max(w, h);
    if (small * k < RESIZE_MIN_PX) k = RESIZE_MIN_PX / small;
    if (big * k > RESIZE_MAX_PX) k = RESIZE_MAX_PX / big;
    // and it has to fit inside the map, on each axis
    if (w * k > WORLD_W * 0.96) k = WORLD_W * 0.96 / w;
    if (h * k > WORLD_H * 0.96) k = WORLD_H * 0.96 / h;
    return Math.max(0.02, k);
  }
  function scaleSelected(k, pivot){
    var list = selList();
    if (!list.length) return;
    if (Math.abs(k - 1) < 0.001) return;
    pushUndo(list.length > 1 ? ("resizing " + list.length + " objects") : "resize");
    var held = boltsTouching(list).map(function(b){ return boltWorldPoint(b); });
    list.forEach(function(o){ scaleObjectAbout(o, pivot.x, pivot.y, k); });
    var scaleMap = function(pt){ return { x: pivot.x + (pt.x - pivot.x)*k, y: pivot.y + (pt.y - pivot.y)*k }; };
    carryBolts(list, scaleMap);
    carryGadgets(list, scaleMap, k);
    carryLinks(list, scaleMap);
    renderSelBar();
    sfx("glue");
  }

  /* ---- Moving what is placed: a gadget, a bolt, or one end of a link.

     With the Move tool, pressing on one of these and dragging picks it up;
     letting go over somewhere valid puts it there, anywhere else snaps it
     back. A press without a drag is just a select, as before. Wires are by
     id and never notice. */
  var attachDrag = null;   // { kind, ref, end, x0, y0, moved, orig }
  function beginAttachDrag(kind, ref, pt, end){
    attachDrag = { kind: kind, ref: ref, end: end || null, x0: pt.x, y0: pt.y, moved: false, pt: { x:pt.x, y:pt.y } };
    if (kind === "gadget") attachDrag.orig = { obj: ref.obj, pos: { x: ref.pos.x, y: ref.pos.y }, local: ref.local ? { x: ref.local.x, y: ref.local.y } : null, layer: ref.layer };
    if (kind === "camZone" || kind === "camFrame" || kind === "camEnd"){
      var src = kind === "camZone" ? ref.zone : (kind === "camFrame" ? ref.view : ref.sweep);
      attachDrag.start = { dx: src.dx, dy: src.dy };
    }
    if (kind === "camFrame"){ var sh = cameraShotRect(ref); attachDrag.shot0 = { x: sh.x + sh.w/2, y: sh.y + sh.h/2 }; }
    if (kind === "camZoneCorner" || kind === "camFrameCorner"){
      // the opposite corner stays put, as when resizing an object
      var r = kind === "camZoneCorner" ? cameraZoneRect(ref) : cameraShotRect(ref);
      var sx = end.indexOf("e") >= 0 ? 1 : -1, sy = end.indexOf("s") >= 0 ? 1 : -1;
      attachDrag.fixed = { x: sx > 0 ? r.x : r.x + r.w, y: sy > 0 ? r.y : r.y + r.h };
      attachDrag.sx = sx; attachDrag.sy = sy;
    }
  }
  /* What part of a selected camera the point is on: a corner of its zone
     or frame (`nw` … `se`), the knob of its second spot, or either outline. */
  function cameraHandleAt(g, pt, inside){
    var tol = 9/camScale, band = 7/camScale;
    var zr = cameraZoneRect(g), fr = cameraShotRect(g);
    if (inside){   // the second pass: anywhere in the zone box moves it
      return pt.x >= zr.x && pt.x <= zr.x + zr.w && pt.y >= zr.y && pt.y <= zr.y + zr.h ? { kind: "camZone" } : null;
    }
    var cornerOf = function(r){
      var cs = [["nw", r.x, r.y], ["ne", r.x + r.w, r.y], ["sw", r.x, r.y + r.h], ["se", r.x + r.w, r.y + r.h]];
      for (var i = 0; i < cs.length; i++) if (Math.abs(pt.x - cs[i][1]) <= tol && Math.abs(pt.y - cs[i][2]) <= tol) return cs[i][0];
      return null;
    };
    var onOutline = function(r){
      var inX = pt.x >= r.x - band && pt.x <= r.x + r.w + band, inY = pt.y >= r.y - band && pt.y <= r.y + r.h + band;
      if (!inX || !inY) return false;
      var nearV = Math.abs(pt.x - r.x) <= band || Math.abs(pt.x - (r.x + r.w)) <= band;
      var nearH = Math.abs(pt.y - r.y) <= band || Math.abs(pt.y - (r.y + r.h)) <= band;
      return nearV || nearH;
    };
    var c = cornerOf(fr); if (c) return { kind: "camFrameCorner", corner: c };
    c = cornerOf(zr); if (c) return { kind: "camZoneCorner", corner: c };
    if (g.sweep && dist(cameraSweepEnd(g), pt) < 14/camScale + 4) return { kind: "camEnd" };
    if (onOutline(fr)) return { kind: "camFrame" };
    if (onOutline(zr)) return { kind: "camZone" };
    return null;
  }
  function updateAttachDrag(pt){
    if (!attachDrag) return;
    attachDrag.pt = { x: pt.x, y: pt.y };
    if (!attachDrag.moved && Math.hypot(pt.x - attachDrag.x0, pt.y - attachDrag.y0) > 4/camScale) attachDrag.moved = true;
    if (attachDrag.moved && attachDrag.kind === "gadget"){
      // rides the cursor while it is being carried
      var g = attachDrag.ref;
      g.pos = { x: pt.x, y: pt.y };
      if (g.obj && g.obj.body) g.local = toBodyLocal(g.obj.body, g.pos);
    }
    var ck = attachDrag.kind;
    if (attachDrag.moved && ck === "moverEnd"){
      if (!attachDrag.pushed){ attachDrag.pushed = true; pushUndo("changing a mover"); }
      var mst3 = moverStart(attachDrag.ref);
      attachDrag.ref.line = { dx: pt.x - mst3.x, dy: pt.y - mst3.y };
    }
    if (attachDrag.moved && (ck === "camEnd" || ck === "camZone" || ck === "camFrame" || ck === "camZoneCorner" || ck === "camFrameCorner")){
      var g2 = attachDrag.ref;
      // one undo step for the whole drag, taken before the first change
      if (!attachDrag.pushed){ attachDrag.pushed = true; pushUndo("changing a camera"); }
      var mx = pt.x - attachDrag.x0, my = pt.y - attachDrag.y0, gp = gadgetWorld(g2);
      if (ck === "camEnd" && g2.sweep){ g2.sweep.dx = pt.x - gp.x; g2.sweep.dy = pt.y - gp.y; }
      else if (ck === "camZone"){ g2.zone.dx = attachDrag.start.dx + mx; g2.zone.dy = attachDrag.start.dy + my; }
      else if (ck === "camFrame"){
        // the frame follows the cursor; the view spot goes wherever that takes it
        var nv = cameraViewForShot(g2, { x: attachDrag.shot0.x + mx, y: attachDrag.shot0.y + my });
        if (nv) g2.view = nv;
      }
      else if (ck === "camZoneCorner"){
        var f = attachDrag.fixed, w = Math.max(40, Math.min(6000, Math.abs(pt.x - f.x))), h = Math.max(40, Math.min(6000, Math.abs(pt.y - f.y)));
        g2.zone.w = w; g2.zone.h = h;
        g2.zone.dx = f.x + attachDrag.sx * w/2 - gp.x; g2.zone.dy = f.y + attachDrag.sy * h/2 - gp.y;
      } else if (ck === "camFrameCorner"){
        // the frame keeps the screen's shape: its width sets the zoom, and it grows from the fixed corner
        var f2 = attachDrag.fixed, w2 = Math.max(20, Math.abs(pt.x - f2.x));
        g2.zoom = Math.max(CAM_ZOOM_MIN, Math.min(CAM_ZOOM_MAX, viewRectW / (baseScale * w2)));
        var fr = cameraFrameRect(g2, g2.zoom, { x:0, y:0 });
        var nv2 = cameraViewForShot(g2, { x: f2.x + attachDrag.sx * fr.w/2, y: f2.y + attachDrag.sy * fr.h/2 });
        if (nv2) g2.view = nv2;
      }
    }
  }
  function moveGadgetTo(g, pt){
    var host = objectUnderAny(pt.x, pt.y, 6);
    if (!host && gadgetNeedsHost(g.kind)) return false;
    g.obj = host || null; if (host) g.layer = host.layer;   // a camera dropped on nothing keeps its layer and stays put
    g.pos = { x: pt.x, y: pt.y };
    g.local = host ? toBodyLocal(host.body, g.pos) : null;
    return true;
  }
  /* A bolt keeps its settings and its wires; it gets a new pair of objects
     and a new joint. */
  function moveBoltTo(b, pt){
    var pair = boltPairAt(pt.x, pt.y);
    if (!pair) return false;
    World.remove(world, b.constraint);
    b.objA = pair.front; b.objB = pair.partner; b.layer = pair.layer;
    b.point = { x: pt.x, y: pt.y };
    b.constraint = Constraint.create({
      bodyA: b.objA.body, pointA: { x: pt.x - b.objA.body.position.x, y: pt.y - b.objA.body.position.y },
      bodyB: b.objB.body, pointB: { x: pt.x - b.objB.body.position.x, y: pt.y - b.objB.body.position.y },
      length: 0, stiffness: 0.9, damping: 0.35
    });
    World.add(world, b.constraint);
    b.rest = b.objA.body.angle - b.objB.body.angle;
    b.holdRel = null; b.t = 0;
    applyBoltMode(b);
    return true;
  }
  /* One end of a link goes to a new spot — on its own object, or onto
     another one, as long as it is not the object the other end is on. */
  function moveLinkEndTo(l, end, pt){
    var host = objectUnderAny(pt.x, pt.y, 6);
    var otherObj = end === "A" ? l.objB : l.objA;
    if (!host || host === otherObj) return false;
    var body = host.body, off = { x: pt.x - body.position.x, y: pt.y - body.position.y };
    var cs = l.kind === "piston" ? [l.constraint] : [l.constraint, end === "A" ? l.endA : l.endB];
    cs.forEach(function(c){
      if (!c) return;
      if (end === "A"){ c.bodyA = body; c.pointA = { x: off.x, y: off.y }; c.angleA = body.angle; }
      else { c.bodyB = body; c.pointB = { x: off.x, y: off.y }; c.angleB = body.angle; }
    });
    if (end === "A") l.objA = host; else l.objB = host;
    l.layer = Math.max(l.objA.layer, l.objB.layer);
    if (l.kind === "piston"){
      // the reach is measured from the placed pose; keep it sensible around the new span
      var e = linkEnds(l), d = Math.max(8, dist(e.a, e.b));
      if (d < l.min) l.min = Math.max(10, Math.round(d * 0.5));
      if (d > l.max) l.max = Math.round(d * 1.5);
      l.len = Math.max(l.min, Math.min(l.max, d));
      l.constraint.length = l.len;
      refreshStiffRef(l);
    } else {
      // a rope re-hangs from the new spot
      var e2 = linkEnds(l);
      tearDownRope(l); buildRope(l, e2.a, e2.b);
    }
    return true;
  }
  function endAttachDrag(){
    if (!attachDrag) return;
    var d = attachDrag; attachDrag = null;
    if (d.kind.indexOf("cam") === 0 || d.kind === "moverEnd"){ if (d.moved) renderSelBar(); return; }   // already where the cursor left it
    if (!d.moved) return;
    var pt = d.pt, done = false;
    if (d.kind === "gadget"){
      var g = d.ref, o = d.orig;
      // put it back first, so the undo snapshot is of the world before the
      // move — and so a drop on nothing leaves no trace, not even an undo step
      g.obj = o.obj; g.pos = o.pos; g.local = o.local; g.layer = o.layer;
      if (objectUnderAny(pt.x, pt.y, 6) || !gadgetNeedsHost(g.kind)){
        pushUndo("moving a " + GADGET_LABEL[g.kind].toLowerCase());
        done = moveGadgetTo(g, pt);
      }
    } else if (d.kind === "bolt"){
      if (boltPairAt(pt.x, pt.y)){ pushUndo("moving a bolt"); done = moveBoltTo(d.ref, pt); }
    } else if (d.kind === "link"){
      var host = objectUnderAny(pt.x, pt.y, 6), other = d.end === "A" ? d.ref.objB : d.ref.objA;
      if (host && host !== other){ pushUndo("moving a " + LINK_LABEL[d.ref.kind].toLowerCase() + " end"); done = moveLinkEndTo(d.ref, d.end, pt); }
    }
    if (done){ sfx("glue"); renderSelBar(); }
    else { sfx("deny"); showToast(d.kind === "bolt" ? "A bolt has to go through to the layer behind or in front." : "Drop it on an object."); }
  }
  /* Which end of a link the point is near, if either. */
  function linkEndAt(l, x, y){
    var e = linkEnds(l);
    if (dist(e.a, { x:x, y:y }) < 14) return "A";
    if (dist(e.b, { x:x, y:y }) < 14) return "B";
    return null;
  }

  /* Corner handles. The drag scales about the OPPOSITE corner, so the corner
     you are not holding stays put — which is what makes it feel like pulling
     the shape bigger rather than watching it drift. */
  var resizing = null;
  function resizeCorners(){
    var sb = selectionBounds();
    if (!sb) return null;
    return [
      { id:"nw", x:sb.minX-5, y:sb.minY-5, ox:sb.maxX+5, oy:sb.maxY+5 },
      { id:"ne", x:sb.maxX+5, y:sb.minY-5, ox:sb.minX-5, oy:sb.maxY+5 },
      { id:"sw", x:sb.minX-5, y:sb.maxY+5, ox:sb.maxX+5, oy:sb.minY-5 },
      { id:"se", x:sb.maxX+5, y:sb.maxY+5, ox:sb.minX-5, oy:sb.minY-5 }
    ];
  }
  function resizeHandleAt(pt){
    if (mode !== "build" || currentTool !== "move" || !selected) return null;
    var cs = resizeCorners();
    if (!cs) return null;
    var r = 11 / camScale, best = null, bd = r;
    cs.forEach(function(c){
      var d = Math.hypot(pt.x - c.x, pt.y - c.y);
      if (d <= bd){ bd = d; best = c; }
    });
    return best;
  }
  function beginResize(pt, corner){
    var sb = selectionBounds();
    resizing = {
      corner: corner,
      pivot: { x: corner.ox, y: corner.oy },
      box: { min:{x:sb.minX,y:sb.minY}, max:{x:sb.maxX,y:sb.maxY} },
      d0: Math.max(1, Math.hypot(corner.x - corner.ox, corner.y - corner.oy)),
      k: 1
    };
  }
  function updateResize(pt){
    if (!resizing) return;
    var d = Math.hypot(pt.x - resizing.pivot.x, pt.y - resizing.pivot.y);
    resizing.k = clampResize(d / resizing.d0, resizing.box);
  }
  function commitResize(){
    if (!resizing) return;
    var k = resizing.k, pivot = resizing.pivot;
    resizing = null;
    scaleSelected(k, pivot);
  }
  function drawResizePreview(){
    if (!resizing) return;
    var b = resizing.box, k = resizing.k, p = resizing.pivot;
    var x1 = p.x + (b.min.x - p.x)*k, y1 = p.y + (b.min.y - p.y)*k;
    var x2 = p.x + (b.max.x - p.x)*k, y2 = p.y + (b.max.y - p.y)*k;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = "#FFF6D8"; ctx.lineWidth = 2.4/camScale;
    ctx.setLineDash([8/camScale, 5/camScale]);
    ctx.strokeRect(x1, y1, x2-x1, y2-y1);
    ctx.setLineDash([]);
    ctx.restore();
  }

  function afterObjectEdit(o){
    // The cached render paths are baked in the body's own frame at the
    // layer's depth scale, so anything that changes the parts or the
    // layer has to drop them.
    o.geomRev = (o.geomRev || 0) + 1;
    renderSelBar();
  }
  function rotateSelected(a){
    var list = selList();
    if (!list.length) return;
    pushUndo("rotate");
    // several pieces turn about the group's own middle, so an assembly
    // rotates as the thing you built rather than each part in place
    var sb = list.length > 1 ? selectionBounds() : null;
    var pivot = sb ? { x:(sb.minX+sb.maxX)/2, y:(sb.minY+sb.maxY)/2 } : null;
    list.forEach(function(o){
      if (pivot) Body.rotate(o.body, a, pivot); else Body.rotate(o.body, a);
      Body.setVelocity(o.body, {x:0,y:0});
      Body.setAngularVelocity(o.body, 0);
    });
    sfx("tick");
  }
  // Mirroring is done on the parts' world positions and then rebuilt
  // from scratch, which also drops any accumulated body rotation —
  // mirroring a rotated shape "about its own middle" is otherwise
  // ambiguous, and this is the answer people expect.
  // Mirror in WORLD space and rebuild square, which also drops any
  // accumulated body rotation — mirroring a rotated shape "about its own
  // middle" is otherwise ambiguous, and this is what people mean. The
  // mirrored contours ARE world coordinates, so the rebuild is handed a
  // zero frame and works out the new centre itself.
  function flipObjectAbout(o, cx){
    var pieces = o.pieces.map(function(pc){
      var w = objToWorld(o, pc.poly);
      var m = pgMap(w, function(x, y){ return [2*cx - x, y]; });
      // mirroring reverses every contour's winding; pgClean puts it back
      return { m: pc.m, poly: pgClean(m, GEOM_TOL) };
    }).filter(function(pc){ return pc.poly.length; });
    if (!pieces.length) return;
    o.pieces = pieces;
    rebuildFromPieces(o, { a: 0, x: 0, y: 0 });
    afterObjectEdit(o);
  }
  function flipSelected(){
    var list = selList();
    if (!list.length) return;
    pushUndo("flip");
    var sb = selectionBounds();
    var cx = list.length > 1 ? (sb.minX + sb.maxX)/2 : list[0].body.position.x;
    list.forEach(function(o){ flipObjectAbout(o, cx); });
    var flipMap = function(pt){ return { x: 2*cx - pt.x, y: pt.y }; };
    carryBolts(list, flipMap);
    carryGadgets(list, flipMap, 1);
    carryLinks(list, flipMap);
    renderSelBar();
    sfx("glue");
  }
  function duplicateSelected(){
    var list = selList();

    var copies = [];
    list.forEach(function(src){
      var copy = spawnObjectFromPieces(
        src.pieces.map(function(pc){ return { m: pc.m, poly: pgClone(pc.poly) }; }),
        src.layer,
        { a: src.body.angle, x: src.body.position.x + off, y: src.body.position.y + off },
        src.forcedStatic);
      if (copy){
        // a duplicate is the same light, not a fresh one at whatever the
        // brush happens to be set to
        copy.glow = (src.glow == null ? 1 : src.glow);
        copy.lightSolid = !!src.lightSolid;
        copy.lightFalls = !!src.lightFalls;
        if (src.grabbable != null) copy.grabbable = src.grabbable;   // and the same grip and weight
        if (src.weight != null) copy.weight = src.weight;
        if (src.alpha != null) copy.alpha = src.alpha;
        rebuildFromPieces(copy);
        if (objects.indexOf(copy) >= 0) refreshObjectPhysics(copy);
        Body.setVelocity(copy.body, {x:0,y:0});
        copies.push(copy);
      }
    });
    if (!copies.length) return;
    selectMany(copies, false);

  }
  function anchorSelected(){
    var list = selList();
    if (!list.length) return;
    var on = !selected.forcedStatic;          // the whole group follows the one you clicked
    pushUndo(on ? "anchor" : "unanchor");
    list.forEach(function(o){
      o.forcedStatic = on;
      refreshObjectPhysics(o);
      Body.setVelocity(o.body, {x:0,y:0});
      Body.setAngularVelocity(o.body, 0);
    });
    renderSelBar();
    sfx(on ? "bolt" : "click");
    showToast(on ? "🔒 Anchored — it won't move" : "🔓 Released — gravity has it again");
  }
  function layerSelected(dir){
    var list = selList();
    if (!list.length) return;
    var l = selected.layer + dir;
    if (l < 0 || l > 2){ sfx("deny"); showToast("That's already the " + (l < 0 ? "back" : "front") + " layer."); return; }
    pushUndo("layer change");
    beginBulk();
    list.forEach(function(o){
      var ol = Math.max(0, Math.min(2, o.layer + dir));
      if (ol === o.layer) return;
      o.layer = ol;
      // A layer change swaps how the shape collides AND how it is drawn
      // (decoration gets one cheap box instead of a full decomposition),
      // so the body has to be rebuilt, not just re-flagged.
      rebuildFromPieces(o);
    });
    endBulk();
    list.forEach(function(o){ if (objects.indexOf(o) >= 0){ refreshObjectPhysics(o); afterObjectEdit(o); } });
    sfx("click");
    showToast("Moved to the " + LAYER_NAMES[l] + " layer" + (l === MID_LAYER ? " — interactive" : " — decoration only"));
  }
  function deleteSelectedRegion(){
    var reg = selectedRegion;
    if (!regionValid(reg)) return;
    pushUndo("deleting a " + matOf(reg.materialId).label + " piece");
    var before = objects.length;
    var rp = regionPoly(reg);
    var lc = rp ? pgCentroid(rp) : { x:0, y:0 };
    var wc = localPtToWorld(reg.obj, lc.x, lc.y);
    var rb = rp ? pgBounds(rp) : null;
    puff(wc.x, wc.y, 14, { color: matOf(reg.materialId).color, speed:2.6, g:0.1, r:3,
                       jitter: rb ? Math.min(120, Math.max(20, Math.max(rb.w, rb.h)*0.4)) : 30 });
    deleteRegion(reg);
    clearSelection();
    sfx("delete");
    var split = objects.length - before + 1;
    showToast(split > 1 ? ("✂ Removed — it came apart into " + split + " pieces.")
                        : "✂ Piece removed.");
  }
  /* Detach: the piece you clicked stops being part of its object and
