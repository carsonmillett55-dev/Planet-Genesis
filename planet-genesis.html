  function placeBoltAt(pt){
    var candidates = [];
    objects.forEach(function(o){
      var bestD = Infinity;
      o.parts.forEach(function(p){ var d = dist(p.position, pt); if (d < bestD) bestD = d; });
      if (bestD < 90) candidates.push({ o:o, d:bestD });
    });
    candidates.sort(function(a,b){ return a.d - b.d; });
    if (candidates.length < 2){ showToast("Bolts need two nearby objects to connect."); sfx("deny"); return; }
    pushUndo("placing a bolt");
    addBolt(candidates[0].o, candidates[1].o, pt, "tight");
    showToast("🔩 Bolt placed — right-click it for Loose or Motor.");
    sfx("bolt");
    puff(pt.x, pt.y, 8, { color:"#98A3B3", speed:1.6, g:0.06 });
  }

  /* ============================================================
     Painting — a stroke is a swept polygon, not a row of stamps.

     Dragging a convex brush covers the Minkowski sum of the brush with
     the drag, and for a convex brush that is exactly the convex hull of
     the brush stamped at both ends. So a straight drag produces a
     mathematically straight edge, a curve produces a true offset curve,
     and the outline of the whole stroke is one contour rather than a
     chain of arcs. That is the difference between a cut that comes out
     clean and one that comes out scalloped.

     While you drag, the stroke's own polygon is grown segment by
     segment and drawn on top of the level — so the preview IS the
     geometry, and nothing changes shape when you let go. On release it
     is unioned into whatever it touched, cutting the other materials
     there, which is LBP's rule.
     ============================================================ */
  var painting = false, lastPaint = null;
  var stroke = null;                 // the drag in progress
  var FUSE_REACH = 4;                // how close counts as "touching"

  function strokeQuality(){ return camScale >= 1.6 ? 0.18 : 0.3; }
  /* `cut` is LittleBigPlanet's Triangle: the material brush, used the
     other way round. It takes exactly the footprint you can already see
     on the cursor — same shape, same size — and only on the layer you
     are building on, so a cut can't quietly eat the decoration behind
     what you are working on. The Erase tool stays a slightly oversized
     round brush that works through every layer at once. */
  function beginStroke(pt, materialId, isErase, cut){
    stroke = {
      mat: materialId, erase: !!isErase, cut: !!cut, layer: buildLayer,
      waterOnly: !!(cut && matOf(currentTool) && matOf(currentTool).isFluid),
      r: (isErase && !cut) ? paintRadius() + 8 : paintRadius(),
      shape: (isErase && !cut) ? "circle" : paintShape,
      pts: [[pt.x, pt.y]], seg: 0, poly: null, done: null
    };
    strokeGrow();
  }
  function strokeAdd(pt){
    if (!stroke) return false;
    var last = stroke.pts[stroke.pts.length-1];
    var dx = pt.x - last[0], dy = pt.y - last[1];
    if (dx*dx + dy*dy < 1.6) return false;       // pointer noise
    stroke.pts.push([pt.x, pt.y]);
    strokeGrow();
    return true;
  }
  /* Only the segments drawn since last time are turned into geometry, so
     the live preview costs what you just moved rather than everything
     you have drawn so far. */
  function strokeGrow(){
    var pts = stroke.pts, n = pts.length, q = strokeQuality(), i;
    if (n === 1){
      stroke.poly = pgClean([[brushRing(stroke.shape, pts[0][0], pts[0][1], stroke.r, 0, q)]], GEOM_TOL);
      stroke.seg = 0;
      return;
    }
    var add = [];
    for (i = Math.max(1, stroke.seg + 1); i < n; i++){
      var ring = sweepRing(stroke.shape, pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1], stroke.r, 0, q);
      if (ring.length >= 3) add.push([[ring]]);
    }
    stroke.seg = n - 1;
    if (!add.length) return;
    if (stroke.poly) add.unshift(stroke.poly);
    stroke.poly = pgUnionMany(add, GEOM_TOL);
    // A stroke that has wandered far enough to get genuinely complicated
    // is simplified harder rather than allowed to crawl.
    if (pgVertexCount(stroke.poly) > 2600) stroke.poly = pgClean(stroke.poly, 1.2);
  }
  // What the stroke would look like if it were committed right now.
  function drawStrokePreview(){
    if (!stroke || !stroke.poly || !stroke.poly.length) return;
    var path = mpPath(stroke.poly);
    ctx.save();
    if (stroke.erase){
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = "rgba(20,14,10,.75)"; ctx.fill(path);
      ctx.globalAlpha = 0.9; ctx.lineWidth = 1.6/camScale;
      ctx.strokeStyle = "#F6ECD9"; ctx.setLineDash([6/camScale, 5/camScale]);
      ctx.stroke(path); ctx.setLineDash([]);
    } else {
      var mat = matOf(stroke.mat);
      var depth = layerDepth(stroke.layer);
      ctx.globalAlpha = depth.a;
      ctx.fillStyle = mat.color; ctx.fill(path);
      ctx.save();
      ctx.clip(path);
      ctx.globalAlpha = depth.a*0.5; ctx.strokeStyle = mat.dark;
      ctx.lineWidth = BEVEL_W*2; ctx.lineJoin = "round"; ctx.stroke(path);
      ctx.restore();
      ctx.globalAlpha = depth.a; ctx.strokeStyle = INK; ctx.lineWidth = INK_W;
      ctx.stroke(path);
    }
    ctx.restore();
  }

  // How many separate islands the object's silhouette is in. Removing
  // material is the only thing that can raise this, and a rise is
  // exactly what "that cut it in two" means.
  function countIslands(obj){
    if (!obj.pieces.length) return 0;
    if (obj.pieces.length === 1) return obj.pieces[0].poly.length;
    var all = pgUnionMany(obj.pieces.map(function(p){ return p.poly; }), GEOM_TOL);
    return all.length;
  }
  /* Split an object whose silhouette has come apart. The biggest island
     keeps the original identity — its id, its bolts, whether it was
     anchored — and the rest are spawned beside it in the same frame.

     Only ever called after material has been REMOVED, and only when the
     island count actually went up. Painting can only ever join things
     together, and an object that arrived already in several pieces (an
     old level often has dozens welded into one) is left exactly as the
     player built it. */
  function splitObject(obj){
    if (objects.indexOf(obj) < 0 || !obj.pieces.length) return [obj];
    var all = pgUnionMany(obj.pieces.map(function(p){ return p.poly; }), GEOM_TOL);
    if (all.length <= 1) return [obj];
    if (all.length > 64) return [obj];        // not worth a hundred bodies
    var islands = all.map(function(poly){ return { mp:[poly], area: Math.abs(pgArea([poly])) }; });
    islands.sort(function(a,b){ return b.area - a.area; });
    var frame = { a: obj.body.angle, x: obj.body.position.x, y: obj.body.position.y };
    var made = [obj], keep = null, k, i;
    for (k = 0; k < islands.length; k++){
      var sub = [];
      for (i = 0; i < obj.pieces.length; i++){
        var inter = pgIntersect(obj.pieces[i].poly, islands[k].mp, GEOM_TOL);
        if (inter.length) sub.push({ m: obj.pieces[i].m, poly: inter });
      }
      if (!sub.length) continue;
      if (k === 0 || objects.length >= PLACED_CAP){
        keep = keep ? keep.concat(sub) : sub;
        continue;
      }
      var piece = { id:"o"+(objCounter++), body:null, parts:[], pieces:sub,
                    layer: obj.layer, darkMatter:false, decorative: obj.decorative,
                    forcedStatic: obj.forcedStatic, drawing:false, geomRev:0,
                    glow: (obj.glow == null ? 1 : obj.glow),
                    lightSolid: !!obj.lightSolid, lightFalls: !!obj.lightFalls };
      objects.push(piece);
      var hold = bulkList; bulkList = null;         // it needs a body right now
      var ok = rebuildFromPieces(piece, frame);
      bulkList = hold;
      if (ok) made.push(piece);
    }
    if (!keep){ return made; }
    obj.pieces = keep;
    var hold2 = bulkList; bulkList = null;
    rebuildFromPieces(obj);
    bulkList = hold2;
    // A bolt follows whichever piece its anchor actually sits on.
    bolts.slice().forEach(function(bo){
      ["objA","objB"].forEach(function(side){
        if (bo[side] !== obj) return;
        var best = null, bestD = Infinity;
        made.forEach(function(m){
          if (objects.indexOf(m) < 0) return;
          var lp = worldPtToLocal(m, bo.point.x, bo.point.y);
          for (var j = 0; j < m.pieces.length; j++){
            var d = pgContains(m.pieces[j].poly, lp.x, lp.y) ? 0
                  : pgEdgeDist(m.pieces[j].poly, lp.x, lp.y, 400);
            if (d < bestD){ bestD = d; best = m; }
          }
        });
        if (best && best !== obj) bo[side] = best;
      });
      if (bo.objA === bo.objB || objects.indexOf(bo.objA) < 0 || objects.indexOf(bo.objB) < 0) removeBolt(bo);
      else {
        bo.constraint.bodyA = bo.objA.body;
        bo.constraint.bodyB = bo.objB.body;
      }
    });
    return made;
  }
  function maybeSplit(obj, islandsBefore){
    if (objects.indexOf(obj) < 0) return 0;
    var after = countIslands(obj);
    if (after <= islandsBefore) return 0;
    return splitObject(obj).length - 1;
  }

  function commitStroke(){
    var st = stroke; stroke = null;
    if (!st || !st.poly || !st.poly.length) return;
    if (st.erase) return;                     // erasing commits as it goes
    beginBulk();
    var hits = objectsTouching(st.poly, st.layer, FUSE_REACH);
    var target = hits.length ? hits[0] : null, i;
    for (i = 1; i < hits.length; i++){
      if (objects.indexOf(hits[i]) < 0) continue;
      target = mergeObjects(target, hits[i]);
    }
    if (target){
      if (objCorners(target) > MAX_OBJ_CORNERS){
        endBulk();
        showToast("That shape is getting too complicated — try building it in separate pieces.");
        sfx("deny");
        return;
      }
      addPolyToObject(target, st.mat, st.poly, GEOM_TOL);
      target.drawing = false;
      if (stickPaint) target.forcedStatic = true;
      rebuildFromPieces(target);
    } else {
      target = newObjectFromPoly(st.mat, st.poly, st.layer);
      if (target && stickPaint){ target.forcedStatic = true; }
    }
    endBulk();
    if (!target || objects.indexOf(target) < 0) return;
    target.drawing = false;
    refreshObjectPhysics(target);
    Body.setVelocity(target.body, {x:0,y:0});
    Body.setAngularVelocity(target.body, 0);
  }

  function paintAt(rawPt){
    var pt = snapPt(rawPt);
    if (currentTool === "spawn"){ checkpoints[0].x = pt.x; checkpoints[0].y = pt.y; return; }
    if (currentTool === "checkpoint"){
      if (!lastPaint || dist(pt,lastPaint) > 60){
        checkpoints.push({ x:pt.x, y:pt.y, reached:false }); lastPaint = pt;
        sfx("place"); puff(pt.x, pt.y, 8, { color:"#2F86A6", speed:1.6, g:0.1 });
      }
      return;
    }
    if (currentTool === "bubble"){
      if (!lastPaint || dist(pt,lastPaint) > 40){
        bubbles.push({ x:pt.x, y:pt.y, collected:false }); lastPaint = pt;
        sfx("tick"); puff(pt.x, pt.y, 6, { color:"#F2B705", speed:1.4, g:0.02 });
      }
      return;
    }
    if (currentTool === "goal"){ goalPoint = pt; sfx("place"); return; }
    if (currentTool === "bolt"){ if (!lastPaint){ placeBoltAt(pt); lastPaint = pt; } return; }
    if (currentTool.indexOf("stamp:") === 0){
      stampObject(currentTool.slice(6), pt);
      currentTool = "move"; canvas.dataset.tool = "move";
      return;
    }
    // Any cut already under way — the Erase tool, or a right-drag with a
    // material picked — keeps going through the same path.
    if (stroke && stroke.erase){
      if (!strokeAdd(pt)) return;
      eraseStep();
      lastPaint = pt;
      return;
    }
    if (currentTool === "erase"){
      beginStroke(pt, null, true, false);
      eraseStep();
      lastPaint = pt;
      return;
    }
    // Water is poured, not built. It never becomes a body, and it only
    // exists on the Mid layer — the Back and Front layers are painted
    // decoration with no physics for water to sit in.
    if (currentTool === "water"){
      if (buildLayer !== MID_LAYER){
        showToast("Water only works on the Mid layer — switch to Mid to pour it.");
        return;
      }
      addWaterAt(pt.x, pt.y, paintRadius(), 1);
      lastPaint = pt;
      sfx("pour");
      puff(pt.x, pt.y, 2, { color:"#8FD3F0", speed:0.8, g:0.14, r:2.4, jitter:paintRadius() });
      return;
    }
    if (!matOf(currentTool)) return;

    if (!stroke){
      beginStroke(pt, currentTool, false);
      sfx("paint");
    } else if (!strokeAdd(pt)) return;
    lastPaint = pt;
    if (Math.random() < 0.35){
      puff(pt.x, pt.y, 1, { color: matOf(currentTool).dark, speed:0.7, g:0.03, r:2,
                            jitter: stroke.r*1.2, life:20 });
    }
  }

  /* ---- Drag-out shapes -----------------------------------------------
     The other half of building: drag out a rectangle, ellipse or
     triangle and let go and it arrives as one solid piece — and now
     literally so. A dragged rectangle is a four-corner rectangle, not
     six hundred circles packed on a lattice hoping to look like one.
     Shift constrains to a square / circle / equilateral triangle.
     -------------------------------------------------------------- */
  var shapeDrag = null;      // { a, b, square }
  function shapeRect(d){
    var ax = d.a.x, ay = d.a.y, bx = d.b.x, by = d.b.y;
    if (d.square){
      var s = Math.max(Math.abs(bx-ax), Math.abs(by-ay));
      bx = ax + (bx < ax ? -s : s);
      by = ay + (by < ay ? -s : s);
    }
    return { x: Math.min(ax,bx), y: Math.min(ay,by), w: Math.abs(bx-ax), h: Math.abs(by-ay) };
  }
  function insideShape(mode, x, y, R){
    var u = R.w ? (x - R.x)/R.w : 0.5, v = R.h ? (y - R.y)/R.h : 0.5;
    if (mode === "ellipse"){
      var dx = u - 0.5, dy = v - 0.5;
      return dx*dx + dy*dy <= 0.25;
    }
    if (mode === "tri"){
      if (v < 0 || v > 1) return false;
      var halfW = v*0.5;
      return Math.abs(u - 0.5) <= halfW + 1e-6;
    }
    return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  }
  // The exact contour of a dragged shape.
  function dragShapeRing(mode, R){
    var pts = [], i, n;
    if (mode === "ellipse"){
      var rx = Math.max(0.5, R.w/2), ry = Math.max(0.5, R.h/2);
      n = Math.max(16, Math.min(160, Math.ceil(Math.PI * (rx + ry) / 2.2)));
      for (i = 0; i < n; i++){
        var a = i/n*Math.PI*2;
        pts.push([R.x + R.w/2 + Math.cos(a)*rx, R.y + R.h/2 + Math.sin(a)*ry]);
      }
    } else if (mode === "tri"){
      pts = [[R.x + R.w/2, R.y], [R.x + R.w, R.y + R.h], [R.x, R.y + R.h]];
    } else {
      pts = [[R.x, R.y], [R.x + R.w, R.y], [R.x + R.w, R.y + R.h], [R.x, R.y + R.h]];
    }
    return ringArea2(pts) > 0 ? pts : pts.reverse();
  }
  function tracePreviewShape(c2d, mode, R){
    if (mode === "ellipse"){
      c2d.ellipse(R.x + R.w/2, R.y + R.h/2, Math.max(0.5,R.w/2), Math.max(0.5,R.h/2), 0, 0, Math.PI*2);
    } else if (mode === "tri"){
      c2d.moveTo(R.x + R.w/2, R.y);
      c2d.lineTo(R.x + R.w, R.y + R.h);
      c2d.lineTo(R.x, R.y + R.h);
      c2d.closePath();
    } else {
      c2d.rect(R.x, R.y, R.w, R.h);
    }
  }
  function drawShapePreview(){
    if (!shapeDrag) return;
    var R = shapeRect(shapeDrag);
    var mat = matOf(currentTool);
    if (!mat) return;
    ctx.save();
    ctx.beginPath();
    tracePreviewShape(ctx, paintMode, R);
    ctx.globalAlpha = shapeDrag.erase ? 0.5 : 0.34;
    ctx.fillStyle = shapeDrag.erase ? "rgba(20,14,10,.8)" : mat.color;
    ctx.fill();
    ctx.globalAlpha = 0.95; ctx.lineWidth = 2.5/camScale;
    ctx.setLineDash([8/camScale, 6/camScale]);
    ctx.strokeStyle = shapeDrag.erase ? "#F6ECD9" : "rgba(43,27,18,.9)"; ctx.stroke();
    ctx.setLineDash([]);
    // live size readout, so you can build to a measurement
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(43,27,18,.85)";
    var fs = 13/camScale;
    ctx.font = fs + "px 'Baloo 2', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(Math.round(R.w) + " × " + Math.round(R.h), R.x + R.w/2, R.y - 8/camScale);
    ctx.restore();
  }
  function commitShapeDrag(){
    var d = shapeDrag; shapeDrag = null;
    if (!d){ endBulk(); return; }
    var mat = matOf(currentTool);
    if (!mat) return;
    var R = shapeRect(d);
    var r = paintRadius();
    if (R.w < r*0.6 && R.h < r*0.6){ sfx("deny"); return; }   // a click, not a drag

    // Right-dragged: punch this shape OUT of whatever is on this layer.
    if (d.erase){
      var hole = pgClean([[dragShapeRing(paintMode, R)]], GEOM_TOL);
      if (!hole.length){ sfx("deny"); return; }
      var touched = [], gone = false;
      beginBulk();
      removeWaterAt(R.x + R.w/2, R.y + R.h/2, Math.max(R.w, R.h)/2);
      if (!mat.isFluid){
        objectsTouching(hole, buildLayer, 0).forEach(function(o){
          touched.push({ obj:o, islands: countIslands(o) });
          if (!subPolyFromObject(o, hole, GEOM_TOL)) return;
          gone = true;
          if (!o.pieces.length) removeObject(o);
          else rebuildFromPieces(o);
        });
      }
      endBulk();
      var extraCut = 0;
      touched.forEach(function(t){ if (objects.indexOf(t.obj) >= 0) extraCut += maybeSplit(t.obj, t.islands); });
      sfx(gone ? "erase" : "deny");
      puff(R.x + R.w/2, R.y + R.h/2, 12, { color:"#8B8374", speed:2.2, g:0.1,
        jitter: Math.max(R.w, R.h)*0.35, r:2.8 });
      if (extraCut > 0) showToast("✂ That cut it into " + (extraCut+1) + " pieces.");
      return;
    }

    if (mat.isFluid){
      // water isn't a body — fill the region with fluid instead
      var wstep = WATER_CELL*0.8;
      for (var wy = R.y; wy <= R.y + R.h; wy += wstep){
        for (var wx = R.x; wx <= R.x + R.w; wx += wstep){
          if (insideShape(paintMode, wx, wy, R)) addWaterAt(wx, wy, WATER_CELL*0.6, 1);
        }
      }
      sfx("splash");
      puff(R.x + R.w/2, R.y + R.h/2, 14, { color:"#8FD3F0", speed:2, g:0.12, jitter:Math.max(R.w,R.h)*0.35 });
      return;
    }

    var poly = pgClean([[dragShapeRing(paintMode, R)]], GEOM_TOL);
    if (!poly.length){ sfx("deny"); return; }
    beginBulk();
    var hits = objectsTouching(poly, buildLayer, FUSE_REACH);
    var obj = hits.length ? hits[0] : null, i;
    for (i = 1; i < hits.length; i++){
      if (objects.indexOf(hits[i]) < 0) continue;
      obj = mergeObjects(obj, hits[i]);
    }
    if (obj) addPolyToObject(obj, currentTool, poly, GEOM_TOL);
    else obj = newObjectFromPoly(currentTool, poly, buildLayer);
    if (!obj){ endBulk(); return; }
    obj.drawing = false;
    if (stickPaint) obj.forcedStatic = true;
    rebuildFromPieces(obj);
    endBulk();
    if (objects.indexOf(obj) < 0) return;
    refreshObjectPhysics(obj);
    Body.setVelocity(obj.body, {x:0,y:0});
    Body.setAngularVelocity(obj.body, 0);
    sfx("shape");
    puff(R.x + R.w/2, R.y + R.h/2, 16, { color: mat.color, speed:2.6, g:0.05,
      jitter: Math.max(R.w, R.h)*0.4, r:3.4 });
    // Hand it over selected: nine times out of ten the next thing you
    // want is to anchor it, nudge it or copy it, and now all of that is
    // sitting right above the piece you just made.
    selected = obj;
    renderSelBar();
  }
  // Nothing you are part-way through drawing should sag, roll or fall:
  // the shape stays frozen until the mouse comes up, then goes live.
  function endPaintStroke(){
    if (stroke && stroke.erase){
      stroke = null;
      endBulk();
      finishErase();
    } else if (stroke){
      commitStroke();
    } else {
      endBulk();
    }
    painting = false; lastPaint = null;
  }

  /* ============================================================
     Regions — one material area inside a welded object.

     LBP keeps every painted material as its own Thing even when it is
     glued into a bigger assembly, so you can right-click just the dark
     matter bar running through a plank and delete only that. Here a
     REGION is one connected island of one material, and because the
     materials never overlap it is unambiguous which one you clicked.
     ============================================================ */
  function regionAt(x, y, slack){
    var hit = objectAt(x, y, slack);
    if (!hit) return null;
    var o = hit.obj, lp = worldPtToLocal(o, x, y), i, j;
    for (i = 0; i < o.pieces.length; i++){
      var isl = pgPieceAt(o.pieces[i].poly, lp.x, lp.y);
      if (isl >= 0) return { obj:o, materialId:o.pieces[i].m, pieceIdx:i, island:isl };
    }
    var best = null, bd = (slack == null ? GRAB_SLACK : slack) + 2;
    for (i = 0; i < o.pieces.length; i++){
      for (j = 0; j < o.pieces[i].poly.length; j++){
        var d = pgEdgeDist([o.pieces[i].poly[j]], lp.x, lp.y, bd);
        if (d < bd){ bd = d; best = { obj:o, materialId:o.pieces[i].m, pieceIdx:i, island:j }; }
      }
    }
    return best;
  }
  function regionValid(reg){
    return !!(reg && reg.obj && objects.indexOf(reg.obj) >= 0 &&
              reg.obj.pieces[reg.pieceIdx] &&
              reg.obj.pieces[reg.pieceIdx].m === reg.materialId &&
              reg.obj.pieces[reg.pieceIdx].poly[reg.island]);
  }
  // Is this region the entire object? Then it isn't a "piece" worth
  // offering separately — it's just the object again.
  function regionIsWhole(reg){
    if (!regionValid(reg)) return true;
    var o = reg.obj;
    return o.pieces.length === 1 && o.pieces[0].poly.length === 1;
  }
  function regionPoly(reg){
    return regionValid(reg) ? [ reg.obj.pieces[reg.pieceIdx].poly[reg.island] ] : null;
  }
  // Remove a whole region and let whatever it was holding together fall apart.
  function deleteRegion(reg){
    if (!regionValid(reg)) return false;
    var o = reg.obj, pc = o.pieces[reg.pieceIdx];
    var before = countIslands(o);
    pc.poly = pc.poly.filter(function(_, i){ return i !== reg.island; });
    o.pieces = o.pieces.filter(function(p){ return p.poly && p.poly.length; });
    if (!o.pieces.length){ removeObject(o); return true; }
    rebuildFromPieces(o);
    maybeSplit(o, before);
    return true;
  }

  /* ---- Erasing --------------------------------------------------------
     Subtracting the brush's swept area, exactly like painting but the
     other way round, so the cut follows the cursor precisely instead of
     coming away in brush-sized chunks. It commits as you drag rather
     than on release, because an eraser you can't see working is no use.
     -------------------------------------------------------------------- */
  var eraseTouched = [];             // [{obj, islands}]
  function eraseNote(o){
    for (var i = 0; i < eraseTouched.length; i++) if (eraseTouched[i].obj === o) return;
    eraseTouched.push({ obj:o, islands: countIslands(o) });
  }
  function eraseStep(){
    if (!stroke) return;
    var pts = stroke.pts, n = pts.length, q = strokeQuality();
    // Just the sweep since the last step, in the stroke's OWN brush shape —
    // a right-click cut takes exactly the footprint the cursor was showing,
    // square or diamond included, while the Erase tool stays round.
    var seg;
    if (n === 1) seg = pgClean([[brushRing(stroke.shape, pts[0][0], pts[0][1], stroke.r, 0, q)]], GEOM_TOL);
    else {
      var ring = sweepRing(stroke.shape, pts[n-2][0], pts[n-2][1], pts[n-1][0], pts[n-1][1], stroke.r, 0, q);
      seg = pgClean([[ring]], GEOM_TOL);
    }
    if (!seg.length) return;
    var pt = { x: pts[n-1][0], y: pts[n-1][1] };
    beginBulk();
    removeWaterAt(pt.x, pt.y, stroke.r);       // the eraser mops up water too
    var bit = false;
    (stroke.waterOnly ? [] : objectsTouching(seg, stroke.cut ? stroke.layer : null, 0)).forEach(function(o){
      eraseNote(o);
      if (!subPolyFromObject(o, seg, GEOM_TOL)) return;
      bit = true;
      if (Math.random() < 0.7){
        var m = o.pieces.length ? o.pieces[0].m : "dissolve";
        puff(pt.x, pt.y, 2, { color: matOf(m).dark, speed:1.3, g:0.08, r:2.4,
                              jitter: stroke.r*0.7, life:22 });
      }
      if (!o.pieces.length) removeObject(o);
      else rebuildFromPieces(o);
    });
    if (bit) sfx("erase");
    if (!painting){ endBulk(); finishErase(); }
    bubbles = bubbles.filter(function(b){ return dist(b, pt) >= Math.max(24, stroke.r); });
    for (var i = checkpoints.length - 1; i >= 1; i--){
      if (dist(checkpoints[i], pt) < Math.max(34, stroke.r)) checkpoints.splice(i, 1);
    }
    bolts.slice().forEach(function(b){ if (dist(b.point, pt) < Math.max(20, stroke.r)) removeBolt(b); });
  }
  function finishErase(){
    if (!eraseTouched.length) return;
    var extra = 0;
    eraseTouched.forEach(function(e){ extra += maybeSplit(e.obj, e.islands); });
    eraseTouched = [];
    if (extra > 0) showToast("✂ That cut it into " + (extra+1) + " pieces.");
  }
  // Kept for the few callers that erase at a single point rather than
  // along a drag (the keyboard shortcut, mainly).
  function eraseAt(pt){
    var wasPainting = painting;
    painting = false;
    beginStroke(pt, null, true);
    eraseStep();
    stroke = null;
    painting = wasPainting;
  }

  /* ============================================================
     6d. Selection — pick a thing you've built and do something to it.

     Painting is only half of building; the other half is picking up
     what you made and turning it, mirroring it, copying it, locking it
     down or dropping it onto another layer. Clicking an object with the
     Move tool selects it, rings it, and floats a little bar of those
     actions beside it.
     ============================================================ */
  var selected = null;
  /* The PIECE under the cursor, as opposed to the whole object: the run
     of one material you could pull out on its own. LittleBigPlanet lets
     you address these separately even while they are welded into one
     movable thing, and that is what makes cutting a plank in half with
     a line of Dark Matter work. */
  var selectedRegion = null;
  /* Everything currently picked. `selected` stays the one the toolbar
     reads for its own state (anchored or not, which layer); `selection`
     is what every action actually runs over, so a marquee drag and a
     plain click go through exactly the same code. */
  var selection = [];
  var selBarEl = document.getElementById("selBar");
  function clearSelection(){
    selectedRegion = null;
    selection = [];
    if (!selected) return;
    selected = null;
    selBarEl.hidden = true;
  }
  // Everything selected that still exists.
  function selList(){
    if (selection.length) return selection.filter(function(o){ return objects.indexOf(o) >= 0; });
    return (selected && objects.indexOf(selected) >= 0) ? [selected] : [];
  }
  function selectMany(list, additive){
    var out = additive ? selList() : [];
    list.forEach(function(o){ if (objects.indexOf(o) >= 0 && out.indexOf(o) < 0) out.push(o); });
    selection = out;
    selected = out[out.length - 1] || null;
    selectedRegion = null;
    if (!selected){ selBarEl.hidden = true; return; }
    renderSelBar();
  }
  function toggleInSelection(o){
    var list = selList(), i = list.indexOf(o);
    if (i >= 0) list.splice(i, 1); else list.push(o);
    selection = list;
    selected = list[list.length - 1] || null;
    selectedRegion = null;
    if (!selected){ selBarEl.hidden = true; return; }
    renderSelBar();
  }
  function selectionBounds(){
    var list = selList(), b = null;
    list.forEach(function(o){
      var ob = o.body.bounds;
      if (!b) b = { minX:ob.min.x, minY:ob.min.y, maxX:ob.max.x, maxY:ob.max.y };
      else {
        if (ob.min.x < b.minX) b.minX = ob.min.x;
        if (ob.min.y < b.minY) b.minY = ob.min.y;
        if (ob.max.x > b.maxX) b.maxX = ob.max.x;
        if (ob.max.y > b.maxY) b.maxY = ob.max.y;
      }
    });
    return b;
  }
  // Outline of the selected piece, cached in the body's own frame so it
  // follows the object around for free.
  function regionOutline(reg){
    if (!regionValid(reg)) return null;
    if (reg._path && reg._pathRev === (reg.obj.geomRev||0)) return reg._path;
    var pth = mpPath(regionPoly(reg));
    reg._path = pth; reg._pathRev = reg.obj.geomRev||0;
    return pth;
  }
  function selectObject(o){
    if (selected === o && selection.length <= 1){ selection = [o]; renderSelBar(); return; }
    selected = o;
    selection = [o];
    renderSelBar();
    sfx("tick");
  }
  function selBtn(label, title, fn, on){
    var b = document.createElement("button");
    b.textContent = label; b.title = title;
    if (on) b.className = "on";
    b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });
    return b;
  }
  function renderSelBar(){
    if (!selected || mode !== "build"){ selBarEl.hidden = true; return; }
    var o = selected, many = selList().length;
    selBarEl.innerHTML = "";
    if (many > 1){
      var cnt = document.createElement("span");
      cnt.className = "ro";
      cnt.textContent = many + " selected";
      cnt.title = "Everything here moves, turns, copies and deletes together";
      selBarEl.appendChild(cnt);
      var sep0 = document.createElement("div"); sep0.className = "sep"; selBarEl.appendChild(sep0);
    }
    selBarEl.appendChild(selBtn("↺", "Rotate left (15°)", function(){ rotateSelected(-Math.PI/12); }));
    selBarEl.appendChild(selBtn("↻", "Rotate right (15°)", function(){ rotateSelected(Math.PI/12); }));
    selBarEl.appendChild(selBtn("⇄", "Flip horizontally", function(){ flipSelected(); }));
    var sep1 = document.createElement("div"); sep1.className = "sep"; selBarEl.appendChild(sep1);
    selBarEl.appendChild(selBtn("⧉", "Duplicate (Ctrl+D)", function(){ duplicateSelected(); }));
    selBarEl.appendChild(selBtn(o.forcedStatic ? "🔒" : "🔓",
      o.forcedStatic ? "Anchored in place — click to let it fall" : "Free to move — click to anchor it",
      function(){ anchorSelected(); }, o.forcedStatic));
    var sep2 = document.createElement("div"); sep2.className = "sep"; selBarEl.appendChild(sep2);
    selBarEl.appendChild(selBtn("⤒", "Move a layer forward", function(){ layerSelected(1); }));
    selBarEl.appendChild(selBtn("⤓", "Move a layer back", function(){ layerSelected(-1); }));
    var lay = document.createElement("span");
    lay.className = "ro";
    lay.textContent = LAYER_NAMES[o.layer];
    lay.title = o.layer === MID_LAYER ? "On the interactive layer" : "On a decoration layer";
    selBarEl.appendChild(lay);
    var sep3 = document.createElement("div"); sep3.className = "sep"; selBarEl.appendChild(sep3);
    // Only worth offering when the piece is genuinely a part of
     // something bigger — otherwise it is just the object again.
    if (many === 1 && selectedRegion && selectedRegion.obj === o && regionValid(selectedRegion) && !regionIsWhole(selectedRegion)){
      selBarEl.appendChild(selBtn("✂", "Delete just this " + matOf(selectedRegion.materialId).label +
        " piece (Del) — whatever it was holding together may come apart",
        function(){ deleteSelectedRegion(); }));
    }
    selBarEl.appendChild(selBtn("💾", "Save to My Objects", function(){ saveObjectToMyObjects(o); }));
    selBarEl.appendChild(selBtn("🗑", "Delete the whole object — or double-click it first, then Del", function(){ deleteSelected(); }));
    selBarEl.hidden = false;
    updateSelBarPos();
  }
  function updateSelBarPos(){
    if (!selected || selBarEl.hidden) return;
    if (objects.indexOf(selected) < 0){ clearSelection(); return; }
    var sb = selectionBounds();
    if (!sb){ clearSelection(); return; }
    var b = { min:{x:sb.minX, y:sb.minY}, max:{x:sb.maxX, y:sb.maxY} };
    var visR = camX + viewRectW/camScale, visB = camY + viewRectH/camScale;
    if (b.max.x < camX || b.min.x > visR || b.max.y < camY || b.min.y > visB){
      selBarEl.style.visibility = "hidden"; return;   // off-screen: keep the
    }                                                 // selection, hide the bar
    selBarEl.style.visibility = "";
    var s = worldToScreen((b.min.x + b.max.x)/2, b.min.y);
    var wrapRect = wrap.getBoundingClientRect();
    var bw = selBarEl.offsetWidth || 220, bh = selBarEl.offsetHeight || 30;
    var left = Math.max(6, Math.min(s.x - bw/2, wrapRect.width - bw - 6));
    var top = s.y - bh - 12;
    if (top < 6) top = Math.min(wrapRect.height - bh - 6, worldToScreen(0, b.max.y).y + 12);
    selBarEl.style.left = Math.round(left) + "px";
    selBarEl.style.top = Math.round(Math.max(6, top)) + "px";
  }
  function drawSelectionOutline(){
    if (mode !== "build") return;
    var o = selected && objects.indexOf(selected) >= 0 ? selected : null;
    var h = (currentTool === "move" && hoverObj && hoverObj !== o &&
             objects.indexOf(hoverObj) >= 0) ? hoverObj : null;
    if (h){
      var hb = h.body.bounds;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = "#F6ECD9"; ctx.lineWidth = 2/camScale;
      ctx.setLineDash([6/camScale, 5/camScale]);
      ctx.strokeRect(hb.min.x-3, hb.min.y-3, (hb.max.x-hb.min.x)+6, (hb.max.y-hb.min.y)+6);
      ctx.setLineDash([]);
      ctx.restore();
    }
    if (!o) return;
    // every other object in the selection gets its own quiet ring
    var group = selList();
    if (group.length > 1){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "#F2B705"; ctx.lineWidth = 2/camScale;
      ctx.setLineDash([6/camScale, 5/camScale]);
      group.forEach(function(g){
        if (g === o) return;
        var gb = g.body.bounds;
        ctx.strokeRect(gb.min.x-4, gb.min.y-4, (gb.max.x-gb.min.x)+8, (gb.max.y-gb.min.y)+8);
      });
      ctx.setLineDash([]);
      ctx.restore();
    }
    // the piece under the cursor, drawn inside the object's own outline
    if (selectedRegion && selectedRegion.obj === o && regionValid(selectedRegion) && !regionIsWhole(selectedRegion)){
      var rp = regionOutline(selectedRegion);
      if (rp){
        var rb = o.body;
        ctx.save();
        ctx.translate(rb.position.x, rb.position.y);
        ctx.rotate(rb.angle);
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 2.6/camScale;
        ctx.setLineDash([7/camScale, 5/camScale]);
        ctx.lineDashOffset = performance.now()/90/camScale;
        ctx.strokeStyle = "#FFF6D8"; ctx.stroke(rp);
        ctx.setLineDash([]);
        ctx.restore();
      }
    }
    var sb = selectionBounds();
    var b = sb ? { min:{x:sb.minX,y:sb.minY}, max:{x:sb.maxX,y:sb.maxY} } : o.body.bounds;
    var pulse = 0.55 + Math.sin(performance.now()/260)*0.2;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = "#F2B705"; ctx.lineWidth = 3.2/camScale;
    ctx.setLineDash([9/camScale, 6/camScale]);
    ctx.lineDashOffset = -performance.now()/70/camScale;
    ctx.strokeRect(b.min.x-5, b.min.y-5, (b.max.x-b.min.x)+10, (b.max.y-b.min.y)+10);
    ctx.setLineDash([]);
    // corner ticks, so the selection reads as a handle rather than a box
    ctx.globalAlpha = 0.95; ctx.lineWidth = 3.4/camScale;
    var k = Math.min(16, (b.max.x-b.min.x)/3, (b.max.y-b.min.y)/3)/1;
    [[b.min.x-5,b.min.y-5,1,1],[b.max.x+5,b.min.y-5,-1,1],
     [b.min.x-5,b.max.y+5,1,-1],[b.max.x+5,b.max.y+5,-1,-1]].forEach(function(c){
      ctx.beginPath();
      ctx.moveTo(c[0] + c[2]*k, c[1]);
      ctx.lineTo(c[0], c[1]);
      ctx.lineTo(c[0], c[1] + c[3]*k);
      ctx.stroke();
    });
    ctx.restore();
  }

  function afterObjectEdit(o){
    // The cached render paths are baked in the body's own frame at the
    // layer's depth scale, so anything that changes the parts or the
    // layer has to drop them.
    o.geomRev = (o.geomRev || 0) + 1;
    renderSelBar();
  }
  function rotateSelected(a){
    var list = selList();
    if (!list.length) return;
    pushUndo("rotate");
    // several pieces turn about the group's own middle, so an assembly
    // rotates as the thing you built rather than each part in place
    var sb = list.length > 1 ? selectionBounds() : null;
    var pivot = sb ? { x:(sb.minX+sb.maxX)/2, y:(sb.minY+sb.maxY)/2 } : null;
    list.forEach(function(o){
      if (pivot) Body.rotate(o.body, a, pivot); else Body.rotate(o.body, a);
      Body.setVelocity(o.body, {x:0,y:0});
      Body.setAngularVelocity(o.body, 0);
    });
    sfx("tick");
  }
  // Mirroring is done on the parts' world positions and then rebuilt
  // from scratch, which also drops any accumulated body rotation —
  // mirroring a rotated shape "about its own middle" is otherwise
  // ambiguous, and this is the answer people expect.
  // Mirror in WORLD space and rebuild square, which also drops any
  // accumulated body rotation — mirroring a rotated shape "about its own
  // middle" is otherwise ambiguous, and this is what people mean. The
  // mirrored contours ARE world coordinates, so the rebuild is handed a
  // zero frame and works out the new centre itself.
  function flipObjectAbout(o, cx){
    var pieces = o.pieces.map(function(pc){
      var w = objToWorld(o, pc.poly);
      var m = pgMap(w, function(x, y){ return [2*cx - x, y]; });
      // mirroring reverses every contour's winding; pgClean puts it back
      return { m: pc.m, poly: pgClean(m, GEOM_TOL) };
    }).filter(function(pc){ return pc.poly.length; });
    if (!pieces.length) return;
    o.pieces = pieces;
    rebuildFromPieces(o, { a: 0, x: 0, y: 0 });
    afterObjectEdit(o);
  }
  function flipSelected(){
    var list = selList();
    if (!list.length) return;
    pushUndo("flip");
    var sb = selectionBounds();
    var cx = list.length > 1 ? (sb.minX + sb.maxX)/2 : list[0].body.position.x;
    list.forEach(function(o){ flipObjectAbout(o, cx); });
    renderSelBar();
    sfx("glue");
  }
  function duplicateSelected(){
    var list = selList();
    if (!list.length) return;
    pushUndo("duplicate");
    var off = gridOn ? gridSize*2 : 44;
    var copies = [];
    list.forEach(function(src){
      var copy = spawnObjectFromPieces(
        src.pieces.map(function(pc){ return { m: pc.m, poly: pgClone(pc.poly) }; }),
        src.layer,
        { a: src.body.angle, x: src.body.position.x + off, y: src.body.position.y + off },
        src.forcedStatic);
      if (copy){
        // a duplicate is the same light, not a fresh one at whatever the
        // brush happens to be set to
        copy.glow = (src.glow == null ? 1 : src.glow);
        copy.lightSolid = !!src.lightSolid;
        copy.lightFalls = !!src.lightFalls;
        rebuildFromPieces(copy);
        if (objects.indexOf(copy) >= 0) refreshObjectPhysics(copy);
        Body.setVelocity(copy.body, {x:0,y:0});
        copies.push(copy);
      }
    });
    if (!copies.length) return;
    selectMany(copies, false);
    sfx("place");
    showToast(copies.length > 1 ? ("Copied " + copies.length + " — drag them where you want them.")
                                : "Copied — drag it where you want it.");
  }
  function anchorSelected(){
    var list = selList();
    if (!list.length) return;
    var on = !selected.forcedStatic;          // the whole group follows the one you clicked
    pushUndo(on ? "anchor" : "unanchor");
    list.forEach(function(o){
      o.forcedStatic = on;
      refreshObjectPhysics(o);
      Body.setVelocity(o.body, {x:0,y:0});
      Body.setAngularVelocity(o.body, 0);
    });
    renderSelBar();
    sfx(on ? "bolt" : "click");
    showToast(on ? "🔒 Anchored — it won't move" : "🔓 Released — gravity has it again");
  }
  function layerSelected(dir){
    var list = selList();
    if (!list.length) return;
    var l = selected.layer + dir;
    if (l < 0 || l > 2){ sfx("deny"); showToast("That's already the " + (l < 0 ? "back" : "front") + " layer."); return; }
    pushUndo("layer change");
    beginBulk();
    list.forEach(function(o){
      var ol = Math.max(0, Math.min(2, o.layer + dir));
      if (ol === o.layer) return;
      o.layer = ol;
      // A layer change swaps how the shape collides AND how it is drawn
      // (decoration gets one cheap box instead of a full decomposition),
      // so the body has to be rebuilt, not just re-flagged.
      rebuildFromPieces(o);
    });
    endBulk();
    list.forEach(function(o){ if (objects.indexOf(o) >= 0){ refreshObjectPhysics(o); afterObjectEdit(o); } });
    sfx("click");
    showToast("Moved to the " + LAYER_NAMES[l] + " layer" + (l === MID_LAYER ? " — interactive" : " — decoration only"));
  }
  function deleteSelectedRegion(){
    var reg = selectedRegion;
    if (!regionValid(reg)) return;
    pushUndo("deleting a " + matOf(reg.materialId).label + " piece");
    var before = objects.length;
    var rp = regionPoly(reg);
    var lc = rp ? pgCentroid(rp) : { x:0, y:0 };
    var wc = localPtToWorld(reg.obj, lc.x, lc.y);
    var rb = rp ? pgBounds(rp) : null;
    puff(wc.x, wc.y, 14, { color: matOf(reg.materialId).color, speed:2.6, g:0.1, r:3,
                       jitter: rb ? Math.min(120, Math.max(20, Math.max(rb.w, rb.h)*0.4)) : 30 });
    deleteRegion(reg);
    clearSelection();
    sfx("delete");
    var split = objects.length - before + 1;
    showToast(split > 1 ? ("✂ Removed — it came apart into " + split + " pieces.")
                        : "✂ Piece removed.");
  }
  function deleteSelected(){
    var list = selList();
    if (!list.length) return;
    pushUndo(list.length > 1 ? ("deleting " + list.length + " objects") : "delete");
    list.forEach(function(o){
      var b = o.body.bounds;
      var mat = o.pieces[0] ? matOf(o.pieces[0].m) : null;
      puff((b.min.x+b.max.x)/2, (b.min.y+b.max.y)/2, 18,
        { color: mat ? mat.color : "#8B8374", speed:3, g:0.12,
          jitter: Math.max(20, (b.max.x-b.min.x)*0.4), r:3.6 });
      removeObject(o);
    });
    clearSelection();
    sfx("delete");
    if (list.length > 1) showToast("Deleted " + list.length + " objects.");
  }

  // ---- Move tool: drag a whole compound object, or a flag/checkpoint/bubble ----
  var dragging = null;
  var dragOrigStatic = false;
  var dragMoved = false;
  var hoverObj = null;
  /* Grabbing something that is part of a selection moves the whole
     selection; grabbing anything else picks that up on its own. Holding
     Shift adds to (or removes from) what's selected instead. */
  function beginDrag(rawPt, additive){
    var pt = rawPt;
    if (goalPoint && dist(goalPoint, pt) < 34){ dragging = { type:"goal" }; clearSelection(); return; }
    for (var i = checkpoints.length - 1; i >= 0; i--){
      if (dist(checkpoints[i], pt) < 34){ dragging = { type:"checkpoint", index:i }; clearSelection(); return; }
    }
    for (var j = bubbles.length - 1; j >= 0; j--){
      if (dist(bubbles[j], pt) < 24){ dragging = { type:"bubble", index:j }; clearSelection(); return; }
    }
    var hit = objectAt(pt.x, pt.y);
    if (!hit){ dragging = null; if (!additive) clearSelection(); return; }
    if (additive){
      toggleInSelection(hit.obj);
      dragging = null;
      return;
    }
    var group = selList();
    if (group.indexOf(hit.obj) < 0){
      selectedRegion = regionAt(pt.x, pt.y);
      selectObject(hit.obj);
      group = [hit.obj];
    } else if (group.length === 1){
      selectedRegion = regionAt(pt.x, pt.y);
    }
    renderSelBar();
    dragging = { type:"object", objs:group, last:pt, start:{x:pt.x,y:pt.y} };
    dragMoved = false;
    dragOrigStatic = group.map(function(o){ return o.body.isStatic; });
    group.forEach(function(o){ setBodyStatic(o.body, true); });
  }
  function moveDrag(rawPt){
    if (!dragging) return;
    var pt = snapPt(rawPt);
    if (dragging.type === "goal"){ goalPoint = pt; return; }
    if (dragging.type === "checkpoint"){ checkpoints[dragging.index].x = pt.x; checkpoints[dragging.index].y = pt.y; return; }
    if (dragging.type === "bubble"){ bubbles[dragging.index].x = pt.x; bubbles[dragging.index].y = pt.y; return; }
    if (dragging.type === "object"){
      var dx = pt.x - dragging.last.x, dy = pt.y - dragging.last.y;
      if (!dx && !dy) return;
      dragging.objs.forEach(function(o){
        if (objects.indexOf(o) >= 0) Body.translate(o.body, { x: dx, y: dy });
      });
      dragging.last = pt;
      dragMoved = true;
    }
  }
  function endDrag(){
    if (dragging && dragging.type === "object"){
      dragging.objs.forEach(function(o, i){
        if (objects.indexOf(o) < 0) return;
        setBodyStatic(o.body, dragOrigStatic[i]);
        Body.setVelocity(o.body, {x:0,y:0});
        Body.setAngularVelocity(o.body, 0);
      });
      if (dragMoved) sfx("place");
    }
    dragging = null; dragMoved = false;
  }

  /* ---- Marquee ---------------------------------------------------
     Drag across empty space with the Move tool to rubber-band
     everything it touches. Shift adds to what's already picked. The
     camera moves on the middle button or a right-drag instead, which
     is what that gesture used to do here.
     ---------------------------------------------------------------- */
  var marquee = null;
  function commitMarquee(){
    var m = marquee; marquee = null;
    if (!m) return;
    var x0 = Math.min(m.a.x, m.b.x), x1 = Math.max(m.a.x, m.b.x);
    var y0 = Math.min(m.a.y, m.b.y), y1 = Math.max(m.a.y, m.b.y);
    if (x1 - x0 < 5 && y1 - y0 < 5) return;         // a click, not a drag
    var hits = objects.filter(function(o){
      var b = o.body.bounds;
      return b.max.x >= x0 && b.min.x <= x1 && b.max.y >= y0 && b.min.y <= y1;
    });
    if (!hits.length){
      if (!m.add) clearSelection();
      sfx("deny");
      return;
    }
    selectMany(hits, m.add);
    sfx("tick");
    var total = selList().length;
    showToast(total === 1 ? "Selected 1 object" : ("Selected " + total + " objects"));
  }
  function drawMarquee(){
    if (!marquee) return;
    var x0 = Math.min(marquee.a.x, marquee.b.x), x1 = Math.max(marquee.a.x, marquee.b.x);
    var y0 = Math.min(marquee.a.y, marquee.b.y), y1 = Math.max(marquee.a.y, marquee.b.y);
    ctx.save();
    ctx.fillStyle = "rgba(242,183,5,.12)";
    ctx.fillRect(x0, y0, x1-x0, y1-y0);
    ctx.strokeStyle = "#F2B705";
    ctx.lineWidth = 1.8/camScale;
    ctx.setLineDash([7/camScale, 5/camScale]);
    ctx.lineDashOffset = -performance.now()/70/camScale;
    ctx.strokeRect(x0, y0, x1-x0, y1-y0);
    ctx.setLineDash([]);
    ctx.restore();
  }

  function handleGlueClick(pt){
    var hit = objectAt(pt.x, pt.y);
    if (!hit) return;
    if (!glueFirst){ glueFirst = hit.obj; showToast("Now click a second object to glue to it."); }
    else if (glueFirst === hit.obj){ showToast("Pick a different object to glue to."); }
    else { pushUndo("gluing"); mergeObjects(glueFirst, hit.obj); showToast("Glued together!"); sfx("glue");
           puff(pt.x, pt.y, 10, { color:"#F6ECD9", speed:1.8, g:0.05 }); glueFirst = null; }
  }

  // ---- Right-click context menu (Build) / grapple rope (Play) ----
  var objCtxMenu = document.getElementById("objCtxMenu");
  /* Which object the open menu belongs to. Without it, anything that
     removed that object by another route — the eraser, a right-click cut,
     Del, the bin on the selection bar, an undo, loading another level —
     left its menu sitting there, still offering to anchor and duplicate
     something that no longer exists. */
  var ctxObj = null, ctxCam = null;
  function openObjCtxMenu(clientX, clientY, obj){
    ctxObj = obj;
    ctxCam = { x: camX, y: camY, s: camScale };   // see pruneObjCtxMenu
    objCtxMenu.innerHTML = "";
    var dup = document.createElement("button"); dup.textContent = "⧉ Duplicate";
    dup.addEventListener("click", function(){ selectObject(obj); duplicateSelected(); closeObjCtxMenu(); });
    objCtxMenu.appendChild(dup);
    var anch = document.createElement("button");
    anch.textContent = obj.forcedStatic ? "🔓 Let it fall" : "🔒 Anchor in place";
    anch.addEventListener("click", function(){ selectObject(obj); anchorSelected(); closeObjCtxMenu(); });
    objCtxMenu.appendChild(anch);
    if (objectLights(obj).length){
      var glowWrap = document.createElement("div");
      glowWrap.className = "ctxSlider";
      var pushedGlow = false;
      glowWrap.appendChild(sliderRow("☀ Glow", obj.glow == null ? 1 : obj.glow, GLOW_MIN, GLOW_MAX, 0.05,
        function(v){
          // one undo step for the whole drag, not one per pixel
          if (!pushedGlow){ pushUndo("changing a light"); pushedGlow = true; }
          obj.glow = clampGlow(v);
        },
        function(v){ return Math.round(v*100) + "%"; }));
      objCtxMenu.appendChild(glowWrap);
      var solid = document.createElement("button");
      solid.textContent = obj.lightSolid ? "👻 Walk through it" : "🧱 Make it solid";
      solid.title = obj.lightSolid ? "Go back to walking straight through this light"
                                   : "Give this light a real surface you can stand on";
      solid.addEventListener("click", function(){
        pushUndo(obj.lightSolid ? "making a light walk-through" : "making a light solid");
        obj.lightSolid = !obj.lightSolid;
        rebuildFromPieces(obj);
        if (objects.indexOf(obj) >= 0) refreshObjectPhysics(obj);
        showToast(obj.lightSolid ? "🧱 Solid — you can stand on it" : "👻 Walk straight through");
        sfx("click");
        closeObjCtxMenu();
      });
      objCtxMenu.appendChild(solid);
      if (obj.allGlow || obj.lightFalls){
        var fall = document.createElement("button");
        fall.textContent = obj.lightFalls ? "☁ Hold it up" : "⬇ Let it fall";
        fall.addEventListener("click", function(){
          pushUndo("changing a light");
          obj.lightFalls = !obj.lightFalls;
          refreshObjectPhysics(obj);
          Body.setVelocity(obj.body, {x:0,y:0});
          showToast(obj.lightFalls ? "⬇ Gravity has it" : "☁ Holding itself up");
          sfx("click");
          closeObjCtxMenu();
        });
        objCtxMenu.appendChild(fall);
      }
    }
    var save = document.createElement("button"); save.textContent = "💾 Save to My Objects";
    save.addEventListener("click", function(){ saveObjectToMyObjects(obj); closeObjCtxMenu(); });
    var del = document.createElement("button"); del.textContent = "🗑 Delete";
    del.addEventListener("click", function(){ selectObject(obj); deleteSelected(); closeObjCtxMenu(); });
    objCtxMenu.appendChild(save); objCtxMenu.appendChild(del);
    var wrapRect = wrap.getBoundingClientRect();
    objCtxMenu.style.left = (clientX - wrapRect.left) + "px";
    objCtxMenu.style.top = (clientY - wrapRect.top) + "px";
    objCtxMenu.hidden = false;
  }
  function closeObjCtxMenu(){ ctxObj = null; ctxCam = null; objCtxMenu.hidden = true; }
  /* Catch-all, checked every frame, so no future way of deleting something
     or of moving the camera has to remember this menu exists:
       - the object it belongs to is gone  → the menu goes with it
       - the camera moved                  → it is pinned to the screen, not
         to the world, so it would sit there pointing at empty air. */
  function pruneObjCtxMenu(){
    if (objCtxMenu.hidden) return;
    if (!ctxObj || objects.indexOf(ctxObj) < 0){ closeObjCtxMenu(); return; }
    if (!ctxCam) return;
    // A few pixels of drift (the camera easing back inside the world, a
    // platform carrying the shot) is not worth snatching the menu away.
    var dx = (ctxCam.x - camX) * camScale, dy = (ctxCam.y - camY) * camScale;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6 || Math.abs(ctxCam.s - camScale) > 1e-4) closeObjCtxMenu();
  }
  // Only a plain left click outside the menu dismisses it — the right-click
  // that OPENS it also bubbles up to this same document listener on the
  // very same event, so reacting to button 2 here would close the menu
  // the instant it opens.
  document.addEventListener("pointerdown", function(e){
    if (e.button !== 0) return;
    if (!objCtxMenu.hidden && !objCtxMenu.contains(e.target)) closeObjCtxMenu();
  });

  // Which bit of sponge the cursor is aiming at, and how far off it is.
  // Used both to fire the rope and to colour the play-mode reticle, so
  // the cursor always tells the truth about whether a shot will land.
  function grappleTargetAt(pt){
    if (!player) return null;
    var best = null, bestOwner = null, bestD = Infinity;
    objects.forEach(function(o){
      var lp = null;
      for (var i = 0; i < o.pieces.length; i++){
        if (!matOf(o.pieces[i].m) || !matOf(o.pieces[i].m).ropeable) continue;
        if (!lp) lp = worldPtToLocal(o, pt.x, pt.y);
        var poly = o.pieces[i].poly;
        var d = pgContains(poly, lp.x, lp.y) ? -1 : pgEdgeDist(poly, lp.x, lp.y, 260);
        if (d < bestD){
          bestD = d; bestOwner = o;
          // aim at the nearest part carrying that material, so the rope
          // still has a body to attach to
          var bp = null, bpd = Infinity;
          for (var k = 0; k < o.parts.length; k++){
            if (o.parts[k].plugin.materialId !== o.pieces[i].m) continue;
            var pd = dist(o.parts[k].position, pt);
            if (pd < bpd){ bpd = pd; bp = o.parts[k]; }
          }
          best = bp || o.parts[0];
        }
      }
    });
    if (!best) return null;
    if (!best) return null;
    // grab exactly where the cursor is when it's actually over the
    // sponge; otherwise the nearest bit of it
    var anchor = bestD <= 0 ? pt : best.position;
    return {
      part: best, owner: bestOwner, anchor: anchor,
      aimD: bestD,
      inReach: dist(anchor, player.position) <= worldSettings.ropeLength,
      near: bestD < 90
    };
  }
  function startRope(pt){
    if (!player) return;
    releaseRope();
    var t = grappleTargetAt(pt);
    if (!t || !t.near){ showToast("No sponge here to grapple — aim at Grip Sponge."); sfx("deny"); return; }
    if (!t.inReach){ showToast("That sponge is too far away."); sfx("deny"); return; }
    ropeConstraint = Constraint.create({
      bodyA: player, bodyB: t.owner.body,
      pointB: toBodyLocal(t.owner.body, t.anchor),
      stiffness: 0.7, damping: 0.2, length: dist(t.anchor, player.position)
    });
    World.add(world, ropeConstraint);
    sfx("rope");
    puff(t.anchor.x, t.anchor.y, 6, { color:"#D9DD6B", speed:1.6, g:0.06 });
  }

  // ---- Camera panning: middle-drag anywhere, or drag empty space with
  // the Move tool. Panning takes the camera off your character until you
  // press the ⦿ button (or C) to hand it back. ----
  var camPan = null;
  function beginPan(e){
    camPan = { sx:e.clientX, sy:e.clientY, cx:camX, cy:camY, moved:false };
    canvas.style.cursor = "grabbing";
  }
  function movePan(e){
    if (!camPan) return;
    var dx = (e.clientX - camPan.sx)/camScale, dy = (e.clientY - camPan.sy)/camScale;
    if (Math.abs(dx) + Math.abs(dy) > 2/camScale) camPan.moved = true;
    if (camPan.moved) camFollow = false;
    camX = camPan.cx - dx; camY = camPan.cy - dy;
    clampCamNow();
  }
  function endPan(){
    if (!camPan) return;
    if (camPan.moved) updateViewHud();
    camPan = null;
    canvas.style.cursor = "";
  }
  // Alt-click anywhere to pick up the material under the cursor, the way
  // every paint program works.
  function eyedrop(pt){
    var hit = objectAt(pt.x, pt.y, 6);
    if (!hit || !hit.materialId){ sfx("deny"); showToast("Nothing to pick up there."); return false; }
    var m = hit.materialId;
    currentTool = m; canvas.dataset.tool = m;
    if (pmOpen) renderPersonalMenu();
    sfx("tick");
    showToast("🎨 Picked up " + matOf(m).label);
    return true;
  }

  canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    var pt = screenToWorld(e.clientX, e.clientY);
    zoomAround(pt, e.deltaY < 0 ? 1.12 : 1/1.12);
    updateViewHud();
  }, { passive:false });

  canvas.addEventListener("pointerdown", function(e){
    if (e.button === 1){ e.preventDefault(); beginPan(e); canvas.setPointerCapture(e.pointerId); return; }
    if (e.button === 2){
      var pt = screenToWorld(e.clientX, e.clientY);
      if (mode === "build"){
        /* With a material picked, the right button CUTS — LBP's Triangle.
           Click to punch the brush's own shape out of whatever is under
           it, or drag to shave an edge; in a drag-out shape mode you drag
           out the hole instead. Every other tool keeps the right-click menu. */
        if (matOf(currentTool)){
          e.preventDefault();
          canvas.setPointerCapture(e.pointerId);
          closeObjCtxMenu();
          var snapped = snapPt(pt);
          if (paintMode !== "brush"){
            shapeDrag = { a: snapped, b: snapped, square: e.shiftKey, erase: true };
            return;
          }
          pushUndo("cutting");
          painting = true; lastPaint = snapped; stroke = null;
          beginBulk();
          beginStroke(snapped, null, true, true);
          eraseStep();
          return;
        }
        var boltHit = boltAt(pt.x, pt.y);
        if (boltHit){ toggleBolt(boltHit); return; }
        var hitObj = objectAt(pt.x, pt.y);
        if (hitObj){
          selectedRegion = regionAt(pt.x, pt.y);
          if (selList().indexOf(hitObj.obj) < 0) selectObject(hitObj.obj);
          renderSelBar();
          openObjCtxMenu(e.clientX, e.clientY, hitObj.obj);
        } else {
          // empty space with the Move tool: the right button moves the
          // camera, since the left one is busy rubber-banding now
          canvas.setPointerCapture(e.pointerId);
          beginPan(e);
        }
      } else if (mode === "play"){
        startRope(pt);
      }
      return;
    }
    if (mode !== "build") return;
    var pt2 = screenToWorld(e.clientX, e.clientY);
    if (e.altKey){ eyedrop(pt2); return; }
    if (glueMode){ handleGlueClick(pt2); return; }
    canvas.setPointerCapture(e.pointerId);
    if (currentTool === "move"){
      var wasSel = selected;
      beginDrag(pt2, e.shiftKey);
      if (!dragging){
        // empty space → rubber-band a selection (the camera moves on the
        // middle button or a right-drag)
        if (!e.shiftKey || objectAt(pt2.x, pt2.y) === null) marquee = { a: pt2, b: pt2, add: e.shiftKey };
        return;
      }
      if (dragging.type === "object") pushUndo("move");
      else pushUndo(dragging.type === "goal" ? "moving the goal" : "moving a marker");
      if (wasSel !== selected) renderSelBar();
      return;
    }
    // A drag-out shape is one action; freehand is one action per stroke.
    var shapeable = matOf(currentTool) && paintMode !== "brush";
    if (shapeable){
      if (matOf(currentTool).isFluid && buildLayer !== MID_LAYER){
        showToast("Water only works on the Mid layer — switch to Mid to pour it.");
        sfx("deny"); return;
      }
      var a = snapPt(pt2);
      shapeDrag = { a:a, b:a, square: e.shiftKey };
      return;
    }
    pushUndo(currentTool === "erase" ? "erasing"
             : (matOf(currentTool) ? "painting " + matOf(currentTool).label : "that"));
    painting = true; lastPaint = null; stroke = null;
    beginBulk();                       // one rebuild when the stroke ends
    paintAt(pt2);
  });
  canvas.addEventListener("pointermove", function(e){
    if (camPan){ movePan(e); return; }
    if (mode !== "build") return;
    var pt = screenToWorld(e.clientX, e.clientY);
    if (shapeDrag){ shapeDrag.b = snapPt(pt); shapeDrag.square = e.shiftKey; return; }
    if (marquee){ marquee.b = pt; return; }
    if (currentTool === "move"){
      moveDrag(pt);
      if (!dragging){
        var h = objectAt(pt.x, pt.y);
        hoverObj = h ? h.obj : null;
      }
    }
    else if (painting){ paintAt(pt); }
  });

  /* ============================================================
     9. Save / Load
     ============================================================ */
  function serializeLevel(name){
    var objIndex = {};
    var objSnaps = objects.map(function(o,i){ objIndex[o.id] = i; return packObject(o); });
    var boltSnaps = bolts.map(function(b){ return { a:objIndex[b.objA.id], b:objIndex[b.objB.id], x:b.point.x, y:b.point.y, tight:b.tight, mode:b.mode }; });
    return {
      name: name, updatedAt: Date.now(), version: 4,
      checkpoints: checkpoints.map(function(c){ return { x:c.x, y:c.y }; }),
      goal: goalPoint,
      bubbles: bubbles.map(function(b){ return { x:b.x, y:b.y }; }),
      objects: objSnaps, bolts: boltSnaps,
      water: packWaterSparse(),
      world: { gravity: worldSettings.gravity, waterLevel: worldSettings.waterLevel, ropeLength: worldSettings.ropeLength, motorSpeed: worldSettings.motorSpeed, light: worldSettings.light }
    };
  }
  function loadLevelData(data){
    clearAllObjects();
    if (!data || typeof data !== "object") data = {};
    var version = +data.version || 0;
    if ((version === 2 || version === 3 || version === 4) && Array.isArray(data.objects)){
      beginBulk();
      loadBudget = MAX_LEVEL_CORNERS;
      var list = data.objects.slice(0, PLACED_CAP);
      var newObjs = list.map(version === 2 ? migrateDabObject : unpackObject);
      var truncated = loadBudget <= 0;
      loadBudget = MAX_LEVEL_CORNERS;
      endBulk();
      if (truncated) showToast("That level is bigger than this build can hold — some of it was left out.");
      newObjs.forEach(function(o){ if (o) refreshObjectPhysics(o); });
      if (version === 2) showToast("Rebuilt this level's shapes as polygons — the edges are clean now.");
      (Array.isArray(data.bolts) ? data.bolts : []).forEach(function(bs){
        var oa = newObjs[bs.a], ob = newObjs[bs.b];
        if (oa && ob) addBolt(oa, ob, { x:+bs.x||0, y:+bs.y||0 }, bs.mode || (bs.tight ? "tight" : "loose"));
      });
      if (data.world){
        worldSettings.gravity = data.world.gravity != null ? data.world.gravity : 1;
        worldSettings.waterLevel = data.world.waterLevel != null ? data.world.waterLevel : null;
        worldSettings.ropeLength = data.world.ropeLength || 220;
        worldSettings.motorSpeed = data.world.motorSpeed != null ? data.world.motorSpeed : 0.06;
        worldSettings.light = data.world.light != null ? Math.max(0, Math.min(1, +data.world.light)) : 1;
        applyWorldSettings();
      }
    } else if (Array.isArray(data.blocks)){
      // legacy save from before objects existed — each old block becomes its own little square
      beginBulk();
      data.blocks.slice(0, PLACED_CAP).forEach(function(bl){
        if (!bl || !matOf(bl.m) || matOf(bl.m).isFluid) return;
        var x = +bl.x, y = +bl.y, r = BRUSH_R;
        if (!isFinite(x) || !isFinite(y)) return;
        newObjectFromPoly(bl.m, [[[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]]]],
                          bl.l != null ? bl.l : MID_LAYER);
      });
      endBulk();
    } else if (version && version !== 2 && version !== 3 && version !== 4){
      showToast("That level was saved by a newer version of the game.");
    }
    if (data.checkpoints && data.checkpoints.length){
      checkpoints = data.checkpoints.map(function(c){ return { x:c.x, y:c.y, reached:false }; });
    } else if (data.spawn){
      checkpoints = [{ x:data.spawn.x, y:data.spawn.y, reached:false }];
    } else {
      checkpoints = [{ x:90, y:700, reached:false }];
    }
    goalPoint = data.goal || null;
    bubbles = (data.bubbles||[]).map(function(b){ return { x:b.x, y:b.y, collected:false }; });
    activeCheckpoint = 0;
    unpackWaterSparse(data.water);
  }

  onStep("beforeUpdate", function(){
    if (mode !== "play" || !player) return;
    if (goalPoint && dist(goalPoint, player.position) < 46) levelComplete();
    bubbles.forEach(function(b){
      if (!b.collected && dist(b, player.position) < 34) collectBubble(b);
    });
    for (var i = 1; i < checkpoints.length; i++){
      var cp = checkpoints[i];
      if (!cp.reached && dist(cp, player.position) < 40){
        cp.reached = true;
        activeCheckpoint = i;
        showToast("🚩 Checkpoint!");
      }
    }
  });

  function localLevels(){
    try { return JSON.parse(localStorage.getItem("pg_local_levels") || "[]"); }
    catch(e){ return []; }
  }
  /* Which stored level this session is editing.

     Save used to call .add() unconditionally, so every press wrote a whole
     new ~165KB document and the level list filled up with copies of one
     level. Holding the id lets a save UPDATE what it saved last time.

     Two ids rather than one because the cloud and the device are separate
     stores, and a cloud save that fails falls back to the device: that is a
     fallback copy, not a change of identity, so the next save must still try
     the cloud. Null on either side means "not written there yet".

     Persisted alongside the autosave, or a reload would forget which
     document it was editing and the very next save would duplicate again —
     which is most of the original bug back. */
  var cloudLevelId = null, localLevelId = null;
  function rememberLevelIds(){
    try { localStorage.setItem("pg_level_id", JSON.stringify({ cloud: cloudLevelId, local: localLevelId })); }
    catch(e){}
  }
  function setLevelIds(cloud, local){
    cloudLevelId = cloud || null;
    localLevelId = local || null;
    rememberLevelIds();
  }
  function forgetLevelIfDeleted(id){
    if (id && (id === cloudLevelId || id === localLevelId)){
      if (id === cloudLevelId) cloudLevelId = null;
      if (id === localLevelId) localLevelId = null;
      rememberLevelIds();
    }
  }

  function saveLocalLevel(data){
    var list = localLevels(), i;
    if (localLevelId){
      for (i = 0; i < list.length; i++){
        if (list[i].id === localLevelId){
          list[i] = { id: localLevelId, data: data };
          localStorage.setItem("pg_local_levels", JSON.stringify(list.slice(0,30)));
          return;
        }
      }
    }
    localLevelId = "local_" + Date.now();
    list.unshift({ id: localLevelId, data: data });
    localStorage.setItem("pg_local_levels", JSON.stringify(list.slice(0,30)));
    rememberLevelIds();
  }

  function doSave(){
    var name = document.getElementById("levelNameInput").value.trim() || "Untitled Level";
    var data = serializeLevel(name);
    localStorage.setItem("pg_autosave", JSON.stringify(data));
    sfx("save");
    dbPromise.then(function(db){
      if (db){
        var rec = { name: data.name, updatedAt: data.updatedAt, payload: JSON.stringify(data) };
        var saved = function(){ showToast("Saved '"+name+"' to the cloud ☁"); };
        var fellBack = function(){ saveLocalLevel(data); showToast("Cloud save failed — saved on this device instead."); };
        if (cloudLevelId){
          /* set(), not update(): the record is the whole level, and if the
             document has gone (deleted on another device) this recreates it
             rather than failing. */
          db.collection("levels").doc(cloudLevelId).set(rec).then(saved).catch(fellBack);
        } else {
          db.collection("levels").add(rec).then(function(ref){
            if (ref && ref.id){ cloudLevelId = ref.id; rememberLevelIds(); }
            saved();
          }).catch(fellBack);
        }
      } else {
        saveLocalLevel(data);
        showToast("Saved '"+name+"' on this device.");
      }
    });
  }
  function doNew(){
    askConfirm("Start a brand new level? Unsaved changes will be lost.", function(){
      starterLevel();
      document.getElementById("levelNameInput").value = "Untitled Level";
      /* A new level is not the old one — drop the ids or the first save
         would overwrite whatever was last open. */
      setLevelIds(null, null);
      showToast("New level started.");
      buildFrozen = snapshotFull();
    });
  }

  var loadOverlay = document.getElementById("loadOverlay");
  var levelListEl = document.getElementById("levelList");
  function openLoad(){
    loadOverlay.hidden = false;
    levelListEl.innerHTML = '<div class="empty-note">Loading…</div>';
    renderLevelList();
  }
  document.getElementById("closeLoad").addEventListener("click", function(){ loadOverlay.hidden = true; });

  function renderLevelList(){
    dbPromise.then(function(db){
      var localList = localLevels();
      var finish = function(cloudRows){
        levelListEl.innerHTML = "";
        var all = cloudRows.concat(localList.map(function(l){
          return { id:l.id, name:l.data.name, updatedAt:l.data.data ? l.data.data.updatedAt : l.data.updatedAt, local:true, raw:l.data };
        }));
        if (!all.length){ levelListEl.innerHTML = '<div class="empty-note">No saved levels yet — build something and press Ctrl+S!</div>'; return; }
        all.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
        all.forEach(function(row){ levelListEl.appendChild(levelRowEl(row)); });
      };
      if (db){
        db.collection("levels").orderBy("updatedAt","desc").limit(40).get().then(function(snap){
          var cloudRows = snap.docs.map(function(d){
            var data = d.data();
            return { id:d.id, name:data.name, updatedAt:data.updatedAt, payload:data.payload, cloud:true };
          });
          finish(cloudRows);
        }).catch(function(){ finish([]); });
      } else {
        finish([]);
      }
    });
  }

  function levelRowEl(row){
    var el = document.createElement("div");
    el.className = "levelRow";
    var when = row.updatedAt ? timeAgo(row.updatedAt) : "";
    el.innerHTML =
      '<div class="lname">'+escapeHtml(row.name || "Untitled")+'</div>'+
      '<div class="ldate">'+(row.cloud?"☁ ":"💾 ")+when+'</div>'+
      '<button class="btn small">Load</button>'+
      '<button class="btn small red">✕</button>';
    el.querySelector(".btn.small:not(.red)").addEventListener("click", function(){
      var data = row.cloud ? JSON.parse(row.payload) : row.raw;
      loadLevelData(data);
      /* From here on this session is editing THAT stored level, so saving
         updates it in place instead of leaving a copy behind. */
      setLevelIds(row.cloud ? row.id : null, row.cloud ? null : row.id);
      document.getElementById("levelNameInput").value = data.name || "Untitled Level";
      loadOverlay.hidden = true;
      setMode("build");
      buildFrozen = snapshotFull();
      showToast("Loaded '"+(data.name||"level")+"'");
    });
    el.querySelector(".btn.red").addEventListener("click", function(){
      askConfirm("Delete '"+(row.name||"this level")+"'?", function(){
        /* If this session was editing what just got deleted, stop pointing at
           it — otherwise the next save would silently resurrect it. */
        forgetLevelIfDeleted(row.id);
        if (row.cloud){
          dbPromise.then(function(db){
            if (db) db.collection("levels").doc(row.id).delete().then(renderLevelList);
          });
        } else {
          var list = localLevels().filter(function(l){ return l.id !== row.id; });
          localStorage.setItem("pg_local_levels", JSON.stringify(list));
          renderLevelList();
        }
      });
    });
    return el;
  }
  function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function timeAgo(ts){
    var s = Math.floor((Date.now()-ts)/1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60)+"m ago";
    if (s < 86400) return Math.floor(s/3600)+"h ago";
    return Math.floor(s/86400)+"d ago";
  }

  setInterval(function(){
    if (mode === "build" && objects.length){
      localStorage.setItem("pg_autosave", JSON.stringify(serializeLevel(document.getElementById("levelNameInput").value || "Untitled Level")));
    }
  }, 15000);

  (function restoreAutosave(){
    /* Pick the level identity back up before anything can save, so a reload
       carries on editing the same document instead of forking a copy. */
    try {
      var ids = JSON.parse(localStorage.getItem("pg_level_id") || "null");
      if (ids){ cloudLevelId = ids.cloud || null; localLevelId = ids.local || null; }
    } catch(e){}
    try {
      var raw = localStorage.getItem("pg_autosave");
      if (raw){
        var data = JSON.parse(raw);
        if (data && ((data.objects && data.objects.length) || (data.blocks && data.blocks.length))){
          loadLevelData(data);
          document.getElementById("levelNameInput").value = data.name || "Untitled Level";
        }
      }
    } catch(e){}
    // whatever we ended up with at boot (starter level or a restored
    // autosave) becomes the anchor Build snapshot / history root.
    buildFrozen = snapshotFull();
  })();

})();
</script>
