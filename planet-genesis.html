  function detachSelectedRegion(){
    var reg = selectedRegion;
    if (!regionValid(reg) || regionIsWhole(reg)) return;
    var o = reg.obj, mat = reg.materialId, layer = o.layer;
    var worldPoly = objToWorld(o, regionPoly(reg));
    pushUndo("detaching a " + matOf(mat).label + " piece");
    var before = objects.length;
    deleteRegion(reg);
    var fresh = newObjectFromPoly(mat, worldPoly, layer);
    clearSelection();
    if (fresh) selectObject(fresh);
    sfx("glue");
    var split = objects.length - before;
    showToast(split > 1 ? "⇱ Detached — and what it was holding together came apart too."
                        : "⇱ Detached — it's its own thing now.");
  }
  function deleteSelected(){
    var list = selList();
    if (!list.length) return;
    pushUndo(list.length > 1 ? ("deleting " + list.length + " objects") : "delete");
    list.forEach(function(o){
      var b = o.body.bounds;
      var mat = o.pieces[0] ? matOf(o.pieces[0].m) : null;
      puff((b.min.x+b.max.x)/2, (b.min.y+b.max.y)/2, 18,
        { color: mat ? mat.color : "#8B8374", speed:3, g:0.12,
          jitter: Math.max(20, (b.max.x-b.min.x)*0.4), r:3.6 });
      removeObject(o);
    });
    clearSelection();
    sfx("delete");
    if (list.length > 1) showToast("Deleted " + list.length + " objects.");
  }

  // ---- Move tool: drag a whole compound object, or a flag/checkpoint/bubble ----
  var dragging = null;
  var dragOrigStatic = false;
  var dragMoved = false;
  var hoverObj = null;
  /* Grabbing something that is part of a selection moves the whole
     selection; grabbing anything else picks that up on its own. Holding
     Shift adds to (or removes from) what's selected instead. */
  function beginDrag(rawPt, additive){
    var pt = rawPt;
    /* A resize handle wins over everything, including the object under it —
       the handles sit on the selection's edge, which is usually on top of
       the thing you are resizing. */
    if (!additive){
      var handle = resizeHandleAt(pt);
      if (handle){ dragging = null; beginResize(pt, handle); return; }
      if (wiring){ dragging = null; finishWire(pt); return; }
      // a selected camera's zone, frame, corners and second spot are dragged
      // straight — none of them needs a host, a view can point at sky
      var selCam = selectedGadget && selectedGadget.kind === "camera" ? selectedGadget : null;
      var camH = selCam ? cameraHandleAt(selCam, pt) : null;
      if (camH){ dragging = null; beginAttachDrag(camH.kind, selCam, pt, camH.corner); return; }
      // a selected mover's knob: the end of its travel
      if (selectedGadget && selectedGadget.kind === "mover" && selectedGadget.line){
        var mst2 = moverStart(selectedGadget);
        if (dist({ x: mst2.x + selectedGadget.line.dx, y: mst2.y + selectedGadget.line.dy }, pt) < 14/camScale + 4){
          dragging = null; beginAttachDrag("moverEnd", selectedGadget, pt); return;
        }
      }
      var gh = gadgetAt(pt.x, pt.y);
      if (gh && (gh.kind === "creature" || gh.kind === "anim") && gh.art && gh.obj && objects.indexOf(gh.obj) >= 0){
        // the marker IS the creature or object: dragging it moves the whole
        // thing, as if you had taken hold of the drawing. It used to come
        // off like any gadget and leave the body behind — Carson: "there
        // will just be a square in my level"
        selectGadget(gh); renderSelBar();
        var dh = gh.obj;
        dragging = { type:"object", objs:[dh], last:pt, start:{x:pt.x,y:pt.y}, held: [dragHasPhysics(dh)],
                     targets: [{ x: dh.body.position.x, y: dh.body.position.y }], angles: [dh.body.angle], lastPos: [null], lastCmd: [0] };
        dragMoved = false;
        dragOrigStatic = [dh.body.isStatic];
        if (!dragging.held[0]) setBodyStatic(dh.body, true);
        return;
      }
      if (gh){ dragging = null; selectGadget(gh); renderSelBar(); beginAttachDrag("gadget", gh, pt); return; }
      var bh = boltAt(pt.x, pt.y);
      if (bh){ dragging = null; selectBolt(bh); renderSelBar(); beginAttachDrag("bolt", bh, pt); return; }
      var lh = linkAt(pt.x, pt.y);
      if (lh){
        dragging = null; selectLink(lh); renderSelBar();
        var le = linkEndAt(lh, pt.x, pt.y);
        if (le) beginAttachDrag("link", lh, pt, le);
        return;
      }
      // the zone box moves from anywhere inside it — after the camera and
      // any other gadget in the box have had their chance to be picked
      var camIn = selCam ? cameraHandleAt(selCam, pt, true) : null;
      if (camIn){ dragging = null; beginAttachDrag(camIn.kind, selCam, pt); return; }
    }
    if (goalPoint && dist(goalPoint, pt) < 34){ dragging = { type:"goal" }; clearSelection(); return; }
    for (var i = checkpoints.length - 1; i >= 0; i--){
      if (dist(checkpoints[i], pt) < 34){ dragging = { type:"checkpoint", index:i }; clearSelection(); return; }
    }
    for (var j = bubbles.length - 1; j >= 0; j--){
      if (dist(bubbles[j], pt) < 24){ dragging = { type:"bubble", index:j }; clearSelection(); return; }
    }
    var hit = objectAt(pt.x, pt.y);
    if (!hit){ dragging = null; if (!additive) clearSelection(); return; }
    if (additive){
      toggleInSelection(hit.obj);
      dragging = null;
      return;
    }
    var group = selList();
    if (group.indexOf(hit.obj) < 0){
      selectedRegion = regionAt(pt.x, pt.y);
      selectObject(hit.obj);
      group = [hit.obj];
    } else if (group.length === 1){
      selectedRegion = regionAt(pt.x, pt.y);
    }
    renderSelBar();
    dragging = { type:"object", objs:group, last:pt, start:{x:pt.x,y:pt.y},
                 held: group.map(dragHasPhysics),
                 targets: group.map(function(o){ return { x: o.body.position.x, y: o.body.position.y }; }),
                 angles: group.map(function(o){ return o.body.angle; }), lastPos: group.map(function(){ return null; }), lastCmd: group.map(function(){ return 0; }) };
    dragMoved = false;
    dragOrigStatic = group.map(function(o){ return o.body.isStatic; });
    group.forEach(function(o, i){ if (!dragging.held[i]) setBodyStatic(o.body, true); });
  }
  /* Dragging with physics on. An object with its physics on — free, solid,
     on the Mid layer — is not teleported under the cursor but DRIVEN there:
     kept dynamic and given a velocity toward its target every step, so the
     engine resolves what it meets on the way — a wall stops it, a loose
     crate is shoved along. It used to be translated straight through
     everything and left overlapping whatever it was dropped in ("objects
     just merge into each other"). While the world is paused there is no
     engine to resolve anything, so the move is tried by hand and backed
     out of a solid, the way the paused walk is. A locked, decorative or
     walk-through object — physics off — still goes straight where the
     cursor says, through anything. */
  function dragHasPhysics(o){
    return !!o.body && !o.decorative && !o.forcedStatic && !o.holdsStill && !o.body.isSensor && !o.body.isStatic;
  }
  function dragObstaclesFor(o){
    var group = dragging ? dragging.objs : [];
    var list = objects.filter(function(q){ return q !== o && group.indexOf(q) < 0 && q.body && !q.body.isSensor; }).map(function(q){ return q.body; }).concat(walls);
    if (player) list.push(player);
    return Query.region(list, o.body.bounds);
  }
  function tryMoveObject(o, dx, dy){
    Body.translate(o.body, { x: dx, y: dy });
    var near = dragObstaclesFor(o);
    if (near.length && Query.collides(o.body, near).length){
      Body.translate(o.body, { x: -dx, y: -dy });
      return false;
    }
    return true;
  }
  function moveDrag(rawPt){
    if (!dragging) return;
    var pt = snapPt(rawPt);
    if (dragging.type === "goal"){ goalPoint = pt; return; }
    if (dragging.type === "checkpoint"){ checkpoints[dragging.index].x = pt.x; checkpoints[dragging.index].y = pt.y; return; }
    if (dragging.type === "bubble"){ bubbles[dragging.index].x = pt.x; bubbles[dragging.index].y = pt.y; return; }
    if (dragging.type === "object"){
      var dx = pt.x - dragging.last.x, dy = pt.y - dragging.last.y;
      if (!dx && !dy) return;
      dragging.objs.forEach(function(o, i){
        if (objects.indexOf(o) < 0) return;
        var tg = dragging.targets && dragging.targets[i];
        if (tg){ tg.x += dx; tg.y += dy; }
        if (dragging.held && dragging.held[i]){
          if (!runner.enabled){
            // paused: by hand, straight to the target if it fits, else as far as it goes on each axis
            var gx = tg.x - o.body.position.x, gy = tg.y - o.body.position.y;
            if (!tryMoveObject(o, gx, gy)){ tryMoveObject(o, gx, 0); tryMoveObject(o, 0, gy); }
          }
          return;   // running: the step drives it
        }
        Body.translate(o.body, { x: dx, y: dy });
      });
      dragging.last = pt;
      dragMoved = true;
    }
  }
  // the drive: every step, each held object is pushed toward where the cursor put its target
  onStep("beforeUpdate", function(){
    if (!dragging || dragging.type !== "object" || !dragging.held) return;
    dragging.objs.forEach(function(o, i){
      if (!dragging.held[i] || objects.indexOf(o) < 0 || o.body.isStatic) return;
      var tg = dragging.targets[i], b = o.body;
      // brisk but under what the solver separates cleanly in a step — and
      // when it is blocked (it moved much less than it was told to last
      // step), it leans rather than shoves, so a crate pinned against a
      // wall is not driven into it
      var vx = (tg.x - b.position.x) * 0.3, vy = (tg.y - b.position.y) * 0.3, vm = Math.hypot(vx, vy), vmax = 9;
      var lp = dragging.lastPos[i], lc = dragging.lastCmd[i];
      if (lp && lc > 0.5){
        var got = Math.hypot(b.position.x - lp.x, b.position.y - lp.y);
        if (got < lc * 0.5) vmax = Math.min(vmax, Math.max(1, got * 1.5 + 0.5));
      }
      if (vm > vmax){ vx *= vmax / vm; vy *= vmax / vm; vm = vmax; }
      dragging.lastPos[i] = { x: b.position.x, y: b.position.y }; dragging.lastCmd[i] = vm;
      Body.setVelocity(b, { x: vx, y: vy });
      if (Math.abs(b.angle - dragging.angles[i]) > 1e-6) Body.setAngle(b, dragging.angles[i]);
      Body.setAngularVelocity(b, 0);
    });
  });
  function endDrag(){
    if (dragging && dragging.type === "object"){
      dragging.objs.forEach(function(o, i){
        if (objects.indexOf(o) < 0) return;
        if (!(dragging.held && dragging.held[i])) setBodyStatic(o.body, dragOrigStatic[i]);
        Body.setVelocity(o.body, {x:0,y:0});
        Body.setAngularVelocity(o.body, 0);
      });
      if (dragMoved) sfx("place");
    }
    dragging = null; dragMoved = false;
  }

  /* ---- Marquee ---------------------------------------------------
     Drag across empty space with the Move tool to rubber-band
     everything it touches. Shift adds to what's already picked. The
     camera moves on the middle button or a right-drag instead, which
     is what that gesture used to do here.
     ---------------------------------------------------------------- */
  var marquee = null;
  function commitMarquee(){
    var m = marquee; marquee = null;
    if (!m) return;
    var x0 = Math.min(m.a.x, m.b.x), x1 = Math.max(m.a.x, m.b.x);
    var y0 = Math.min(m.a.y, m.b.y), y1 = Math.max(m.a.y, m.b.y);
    if (x1 - x0 < 5 && y1 - y0 < 5) return;         // a click, not a drag
    // what the box actually touches — the material, not the box round it: a
    // diagonal plank's bounds are huge, and a marquee over the dots beside
    // it kept catching the plank. Carson: "only the specific material
    // touching inside the box"
    var boxPoly = [[[[x0, y0], [x1, y0], [x1, y1], [x0, y1]]]];
    var hits = objects.filter(function(o){
      var b = o.body.bounds;
      if (b.max.x < x0 || b.min.x > x1 || b.max.y < y0 || b.min.y > y1) return false;   // bounds first, cheaply
      var local = objToLocal(o, boxPoly);
      for (var i = 0; i < o.pieces.length; i++) if (pgIntersects(o.pieces[i].poly, local)) return true;
      return false;
    });
    if (!hits.length){
      if (!m.add) clearSelection();
      sfx("deny");
      return;
    }
    selectMany(hits, m.add);
    sfx("tick");
    var total = selList().length;
    showToast(total === 1 ? "Selected 1 object" : ("Selected " + total + " objects"));
  }
  function drawMarquee(){
    if (!marquee) return;
    var x0 = Math.min(marquee.a.x, marquee.b.x), x1 = Math.max(marquee.a.x, marquee.b.x);
    var y0 = Math.min(marquee.a.y, marquee.b.y), y1 = Math.max(marquee.a.y, marquee.b.y);
    ctx.save();
    ctx.fillStyle = "rgba(242,183,5,.12)";
    ctx.fillRect(x0, y0, x1-x0, y1-y0);
    ctx.strokeStyle = "#F2B705";
    ctx.lineWidth = 1.8/camScale;
    ctx.setLineDash([7/camScale, 5/camScale]);
    ctx.lineDashOffset = -performance.now()/70/camScale;
    ctx.strokeRect(x0, y0, x1-x0, y1-y0);
    ctx.setLineDash([]);
    ctx.restore();
  }

  function handleGlueClick(pt){
    var hit = objectAt(pt.x, pt.y);
    if (!hit) return;
    if (!glueFirst){ glueFirst = hit.obj; showToast("Now click a second object to glue to it."); }
    else if (glueFirst === hit.obj){ showToast("Pick a different object to glue to."); }
    else { pushUndo("gluing"); mergeObjects(glueFirst, hit.obj); showToast("Glued together!"); sfx("glue");
           puff(pt.x, pt.y, 10, { color:"#F6ECD9", speed:1.8, g:0.05 }); glueFirst = null; }
  }

  // ---- The object box (Build) / grab (Play) ----
  /* Right-click used to open its own popup at the cursor with half the
     same buttons as the strip. Now both are the one box: right-click just
     makes sure the thing is selected and the box is showing. The caller
     has already recorded which piece was under the cursor. */
  function openObjCtxMenu(clientX, clientY, obj){
    if (selList().indexOf(obj) < 0) selectObject(obj);
    opWanted = true;
    renderSelBar();
  }
  function closeObjCtxMenu(){ renderSelBar(); }
  /* Runs every frame. Catch-all on purpose: no future way of deleting an
     object has to remember the box exists. The camera no longer matters —
     the box is docked, not pinned to a spot on the level. */
  function pruneObjCtxMenu(){
    if (selectedLink && links.indexOf(selectedLink) < 0){ clearSelection(); return; }
    if (selectedGadget && gadgets.indexOf(selectedGadget) < 0){ clearSelection(); return; }
    if (selectedBolt && bolts.indexOf(selectedBolt) < 0){ clearSelection(); return; }
    if (objPanelEl.hidden) return;
    if (selectedBolt || selectedGadget || selectedLink) return;
    if (!selected || objects.indexOf(selected) < 0) clearSelection();
  }

  /* ---- Dragging and resizing the box. The position and size are yours,
     so they are remembered next to the menu gradient. Dragging converts
     the box from right-docked to an absolute left/top the first time, so
     it stays where you put it rather than snapping back. */
  var opDrag = null;
  /* offsetLeft/offsetTop are measured from inside the stage's border, which
     is also what style.left/top position against — so saving one and
     restoring the other lands in the same place. Mixing in
     getBoundingClientRect, which measures from outside the border, put the
     box 5px off every time it came back. */
  function opSavePlacement(){
    try {
      localStorage.setItem("pg_panel", JSON.stringify({
        left: objPanelEl.offsetLeft, top: objPanelEl.offsetTop,
        w: objPanelEl.offsetWidth, h: objPanelEl.offsetHeight }));
    } catch(e){}
  }
  function opClampIntoStage(){
    var W = wrap.clientWidth, H = wrap.clientHeight;
    var pw = objPanelEl.offsetWidth, ph = objPanelEl.offsetHeight;
    var left = Math.max(0, Math.min(objPanelEl.offsetLeft, W - Math.min(pw, W)));
    var top = Math.max(0, Math.min(objPanelEl.offsetTop, H - Math.min(ph, H)));
    objPanelEl.style.left = Math.round(left) + "px";
    objPanelEl.style.top = Math.round(top) + "px";
    objPanelEl.style.right = "auto";
  }
  opHeadEl.addEventListener("pointerdown", function(e){
    if (e.button !== 0 || e.target.tagName === "BUTTON") return;
    var w = wrap.getBoundingClientRect();
    var ox = w.left + wrap.clientLeft, oy = w.top + wrap.clientTop;   // inside the border
    opDrag = { dx: e.clientX - ox - objPanelEl.offsetLeft, dy: e.clientY - oy - objPanelEl.offsetTop, wl: ox, wt: oy };
    objPanelEl.style.right = "auto";
    opHeadEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  opHeadEl.addEventListener("pointermove", function(e){
    if (!opDrag) return;
    objPanelEl.style.left = Math.round(e.clientX - opDrag.dx - opDrag.wl) + "px";
    objPanelEl.style.top = Math.round(e.clientY - opDrag.dy - opDrag.wt) + "px";
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    opHeadEl.addEventListener(ev, function(){
      if (!opDrag) return;
      opDrag = null;
      opClampIntoStage();
      opSavePlacement();
    });
  });
  document.getElementById("opClose").addEventListener("click", function(){
    opWanted = false; objPanelEl.hidden = true;
  });
  if (typeof ResizeObserver !== "undefined"){
    var opRO = new ResizeObserver(function(){ if (!objPanelEl.hidden && !opDrag) opSavePlacement(); });
    opRO.observe(objPanelEl);
  }
  (function restorePanelPlacement(){
    try {
      var pl = JSON.parse(localStorage.getItem("pg_panel") || "null");
      if (!pl) return;
      if (pl.w) objPanelEl.style.width = pl.w + "px";
      if (pl.h) objPanelEl.style.height = pl.h + "px";
      if (pl.left != null && pl.top != null){
        objPanelEl.style.left = pl.left + "px"; objPanelEl.style.top = pl.top + "px";
        objPanelEl.style.right = "auto";
      }
    } catch(e){}
  })();

  // ---- Camera panning: middle-drag anywhere, or drag empty space with
  // the Move tool. Panning takes the camera off your character until you
  // press the ⦿ button (or C) to hand it back. ----
  var camPan = null;
  function beginPan(e){
    camPan = { sx:e.clientX, sy:e.clientY, cx:camX, cy:camY, moved:false };
    canvas.style.cursor = "grabbing";
  }
  function movePan(e){
    if (!camPan) return;
    var dx = (e.clientX - camPan.sx)/camScale, dy = (e.clientY - camPan.sy)/camScale;
    if (Math.abs(dx) + Math.abs(dy) > 2/camScale) camPan.moved = true;
    if (camPan.moved) camFollow = false;
    camX = camPan.cx - dx; camY = camPan.cy - dy;
    clampCamNow();
  }
  function endPan(){
    if (!camPan) return;
    if (camPan.moved) updateViewHud();
    camPan = null;
    canvas.style.cursor = "";
  }
  // Alt-click anywhere to pick up the material under the cursor, the way
  // every paint program works.
  function eyedrop(pt){
    var hit = objectAt(pt.x, pt.y, 6);
    if (!hit || !hit.materialId){ sfx("deny"); showToast("Nothing to pick up there."); return false; }
    var m = hit.materialId;
    currentTool = m; canvas.dataset.tool = m;
    if (pmOpen) renderPersonalMenu();
    sfx("tick");
    showToast("🎨 Picked up " + matOf(m).label);
    return true;
  }

  canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    var pt = screenToWorld(e.clientX, e.clientY);
    zoomAround(pt, e.deltaY < 0 ? 1.12 : 1/1.12);
    updateViewHud();
  }, { passive:false });

  canvas.addEventListener("pointerdown", function(e){
    if (e.button === 1){
      e.preventDefault();
      // LBP's peek, Carson's way: hold the middle button on a thing and
      // that thing — the whole object, whatever layer — is hidden while
      // you hold, so you can see and reach what is behind it. On nothing,
      // the button pans as it always did.
      if (mode === "build"){
        var pkPt = screenToWorld(e.clientX, e.clientY), pkHit = objectAt(pkPt.x, pkPt.y);
        if (pkHit){ peekObj = pkHit.obj; canvas.setPointerCapture(e.pointerId); return; }
      }
      beginPan(e); canvas.setPointerCapture(e.pointerId); return;
    }
    if (e.button === 2){
      var pt = screenToWorld(e.clientX, e.clientY);
      if (mode === "build"){
        /* With a material picked, the right button CUTS — LBP's Triangle.
           Click to punch the brush's own shape out of whatever is under
           it, or drag to shave an edge; in a drag-out shape mode you drag
           out the hole instead. Every other tool keeps the right-click menu. */
        if (matOf(currentTool)){
          e.preventDefault();
          canvas.setPointerCapture(e.pointerId);
          closeObjCtxMenu();
          var snapped = snapPt(pt);
          if (paintMode !== "brush" && paintMode !== "fill"){
            shapeDrag = { a: snapped, b: snapped, square: e.shiftKey, erase: true };
            return;
          }
          pushUndo("cutting");
          painting = true; lastPaint = snapped; stroke = null;
          beginBulk();
          beginStroke(snapped, null, true, true);
          eraseStep();
          return;
        }
        if (wiring){ wiring = null; showToast("Wiring cancelled."); return; }
        var gadHit = gadgetAt(pt.x, pt.y);
        if (gadHit){ selectGadget(gadHit); opWanted = true; renderSelBar(); return; }
        var boltHit = boltAt(pt.x, pt.y);
        if (boltHit){ selectBolt(boltHit); opWanted = true; renderSelBar(); return; }
        var linkHit = linkAt(pt.x, pt.y);
        if (linkHit){ selectLink(linkHit); opWanted = true; renderSelBar(); return; }
        var hitObj = objectAt(pt.x, pt.y);
        if (hitObj){
          selectedRegion = regionAt(pt.x, pt.y);
          if (selList().indexOf(hitObj.obj) < 0) selectObject(hitObj.obj);
          renderSelBar();
          openObjCtxMenu(e.clientX, e.clientY, hitObj.obj);
        } else {
          // empty space with the Move tool: the right button moves the
          // camera, since the left one is busy rubber-banding now
          canvas.setPointerCapture(e.pointerId);
          beginPan(e);
        }
      } else if (mode === "play"){
        grabMouse = true; setGrabHeld(true);
      }
      return;
    }
    if (mode !== "build") return;
    var pt2 = screenToWorld(e.clientX, e.clientY);
    if (e.altKey){ eyedrop(pt2); return; }
    if (glueMode){ handleGlueClick(pt2); return; }
    canvas.setPointerCapture(e.pointerId);
    if (currentTool === "move"){
      var wasSel = selected;
      beginDrag(pt2, e.shiftKey);
      if (!dragging){
        // empty space → rubber-band a selection (the camera moves on the
        // middle button or a right-drag)
        if (!e.shiftKey || objectAt(pt2.x, pt2.y) === null) marquee = { a: pt2, b: pt2, add: e.shiftKey };
        return;
      }
      if (dragging.type === "object") pushUndo("move");
      else pushUndo(dragging.type === "goal" ? "moving the goal" : "moving a marker");
      if (wasSel !== selected) renderSelBar();
      return;
    }
    // A drag-out shape is one action; freehand is one action per stroke.
    if (matOf(currentTool) && paintMode === "fill"){ fillAt(pt2); return; }
    var shapeable = matOf(currentTool) && paintMode !== "brush";
    if (shapeable){
      if (matOf(currentTool).isFluid && buildLayer !== MID_LAYER){
        showToast("Water only works on the Mid layer — switch to Mid to pour it.");
        sfx("deny"); return;
      }
      var a = snapPt(pt2);
      shapeDrag = { a:a, b:a, square: e.shiftKey };
      return;
    }
    pushUndo(currentTool === "erase" ? "erasing" : (currentTool === "vacuum" ? "vacuuming water"
             : (matOf(currentTool) ? "painting " + matOf(currentTool).label : "that")));
    painting = true; lastPaint = null; stroke = null;
    beginBulk();                       // one rebuild when the stroke ends
    paintAt(pt2);
  });
  canvas.addEventListener("pointermove", function(e){
    if (camPan){ movePan(e); return; }

  /* A level built on a smaller map is placed at the bottom-left of this
     one: every world coordinate in the file moves down by the difference
     in height (and right by the difference in width, which is 0 — the map
     grew to the right). Its ground stays the ground and the new room is
     sky. Offsets (a camera's zone, a mover's line, a glide) need nothing. */
  function migrateWorldSize(data){
    var ow = +data.worldW || OLD_WORLD_W, oh = +data.worldH || OLD_WORLD_H;
    var dx = 0, dy = WORLD_H - oh;
    if (!dx && !dy) return;
    var mv = function(o, kx, ky){ if (o && isFinite(+o[kx]) && isFinite(+o[ky])){ o[kx] = +o[kx] + dx; o[ky] = +o[ky] + dy; } };
    (data.objects || []).forEach(function(os){
      if (os && Array.isArray(os.parts)) os.parts.forEach(function(pt){ mv(pt, "x", "y"); });   // a v2 level: a pile of dabs, each with its own spot
      else mv(os, "x", "y");
    });
    (data.bolts || []).forEach(function(b){ mv(b, "x", "y"); });
    (data.gadgets || []).forEach(function(g){ mv(g, "x", "y"); });
    (data.links || []).forEach(function(l){ mv(l, "ax", "ay"); mv(l, "bx", "by"); });
    (data.checkpoints || []).forEach(function(c){ mv(c, "x", "y"); });
    (data.bubbles || []).forEach(function(b){ mv(b, "x", "y"); });
    (data.blocks || []).forEach(function(b){ mv(b, "x", "y"); });
    if (data.goal) mv(data.goal, "x", "y");
    if (data.spawn) mv(data.spawn, "x", "y");
    if (data.world && data.world.waterLevel != null && isFinite(+data.world.waterLevel)) data.world.waterLevel = +data.world.waterLevel + dy;
    data.worldW = WORLD_W; data.worldH = WORLD_H;
  }
  function loadLevelData(data){
    clearAllObjects();
    if (!data || typeof data !== "object") data = {};
    var version = +data.version || 0;
    var fileW = +data.worldW || OLD_WORLD_W, fileH = +data.worldH || OLD_WORLD_H;
    migrateWorldSize(data);
    // the drawn materials it uses, before its objects need them
    if (data.materials && typeof data.materials === "object"){
      Object.keys(data.materials).forEach(function(id){ if (/^u_[A-Za-z0-9]+$/.test(id) && !customMats[id]) registerCustomMat(data.materials[id]); });
    }
    if ((version === 2 || version === 3 || version === 4) && Array.isArray(data.objects)){
      beginBulk();
      loadBudget = MAX_LEVEL_CORNERS;
      var list = data.objects.slice(0, PLACED_CAP);
      var newObjs = list.map(version === 2 ? migrateDabObject : unpackObject);
      var truncated = loadBudget <= 0;
      loadBudget = MAX_LEVEL_CORNERS;
      endBulk();
      if (truncated) showToast("That level is bigger than this build can hold — some of it was left out.");
      newObjs.forEach(function(o){ if (o) refreshObjectPhysics(o); });
      if (version === 2) showToast("Rebuilt this level's shapes as polygons — the edges are clean now.");
      /* Older levels had one motor speed for the whole world. A bolt saved
         without its own speed gets that one, so nothing changes pace. */
      var oldSpeed = data.world && data.world.motorSpeed != null ? +data.world.motorSpeed : null;
      (Array.isArray(data.bolts) ? data.bolts : []).forEach(function(bs){
        var oa = newObjs[bs.a], ob = newObjs[bs.b];
        if (oa && ob) addBolt(oa, ob, { x:+bs.x||0, y:+bs.y||0 }, bs.mode || (bs.tight ? "tight" : "loose"),
                              { layer:bs.layer, tightness:bs.tightness, speed: bs.speed != null ? bs.speed : oldSpeed,
                                kind:bs.kind, dir:bs.dir, strength:bs.strength, angle:bs.angle, period:bs.period, rest:bs.rest, visible:bs.visible, limit:bs.limit, minA:bs.minA, maxA:bs.maxA });
      });
      (Array.isArray(data.gadgets) ? data.gadgets : []).forEach(function(gs){
        var host = gs.o != null ? newObjs[gs.o] : null;
        if (host || !gadgetNeedsHost(gs.kind)) addGadget(gs.kind, host, { x:+gs.x||0, y:+gs.y||0 }, gs);
      });
        (Array.isArray(data.links) ? data.links : []).forEach(function(ls){
        var oa = newObjs[ls.a], ob = newObjs[ls.b];
        if (oa && ob) addLink(ls.kind, oa, { x:+ls.ax||0, y:+ls.ay||0 }, ob, { x:+ls.bx||0, y:+ls.by||0 }, ls);
      });
      (Array.isArray(data.wires) ? data.wires : []).forEach(function(ws){
        var src = gadgets[ws.from], tgt = ws.toBolt != null ? bolts[ws.toBolt] : (ws.toLink != null ? links[ws.toLink] : gadgets[ws.toGadget]);
        if (src && tgt) addWire(src, tgt);
      });
      if (data.world){
        worldSettings.gravity = data.world.gravity != null ? data.world.gravity : 1;
        worldSettings.waterLevel = data.world.waterLevel != null ? data.world.waterLevel : null;
        worldSettings.ropeLength = data.world.ropeLength || 220;
        worldSettings.motorSpeed = data.world.motorSpeed != null ? data.world.motorSpeed : 0.06;
        worldSettings.light = data.world.light != null ? Math.max(0, Math.min(1, +data.world.light)) : 1;
        unpackPlayerSettings(data.world);
        applyWorldSettings(); worldLiveReset();
      }
    } else if (Array.isArray(data.blocks)){
      // legacy save from before objects existed — each old block becomes its own little square
      beginBulk();
      data.blocks.slice(0, PLACED_CAP).forEach(function(bl){
        if (!bl || !matOf(bl.m) || matOf(bl.m).isFluid) return;
        var x = +bl.x, y = +bl.y, r = BRUSH_R;
        if (!isFinite(x) || !isFinite(y)) return;
        newObjectFromPoly(bl.m, [[[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r]]]],
                          bl.l != null ? bl.l : MID_LAYER);
      });
      endBulk();
    } else if (version && version !== 2 && version !== 3 && version !== 4){
      showToast("That level was saved by a newer version of the game.");
    }
    if (data.checkpoints && data.checkpoints.length){
      checkpoints = data.checkpoints.map(function(c){ return { x:c.x, y:c.y, reached:false }; });
    } else if (data.spawn){
      checkpoints = [{ x:data.spawn.x, y:data.spawn.y, reached:false }];
    } else {
      checkpoints = [{ x:90, y:700, reached:false }];
    }
    goalPoint = data.goal || null;
    bubbles = (data.bubbles||[]).map(function(b){ return { x:b.x, y:b.y, collected:false }; });
    activeCheckpoint = 0;
    unpackWaterSparse(data.water, data.waterCell != null ? +data.waterCell : 16, fileW, fileH);   // levels before the cell size was saved were built at 16
  }

  onStep("beforeUpdate", function(){
    if (mode !== "play" || !player) return;
    if (goalPoint && dist(goalPoint, player.position) < 46) levelComplete();
    bubbles.forEach(function(b){
      if (!b.collected && dist(b, player.position) < 34) collectBubble(b);
    });
    for (var i = 1; i < checkpoints.length; i++){
      var cp = checkpoints[i];
      if (!cp.reached && dist(cp, player.position) < 40){
        cp.reached = true;
        activeCheckpoint = i;
        showToast("🚩 Checkpoint!");
      }
    }
  });

  function localLevels(){
    try { return JSON.parse(localStorage.getItem("pg_local_levels") || "[]"); }
    catch(e){ return []; }
  }
  /* Which stored level this session is editing.

     Save used to call .add() unconditionally, so every press wrote a whole
     new ~165KB document and the level list filled up with copies of one
     level. Holding the id lets a save UPDATE what it saved last time.

     Two ids rather than one because the cloud and the device are separate
     stores, and a cloud save that fails falls back to the device: that is a
     fallback copy, not a change of identity, so the next save must still try
     the cloud. Null on either side means "not written there yet".

     Persisted alongside the autosave, or a reload would forget which
     document it was editing and the very next save would duplicate again —
     which is most of the original bug back. */
  var cloudLevelId = null, localLevelId = null;
  function rememberLevelIds(){
    try { localStorage.setItem("pg_level_id", JSON.stringify({ cloud: cloudLevelId, local: localLevelId })); }
    catch(e){}
  }
  function setLevelIds(cloud, local){
    cloudLevelId = cloud || null;
    localLevelId = local || null;
    rememberLevelIds();
  }
  function forgetLevelIfDeleted(id){
    if (id && (id === cloudLevelId || id === localLevelId)){
      if (id === cloudLevelId) cloudLevelId = null;
      if (id === localLevelId) localLevelId = null;
      rememberLevelIds();
    }
  }

  function saveLocalLevel(data){
    var list = localLevels(), i;
    if (localLevelId){
      for (i = 0; i < list.length; i++){
        if (list[i].id === localLevelId){
          list[i] = { id: localLevelId, data: data };
          localStorage.setItem("pg_local_levels", JSON.stringify(list.slice(0,30)));
          return;
        }
      }
    }
    localLevelId = "local_" + Date.now();
    list.unshift({ id: localLevelId, data: data });
    localStorage.setItem("pg_local_levels", JSON.stringify(list.slice(0,30)));
    rememberLevelIds();
  }

  function doSave(){
    var name = document.getElementById("levelNameInput").value.trim() || "Untitled Level";
    var data = serializeLevel(name);
    localStorage.setItem("pg_autosave", JSON.stringify(data));
    autosaveSeen = data.updatedAt; autosaveStoodBack = false;
    sfx("save");
    dbPromise.then(function(db){
      if (db){
        var rec = { name: data.name, updatedAt: data.updatedAt, payload: JSON.stringify(data) };
        var saved = function(){ showToast("Saved '"+name+"' to the cloud ☁"); };
        var fellBack = function(){ saveLocalLevel(data); showToast("Cloud save failed — saved on this device instead."); };
        if (cloudLevelId){
          /* set(), not update(): the record is the whole level, and if the
             document has gone (deleted on another device) this recreates it
             rather than failing. */
          db.collection("levels").doc(cloudLevelId).set(rec).then(saved).catch(fellBack);
        } else {
          db.collection("levels").add(rec).then(function(ref){
            if (ref && ref.id){ cloudLevelId = ref.id; rememberLevelIds(); }
            saved();
          }).catch(fellBack);
        }
      } else {
        saveLocalLevel(data);
        showToast("Saved '"+name+"' on this device.");
      }
    });
  }
  function doNew(){
    askConfirm("Start a brand new level? Unsaved changes will be lost.", function(){
      starterLevel();
      document.getElementById("levelNameInput").value = "Untitled Level";
      /* A new level is not the old one — drop the ids or the first save
         would overwrite whatever was last open. */
      setLevelIds(null, null);
      showToast("New level started.");
      buildFrozen = snapshotFull();
    });
  }

  var loadOverlay = document.getElementById("loadOverlay");
  var levelListEl = document.getElementById("levelList");
  function openLoad(){
    loadOverlay.hidden = false;
    levelListEl.innerHTML = '<div class="empty-note">Loading…</div>';
    renderLevelList();
  }
  document.getElementById("closeLoad").addEventListener("click", function(){ loadOverlay.hidden = true; });

  function renderLevelList(){
    dbPromise.then(function(db){
      var localList = localLevels();
      var finish = function(cloudRows){
        levelListEl.innerHTML = "";
        var all = cloudRows.concat(localList.map(function(l){
          return { id:l.id, name:l.data.name, updatedAt:l.data.data ? l.data.data.updatedAt : l.data.updatedAt, local:true, raw:l.data };
        }));
        if (!all.length){ levelListEl.innerHTML = '<div class="empty-note">No saved levels yet — build something and press Ctrl+S!</div>'; return; }
        all.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
        all.forEach(function(row){ levelListEl.appendChild(levelRowEl(row)); });
      };
      if (db){
        db.collection("levels").orderBy("updatedAt","desc").limit(40).get().then(function(snap){
          var cloudRows = snap.docs.map(function(d){
            var data = d.data();
            return { id:d.id, name:data.name, updatedAt:data.updatedAt, payload:data.payload, cloud:true };
          });
          finish(cloudRows);
        }).catch(function(){ finish([]); });
      } else {
        finish([]);
      }
    });
  }

  function levelRowEl(row){
    var el = document.createElement("div");
    el.className = "levelRow";
    var when = row.updatedAt ? timeAgo(row.updatedAt) : "";
    el.innerHTML =
      '<div class="lname">'+escapeHtml(row.name || "Untitled")+'</div>'+
      '<div class="ldate">'+(row.cloud?"☁ ":"💾 ")+when+'</div>'+
      '<button class="btn small">Load</button>'+
      '<button class="btn small red">✕</button>';
    el.querySelector(".btn.small:not(.red)").addEventListener("click", function(){
      var data = row.cloud ? JSON.parse(row.payload) : row.raw;
      loadLevelData(data);
      /* From here on this session is editing THAT stored level, so saving
         updates it in place instead of leaving a copy behind. */
      setLevelIds(row.cloud ? row.id : null, row.cloud ? null : row.id);
      document.getElementById("levelNameInput").value = data.name || "Untitled Level";
      loadOverlay.hidden = true;
      setMode("build");
      buildFrozen = snapshotFull();
      showToast("Loaded '"+(data.name||"level")+"'");
    });
    el.querySelector(".btn.red").addEventListener("click", function(){
      askConfirm("Delete '"+(row.name||"this level")+"'?", function(){
        /* If this session was editing what just got deleted, stop pointing at
           it — otherwise the next save would silently resurrect it. */
        forgetLevelIfDeleted(row.id);
        if (row.cloud){
          dbPromise.then(function(db){
            if (db) db.collection("levels").doc(row.id).delete().then(renderLevelList);
          });
        } else {
          var list = localLevels().filter(function(l){ return l.id !== row.id; });
          localStorage.setItem("pg_local_levels", JSON.stringify(list));
          renderLevelList();
        }
      });
    });
    return el;
  }
  function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function timeAgo(ts){
    var s = Math.floor((Date.now()-ts)/1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60)+"m ago";
    if (s < 86400) return Math.floor(s/3600)+"h ago";
    return Math.floor(s/86400)+"d ago";
  }

  /* The autosave, and the one thing that can quietly lose work: two tabs.
     Every open tab of the game wrote pg_autosave every 15 seconds, so a
     second tab — an older one left open in the background, say — kept
     writing its stale copy of the level over the one being worked on,
     and the next reload came up with whichever tab had written last.
     Carson: "did you revert way back to an old save?"

     So a tab only autosaves while it holds the autosave: `autosaveSeen`
     is the stamp of the last autosave this tab loaded or wrote, and a
     newer stamp in storage means another tab is writing. While that
     other tab is alive — its write within AUTOSAVE_OTHER_MS — this one
     stands back and says so, once; a tab that has been quiet longer than
     that is closed, and this one takes over. `doSave` (the Save button)
     always writes: that is you, on purpose. */
  var AUTOSAVE_MS = 15000, AUTOSAVE_OTHER_MS = 90000, autosaveSeen = 0, autosaveStoodBack = false;
  function autosaveNow(){
    if (mode !== "build" || !objects.length) return false;
    var other = null;
    try { other = JSON.parse(localStorage.getItem("pg_autosave") || "null"); } catch(e){ other = null; }
    var otherAt = other && +other.updatedAt || 0;
    if (otherAt > autosaveSeen && Date.now() - otherAt < AUTOSAVE_OTHER_MS){
      if (!autosaveStoodBack){ autosaveStoodBack = true; showToast("This level is open in another tab, which is doing the saving — close one of them."); }
      return false;
    }
    var data = serializeLevel(document.getElementById("levelNameInput").value || "Untitled Level");
    localStorage.setItem("pg_autosave", JSON.stringify(data));
    autosaveSeen = data.updatedAt;
    if (autosaveStoodBack){ autosaveStoodBack = false; showToast("Autosaving here again."); }
    return true;
  }
  setInterval(autosaveNow, AUTOSAVE_MS);

  (function restoreAutosave(){
    /* Pick the level identity back up before anything can save, so a reload
       carries on editing the same document instead of forking a copy. */
    try {
      var ids = JSON.parse(localStorage.getItem("pg_level_id") || "null");
      if (ids){ cloudLevelId = ids.cloud || null; localLevelId = ids.local || null; }
    } catch(e){}
    try {
      var raw = localStorage.getItem("pg_autosave");
      if (raw){
        var data = JSON.parse(raw);
        if (data && ((data.objects && data.objects.length) || (data.blocks && data.blocks.length))){
          loadLevelData(data);
          document.getElementById("levelNameInput").value = data.name || "Untitled Level";
          autosaveSeen = +data.updatedAt || 0;
        }
      }
    } catch(e){}
    // whatever we ended up with at boot (starter level or a restored
    // autosave) becomes the anchor Build snapshot / history root.
    buildFrozen = snapshotFull();
  })();

})();
</script>
