<script>
/* ============================================================
   POLYGON GEOMETRY CORE
   ------------------------------------------------------------
   Every painted shape in the game is a real polygon, the way
   LittleBigPlanet stores material: a flat list of corners split
   into loops (one outer contour plus any number of holes), and
   painting, erasing and cutting are boolean union and difference
   on those contours. Not a pile of circles.

   Types, matching polygon-clipping's own:
     Ring       [[x,y], ...]        implicitly closed, no repeated last point
     Poly       [outer, hole, ...]
     MultiPoly  [Poly, ...]         each Poly is one CONNECTED piece

   Winding convention, enforced by pgClean and relied on everywhere:
     outer rings have POSITIVE shoelace, holes NEGATIVE.
   That makes canvas `fill()` (nonzero) do the right thing with
   holes for free, and it is also the order Matter.js wants its
   body vertices in (checked against Bodies.rectangle).
   ============================================================ */

    var s = 0, n = r.length, i, a, b;
    for (i = 0; i < n; i++){

    }
    return s;
  }

    var s = 0, i, j, p;
    for (i = 0; i < mp.length; i++){

    }
    return s / 2;
  }
  function pgVertexCount(mp){
    var n = 0, i, j;
    for (i = 0; i < mp.length; i++)
      for (j = 0; j < mp[i].length; j++) n += mp[i][j].length;
    return n;
  }
  function pgBounds(mp){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var i, j, k, r, v;
    for (i = 0; i < mp.length; i++)
      for (j = 0; j < mp[i].length; j++){
        r = mp[i][j];
        for (k = 0; k < r.length; k++){
          v = r[k];
          if (v[0] < minX) minX = v[0];
          if (v[0] > maxX) maxX = v[0];
          if (v[1] < minY) minY = v[1];
          if (v[1] > maxY) maxY = v[1];
        }

  }
  // Area centroid of a single ring. Matter.js recentres a body's vertices
  // on their AREA centroid, so handing it this exact point as the body's
  // position leaves the vertices precisely where we put them.
  function ringCentroid(r){
    var cx = 0, cy = 0, a2 = 0, n = r.length, i, p, q, cr;
    for (i = 0; i < n; i++){
      p = r[i]; q = r[(i+1) % n];
      cr = p[0]*q[1] - q[0]*p[1];
      a2 += cr; cx += (p[0]+q[0])*cr; cy += (p[1]+q[1])*cr;

    for (i = 0; i < mp.length; i++)

        for (k = 0; k < n; k++){

        }

  var MIN_RING_AREA = 6;      // px^2 — below this a fragment is a speck
  var MIN_PIECE_AREA = 20;    // px^2 — below this a whole island is noise

  function pgClean(mp, tol){
    if (!mp || !mp.length) return [];
    tol = (tol == null) ? 0.55 : tol;
    var out = [], i, j;
    for (i = 0; i < mp.length; i++){

        var r = poly[j];
        // polygon-clipping closes its rings (last == first); drop the repeat

<script>
(function(){
  "use strict";

  /* ============================================================
     0. Capability bootstrap (db).
     ============================================================ */

  });
  setTimeout(function(){
    if (cloudStatusEl.textContent.indexOf("checking") !== -1){

    }
  }, 4000);

  /* ============================================================
     1. Constants & materials
     ============================================================ */
  var WORLD_W = 4800, WORLD_H = 2400;
  var VIEW_W = 1400, VIEW_H = 800;
  var START_FLOOR_W = 1600;
  var PLACED_CAP = 1500;
  var BLOCK = 30;
  var BRUSH_R = BLOCK / 2;
  var BRUSH_SPACING = BRUSH_R * 0.85;
  var FUSE_R = BRUSH_R * 2.6; // painting within this of an existing object grows it instead of starting a new one

  // Most materials are dynamic now — real weight, real gravity — the
  // way LBP objects behave until you anchor them. Dark Matter is the
  // one material that has no gravity at all: paint it into (or attach
  // it to) any object and the WHOLE object becomes fixed in place.
  var MATERIALS = {
    wood:      { label:"Timber",       color:"#9C6B3E", dark:"#6E4A29", friction:0.9, restitution:0.05, density:0.006, ropeable:false, hazard:false, floatForce:0, tex:"grain" },
    sponge:    { label:"Grip Sponge",  color:"#D9DD6B", dark:"#9BA23A", friction:0.95,restitution:0.1,  density:0.004, ropeable:true,  hazard:false, floatForce:0, tex:"dots" },
    rubber:    { label:"Bounce",       color:"#E8567A", dark:"#B33455", friction:0.6, restitution:1.05, density:0.004, ropeable:false, hazard:false, floatForce:0, tex:"shine" },
    metal:     { label:"Heavy Metal",  color:"#98A3B3", dark:"#5F6975", friction:0.5, restitution:0.02, density:0.03,  ropeable:false, hazard:false, floatForce:0, tex:"rivets" },
    ice:       { label:"Ice",          color:"#BEE7F2", dark:"#7FB9CE", friction:0.02,restitution:0.05, density:0.005, ropeable:false, hazard:false, floatForce:0, tex:"crystal" },
    dissolve:  { label:"Dissolve",     color:"#C9C2B4", dark:"#8B8374", friction:0.8, restitution:0.05, density:0.005, ropeable:false, hazard:false, floatForce:0, tex:"dashed", dissolve:true },
    floaty:    { label:"Floaty",       color:"#8ED0E8", dark:"#4E9CBB", friction:0.3, restitution:0.4,  density:0.0018,ropeable:false, hazard:false, floatForce:2.1, tex:"bubble" },
    hazard:    { label:"Zap Hazard",   color:"#F2B705", dark:"#1A1A1A", friction:0.8, restitution:0.1,  density:0.005, ropeable:false, hazard:true,  floatForce:0, warn:true },
    darkmatter:{ label:"Dark Matter",  color:"#3A2E52", dark:"#1C1630", friction:0.6, restitution:0,    density:0.01,  ropeable:false, hazard:false, floatForce:0, isDarkMatter:true },
    // See-through, and it doesn't hide what's behind it on any layer.
    glass:     { label:"Glass",        color:"#C7EAF2", dark:"#6FA6B8", friction:0.25,restitution:0.2,  density:0.006, ropeable:false, hazard:false, floatForce:0, glass:true },
    // Not a solid at all: it glows, it holds itself up, and you walk
    // straight through it. Turn the world light down and it comes into
    // its own.
    light:     { label:"Light",        color:"#FFE9A8", dark:"#E0B34A", friction:0.4, restitution:0.1,  density:0.002, ropeable:false, hazard:false, floatForce:0, emitter:true },
    // Water is not a solid at all — painting it pours into the fluid
    // grid instead of building a body. Its density is what everything
    // else floats or sinks against.
    water:     { label:"Water",        color:"#4FA9D6", dark:"#2F86A6", friction:0.02,restitution:0,    density:0.009, ropeable:false, hazard:false, floatForce:0, tex:"wave", isFluid:true }
  };
  var MATERIAL_ORDER = ["wood","sponge","rubber","metal","ice","dissolve","floaty","hazard","darkmatter","glass","light","water"];

  /* ---- Colour ---------------------------------------------------------
     Every material can be painted in any of these. It keeps all of its
     physics and simply comes out the colour you picked — and, the way
     LittleBigPlanet does it, the SAME material in a DIFFERENT colour
     counts as a different material while you build: the two sit beside
     each other and cut each other instead of merging, which is the only
     way to draw detail into a shape without losing it.

     A material key is therefore "<base>" for the natural colour, or
     "<base>:<n>" for swatch n. Everything downstream reads the key
     through matOf(), so a colour costs nothing to store and a level
     written before colours existed still loads: a bare "wood" is just
     wood in its natural colour.
     -------------------------------------------------------------------- */
  var MAT_COLORS = [
    "#FFFFFF","#EDE6D6","#CFC7B6","#A39B8B","#6E6759","#413B32","#1E1B16",
    "#F7C9A0","#F2A65A","#E07B39","#C1541F","#F49A9A","#DE5B5B","#A83232",
    "#BEE7F2","#7FC7E8","#3F9BD1","#2A6FA8","#C9B8FF","#9B7FE0","#6B4FB0",

  ];
  var MAT_COLOR_NAMES = [
    "White","Bone","Ash","Stone","Slate","Charcoal","Ink",
    "Peach","Apricot","Amber","Rust","Blush","Coral","Brick",
    "Ice","Sky","Cobalt","Deep","Lilac","Violet","Plum",
    "Meadow","Lime","Fern","Forest","Cream","Gold","Bronze"
  ];
  // Darker (f < 0) or lighter (f > 0) — used to derive an edge colour for
  // whatever colour someone picks, so bevels stay right automatically.
  function shadeHex(hex, f){
    var v = parseInt(hex.slice(1), 16);
    var r = (v>>16)&255, g = (v>>8)&255, b = v&255;
    if (f < 0){ r = Math.round(r*(1+f)); g = Math.round(g*(1+f)); b = Math.round(b*(1+f)); }

  }
  function matBase(key){ var c = (key||"").indexOf(":"); return c > 0 ? key.slice(0, c) : (key||""); }

  function matOf(key){
    if (!key || typeof key !== "string") return null;

    if (!b){ _matCache[key] = null; return null; }

    for (k in b) rec[k] = b[k];

    rec.dark = shadeHex(col, -0.36);
    rec.base = base; rec.tint = tint;
    rec.label = b.label + " · " + MAT_COLOR_NAMES[tint-1];
    _matCache[key] = rec;
    return rec;
  }
  /* 1-4 are the tools you reach for constantly while building. 5-9 stay
     on the materials you reach for most, so nothing was taken away. */
  var QUICK_TOOLS = [
    { id:"move",  label:"Move & Select" },
    { id:"erase", label:"Erase" },
    { id:"bolt",  label:"Bolt & Motor" },
    { id:"checkpoint", label:"Checkpoint" }
  ];

  var DISSOLVE_MS = 650;
  var WATER_DENSITY = MATERIALS.water.density;

  // Plain-language explanations shown in the personal menu's Info tab —
  // kept separate from the physics numbers above so the tutorial text
  // reads naturally instead of dumping raw material stats.
  var MATERIAL_INFO = {
    wood:       "Sturdy, reliable, and grippy — a great default building block. Medium weight, high friction, barely bounces.",
    sponge:     "Extra grippy, and the only material your grapple rope can latch onto in Play mode. Light and very high friction.",
    rubber:     "Springy — objects rebound hard off it. Low friction so things slide around, but they'll bounce while they do it.",
    metal:      "By far the heaviest material. Makes a great stable anchor or wrecking weight, but it's slippery and barely bounces.",
    ice:        "Nearly frictionless — anything touching it slides freely. Good for slippery slopes and skating puzzles.",
    dissolve:   "Crumbles away a moment after something steps on it in Play mode, then disappears. Always resets back when you return to Build.",
    floaty:     "Buoyant — constantly pushes itself (and anything attached) upward. Great for balloons, floats, or slow-fall platforms.",
    hazard:     "Zaps and instantly respawns the player on contact in Play mode. Handle with care.",
    darkmatter: "The only solid with no gravity. Fuse it into or attach it to any object and the whole object becomes fixed in place — the standard way to anchor a level's structure.",
    glass:      "See-through, and it doesn't hide what's behind it — on any layer. Solid enough to stand on and slightly slippery. Build windows, tanks and greenhouses, or lay a sheet over your decoration to glaze it.",
    light:      "A glow rather than a solid: it holds itself up, and you walk straight through it. On its own it stays put; painted into something else it comes along for the ride. Turn World Light down in World Settings and your lights are what you'll see by — and a light takes colour like any other material, so you can light a level any way you want.",
    water:      "Real flowing water. Pour it anywhere and it falls, runs downhill, spreads out and pools at the lowest point it can reach, held in by whatever you've built. Only lives on the Mid layer. Timber, Sponge, Bounce, Ice and Floaty bob on top of it; Heavy Metal sinks. For a whole flooded world instead, use World Water in World Settings."
  };
  var TOOL_INFO = [
    ["move","🕹","Move & Select","Click anything you've built to select it — a bar appears above it to rotate, flip, duplicate, anchor, change its layer, save or delete it. Drag it to move it. DRAG ACROSS EMPTY SPACE to rubber-band everything it touches: the whole group then turns, copies, anchors and deletes as one, and rotating turns it about the group's own middle. Shift-click adds or removes one piece, and Shift-drag adds a whole band. To move the camera instead, middle-drag, or right-drag on empty space."],
    ["shape","▭","Drag-out shapes","On the Materials tab, switch 'Draw with' from Freehand to Rectangle, Ellipse or Triangle. Then drag out the shape at the size you want and let go — it arrives as one exact piece, corners and all. Hold Shift to keep it regular."],
    ["grid","▦","Grid snap","Press G (or the ▦ chip) to snap everything you place to a grid, so walls line up and platforms sit level. The size is in Settings."],
    ["stick","🔒","Sticks in place","Everything you paint is a real object with real weight, so a wall drawn in mid-air will topple over. Switch the Materials tab to 'Sticks in place' and new pieces stay exactly where you put them instead — then release the ones you want to move with the 🔓 on their own toolbar."],
    ["bolt","🔩","Bolt & Motor","Click a point between two nearby objects to pin them together. Right-click a placed bolt to cycle it: Tight (rigid), Loose (wobbly), Motor ↻ and Motor ↺ — a motor spins whatever is attached, which is how you build wheels, windmills and rotating platforms. Motors turn in Play only."],
    ["glue","🧵","Glue","Hold Tab, then click two different objects one after another to permanently weld them into a single object."],
    ["spawn","🏁","Start","Sets the player's spawn point — where you begin when you switch to Play mode."],
    ["checkpoint","🚩","Checkpoint","Respawn points along the level. Touching one in Play mode makes it your new spawn point."],
    ["bubble","💠","Bubble","Collectible score bubbles. Grab several in a quick chain for a combo multiplier."],
    ["goal","🏆","Goal","Reach it in Play mode to complete the level."],
    ["cut","✂","Right-click to cut","With a material picked, the RIGHT mouse button cuts instead of painting — LittleBigPlanet's Triangle. Click to punch the brush's own shape clean out of whatever is under it, or drag to shave an edge; in a drag-out shape mode, right-drag to cut that rectangle, ellipse or triangle out instead. It only touches the layer you're building on, so it can't eat the decoration behind your work. Cut all the way through and the two halves become separate objects."],
    ["hole","◎","Holes","Paint one material inside another and it carves a socket for itself. Delete that inner piece — click it with the Move tool and press Del — and you're left with a real hole in the outer shape, edges and all."],
    ["erase","🧹","Erase","Cuts painted material away — click or drag over what you want gone and it takes exactly the shape you swept, down to the pixel. Cut a shape clean in half and the two halves become separate objects. Mops up water too. Lives on the Materials tab."],
    ["undo","↶","Undo & Redo","Ctrl+Z takes back your last edit — a stroke, a shape, a move, a rotation, a glue, a delete — however long ago you made it, and the toast tells you exactly what it undid. Ctrl+Y puts it back. Forty steps deep, and the ↶ ↷ buttons top right do the same thing."],

    ["keys","⌨","1 to 9","1-4 are your tools — Move, Erase, Bolt, Checkpoint. 5-9 drop straight onto the five materials you'll reach for most: Timber, Grip Sponge, Bounce, Heavy Metal and Ice. In Play mode 1-4 pull faces instead."]
  ];

  var CHAR_COLORS = ["#E8567A","#2F86A6","#F2B705","#5F9E5A","#C89BD9","#F27E42"];

  // ---- Character creator: a small pixel-art pose editor. "Simple"
  // characters draw one pose (still wobbles + flips to face the way
  // you move, same as the plain default look); "Animated" characters
  // get a pose per movement state plus four emotes you can trigger
  // with 1/2/3/4.
  var CHAR_PALETTE = ["#E8567A","#2F86A6","#F2B705","#5F9E5A","#C89BD9","#F27E42","#2B1B12","#FFFFFF","#F2D6B3","#6E4A29"];
  var ANIM_STATES = [
    { id:"idle",  label:"Idle",  frames:2, emoji:"🙂" },
    { id:"run",   label:"Run",   frames:2, emoji:"🏃" },
    { id:"jump",  label:"Jump",  frames:1, emoji:"⬆️" },
    { id:"fall",  label:"Fall",  frames:1, emoji:"⬇️" },
    { id:"swing", label:"Swing", frames:1, emoji:"🤾" },
    { id:"happy", label:"Happy", frames:1, emoji:"😄" },
    { id:"sad",   label:"Sad",   frames:1, emoji:"😢" },
    { id:"angry", label:"Angry", frames:1, emoji:"😠" },
    { id:"bored", label:"Bored", frames:1, emoji:"😐" }
  ];
  var EMOTE_KEYS = { "1":"happy", "2":"sad", "3":"angry", "4":"bored" };
  var CHAR_MAX_FRAMES = 12;

  /* ---- Character art model -------------------------------------------
     A drawing is a list of SMOOTH BRUSH STROKES, not a pixel grid, so
     the character editor paints the same way the level does. Every
     coordinate is normalised 0..1 inside the drawing's own box, which
     means one drawing renders crisply at any character size, in any
     preview thumbnail, and on the big editor canvas — nothing is ever
     resampled from a fixed pixel resolution.
       stroke = { c: "#rrggbb" (null = eraser), w: width as a fraction
                  of the box height, p: [x0,y0, x1,y1, ...] }
     -------------------------------------------------------------------- */
  function blankDrawing(){ return []; }
  function drawingHasArt(d){ return !!d && d.length > 0; }
  // Old saves stored a flat pixel grid. Rather than throw away art
  // somebody already drew, every filled cell becomes one round dab.
  function pixelsToStrokes(arr, gw, gh){
    var out = [];
    if (!Array.isArray(arr)) return out;
    for (var row = 0; row < gh; row++){
      for (var col = 0; col < gw; col++){
        var c = arr[row*gw + col];
        if (!c || typeof c !== "string") continue;
        out.push({ c:c, w: 1.5/gh, p:[ (col+0.5)/gw, (row+0.5)/gh ] });
      }
    }
    return out;
  }
  function normalizeDrawing(d, gw, gh){
    if (Array.isArray(d) && d.length && (typeof d[0] === "string" || d[0] === null)) return pixelsToStrokes(d, gw, gh);
    if (!Array.isArray(d)) return blankDrawing();
    return d.filter(function(s){ return s && Array.isArray(s.p) && s.p.length >= 2; });
  }
  // Paint a drawing into any 2D context, scaled to a w x h box.
  function paintDrawing(c2d, strokes, w, h){
    if (!strokes || !strokes.length) return;
    c2d.save();
    c2d.lineJoin = "round"; c2d.lineCap = "round";
    for (var i = 0; i < strokes.length; i++){
      var s = strokes[i], pts = s.p;
      if (!pts || pts.length < 2) continue;
      c2d.globalCompositeOperation = s.c ? "source-over" : "destination-out";
      c2d.strokeStyle = s.c || "#000";
      c2d.lineWidth = Math.max(0.6, (s.w || 0.1) * h);
      c2d.beginPath();
      c2d.moveTo(pts[0]*w, pts[1]*h);
      if (pts.length === 2) c2d.lineTo(pts[0]*w + 0.01, pts[1]*h); // a single tap is a dot
      else for (var j = 2; j < pts.length; j += 2) c2d.lineTo(pts[j]*w, pts[j+1]*h);
      c2d.stroke();
    }
    c2d.restore();
  }
  // Rasterise once and reuse — the game render would otherwise re-stroke
  // every path of every limb on every frame. Bumping _rev invalidates it.
  // These bookkeeping keys are non-index properties on an array, so
  // JSON.stringify still serialises the strokes alone.
  function touchDrawing(strokes){ if (strokes) strokes._rev = (strokes._rev || 0) + 1; }
  function drawingCanvas(strokes, w, h){
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    var key = w + "x" + h + ":" + (strokes._rev || 0);
    if (strokes._cvs && strokes._key === key) return strokes._cvs;
    var cv = strokes._cvs || document.createElement("canvas");
    cv.width = w; cv.height = h;
    var c2 = cv.getContext("2d");
    c2.clearRect(0, 0, w, h);
    paintDrawing(c2, strokes, w, h);
    strokes._cvs = cv; strokes._key = key;
    return cv;
  }

  };

  // Character-editor brush: a real round brush now, sized as a fraction
  // of the drawing box's height so it means the same thing at any zoom.
  var CE_BRUSH_MIN = 0.02, CE_BRUSH_MAX = 0.42;

    { id:"circle", label:"● Round" },
    { id:"square", label:"■ Square" },
    { id:"diamond",label:"◆ Diamond" }
  ];

  var PAINT_SCALE_MIN = 0.3, PAINT_SCALE_MAX = 16;   // 9px to 480px across
  /* How the brush lays material down. "brush" is freehand — drag and it
     smears. The other three are the LittleBigPlanet way round: you drag
     out the shape you want at the size you want and let go, and it
     appears in one piece. Most real building is done with those. */
  var PAINT_MODES = [

  }
  function pieceOf(obj, materialId){
    for (var i = 0; i < obj.pieces.length; i++) if (obj.pieces[i].m === materialId) return obj.pieces[i];
    return null;
  }

  // Local (the object's own frame) <-> world.
  function objToWorld(obj, mp){
    var b = obj.body;
    return pgTransform(mp, b.angle, b.position.x, b.position.y);
  }
  function objToLocal(obj, mp){
    var b = obj.body;
    return pgTransform(pgTranslate(mp, -b.position.x, -b.position.y), -b.angle, 0, 0);
  }
  function worldPtToLocal(obj, x, y){
    var b = obj.body, c = Math.cos(-b.angle), s = Math.sin(-b.angle);
    var dx = x - b.position.x, dy = y - b.position.y;
    return { x: dx*c - dy*s, y: dx*s + dy*c };
  }
  function localPtToWorld(obj, x, y){
    var b = obj.body, c = Math.cos(b.angle), s = Math.sin(b.angle);
    return { x: x*c - y*s + b.position.x, y: x*s + y*c + b.position.y };
  }

  // One convex physics part, from a ring already in world coordinates.
  function makePart(materialId, ring){
    var mat = matOf(materialId);
    var verts = new Array(ring.length), i;
    for (i = 0; i < ring.length; i++) verts[i] = { x: ring[i][0], y: ring[i][1] };
    // Matter recentres a body's vertices on their AREA centroid, so
    // handing it exactly that point leaves them where we put them.
    var c = ringCentroid(ring);
    var body = Body.create({
      position: { x: c.x, y: c.y }, vertices: verts,
      friction: mat.friction, restitution: mat.restitution, density: mat.density,
      frictionAir: 0.006, label: "part:" + materialId
    });
    body.plugin = { materialId: materialId, dissolving:false, dissolveStart:0 };
    return body;
  }

  // Recompute the compound-level physical properties from the regions
  // it's made of (weighted by real area) and re-apply everything Matter
  // reads only from the top level: friction, restitution,
  // collisionFilter, isStatic/isSensor.
  // Matter's Body.setStatic stashes a body's real mass/inertia in
  // `_original` on the way to static, and restores it on the way back.
  // Calling it with `true` on something ALREADY static overwrites that
  // stash with the Infinity placeholders, so the eventual restore hands
  // back an infinite mass and every later position works out to NaN.
  // Never call it unless the state is actually changing.
  function setBodyStatic(body, v){
    if (body.isStatic === !!v) return;
    Body.setStatic(body, !!v);
  }
  function refreshObjectPhysics(obj){
    if (!obj.body) return;                 // still waiting on a batched rebuild
    var hasDark = false, totalArea = 0, fr = 0, re = 0, i;
    // Light has no body, so it lends the object neither weight nor grip.
    // A shape made ONLY of light holds itself up and is walked straight
    // through; light painted into something solid just comes along.
    var allGlow = obj.pieces.length > 0;
    for (i = 0; i < obj.pieces.length; i++){
      var pc = obj.pieces[i], mat = matOf(pc.m) || MATERIALS.wood;
      if (mat.isDarkMatter) hasDark = true;
      if (!mat.emitter) allGlow = false;
      // a glow weighs nothing and grips nothing unless you make it solid
      if (mat.emitter && !obj.lightSolid) continue;
      var area = Math.abs(pgArea(pc.poly));
      totalArea += area; fr += mat.friction*area; re += mat.restitution*area;
    }
    obj.allGlow = allGlow;
    obj.darkMatter = hasDark || obj.forcedStatic;
    // Light holds itself up unless you tell it not to.
    obj.holdsStill = obj.darkMatter || (allGlow && !obj.lightFalls);
    if (totalArea > 0){ obj.body.friction = fr/totalArea; obj.body.restitution = re/totalArea; }
    var decorative = obj.layer !== MID_LAYER;
    obj.decorative = decorative;
    // `drawing` holds a shape completely still while the stroke that is
    // creating it is still in progress — nothing you are mid-way through
    // painting should sag, roll away or explode out from under the brush.
    // It goes live the moment the mouse button comes up.
    setBodyStatic(obj.body, (decorative || obj.drawing) ? true : !!obj.holdsStill);
    var ghost = decorative || (allGlow && !obj.lightSolid);
    obj.body.isSensor = ghost;
    obj.body.collisionFilter = ghost ? { category: CAT_LAYER[obj.layer], mask: 0, group: 0 } : layerFilter(obj.layer);
    obj.body.label = "object";
  }

  /* ---- Batched rebuilds ------------------------------------------------
     Rebuilding is O(the whole object) — decompose every region, build a
     fresh compound — so anything that edits several objects in a row
     (loading a level, undo, a stroke that welds five pieces together)
     says so first and pays for one rebuild each at the end instead of
     one per step. Everything in between still reads correctly, because
     obj.pieces is updated immediately and that is what the renderer,
     hit-testing and the fuse search all use. Only the physics body
     lags, and every batched operation either freezes the object first
     or is rebuilding the world anyway.
     -------------------------------------------------------------------- */
  var bulkList = null;
  function beginBulk(){ if (!bulkList) bulkList = []; }
  function endBulk(){
    if (!bulkList) return;
    var list = bulkList;
    bulkList = null;                       // rebuild for real from here on
    for (var i = 0; i < list.length; i++){
      var o = list[i];
      o._bulkPending = false;
      if (objects.indexOf(o) >= 0) rebuildFromPieces(o);
    }
  }

  /* Build the Matter compound from obj.pieces.

     The rotation the body has accumulated is baked into the stored
     polygons and the body's angle resets to zero, so "local" always
     means "relative to body.position, rotated by body.angle" and both
     halves stay consistent however many times an object is rebuilt
     mid-spin. Velocity, spin, bolts and the rope are carried across to
     the new body so growing something mid-fall doesn't visibly hitch.

     (Growing an already-in-world compound with Body.setParts has a real
     bug in this Matter build — it recentres from the new parts' absolute
     positions and then translates by that same amount again, silently
     breaking collision. Building fresh sidesteps it entirely.) */
  function rebuildFromPieces(obj, frame){
    if (frame) obj._frame = frame;      // survives a deferred rebuild
    if (bulkList){
      if (!obj._bulkPending){ obj._bulkPending = true; bulkList.push(obj); }
      obj.geomRev = (obj.geomRev || 0) + 1;
      return true;
    }
    var oldBody = obj.body;
    frame = obj._frame; obj._frame = null;
    var frameA = frame ? frame.a : (oldBody ? oldBody.angle : 0);
    var frameX = frame ? frame.x : (oldBody ? oldBody.position.x : 0);
    var frameY = frame ? frame.y : (oldBody ? oldBody.position.y : 0);

    // Move every region into world space once, and drop anything that
    // cleaned away to nothing.
    var live = [], i, k;
    for (i = 0; i < obj.pieces.length; i++){
      var pc = obj.pieces[i];
      if (!pc.poly || !pc.poly.length) continue;
      live.push({ m: pc.m, world: pgTransform(pc.poly, frameA, frameX, frameY) });
    }
    if (!live.length){ removeObject(obj); return false; }

    var parts = [];
    if (obj.layer !== MID_LAYER){
      // Decoration is a sensor with an empty collision mask — it never
      // touches anything — so one box is all the physics has to carry,
      // however intricate the drawing is.
      var wb = null;
      for (i = 0; i < live.length; i++){
        var lb = pgBounds(live[i].world);
        if (!lb) continue;
        if (!wb) wb = { x:lb.x, y:lb.y, x2:lb.x2, y2:lb.y2 };
        else {
          if (lb.x < wb.x) wb.x = lb.x; if (lb.y < wb.y) wb.y = lb.y;
          if (lb.x2 > wb.x2) wb.x2 = lb.x2; if (lb.y2 > wb.y2) wb.y2 = lb.y2;
        }
      }
      if (!wb || wb.x2 - wb.x < 0.5 || wb.y2 - wb.y < 0.5){ removeObject(obj); return false; }
      parts.push(makePart(live[0].m, [[wb.x,wb.y],[wb.x2,wb.y],[wb.x2,wb.y2],[wb.x,wb.y2]]));
      obj.decorative = true;
    } else {
      for (i = 0; i < live.length; i++){
        var lm = matOf(live[i].m);
        if (lm && lm.emitter && !obj.lightSolid) continue;   // a glow gets no collision
        var simp = pgClean(live[i].world, PHYS_TOL);
        var cps = pgConvexParts(simp.length ? simp : live[i].world);
        for (k = 0; k < cps.length; k++) parts.push(makePart(live[i].m, cps[k]));
        if (parts.length > MAX_PHYS_PARTS) break;
      }
      if (!parts.length){
        // nothing but light — it still needs a body so it has a position,
        // bounds to cull against and something to select
        var gb = null;
        for (i = 0; i < live.length; i++){
          var eb = pgBounds(live[i].world);
          if (!eb) continue;
          if (!gb) gb = { x:eb.x, y:eb.y, x2:eb.x2, y2:eb.y2 };
          else {
            if (eb.x < gb.x) gb.x = eb.x; if (eb.y < gb.y) gb.y = eb.y;
            if (eb.x2 > gb.x2) gb.x2 = eb.x2; if (eb.y2 > gb.y2) gb.y2 = eb.y2;
          }
        }
        if (gb && gb.x2 - gb.x > 0.5 && gb.y2 - gb.y > 0.5)
          parts.push(makePart(live[0].m, [[gb.x,gb.y],[gb.x2,gb.y],[gb.x2,gb.y2],[gb.x,gb.y2]]));
      }
    }
    if (!parts.length){ removeObject(obj); return false; }

    var newBody = Body.create({ parts: parts.slice() });
    newBody.plugin = { isObject:true, obj:obj };
    var vel = oldBody ? { x: oldBody.velocity.x, y: oldBody.velocity.y } : { x:0, y:0 };
    var angVel = oldBody ? oldBody.angularVelocity : 0;
    var wasStatic = oldBody ? oldBody.isStatic : false;
    if (oldBody) World.remove(world, oldBody);
    obj.body = newBody;
    World.add(world, newBody);
    // re-express the regions in the new frame; the old rotation is now
    // part of the polygon, and the body starts square again
    for (i = 0; i < live.length; i++){
      live[i].poly = pgTranslate(live[i].world, -newBody.position.x, -newBody.position.y);
      delete live[i].world;
    }
    obj.pieces = live;
    obj.geomRev = (obj.geomRev || 0) + 1;   // the drawn shape changed; drop cached paths
    obj.parts = newBody.parts.length > 1 ? newBody.parts.slice(1) : newBody.parts.slice();
    refreshObjectPhysics(obj);
    if (!wasStatic && !newBody.isStatic){
      Body.setVelocity(newBody, vel);
      Body.setAngularVelocity(newBody, angVel);
    }
    bolts.forEach(function(b){
      if (b.objA === obj) b.constraint.bodyA = newBody;
      if (b.objB === obj) b.constraint.bodyB = newBody;
    });
    if (typeof ropeConstraint !== "undefined" && ropeConstraint){
      if (oldBody && ropeConstraint.bodyA === oldBody) ropeConstraint.bodyA = newBody;
      if (oldBody && ropeConstraint.bodyB === oldBody) ropeConstraint.bodyB = newBody;
    }
    return true;
  }

  /* Add a world-space polygon of `materialId` to an object, applying
     LBP's rule: it joins its own material and CUTS every other one. */
  function addPolyToObject(obj, materialId, worldPoly, tol){
    if (!worldPoly || !worldPoly.length) return false;
    tol = tol || GEOM_TOL;
    var local = objToLocal(obj, worldPoly);
    var own = pieceOf(obj, materialId), i;
    for (i = 0; i < obj.pieces.length; i++){
      var pc = obj.pieces[i];
      if (pc === own) continue;
      if (!pgIntersects(pc.poly, local)) continue;
      pc.poly = pgDiff(pc.poly, local, tol);
    }
    if (own) own.poly = pgUnion(own.poly, local, tol);
    else obj.pieces.push({ m: materialId, poly: pgClean(local, tol) });
    obj.pieces = obj.pieces.filter(function(p){ return p.poly && p.poly.length; });
    return true;
  }
  // Take a world-space polygon OUT of an object, whatever it is made of.
  function subPolyFromObject(obj, worldPoly, tol, onlyMaterial){
    if (!worldPoly || !worldPoly.length) return false;
    return subLocalPoly(obj, objToLocal(obj, worldPoly), tol, onlyMaterial);
  }
  function subLocalPoly(obj, local, tol, onlyMaterial){
    if (!local || !local.length) return false;
    tol = tol || GEOM_TOL;
    var changed = false, i;
    for (i = 0; i < obj.pieces.length; i++){
      var pc = obj.pieces[i];
      if (onlyMaterial && pc.m !== onlyMaterial) continue;
      if (!pgIntersects(pc.poly, local)) continue;
      pc.poly = pgDiff(pc.poly, local, tol);
      changed = true;
    }
    if (changed) obj.pieces = obj.pieces.filter(function(p){ return p.poly && p.poly.length; });
    return changed;
  }

  /* Put an object into the world from regions already expressed in
     `frame` (its body position and angle). Used by loading, undo,
     stamps and splitting — everything that reconstructs a shape rather
     than painting one. */
  function spawnObjectFromPieces(pieces, layer, frame, forcedStatic){
    if (!pieces || !pieces.length) return null;
    if (objects.length >= PLACED_CAP) return null;
    layer = (layer === 0 || layer === 1 || layer === 2) ? layer : MID_LAYER;
    var obj = { id:"o"+(objCounter++), body:null, parts:[], pieces:pieces, layer:layer,
                darkMatter:false, decorative: layer !== MID_LAYER, glow: newGlow,
                forcedStatic: !!forcedStatic, drawing:false, geomRev:0 };
    objects.push(obj);
    if (!rebuildFromPieces(obj, frame)) return null;
    return objects.indexOf(obj) >= 0 ? obj : null;
  }
  function newObjectFromPoly(materialId, worldPoly, layer){
    if (objects.length >= PLACED_CAP){ showToast("Level is full! Erase something first."); return null; }
    if (!worldPoly || !worldPoly.length) return null;
    var c = pgCentroid(worldPoly);
    var body = Body.create({ parts: [ makePart(materialId, [[c.x-1,c.y-1],[c.x+1,c.y-1],[c.x+1,c.y+1],[c.x-1,c.y+1]]) ] });
    var obj = { id:"o"+(objCounter++), body:body, parts:[],
                pieces:[ { m: materialId, poly: pgTranslate(worldPoly, -body.position.x, -body.position.y) } ],
                layer:layer, darkMatter: matOf(materialId).isDarkMatter, glow: newGlow,
                decorative: layer !== MID_LAYER, forcedStatic:false, drawing:false, geomRev:0 };
    body.plugin = { isObject:true, obj:obj };
    World.add(world, body);
    objects.push(obj);
    var hold = bulkList; bulkList = null;     // it needs real bounds right now
    rebuildFromPieces(obj);
    bulkList = hold;
    return objects.indexOf(obj) >= 0 ? obj : null;
  }

  /* Objects on `layer` whose material this new polygon actually touches.
     Painting into something welds to it, which is how you build one
     continuous hillside out of a dozen separate strokes. */
  function objectsTouching(worldPoly, layer, reach){
    var hits = [], wb = pgBounds(worldPoly);
    if (!wb) return hits;
    reach = reach || 0;
    objects.forEach(function(o){
      if (layer != null && o.layer !== layer) return;   // null means any layer
      var ob = o.body.bounds;
      if (ob.max.x < wb.x - reach || ob.min.x > wb.x2 + reach ||
          ob.max.y < wb.y - reach || ob.min.y > wb.y2 + reach) return;
      var local = objToLocal(o, worldPoly);
      for (var i = 0; i < o.pieces.length; i++){
        if (pgIntersects(o.pieces[i].poly, local)){ hits.push(o); return; }
      }
      // near-miss: painting a hair away from something still welds to it,
      // the way a brush stroke that grazes an edge does in LBP
      if (reach > 0){
        var c = pgCentroid(worldPoly), lc = worldPtToLocal(o, c.x, c.y);
        for (var j = 0; j < o.pieces.length; j++){
          if (pgEdgeDist(o.pieces[j].poly, lc.x, lc.y, reach) < reach){ hits.push(o); return; }
        }
      }
    });
    return hits;
  }
  function removeObject(obj){
    var idx = objects.indexOf(obj);
    if (idx < 0) return;
    dropBitmap(obj);
    bolts.slice().forEach(function(b){ if (b.objA===obj || b.objB===obj) removeBolt(b); });
    if (obj.body) World.remove(world, obj.body);
    objects.splice(idx,1);
    if (ctxObj === obj) closeObjCtxMenu();
    var si = selection.indexOf(obj);
    if (si >= 0) selection.splice(si, 1);
    if (selected === obj){
      selected = selection[selection.length - 1] || null;
      selectedRegion = null;
      if (!selected) clearSelection(); else renderSelBar();
    }
    if (hoverObj === obj) hoverObj = null;
  }
  // How far outside a shape's edge still counts as clicking on it.
  var GRAB_SLACK = 10;
  /* Which object is under this point — a real point-in-polygon test now,
     so clicking the middle of a big shape finds it and clicking a hole
     you cut in it does not. */
  /* Which object is under this point.

     When several overlap, the answer is the one you can actually SEE
     there — drawing a little person on top of a plane and clicking it
     used to hand you the plane, because this walked the list in
     creation order and kept the FIRST match, which is the one drawn
     underneath. Now the pick is ranked: something on the layer you are
     building on wins outright (that is the thing you are working on),
     then the frontmost layer, then whatever was drawn last. Only if
     nothing contains the point does it fall back to the nearest edge
     within `slack`. */
  function objectAt(x, y, slack){
    slack = (slack == null) ? GRAB_SLACK : slack;
    var hit = null, hitMat = null, hitRank = -Infinity;
    var near = null, nearMat = null, nearD = slack;
    objects.forEach(function(o, oi){
      var b = o.body.bounds;
      if (x < b.min.x - slack || x > b.max.x + slack ||
          y < b.min.y - slack || y > b.max.y + slack) return;
      var lp = worldPtToLocal(o, x, y), i;
      for (i = 0; i < o.pieces.length; i++){
        if (pgContains(o.pieces[i].poly, lp.x, lp.y)){
          var rank = (o.layer === buildLayer ? 1e9 : 0) + o.layer * 1e5 + oi;
          if (rank > hitRank){ hitRank = rank; hit = o; hitMat = o.pieces[i].m; }
          return;
        }
      }
      if (hit || slack <= 0) return;
      for (i = 0; i < o.pieces.length; i++){
        var d = pgEdgeDist(o.pieces[i].poly, lp.x, lp.y, slack);
        if (d < nearD){ nearD = d; near = o; nearMat = o.pieces[i].m; }
      }
    });
    if (hit) return { obj: hit, materialId: hitMat };
    return near ? { obj: near, materialId: nearMat } : null;
  }
  function mergeObjects(a, b){
    if (a === b) return a;
    // b's regions come across in a's frame, joining their own material
    // and cutting the rest — the same rule painting follows
    var wp = b.pieces.map(function(pc){ return { m: pc.m, world: objToWorld(b, pc.poly) }; });
    a.forcedStatic = a.forcedStatic || b.forcedStatic;
    var idx = objects.indexOf(b);
    if (idx >= 0) objects.splice(idx,1);
    bolts.forEach(function(bo){ if (bo.objA===b) bo.objA=a; if (bo.objB===b) bo.objB=a; });
    if (b.body) World.remove(world, b.body);
    dropBitmap(b);
    wp.forEach(function(w){ addPolyToObject(a, w.m, w.world); });
    rebuildFromPieces(a);
    return a;
  }
  function removeBolt(b){
    var idx = bolts.indexOf(b);
    if (idx < 0) return;
    World.remove(world, b.constraint);
    bolts.splice(idx,1);
  }
  /* A bolt has four settings rather than two. Tight and Loose pin things
     together rigidly or floppily; the two Motor settings drive whatever
     is attached round and round, which is how you build a wheel, a
     windmill, a rotating platform or a swinging arm. Motors only turn in
     Play, so a spinning contraption doesn't fight you while you're
     still positioning it. */
  var BOLT_MODES = ["tight","loose","cw","ccw"];
  var BOLT_LABEL = { tight:"Tight — rigid", loose:"Loose — wobbly",
                     cw:"Motor ↻ — spins clockwise in Play", ccw:"Motor ↺ — spins the other way in Play" };
  function applyBoltMode(b){
    var rigid = b.mode === "tight" || b.mode === "cw" || b.mode === "ccw";
    b.constraint.stiffness = rigid ? 0.9 : 0.12;
    b.constraint.damping = rigid ? 0.35 : 0.04;
    b.tight = b.mode === "tight";
  }
  function addBolt(objA, objB, point, modeOrTight){
    var m = typeof modeOrTight === "string" ? modeOrTight : (modeOrTight ? "tight" : "loose");
    if (BOLT_MODES.indexOf(m) === -1) m = "tight";
    var c = Constraint.create({
      bodyA: objA.body, pointA: { x: point.x - objA.body.position.x, y: point.y - objA.body.position.y },
      bodyB: objB.body, pointB: { x: point.x - objB.body.position.x, y: point.y - objB.body.position.y },
      length: 0, stiffness: 0.9, damping: 0.35
    });
    World.add(world, c);
    var bolt = { id:"b"+(boltCounter++), point:{x:point.x,y:point.y}, objA:objA, objB:objB, constraint:c, mode:m, tight:true };
    applyBoltMode(bolt);
    bolts.push(bolt);
    return bolt;
  }
  function toggleBolt(bolt){
    bolt.mode = BOLT_MODES[(BOLT_MODES.indexOf(bolt.mode) + 1) % BOLT_MODES.length];
    applyBoltMode(bolt);
    showToast("🔩 " + BOLT_LABEL[bolt.mode]);
    sfx(bolt.mode === "cw" || bolt.mode === "ccw" ? "motor" : "bolt");
  }
  // Motors spin the body about its own centre; the zero-length
  // constraint then drags that rotation around the bolt point, which is
  // what makes an off-centre wheel behave like a real one. If both ends
  // are pinned down there is nothing to turn, so nothing happens.
  onStep("beforeUpdate", function(){
    if (mode !== "play") return;
    for (var i = 0; i < bolts.length; i++){
      var b = bolts[i];
      if (b.mode !== "cw" && b.mode !== "ccw") continue;
      var w = worldSettings.motorSpeed * (b.mode === "cw" ? 1 : -1);
      var target = !b.objA.body.isStatic ? b.objA.body : (!b.objB.body.isStatic ? b.objB.body : null);
      if (target) Body.setAngularVelocity(target, w);
    }
  });
  // Where a bolt actually IS right now. Its stored `point` is where you
  // put it; once the thing it holds has moved or spun, the live anchor
  // is the constraint's own attachment point carried into world space —
  // which is what makes a bolt on a turning wheel stay on the wheel.
  function boltWorldPoint(b){
    if (b.constraint && b.constraint.bodyA && b.constraint.pointA){
      return toWorldPoint(b.constraint.bodyA, b.constraint.pointA);
    }
    return b.point;
  }
  function boltAt(x, y, maxD){
    maxD = maxD || 16;
    var best = null, bestD = maxD;
    bolts.forEach(function(b){
      var d = dist(boltWorldPoint(b), {x:x,y:y});
      if (d < bestD){ bestD = d; best = b; }
    });
    return best;
  }

  function clearAllObjects(){
    // whatever was selected or hovered is about to stop existing
    clearSelection();
    hoverObj = null;
    objects.slice().forEach(removeObject);
    objects = [];
    bolts.slice().forEach(removeBolt);
    bolts = [];
  }

  function starterLevel(){
    clearAllObjects();
    clearWater();
    buildLayer = MID_LAYER;
    // one plank, one rectangle, four corners
    var fy = WORLD_H - 45, fy2 = WORLD_H - 15;
    var floorObj = newObjectFromPoly("wood",
      [[[[5, fy], [START_FLOOR_W - 5, fy], [START_FLOOR_W - 5, fy2], [5, fy2]]]], MID_LAYER);
    if (floorObj){ floorObj.forcedStatic = true; refreshObjectPhysics(floorObj); } // anchor the starting ground
    checkpoints = [{ x: 90, y: WORLD_H-110, reached: false }];
    goalPoint = null;
    bubbles = [];
    activeCheckpoint = 0;
  }

  var goalPoint = null;
  var checkpoints = [];
  var bubbles = [];
  var activeCheckpoint = 0;

  starterLevel();

  /* ============================================================
     2c. Water.

     Painted water isn't a body — bodies can't puddle. It lives in a
     grid of cells, each holding how full it is (0..1, a little over 1
     when it's under pressure from the water above it). Every step each
     cell tries to fall into the cell below, then level itself out with
     its neighbours, then — if it's still over-full — push back up. That
     is enough for water to fall, run downhill, spread along a floor,
     pool at the lowest point it can reach, and find its own level
     between two connected basins.

     The grid is Mid-layer only: Mid geometry blocks it, and Back/Front
     decoration is invisible to it. World Water is separate and much
     simpler — a single surface height that floods every layer at once.
     Both feed the same buoyancy code, so anything that floats in one
     floats in the other.
     ============================================================ */
  var WATER_CELL = 16;
  var WCOLS = Math.ceil(WORLD_W / WATER_CELL);
  var WROWS = Math.ceil(WORLD_H / WATER_CELL);
  var WCELLS = WCOLS * WROWS;
  var waterLevels = new Float32Array(WCELLS);
  var waterSolid = new Uint8Array(WCELLS);
  var waterCount = 0;                                   // cells holding water
  var wMinRow = WROWS, wMaxRow = -1, wMinCol = WCOLS, wMaxCol = -1;
  // Height of the open water surface in each column, NaN where that
  // column is dry. Rebuilt once per step so buoyancy can ask "how deep
  // is the water here" in constant time.
  var waterTopY = new Float32Array(WCOLS);
  waterTopY.fill(NaN);

  var W_MAX = 1.0;        // a brim-full cell
  var W_COMPRESS = 0.025; // how much extra a cell takes under pressure
  var W_MIN = 0.0009;     // below this a cell counts as dry
  var W_MAX_FLOW = 0.9;   // most that can move in one step, for stability
  var W_SPREAD = 0.52;    // how fast neighbours level out

  // Given the water shared by a cell and the one above it, how much the
  // LOWER one should end up holding. Under a column of water the lower
  // cell takes more than full, and that surplus is what pushes water
  // back up the far side of a U-bend.
  function waterStableLower(total){
    if (total <= W_MAX) return W_MAX;
    if (total < 2*W_MAX + W_COMPRESS) return (W_MAX*W_MAX + total*W_COMPRESS) / (W_MAX + W_COMPRESS);
    return (total + W_COMPRESS) / 2;
  }

  function waterIndexAt(x, y){
    var c = Math.floor(x / WATER_CELL), r = Math.floor(y / WATER_CELL);
    if (c < 0 || c >= WCOLS || r < 0 || r >= WROWS) return -1;
    return r*WCOLS + c;
  }
  function noteWaterCell(col, row){
    if (row < wMinRow) wMinRow = row;
    if (row > wMaxRow) wMaxRow = row;
    if (col < wMinCol) wMinCol = col;
    if (col > wMaxCol) wMaxCol = col;
  }
  function clearWater(){
    // starterLevel() runs once during boot, before this grid exists
    if (!waterLevels) return;
    waterLevels.fill(0);
    if (waterTopY) waterTopY.fill(NaN);
    waterCount = 0;
    wMinRow = WROWS; wMaxRow = -1; wMinCol = WCOLS; wMaxCol = -1;
  }

  // Mark every cell covered by Mid-layer geometry. Rebuilt each step
  // because the world moves; clearing a typed array and re-stamping a
  // few thousand dabs is far cheaper than asking the physics engine.
  /* Which cells of the fluid grid are blocked by solid material.
     Scanline-filled straight from the polygons: for each row of cells,
     find where the contours cross that row's centre line, sort the
     crossings and fill the spans between them. Nothing is rasterised
     twice and nothing is missed, which the old circle-by-circle stamp
     could not promise on a shape built from a thousand of them.

     Rebuilt at most once a frame — the fluid step used to ask for it
     up to three times, which on a hand-built level was three full
     passes over every piece of geometry for one identical answer. */
  var waterSolidFrame = -1;
  var wsX = [];
  function stampObjectIntoWater(o){
    var b = o.body, ca = Math.cos(b.angle), sa = Math.sin(b.angle);
    var ox = b.position.x, oy = b.position.y;
    var bb = b.bounds;
    var r0 = Math.max(0, Math.floor((bb.min.y - WATER_CELL)/WATER_CELL));
    var r1 = Math.min(WROWS-1, Math.floor((bb.max.y + WATER_CELL)/WATER_CELL));
    var pi, i, j, k, row, s;
    for (row = r0; row <= r1; row++){
      var cy = row*WATER_CELL + WATER_CELL/2;
      wsX.length = 0;
      for (pi = 0; pi < o.pieces.length; pi++){
        var mp = o.pieces[pi].poly;
        for (i = 0; i < mp.length; i++)
          for (j = 0; j < mp[i].length; j++){
            var ring = mp[i][j], nn = ring.length;
            var px = ring[nn-1][0], py = ring[nn-1][1];
            var ax = px*ca - py*sa + ox, ay = px*sa + py*ca + oy;
            for (k = 0; k < nn; k++){
              var qx = ring[k][0], qy = ring[k][1];
              var bx = qx*ca - qy*sa + ox, by = qx*sa + qy*ca + oy;
              if ((ay > cy) !== (by > cy)) wsX.push(ax + (cy - ay)*(bx - ax)/(by - ay));
              ax = bx; ay = by;
            }
          }
      }
      if (wsX.length < 2) continue;
      wsX.sort(function(p, q){ return p - q; });
      var base = row*WCOLS;
      for (s = 0; s + 1 < wsX.length; s += 2){
        var c0 = Math.max(0, Math.ceil((wsX[s] - WATER_CELL/2)/WATER_CELL));
        var c1 = Math.min(WCOLS-1, Math.floor((wsX[s+1] - WATER_CELL/2)/WATER_CELL));
        for (var col = c0; col <= c1; col++) waterSolid[base + col] = 1;
      }
    }
  }
  function rebuildWaterSolid(force){
    if (!force && waterSolidFrame === bmpFrame) return;
    waterSolidFrame = bmpFrame;
    waterSolid.fill(0);
    for (var oi = 0; oi < objects.length; oi++){
      var o = objects[oi];
      if (o.layer !== MID_LAYER || !o.pieces || !o.pieces.length) continue;
      stampObjectIntoWater(o);
    }
  }

  // Something solid moved into water: shove that water out of the way
  // rather than deleting it, so a block dropped in a pond displaces the
  // pond instead of drilling a hole in it.
  //
  // Sideways first, and only upward as a last resort. Stacking the
  // displaced water on top of whatever pushed it out is what a real
  // pond doesn't do, and doing it here creates a nasty feedback loop: a
  // floating plank shoves water above itself, the water surface is then
  // always higher than the plank, so the plank reads as submerged, gets
  // more lift, rises further — and launches out of the level.
  function evictTrappedWater(){
    if (waterCount === 0) return;
    for (var row = wMaxRow; row >= wMinRow; row--){
      for (var col = wMinCol; col <= wMaxCol; col++){
        var i = row*WCOLS + col;
        if (!waterSolid[i] || waterLevels[i] <= W_MIN) continue;
        var carry = waterLevels[i];
        waterLevels[i] = 0;
        // spread outwards along this row
        for (var d = 1; d <= 10 && carry > W_MIN; d++){
          for (var side = 0; side < 2 && carry > W_MIN; side++){
            var c2 = side ? col + d : col - d;
            if (c2 < 0 || c2 >= WCOLS) continue;
            var j = row*WCOLS + c2;
            if (waterSolid[j]) continue;
            var room = (W_MAX + W_COMPRESS) - waterLevels[j];
            if (room <= 0) continue;
            var give = Math.min(room, carry);
            waterLevels[j] += give; carry -= give;
            noteWaterCell(c2, row);
          }
        }
        // nowhere to go sideways — let it up
        for (var up = row-1; up >= 0 && up >= row-6 && carry > W_MIN; up--){
          var k = up*WCOLS + col;
          if (waterSolid[k]) continue;
          var room2 = (W_MAX + W_COMPRESS) - waterLevels[k];
          if (room2 <= 0) continue;
          var give2 = Math.min(room2, carry);
          waterLevels[k] += give2; carry -= give2;
          noteWaterCell(col, up);
        }
      }
    }
  }

  var waterTick = 0;
  function stepWater(){
    if (waterCount === 0) return;
    rebuildWaterSolid();
    evictTrappedWater();

    var r0 = Math.max(0, wMinRow - 1), r1 = Math.min(WROWS-1, wMaxRow + 1);
    var c0 = Math.max(0, wMinCol - 1), c1 = Math.min(WCOLS-1, wMaxCol + 1);
    var nMinRow = WROWS, nMaxRow = -1, nMinCol = WCOLS, nMaxCol = -1, n = 0;

    // Bottom-up, alternating the left/right sweep so water doesn't
    // develop a permanent drift in whichever direction we happen to scan.
    var flip = (waterTick++ & 1) === 1;
    for (var row = r1; row >= r0; row--){
      for (var k = c0; k <= c1; k++){
        var col = flip ? (c1 - (k - c0)) : k;
        var i = row*WCOLS + col;
        var remaining = waterLevels[i];
        if (remaining <= W_MIN){ if (remaining !== 0) waterLevels[i] = 0; continue; }
        if (waterSolid[i]){ waterLevels[i] = 0; continue; }

        // 1. fall
        if (row + 1 < WROWS){
          var below = i + WCOLS;
          if (!waterSolid[below]){
            var want = waterStableLower(remaining + waterLevels[below]) - waterLevels[below];
            if (want > W_MIN){
              var f = Math.min(want, remaining, W_MAX_FLOW);
              waterLevels[below] += f; remaining -= f;
            }
          }
        }
        // 2. level out sideways
        if (remaining > W_MIN && col > 0 && !waterSolid[i-1]){
          var dL = remaining - waterLevels[i-1];
          if (dL > 0){
            var fL = Math.min(remaining, dL*W_SPREAD, W_MAX_FLOW);
            if (fL > W_MIN){ waterLevels[i-1] += fL; remaining -= fL; }
          }
        }
        if (remaining > W_MIN && col < WCOLS-1 && !waterSolid[i+1]){
          var dR = remaining - waterLevels[i+1];
          if (dR > 0){
            var fR = Math.min(remaining, dR*W_SPREAD, W_MAX_FLOW);
            if (fR > W_MIN){ waterLevels[i+1] += fR; remaining -= fR; }
          }
        }
        // 3. under pressure, push back up
        if (remaining > W_MAX && row > 0 && !waterSolid[i-WCOLS]){
          var above = i - WCOLS;
          var wantUp = remaining - waterStableLower(remaining + waterLevels[above]);
          if (wantUp > W_MIN){
            var fU = Math.min(wantUp, remaining, W_MAX_FLOW);
            waterLevels[above] += fU; remaining -= fU;
          }
        }
        waterLevels[i] = remaining > W_MIN ? remaining : 0;
      }
    }

    // Recount, re-bound, and note each column's surface in one sweep.
    // Rows run downward, so the first wet cell found in a column is its
    // top — which is the level things float at.
    waterTopY.fill(NaN);
    for (var rr2 = r0; rr2 <= r1; rr2++){
      for (var cc2 = c0; cc2 <= c1; cc2++){
        var lv2 = waterLevels[rr2*WCOLS + cc2];
        if (lv2 > W_MIN){
          n++;
          if (rr2 < nMinRow) nMinRow = rr2;
          if (rr2 > nMaxRow) nMaxRow = rr2;
          if (cc2 < nMinCol) nMinCol = cc2;
          if (cc2 > nMaxCol) nMaxCol = cc2;
          if (isNaN(waterTopY[cc2])){
            waterTopY[cc2] = rr2*WATER_CELL + WATER_CELL*(1 - Math.min(1, lv2));
          }
        }
      }
    }
    waterCount = n;
    wMinRow = nMinRow; wMaxRow = nMaxRow; wMinCol = nMinCol; wMaxCol = nMaxCol;
  }
  function addWaterAt(x, y, radius, amount){
    var c0 = Math.max(0, Math.floor((x - radius)/WATER_CELL));
    var c1 = Math.min(WCOLS-1, Math.floor((x + radius)/WATER_CELL));
    var r0 = Math.max(0, Math.floor((y - radius)/WATER_CELL));
    var r1 = Math.min(WROWS-1, Math.floor((y + radius)/WATER_CELL));
    var rr = radius*radius, added = false;
    for (var row = r0; row <= r1; row++){
      for (var col = c0; col <= c1; col++){
        var cx = col*WATER_CELL + WATER_CELL/2, cy = row*WATER_CELL + WATER_CELL/2;
        var dx = cx - x, dy = cy - y;
        if (dx*dx + dy*dy > rr) continue;
        var i = row*WCOLS + col;
        if (waterSolid[i]) continue;      // don't pour inside solid geometry
        if (waterLevels[i] >= W_MAX) continue;
        waterLevels[i] = Math.min(W_MAX, waterLevels[i] + (amount == null ? W_MAX : amount));
        noteWaterCell(col, row);
        added = true;
      }
    }
    // any non-zero count is enough to get the simulation running again;
    // the next step recounts exactly
    if (added && waterCount <= 0) waterCount = 1;
  }
  function removeWaterAt(x, y, radius){
    var c0 = Math.max(0, Math.floor((x - radius)/WATER_CELL));
    var c1 = Math.min(WCOLS-1, Math.floor((x + radius)/WATER_CELL));
    var r0 = Math.max(0, Math.floor((y - radius)/WATER_CELL));
    var r1 = Math.min(WROWS-1, Math.floor((y + radius)/WATER_CELL));
    var rr = radius*radius;
    for (var row = r0; row <= r1; row++){
      for (var col = c0; col <= c1; col++){
        var cx = col*WATER_CELL + WATER_CELL/2, cy = row*WATER_CELL + WATER_CELL/2;
        var dx = cx - x, dy = cy - y;
        if (dx*dx + dy*dy > rr) continue;
        waterLevels[row*WCOLS + col] = 0;
      }
    }
  }

  // How submerged a dab of radius r sitting at (x,y) is, 0..1 — the
  // single answer both kinds of water feed into, which is why anything
  // that floats in one floats in the other.
  // Surface height of the poured water at a given x, looking one column
  // either side. The neighbours matter: a floating object marks its own
  // cells solid and shoves the water out of them, so asking only the
  // column it sits in would report dry ground and nothing would ever
  // float in the water it is displacing.
  function waterSurfaceAt(x){
    if (waterCount <= 0) return null;
    var c = Math.floor(x / WATER_CELL);
    var lo = Math.max(0, c-1), hi = Math.min(WCOLS-1, c+1), best = NaN;
    for (var cc = lo; cc <= hi; cc++){
      var t = waterTopY[cc];
      if (t === t && (best !== best || t < best)) best = t;   // t===t rejects NaN
    }
    return best === best ? best : null;
  }
  function waterAt(x, y, r){
    r = r || 8;
    var w = 0;
    if (worldSettings.waterLevel != null){
      w = Math.max(0, Math.min(1, (y + r - worldSettings.waterLevel) / (2*r)));
    }
    var s = waterSurfaceAt(x);
    if (s !== null){
      var g = Math.max(0, Math.min(1, (y + r - s) / (2*r)));
      if (g > w) w = g;
    }
    return w;
  }

  // Same per-column surface scan the simulation does, for the cases
  // where water arrives without a step running — undoing an edit, or
  // loading a level while paused.
  function recomputeWaterTops(){
    waterTopY.fill(NaN);
    if (waterCount <= 0 || wMaxRow < 0) return;
    for (var row = wMinRow; row <= wMaxRow; row++){
      for (var col = wMinCol; col <= wMaxCol; col++){
        var lv = waterLevels[row*WCOLS + col];
        if (lv > W_MIN && waterTopY[col] !== waterTopY[col]){
          waterTopY[col] = row*WATER_CELL + WATER_CELL*(1 - Math.min(1, lv));
        }
      }
    }
  }

  // ---- save / restore ----
  function packWaterBytes(){
    var out = new Uint8Array(WCELLS);
    for (var i = 0; i < WCELLS; i++){
      var v = waterLevels[i];
      out[i] = v <= 0 ? 0 : Math.min(255, Math.round(v*200));
    }
    return out;
  }
  function unpackWaterBytes(bytes){
    clearWater();
    if (!bytes) return;
    var n = 0;
    for (var i = 0; i < WCELLS && i < bytes.length; i++){
      if (!bytes[i]) continue;
      waterLevels[i] = bytes[i]/200;
      noteWaterCell(i % WCOLS, (i / WCOLS) | 0);
      n++;
    }
    waterCount = n;
    recomputeWaterTops();
  }
  // JSON-safe form for saved levels: only the wet cells, as index/value pairs.
  function packWaterSparse(){
    var out = [];
    for (var i = 0; i < WCELLS; i++){
      var v = waterLevels[i];
      if (v <= W_MIN) continue;
      out.push(i, Math.min(255, Math.round(v*200)));
    }
    return out;
  }
  function unpackWaterSparse(arr){
    clearWater();
    if (!arr || !arr.length) return;
    var n = 0;
    for (var k = 0; k + 1 < arr.length; k += 2){
      var i = arr[k];
      if (i < 0 || i >= WCELLS) continue;
      waterLevels[i] = arr[k+1]/200;
      noteWaterCell(i % WCOLS, (i / WCOLS) | 0);
      n++;
    }
    waterCount = n;
    recomputeWaterTops();
  }

  // Buoyancy. Floaty's own lift works in mid-air (it's a balloon), and
  // is separate from water. In water every dab is pushed up by the
  // weight of what it displaces and pulled down by its own weight, so
  // whether something floats falls straight out of its density against
  // water's: Timber, Sponge, Bounce, Ice and Floaty ride on the
  // surface, Heavy Metal goes to the bottom. Forces are applied at each
  // dab's own position, so a long plank tips and rights itself instead
  // of sliding around flat. Dark Matter needs no force at all — it's
  // simply isStatic, so gravity never touches it.
  onStep("beforeUpdate", function(){
    var g = engine.gravity, gscale = (typeof g.scale !== "undefined") ? g.scale : 0.001;
    var noWater = (worldSettings.waterLevel == null) && waterCount === 0;
    objects.forEach(function(o){
      if (o.body.isStatic || o.body.isSensor) return;
      var floatSum = 0;
      o.parts.forEach(function(p){
        var mat = matOf(p.plugin.materialId);
        if (mat.floatForce) floatSum += mat.floatForce;
      });
      if (floatSum){
        Body.applyForce(o.body, o.body.position, { x: 0, y: -o.body.mass*g.y*gscale*(floatSum/o.parts.length) });
      }
      if (noWater) return;
      var wetness = 0;
      o.parts.forEach(function(p){
        var mat = matOf(p.plugin.materialId);
        var r = partR(p);
        var sub = waterAt(p.position.x, p.position.y, r);
        if (sub <= 0.02) return;
        wetness += sub;
        // real area of the chunk, not a circle standing in for it
        var vol = Math.abs(p.area) || (Math.PI*r*r);
        // The FULL weight of the displaced water, not the net — the
        // engine is already pulling the dab down by its own weight, so
        // subtracting it here as well would cancel the lift twice and
        // sink everything. Whether it rises comes out of the two
        // densities meeting in the middle.
        var lift = WATER_DENSITY * vol * g.y * gscale * sub;
        // Safety rail: never lift a dab harder than 2.5x its own weight,
        // so no amount of odd geometry can fling something out of the
        // level. That still leaves plenty of float for the light stuff.
        var maxLift = mat.density * vol * g.y * gscale * 2.5;
        if (lift > maxLift) lift = maxLift;
        Body.applyForce(o.body, p.position, { x: 0, y: -lift });
      });
      if (wetness > 0){
        // Viscous drag, so things settle and bob instead of pogoing.
        // Damped straight on the velocity: as a force this would be in
        // the wrong units — the engine multiplies force by delta
        // squared, which turns a velocity-proportional "drag" into a
        // couple of hundred times the velocity and throws the object
        // clean out of the world.
        var soak = Math.min(1, wetness / o.parts.length);
        var v = o.body.velocity;
        Body.setVelocity(o.body, { x: v.x * (1 - 0.05*soak), y: v.y * (1 - 0.06*soak) });
        Body.setAngularVelocity(o.body, o.body.angularVelocity * (1 - 0.06*soak));
      }
    });

    // The player floats too — you bob up to the surface and can swim
    // along it rather than trudging around on the bottom.
    if (player && !flying && !noWater){
      var pw = waterAt(player.position.x, player.position.y, PH/2);
      if (pw > 0.02){
        var pvol = PW*PH*0.78;
        var plift = WATER_DENSITY * pvol * g.y * gscale * pw;
        Body.applyForce(player, player.position, { x: 0, y: -plift });
        Body.setVelocity(player, { x: player.velocity.x, y: player.velocity.y * (1 - 0.09*pw) });
      }
    }
  });

  /* ============================================================
     3. Player character
     ============================================================ */
  var charSize = localStorage.getItem("pg_char_size") || "medium"; // "small" | "medium" | "large"
  var PW, PH;
  function applyCharSize(){
    var sz = CHAR_SIZES[charSize] || CHAR_SIZES.medium;
    PW = sz.w; PH = sz.h;
  }
  applyCharSize();
  var player = null;
  var charColor = localStorage.getItem("pg_char_color") || CHAR_COLORS[0];
  var grounded = false;
  var facing = 1;
  var ropeConstraint = null;
  var flying = false;
  var mouseWorld = { x: 0, y: 0 };

  // ---- Character creator state (persisted like charColor) ----
  var charMode = localStorage.getItem("pg_char_mode") || "preset"; // "preset" | "simple" | "animated" | "rig"

  var charFrameCounts = null;
  try { charFrameCounts = JSON.parse(localStorage.getItem("pg_char_frame_counts") || "null"); } catch(e){ charFrameCounts = null; }
  if (!charFrameCounts || typeof charFrameCounts !== "object") charFrameCounts = {};
  ANIM_STATES.forEach(function(s){ if (typeof charFrameCounts[s.id] !== "number") charFrameCounts[s.id] = s.frames; });
  function persistCharFrameCounts(){ localStorage.setItem("pg_char_frame_counts", JSON.stringify(charFrameCounts)); }

  var charSprites = null;
  try { charSprites = JSON.parse(localStorage.getItem("pg_char_sprites") || "null"); } catch(e){ charSprites = null; }
  if (!charSprites || typeof charSprites !== "object") charSprites = {};
  ANIM_STATES.forEach(function(s){
    if (!Array.isArray(charSprites[s.id])) charSprites[s.id] = [];
    var fc = charFrameCounts[s.id];
    for (var i = 0; i < fc; i++){
      charSprites[s.id][i] = normalizeDrawing(charSprites[s.id][i], 10, 14);
    }
    charSprites[s.id].length = fc;
  });
  function persistCharMode(){ localStorage.setItem("pg_char_mode", charMode); }
  function persistCharSprites(){
    try { localStorage.setItem("pg_char_sprites", JSON.stringify(charSprites)); } catch(e){}
  }
  function setStateFrameCount(stateId, n){
    n = Math.max(1, Math.min(CHAR_MAX_FRAMES, n));
    charFrameCounts[stateId] = n;
    var arr = charSprites[stateId];
    while (arr.length < n) arr.push(blankDrawing());
    arr.length = n;
    persistCharFrameCounts(); persistCharSprites();
  }

  // ---- "Simple Animated" rig: four separately-drawn parts, posed and
  // animated procedurally rather than hand-drawn per frame. ----
  var rigSprites = null;
  try { rigSprites = JSON.parse(localStorage.getItem("pg_char_rig") || "null"); } catch(e){ rigSprites = null; }
  if (!rigSprites || typeof rigSprites !== "object") rigSprites = {};
  RIG_PARTS.forEach(function(p){
    var d = RIG_PART_DEFS[p];
    rigSprites[p] = normalizeDrawing(rigSprites[p], d.legacyW, d.legacyH);
  });
  function persistRigSprites(){
    try { localStorage.setItem("pg_char_rig", JSON.stringify(rigSprites)); } catch(e){}
  }
  function rigHasAnyArt(){
    return RIG_PARTS.some(function(p){ return drawingHasArt(rigSprites[p]); });
  }
  var rigAnchors = null;
  try { rigAnchors = JSON.parse(localStorage.getItem("pg_char_rig_anchors") || "null"); } catch(e){ rigAnchors = null; }
  if (!rigAnchors || typeof rigAnchors !== "object") rigAnchors = {};
  Object.keys(RIG_ANCHOR_DEFAULTS).forEach(function(k){ if (typeof rigAnchors[k] !== "number") rigAnchors[k] = RIG_ANCHOR_DEFAULTS[k]; });

  var activeEmote = null, emoteUntil = 0;
  function triggerEmote(id){
    if (charMode !== "animated"){
      showToast(charMode === "rig"
        ? "Emotes need a Draw: Animated character — Simple Animated poses itself instead."
        : "Draw an Animated character in the Character Creator to use emotes.");
      return;
    }
    activeEmote = id; emoteUntil = performance.now() + 1800;
  }
  // Falls back within the SAME character rather than ever mixing in the
  // generic default look mid-animation: an undrawn frame holds that
  // state's frame 0, an undrawn state holds the idle pose, and only a
  // completely untouched character (nothing drawn anywhere) falls
  // through to the plain default rendering in drawCharacter.
  function pickCharFrame(stateId, idx){
    var frames = charSprites[stateId];
    if (drawingHasArt(frames[idx])) return frames[idx];
    if (drawingHasArt(frames[0])) return frames[0];
    if (drawingHasArt(charSprites.idle[0])) return charSprites.idle[0];
    return null;
  }
  function currentCharAnim(){
    if (charMode === "simple") return { frame: charSprites.idle[0] };
    if (charMode !== "animated") return null;
    if (activeEmote && performance.now() < emoteUntil){
      return { frame: pickCharFrame(activeEmote, 0) };
    }
    if (activeEmote) activeEmote = null;
    var stateId = "idle";
    if (ropeConstraint) stateId = "swing";
    else if (player && !grounded && player.velocity.y < -1.2) stateId = "jump";
    else if (player && !grounded && player.velocity.y > 1.2) stateId = "fall";
    else if (input.left || input.right || (player && Math.abs(player.velocity.x) > 0.6)) stateId = "run";
    var fc = charFrameCounts[stateId];
    var period = stateId === "run" ? 130 : 480;
    var idx = fc > 1 ? Math.floor(performance.now()/period) % fc : 0;
    return { frame: pickCharFrame(stateId, idx) };
  }
  // Drawn art is rasterised at 2x the on-screen size and cached, so a
  // smooth brush stroke stays smooth at any character size without
  // re-stroking every path each frame.
  function drawSpriteFrame(frame, mirror){
    var cv = drawingCanvas(frame, PW*2, PH*2);
    ctx.save();
    if (mirror) ctx.scale(-1, 1);
    ctx.drawImage(cv, -PW/2, -PH/2, PW, PH);
    ctx.restore();
  }

  // Draws one rig part into any 2D context already translated to that
  // part's parent origin — shared by the live gameplay render and the
  // editor's "full character" preview so they never drift apart.
  // pivotTop=true anchors the part's top edge at (0,0) and lets it
  // extend downward (arms/legs, for swinging from the shoulder/hip);
  // pivotTop=false centers the part on (0,0) (head/body).
  function drawRigPartAt(targetCtx, part, ax, ay, angle, pivotTop, scale){
    var f = rigSprites[part];
    if (!drawingHasArt(f)) return;
    var d = RIG_PART_DEFS[part];
    var pw = d.gameW * scale, ph = d.gameH * scale;
    var cv = drawingCanvas(f, d.gameW*3, d.gameH*3);
    targetCtx.save();
    targetCtx.translate(ax*scale, ay*scale);
    targetCtx.rotate(angle);
    targetCtx.drawImage(cv, -pw/2, pivotTop ? 0 : -ph/2, pw, ph);
    targetCtx.restore();
  }
  // Live gameplay render — called from inside drawCharacter's local
  // space (already translated to the player's center). The body flips
  // to face whichever side of the world the cursor is on; the head
  // tilts (clamped) toward the cursor; arms & legs swing through a walk
  // cycle while grounded and moving, and the arm nearest the grapple
  // point reaches toward it instead of swinging.
  function drawRigCharacter(){
    var p = player.position;
    var bodyFacing = (mouseWorld.x < p.x) ? -1 : 1;
    var moving = grounded && (input.left || input.right || Math.abs(player.velocity.x) > 0.6);
    var swing = moving ? Math.sin(performance.now()/140) : 0;
    var scale = PH / CHAR_SIZE_BASELINE;

    ctx.save();
    if (bodyFacing === -1) ctx.scale(-1, 1);

    drawRigPartAt(ctx, "leg",  rigAnchors.legX, rigAnchors.legY,  swing*0.55, true, scale);
    drawRigPartAt(ctx, "leg", -rigAnchors.legX, rigAnchors.legY, -swing*0.55, true, scale);
    drawRigPartAt(ctx, "body", 0, 0, 0, false, scale);

    var armAngleR = -swing*0.5, armAngleL = swing*0.5;
    if (ropeConstraint){
      var grabPt = ropeAnchorWorld();
      var dx = (grabPt.x - p.x) * bodyFacing, dy = grabPt.y - p.y;
      var reach = Math.max(-2.2, Math.min(2.2, Math.atan2(-dx, dy)));
      if (dx >= 0) armAngleR = reach; else armAngleL = reach;
    }
    drawRigPartAt(ctx, "arm",  rigAnchors.armX, rigAnchors.armY, armAngleR, true, scale);
    drawRigPartAt(ctx, "arm", -rigAnchors.armX, rigAnchors.armY, armAngleL, true, scale);

    // ---- head tracks the cursor ----
    // Worked out entirely in WORLD space and only converted into the
    // (possibly mirrored) local frame on the very last line, so the
    // direction can't inverts when the character flips. The vertical
    // term is floored so atan2 can never swing past 90° — the old
    // version wrapped right past it the moment the cursor dropped below
    // the head, which is what made the tilt read backwards. The head
    // also shifts slightly toward the cursor, so the tracking reads
    // clearly no matter how the head itself is drawn.
    var headWorldY = p.y + rigAnchors.headY*scale;
    var hdx = mouseWorld.x - p.x, hdy = mouseWorld.y - headWorldY;
    var look = Math.atan2(hdx, Math.max(30, Math.abs(hdy)));
    var headAng = Math.max(-0.5, Math.min(0.5, look)) * -bodyFacing;
    var leanX = Math.max(-4, Math.min(4, hdx/22)) * bodyFacing;
    var leanY = Math.max(-3, Math.min(3, hdy/30));
    drawRigPartAt(ctx, "head", leanX, rigAnchors.headY + leanY, headAng, false, scale);

    ctx.restore();
  }
  // Static "full character" preview used in the Rig editor — same part
  // draw code, a fixed idle-ish pose, own local canvas-pixel space.
  function drawRigPreview(pctx, w, h){
    pctx.clearRect(0, 0, w, h);
    var scale = (h*0.72) / CHAR_SIZE_BASELINE;
    pctx.save();
    pctx.translate(w/2, h*0.62);
    drawRigPartAt(pctx, "leg",  rigAnchors.legX, rigAnchors.legY,  0.16, true, scale);
    drawRigPartAt(pctx, "leg", -rigAnchors.legX, rigAnchors.legY, -0.16, true, scale);
    drawRigPartAt(pctx, "body", 0, 0, 0, false, scale);
    drawRigPartAt(pctx, "arm",  rigAnchors.armX, rigAnchors.armY, -0.12, true, scale);
    drawRigPartAt(pctx, "arm", -rigAnchors.armX, rigAnchors.armY,  0.12, true, scale);
    drawRigPartAt(pctx, "head", 0, rigAnchors.headY, 0, false, scale);
    pctx.restore();
  }
  var FLY_SPEED = 9;
  var SWIM_SPEED = 3.3;
  // How submerged the player is right now, 0..1. Cheap to call every
  // step, and short-circuits when the level has no water at all.
  function playerWetness(){
    if (!player) return 0;
    if (worldSettings.waterLevel == null && waterCount === 0) return 0;
    return waterAt(player.position.x, player.position.y, PH/2);
  }

  function getSpawnPos(){ return checkpoints[activeCheckpoint] || checkpoints[0]; }

    return layerFilter(MID_LAYER);
  }
  function spawnPlayer(atPos){
    if (player) World.remove(world, player);
    var sp = atPos || getSpawnPos();

      chamfer:{radius:16}, friction:0.02, frictionAir:0.01, restitution:0,
      density:0.006, label:"player", collisionFilter: playerFilter()

  function setCharSize(sz){
    if (!CHAR_SIZES[sz] || sz === charSize) return;

    var vel = player ? { x: player.velocity.x, y: player.velocity.y } : null;

      spawnPlayer(pos);

  function releaseRope(){
    if (ropeConstraint){ World.remove(world, ropeConstraint); ropeConstraint = null; sfx("unrope"); }
  }
  // Matter stores a constraint's attachment point in the body's own
  // rotating frame, so converting in either direction has to undo /
  // redo the body's angle — otherwise a rope tied to something that
  // then spins slides around it.
  function toBodyLocal(body, worldPt){
    var dx = worldPt.x - body.position.x, dy = worldPt.y - body.position.y;
    var a = -body.angle, cs = Math.cos(a), sn = Math.sin(a);
    return { x: dx*cs - dy*sn, y: dx*sn + dy*cs };
  }
  function toWorldPoint(body, local){
    var a = body.angle, cs = Math.cos(a), sn = Math.sin(a);
    return { x: body.position.x + local.x*cs - local.y*sn, y: body.position.y + local.x*sn + local.y*cs };
  }
  function ropeAnchorWorld(){
    if (!ropeConstraint) return null;
    return toWorldPoint(ropeConstraint.bodyB, ropeConstraint.pointB || {x:0,y:0});
  }
  function setFlying(v){
    flying = v;
    if (player){
      player.collisionFilter = playerFilter();
      if (flying){ Body.setVelocity(player, {x:0,y:0}); releaseRope(); }
    }
    showToast(flying ? "🕊 Flying on — fly straight through objects. Double-tap Space again to land" : "Flying off");
  }

  var groundedNext = false;
  var lastFallSpeed = 0;
  onStep("beforeUpdate", function(){
    var wasGrounded = grounded;
    grounded = groundedNext;
    groundedNext = false;
    // a landing worth hearing: you were airborne, coming down fast, and
    // now you're not
    if (player && !wasGrounded && grounded && lastFallSpeed > 5 && !flying){
      sfx("land");
      puff(player.position.x, player.position.y + PH/2, Math.min(9, 2 + (lastFallSpeed|0)),
           { color:"#E0D2B0", speed:1.1 + lastFallSpeed*0.05, g:0.05, spread:Math.PI*2, life:18, r:2.6 });
    }
    if (player) lastFallSpeed = player.velocity.y;
  });
  onStep("collisionActive", function(ev){
    if (!player) return;
    ev.pairs.forEach(function(p){
      if (p.bodyA === player || p.bodyB === player) groundedNext = true;
    });
  });
  onStep("collisionStart", function(ev){
    if (!player || mode !== "play") return;
    ev.pairs.forEach(function(p){
      var other = p.bodyA === player ? p.bodyB : (p.bodyB === player ? p.bodyA : null);
      if (!other) return;
      // Matter reports compound collisions at the PART level — pair.bodyA/
      // bodyB are the individual circle that actually touched, not the
      // compound — so `other` here is a part, and `other.parent` is the
      // real owning compound (Matter sets every part's .parent to the
      // top-level body, itself included).
      var parent = other.parent || other;
      if (!parent.plugin || !parent.plugin.isObject) return;
      // Only the dab you actually touched can hurt you. This used to ask
      // whether the OBJECT contained a hazard anywhere, but painting
      // fuses everything that touches into one object — so a single zap
      // dab added to a platform turned that whole platform, and anything
      // welded to it, lethal. Mix a hazard into your ground and you die
      // the instant you land, over and over, with nothing to show why.
      var touched = other.plugin && other.plugin.materialId ? matOf(other.plugin.materialId) : null;
      if (touched && touched.hazard && performance.now() > hazardSafeUntil){
        sfx("zap"); shake(11);
        puff(player.position.x, player.position.y, 20,
             { color:"#F2B705", speed:3.4, g:0.05, r:2.8, shape:"spark", life:24 });
        respawnPlayer("Ouch! Watch out for the zap hazard.");
      }
      if (other.plugin && other.plugin.materialId){
        var touchedMat = matOf(other.plugin.materialId);

          if (owner) noteCrumble(owner, other);

    });
  });
  // Dissolve parts crumble a moment after you touch them, in Play mode only.
  /* Dissolve crumbles a moment after you touch it, in Play mode only.

     The mark is kept on the OBJECT, in the object's own frame, rather
     than on the Matter part that was touched: a part is thrown away and
     rebuilt whenever the shape changes, and would forget it was
     crumbling halfway through. */
  function noteCrumble(obj, part){
    var lp = worldPtToLocal(obj, part.position.x, part.position.y);
    var list = obj.crumbs || (obj.crumbs = []);
    for (var i = 0; i < list.length; i++){
      var dx = list[i].x - lp.x, dy = list[i].y - lp.y;
      if (dx*dx + dy*dy < 16) return;                 // already going
    }
    list.push({ x: lp.x, y: lp.y, r: Math.max(7, partR(part)*1.3), t0: performance.now() });
  }
  onStep("beforeUpdate", function(){
    if (mode !== "play") return;
    var now = performance.now();
    objects.slice().forEach(function(o){
      if (!o.crumbs || !o.crumbs.length) return;
      var ready = [], keep = [];
      o.crumbs.forEach(function(c){ (now - c.t0 > DISSOLVE_MS ? ready : keep).push(c); });
      if (!ready.length) return;
      o.crumbs = keep;
      var holes = ready.map(function(c){ return [[circleRing(c.x, c.y, c.r, 0.6)]]; });
      ready.forEach(function(c){
        var w = localPtToWorld(o, c.x, c.y);
        puff(w.x, w.y, 3, { color:"#8B8374", speed:1.2, g:0.14, r:2.4, life:22 });
      });
      if (subLocalPoly(o, pgUnionMany(holes, GEOM_TOL), GEOM_TOL, "dissolve")){
        if (!o.pieces.length) removeObject(o);
        else rebuildFromPieces(o);
        sfx("erase");

  }

  var input = { left:false, right:false, up:false, down:false, jumpQueued:false };
  var lastSpaceTime = 0;
  var DOUBLE_TAP_MS = 320;
  var glueMode = false;
  var glueFirst = null;

  function handleJumpOrFlyToggle(){
    var now = performance.now();
    var isDouble = (now - lastSpaceTime) < DOUBLE_TAP_MS;
    lastSpaceTime = isDouble ? 0 : now;
    // Flying is a Build-mode convenience only. In Play the second tap of
    // a quick double-tap still has to jump — swallowing it meant every
    // other press did nothing when you were hammering the key.
    if (isDouble && mode === "build"){ setFlying(!flying); return; }
