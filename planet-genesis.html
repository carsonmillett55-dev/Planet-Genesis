<script>
/* ============================================================
   POLYGON GEOMETRY CORE
   ------------------------------------------------------------
   Every painted shape in the game is a real polygon, the way
   LittleBigPlanet stores material: a flat list of corners split
   into loops (one outer contour plus any number of holes), and
   painting, erasing and cutting are boolean union and difference
   on those contours. Not a pile of circles.

   Types, matching polygon-clipping's own:
     Ring       [[x,y], ...]        implicitly closed, no repeated last point
     Poly       [outer, hole, ...]
     MultiPoly  [Poly, ...]         each Poly is one CONNECTED piece

   Winding convention, enforced by pgClean and relied on everywhere:
     outer rings have POSITIVE shoelace, holes NEGATIVE.
   That makes canvas `fill()` (nonzero) do the right thing with
   holes for free, and it is also the order Matter.js wants its
   body vertices in (checked against Bodies.rectangle).
   ============================================================ */

    var s = 0, n = r.length, i, a, b;
    for (i = 0; i < n; i++){

    }
    return s;
  }

    var s = 0, i, j, p;
    for (i = 0; i < mp.length; i++){

    }
    return s / 2;
  }
  function pgVertexCount(mp){
    var n = 0, i, j;
    for (i = 0; i < mp.length; i++)
      for (j = 0; j < mp[i].length; j++) n += mp[i][j].length;
    return n;
  }
  function pgBounds(mp){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    var i, j, k, r, v;
    for (i = 0; i < mp.length; i++)
      for (j = 0; j < mp[i].length; j++){
        r = mp[i][j];
        for (k = 0; k < r.length; k++){
          v = r[k];
          if (v[0] < minX) minX = v[0];
          if (v[0] > maxX) maxX = v[0];
          if (v[1] < minY) minY = v[1];
          if (v[1] > maxY) maxY = v[1];
        }

  }
  // Area centroid of a single ring. Matter.js recentres a body's vertices
  // on their AREA centroid, so handing it this exact point as the body's
  // position leaves the vertices precisely where we put them.
  function ringCentroid(r){
    var cx = 0, cy = 0, a2 = 0, n = r.length, i, p, q, cr;
    for (i = 0; i < n; i++){
      p = r[i]; q = r[(i+1) % n];
      cr = p[0]*q[1] - q[0]*p[1];
      a2 += cr; cx += (p[0]+q[0])*cr; cy += (p[1]+q[1])*cr;

    for (i = 0; i < mp.length; i++)

        for (k = 0; k < n; k++){

        }

  var MIN_RING_AREA = 6;      // px^2 — below this a fragment is a speck
  var MIN_PIECE_AREA = 20;    // px^2 — below this a whole island is noise

  function pgClean(mp, tol){
    if (!mp || !mp.length) return [];
    tol = (tol == null) ? 0.55 : tol;
    var out = [], i, j;
    for (i = 0; i < mp.length; i++){

        var r = poly[j];
        // polygon-clipping closes its rings (last == first); drop the repeat

    white-space:nowrap;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--blue-dark); }
  .btn.ghost{ background:transparent; box-shadow:none; color:var(--paper); border:2px solid var(--paper-edge); }
  .btn.ghost:active{ transform:translateY(1px); }
  .btn.red{ background:var(--red); box-shadow:0 3px 0 var(--red-dark), 0 3px 6px rgba(0,0,0,.35); }
  .btn.yellow{ background:var(--yellow); color:var(--ink); box-shadow:0 3px 0 var(--yellow-dark),0 3px 6px rgba(0,0,0,.35); }
  .btn.purple{ background:var(--purple); box-shadow:0 3px 0 #55407a,0 3px 6px rgba(0,0,0,.35); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.small{ padding:.35rem .7rem; font-size:.72rem; }
  .btn.tiny{ padding:.22rem .55rem; font-size:.64rem; }

  .modebar{ display:flex; background:var(--desk-dark); border-radius:999px; padding:3px; gap:2px; }
  .modebar button{
    font-family:'Patrick Hand',cursive;
    font-size:1rem;
    border:none; background:transparent; color:var(--paper-edge);
    padding:.35rem .9rem; border-radius:999px; cursor:pointer;
  }
  .modebar button.active{ background:var(--yellow); color:var(--ink); }

  .filebar{ display:flex; align-items:center; gap:.4rem; }
  #levelNameInput, #nameInput{
    font-family:'Patrick Hand',cursive;
    font-size:1rem;
    background:var(--paper);
    border:2px solid var(--paper-edge);
    border-radius:8px;
    padding:.3rem .6rem;
    width:8.5rem;
    color:var(--ink);
  }
  #nameInput{ width:100%; font-size:1.1rem; }
  /* above the character studio, which is itself a full-screen overlay */
  #nameOverlay{ z-index:60; }
  #cloudStatus{ font-size:.65rem; color:var(--paper-edge); white-space:nowrap; }
  #cloudStatus b{ color:var(--stitch); }

  /* ---------- stage ---------- */
  main.stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.6rem;
    touch-action:none;
  }
  #canvasWrap{
    position:relative;
    width:100%;
    height:100%;
    background:var(--paper);
    border-radius:14px;
    box-shadow:0 10px 0 var(--paper-edge), 0 14px 24px rgba(0,0,0,.4);
    overflow:hidden;
    border:5px solid var(--stitch);
  }
  canvas#game{ display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  canvas#game[data-tool="move"]{ cursor:grab; }
  canvas#game[data-tool="move"]:active{ cursor:grabbing; }
  canvas#game[data-tool="bolt"]{ cursor:cell; }
  canvas#game.glueMode{ cursor:copy; }
  /* the brush footprint is drawn into the canvas itself,
     so the OS pointer is hidden wherever we draw our own */
  canvas#game.customCursor{ cursor:none; }

  #toast{
    position:absolute; top:12px; left:50%; transform:translate(-50%,-140%);
    pointer-events:none;   /* a passing notice must never eat a click or a paint stroke */
    background:var(--ink); color:var(--stitch);
    font-family:'Patrick Hand',cursive;
    font-size:1.1rem;
    padding:.4rem 1.1rem; border-radius:999px;
    opacity:0; transition:transform .25s ease, opacity .25s ease;
    pointer-events:none; z-index:20; white-space:nowrap;
  }
  #toast.show{ transform:translate(-50%,0); opacity:1; }

  .chip{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:.15rem;
    background:var(--paper);
    border:3px solid var(--paper-edge);
    border-radius:12px;
    padding:.35rem .5rem;
    cursor:pointer;
    min-width:3.6rem;
  }
  .chip.active{ border-color:var(--yellow); box-shadow:0 0 0 3px rgba(242,183,5,.5); }
  .chip .swatch{ width:1.6rem; height:1.6rem; border-radius:6px; border:2px solid var(--ink); }
  .chip label{ font-family:'Patrick Hand',cursive; font-size:.68rem; color:var(--ink); pointer-events:none; }
  .chip.tool .swatch{ display:flex; align-items:center; justify-content:center; font-size:1rem; background:var(--stitch); }
  .chip{ position:relative; }
  .chip .keyTag{ position:absolute; top:-.45rem; right:-.35rem; min-width:1.1rem; height:1.1rem; padding:0 .25rem; border-radius:.55rem;
    background:var(--ink); color:var(--paper); font-family:'Baloo 2',sans-serif; font-size:.62rem; font-weight:700; line-height:1.1rem; text-align:center;
    border:2px solid var(--paper); pointer-events:none; }
  .catalogGrid{ display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; flex:0 0 auto; }
  .colorGrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem; flex:0 0 auto; margin:.15rem 0 .35rem; }
  .colorSw{ aspect-ratio:1; border-radius:.42rem; border:2px solid rgba(43,27,18,.32); cursor:pointer; padding:0;
            box-shadow:inset 0 -2px 0 rgba(0,0,0,.16); transition:transform .08s ease, border-color .08s ease; }
  .colorSw:hover{ transform:translateY(-1px); }
  .colorSw.active{ border-color:#F2B705; box-shadow:0 0 0 2px rgba(242,183,5,.5), inset 0 -2px 0 rgba(0,0,0,.16); }
  .colorSw.natural{ position:relative; }
  .colorSw.natural::after{ content:"◆"; position:absolute; inset:0; display:flex; align-items:center;
                           justify-content:center; font-size:.62rem; color:rgba(43,27,18,.5); }

  /* ---------- HUD: layer / zoom / grid pills (Build) + score (Play).
     The pills live in one flex row (#viewHud) rather than each being
     absolutely placed, so they can never sit on top of each other. ---- */

  /* ---------- transport: undo/redo + pause/play state ---------- */
  #transport{
    position:absolute; top:.6rem; right:.6rem; z-index:18;
    display:flex; align-items:center; gap:.35rem;
  }
  #transport button{
    font-size:1rem; line-height:1; cursor:pointer;
    background:rgba(43,27,18,.72); color:var(--stitch);
    border:2px solid var(--stitch); border-radius:999px;
    width:2.1rem; height:2.1rem; display:flex; align-items:center; justify-content:center;
  }
  #transport button:hover{ background:var(--desk-dark); }
  #transport button[hidden]{ display:none !important; }
  #transport button#stateBtn.paused{ background:var(--yellow); color:var(--ink); border-color:var(--yellow-dark); }
  #pausedBanner{
    position:absolute; top:.6rem; left:50%; transform:translateX(-50%); z-index:17;
    background:var(--yellow); color:var(--ink); border:3px solid var(--yellow-dark);
    font-family:'Patrick Hand',cursive; font-size:1rem; letter-spacing:1px;
    padding:.2rem 1.1rem; border-radius:999px; pointer-events:none;
  }
  #pausedBanner[hidden]{ display:none !important; }
  #scoreHud{
    position:absolute; top:2.7rem; left:.6rem; z-index:16;
    background:rgba(242,183,5,.9); border:2px solid var(--ink); border-radius:999px;
    color:var(--ink); font-family:'Patrick Hand',cursive; font-weight:700; font-size:.9rem;
    padding:.3rem .9rem; pointer-events:none; white-space:nowrap;
  }
  #scoreHud[hidden]{ display:none !important; }

  /* ---------- personal menu: a popup box that hovers near
     the player, opened with E. Tabs down the side, content on the
     right. Replaces every on-screen button the old build had. ---------- */
  /* The menu's own colours live on the element as --pop-a/--pop-b so the
     Character > Menu Colour page can rewrite them at runtime, and everything
     inside picks the change up for free. */
  #personalMenu{
    position:absolute; z-index:25;
    width:27rem; max-width:92vw; max-height:78%;
    --pop-a:#D9B57F; --pop-b:#B8935B; --pop-ang:150deg;
    background:linear-gradient(var(--pop-ang), var(--pop-a), var(--pop-b));
    border:4px solid var(--stitch); border-radius:18px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #personalMenu[hidden]{ display:none !important; }
  /* LBP2 puts the bags in a row across the top, not a list down the side. */
  #pmBags{
    display:flex; gap:.25rem; padding:.4rem .45rem .3rem;
    background:rgba(67,39,20,.42); border-bottom:2px solid rgba(43,27,18,.35);
  }
  #pmBags button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:.1rem;
    font-family:'Patrick Hand',cursive; font-size:.62rem; line-height:1.1;
    color:var(--stitch); background:transparent;
    border:2px solid transparent; border-radius:10px;
    padding:.3rem .15rem; cursor:pointer; text-align:center;
  }
  #pmBags button .bagIcon{ font-size:1.15rem; line-height:1; }
  #pmBags button:hover{ background:rgba(246,236,217,.14); }
  #pmBags button.active{
    background:var(--yellow); border-color:var(--yellow-dark); color:var(--ink);
  }
  #pmMain{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #pmPages{ display:flex; gap:.25rem; padding:.35rem .45rem 0; flex-wrap:wrap; }
  #pmPages[hidden]{ display:none !important; }
  #pmPages button{
    font-family:'Patrick Hand',cursive; font-size:.74rem; color:var(--ink);
    background:rgba(246,236,217,.55); border:2px solid rgba(43,27,18,.25);
    border-radius:8px 8px 0 0; padding:.22rem .5rem; cursor:pointer;
  }
  #pmPages button.active{ background:var(--stitch); border-color:var(--ink); }
  #pmBody{ flex:1; min-width:0; padding:.7rem; overflow-y:auto; display:flex; flex-direction:column; gap:.6rem; }
  /* Gradient pickers on the Menu Colour page. */
  .gradPresets{ display:flex; gap:.35rem; flex-wrap:wrap; }
  .gradPresets button{
    width:2.4rem; height:2.4rem; border-radius:9px; cursor:pointer;
    border:2px solid var(--ink);
  }
  .gradPresets button.active{ border-color:var(--yellow); box-shadow:0 0 0 2px var(--yellow-dark); }
  .gradPickers{ display:flex; gap:.6rem; }
  .gradPickers label{ flex:1; display:flex; flex-direction:column; gap:.2rem; font-size:.74rem; }
  .gradPickers input[type="color"]{ width:100%; height:2rem; border:2px solid var(--ink); border-radius:8px; background:none; cursor:pointer; }
  #pmBody h3{ font-family:'Patrick Hand',cursive; margin:0; font-size:1.1rem; color:var(--ink); }
  /* Ghost buttons are paper-coloured by default, which is invisible on
     any of the paper-coloured panels — restate them in ink there. */
  #pmBody .btn.ghost, #pauseBody .btn.ghost, .panel .btn.ghost,
  #ceLeft .btn.ghost, #ceRight .btn.ghost, #ceHeader .btn.ghost{
    color:var(--ink); border-color:var(--ink);
  }
  .pmPane[hidden]{ display:none !important; }
  .settingRow{ display:flex; flex-direction:column; gap:.25rem; font-size:.78rem; }
  .settingRow input[type="range"]{ width:100%; }
  .settingRow .val{ font-family:'Patrick Hand',cursive; font-size:.85rem; }
  /* the value is a field: click it and type the number you want */
  .settingRow input.val{ width:6.5em; text-align:right; background:transparent; color:inherit;
    border:1px solid transparent; border-radius:5px; padding:0 .25em; cursor:text; }
  .settingRow input.val:hover{ border-color:rgba(43,27,18,.25); }
  .settingRow input.val:focus{ background:#fff; border-color:var(--yellow-dark); outline:none; }
  .kbdList{ font-size:.72rem; line-height:1.6; }
  .kbdList b{ display:inline-block; min-width:7.2rem; color:var(--ink); }
  .infoSubTabs{ display:flex; gap:.3rem; }
  .infoSubTabs button{
    flex:1; font-family:'Patrick Hand',cursive; font-size:.8rem;
    padding:.35rem .3rem; border-radius:8px; border:2px solid var(--paper-edge);
    background:var(--stitch); color:var(--ink); cursor:pointer;
  }
  .infoSubTabs button.active{ background:var(--yellow); border-color:var(--yellow-dark); }
  .infoList{ display:flex; flex-direction:column; gap:.45rem; overflow-y:auto; }
  .infoRow{ display:flex; gap:.55rem; background:var(--stitch); border-radius:10px; padding:.4rem .55rem; align-items:flex-start; }
  .infoRow .swatch{ flex:0 0 auto; width:1.7rem; height:1.7rem; border-radius:6px; border:2px solid var(--ink); margin-top:.05rem; }
  .infoRow .swatch.tool{ display:flex; align-items:center; justify-content:center; font-size:1rem; background:var(--paper); }
  .infoRow .txt{ flex:1; min-width:0; }
  .infoRow .txt b{ font-family:'Patrick Hand',cursive; font-size:.88rem; color:var(--ink); display:block; }
  .infoRow .txt span{ font-size:.72rem; color:var(--ink); opacity:.85; }

  /* ---------- character creator ---------- */
  .charPalette{ display:flex; gap:.3rem; flex-wrap:wrap; }
  .cswatch.eraseSw{
    background:#fff repeating-conic-gradient(#0002 0% 25%, transparent 0% 50%) 0/8px 8px;
    display:flex; align-items:center; justify-content:center; font-size:.75rem; color:var(--ink);
  }
  .charPreviewCanvas{
    border:2px solid var(--paper-edge); border-radius:6px;
    background:radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.35), transparent 70%), var(--paper);
  }

  /* ---------- full-screen character editor ---------- */
  #charEditor{
    position:relative;
    background:var(--paper); border:5px solid var(--stitch); border-radius:16px;
    width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  /* the studio's settings: a card that drops down from the header's ⚙ */
  #ceKeysPanel{
    position:absolute; right:.7rem; top:3.4rem; z-index:5; width:17rem; max-height:calc(100% - 4.5rem); overflow-y:auto;
    background:var(--paper); border:3px solid var(--ink); border-radius:12px; padding:.6rem .7rem;
    display:flex; flex-direction:column; gap:.35rem; box-shadow:0 8px 22px rgba(0,0,0,.35);
  }
  #ceKeysPanel[hidden]{ display:none; }
  #ceKeysPanel h4{ font-family:'Patrick Hand',cursive; margin:0; font-size:1rem; color:var(--ink); }
  #ceKeysPanel .btn.ghost{ color:var(--ink); border-color:var(--ink); }
  #ceHeader #ceKeysBtn.ghost{ color:var(--stitch); border-color:var(--stitch); }
  #ceHeader{
    display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:.5rem .7rem; background:var(--desk-dark); border-bottom:3px dashed var(--stitch);
  }
  #ceHeader h2{ font-family:'Patrick Hand',cursive; color:var(--stitch); margin:0; font-size:1.2rem; margin-right:auto; }
  #ceMain{ flex:1; min-height:0; display:flex; gap:.6rem; padding:.6rem; }
  #ceLeft, #ceRight{
    flex:0 0 12.5rem; min-width:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:.5rem;
  }
  /* the columns scroll; nothing in them shrinks — the frame strip was
     being crushed to a sliver as the left column filled with steps */
  #ceLeft > *, #ceRight > *{ flex-shrink:0; }
  #ceStage{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:.4rem;
  }
  #ceCanvas{
    touch-action:none; cursor:crosshair; border:3px solid var(--ink); border-radius:10px;
    background:#fff repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 0/22px 22px;
    max-width:100%; max-height:100%;
  }
  #ceLeft h4, #ceRight h4{
    font-family:'Patrick Hand',cursive; margin:.2rem 0 0; font-size:.95rem; color:var(--ink);
  }
  .ceChips{ display:flex; flex-wrap:wrap; gap:.25rem; }
  .ceChips button{
    font-family:'Patrick Hand',cursive; font-size:.78rem; cursor:pointer;
    padding:.25rem .5rem; border-radius:8px;
    border:2px solid var(--paper-edge); background:var(--stitch); color:var(--ink);
  }
  .ceChips button.active{ background:var(--yellow); border-color:var(--yellow-dark); }
  .cePicker{ width:1.9rem; height:1.9rem; padding:0; border:2px solid var(--ink); border-radius:50%; background:none; cursor:pointer; }
  .cePickWrap{ display:flex; align-items:center; gap:.4rem; cursor:pointer; padding:.25rem .45rem; border-radius:10px;
    border:2px solid var(--pick, #E8567A); background:var(--paper); font-family:'Patrick Hand',cursive; font-size:.82rem; color:var(--ink); }
  .cePickWrap .cePicker{ border:3px solid transparent; background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00) border-box; }
  .cePickWrap:hover{ background:var(--stitch); }
  .ceKeyRow{ display:flex; align-items:center; justify-content:space-between; gap:.3rem; font-size:.74rem; }
  .cePicker::-webkit-color-swatch-wrapper{ padding:0; }
  .cePicker::-webkit-color-swatch{ border:none; border-radius:50%; }
  .ceFrameStrip{ display:flex; flex-wrap:wrap; gap:.3rem; max-height:11rem; overflow-y:auto; }
  .ceFrameStrip .fr{
    position:relative; width:2.6rem; height:3.4rem; border-radius:6px; cursor:pointer;
    border:2px solid var(--paper-edge); background:var(--paper); overflow:hidden;
  }
  .ceFrameStrip .fr.active{ border-color:var(--yellow); box-shadow:0 0 0 2px rgba(242,183,5,.5); }
  .ceFrameStrip .fr canvas{ display:block; width:100%; height:100%; }
  .ceFrameStrip .fr .n{
    position:absolute; bottom:0; right:0; background:rgba(43,27,18,.7); color:var(--stitch);
    font-size:.55rem; padding:0 .2rem; border-top-left-radius:4px;
  }
  .ceRow{ display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; }
  .myCharRow{ display:flex; align-items:center; gap:.4rem; background:var(--stitch); border-radius:8px; padding:.25rem .4rem; }
  .myCharRow .nm{ flex:1; font-family:'Patrick Hand',cursive; font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- pause / settings menu ---------- */
  #pausePanel{ max-width:30rem; }
  .kbRow{
    display:flex; align-items:center; gap:.5rem;
    background:var(--stitch); border-radius:8px; padding:.3rem .5rem;
  }
  .kbRow .act{ flex:1; font-size:.8rem; }
  .kbRow .key{
    font-family:'Patrick Hand',cursive; font-size:.8rem; background:var(--paper);
    border:2px solid var(--paper-edge); border-radius:6px; padding:.1rem .5rem; min-width:5.5rem; text-align:center;
  }
  .kbRow .key.listening{ background:var(--yellow); border-color:var(--yellow-dark); }
  .noteText{ font-size:.72rem; color:var(--ink); opacity:.8; line-height:1.4; }
  .myObjRow{ display:flex; align-items:center; gap:.5rem; background:var(--stitch); border-radius:10px; padding:.3rem .5rem; }
  .stickerGrid{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .stickerCell{ position:relative; width:5.2rem; display:flex; flex-direction:column; align-items:center; gap:.2rem; padding:.35rem; border-radius:10px; cursor:pointer;
    border:2px solid var(--paper-edge); background:var(--stitch); color:var(--ink); font-family:'Patrick Hand',cursive; font-size:.75rem; }
  .stickerCell.active{ border-color:var(--yellow-dark); background:var(--yellow); }
  .stickerCell canvas{ width:3.6rem; height:3.6rem; background:#fff repeating-conic-gradient(#00000010 0% 25%, transparent 0% 50%) 0/12px 12px; border-radius:6px; }
  .stickerCell .nm{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stickerCell .del{ position:absolute; top:-.3rem; right:-.3rem; }
  .myObjRow .thumb{ width:1.6rem; height:1.6rem; border-radius:6px; background:var(--purple); border:2px solid var(--ink); }
  .myObjRow .nm{ flex:1; font-family:'Patrick Hand',cursive; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- right-click context menu on built objects ---------- */
  /* ---------- the object box: one place for everything about what you
     have selected. Docked to the right of the stage, but yours to drag
     about by its header and resize by its corner; both are remembered.
     It replaces the strip that used to follow the selection around and
     sit on top of it, and the right-click popup, which held half the
     same buttons. Bolts and gadgets will show their settings here too. */
  #objPanel{
    position:absolute; z-index:30; right:.8rem; top:3.4rem;
    width:15.5rem; min-width:12rem; max-width:70%;
    min-height:9rem; max-height:88%; height:auto;
    background:var(--paper); border:3px solid var(--stitch); border-radius:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    display:flex; flex-direction:column; overflow:hidden;
    resize:both;
    animation:popIn .13s ease-out;
  }
  #objPanel[hidden]{ display:none !important; }
  #opHead{
    display:flex; align-items:center; gap:.4rem; padding:.4rem .55rem;
    background:var(--desk-dark); color:var(--stitch); cursor:move; user-select:none;
    flex:0 0 auto;
  }
  #opHead .t{ flex:1; font-family:'Patrick Hand',cursive; font-size:.98rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #opHead .grip{ opacity:.55; font-size:.8rem; letter-spacing:-.1em; }
  #opHead button{
    background:transparent; border:none; color:var(--stitch); cursor:pointer;
    font-size:1rem; line-height:1; padding:.1rem .3rem; border-radius:6px;
  }
  #opHead button:hover{ background:rgba(246,236,217,.18); }
  #opBody{ flex:1; min-height:0; overflow-y:auto; padding:.5rem .6rem .6rem; display:flex; flex-direction:column; gap:.5rem; }
  .opSec h4{
    margin:0 0 .25rem; font-family:'Patrick Hand',cursive; font-size:.72rem;
    color:var(--paper-edge); text-transform:uppercase; letter-spacing:.05em;
  }
  .opInfo{ font-size:.76rem; color:var(--ink); line-height:1.45; }
  .opInfo b{ font-family:'Patrick Hand',cursive; font-size:.9rem; }
  .opRow{ display:flex; gap:.3rem; flex-wrap:wrap; }
  .opRow button{
    flex:1 1 auto; min-width:2.4rem; height:1.9rem; padding:0 .5rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:.3rem;
    background:var(--stitch); color:var(--ink); border:2px solid rgba(43,27,18,.25);
    border-radius:9px; font-family:'Baloo 2',sans-serif; font-size:.78rem; line-height:1;
  }
  .opRow button:hover{ background:var(--yellow); border-color:var(--yellow-dark); }
  .opRow button.on{ background:var(--yellow); border-color:var(--yellow-dark); }
  .opRow button.red{ background:#E4574B; color:#fff; border-color:#B3261E; }
  .opRow button.red:hover{ background:#F0675B; }
  .opRow button.wide{ flex-basis:100%; }
  .opRow .ro{
    display:flex; align-items:center; padding:0 .4rem; height:1.9rem;
    font-family:'Patrick Hand',cursive; font-size:.82rem; color:var(--ink);
  }
  #objPanel .settingRow{ margin:0; }

  /* ---------- modal ---------- */
  .overlay{
    position:absolute; inset:0; background:rgba(20,12,7,.72);

<script>
(function(){
  "use strict";

  /* ============================================================
     0. Capability bootstrap (db).
     ============================================================ */
  var dbPromise = (typeof window.claude !== "undefined" && window.claude.use)
    ? window.claude.use("db")
    : Promise.resolve(null);
  var dbNS = null;
  var cloudStatusEl = document.getElementById("cloudStatus");
  dbPromise.then(function(d){
    dbNS = d;
    cloudStatusEl.innerHTML = d ? "☁ <b>cloud sync on</b>" : "💾 local only";
  });
  setTimeout(function(){
    if (cloudStatusEl.textContent.indexOf("checking") !== -1){
      cloudStatusEl.innerHTML = "💾 local only";
    }
  }, 4000);

  /* ============================================================
     1. Constants & materials
     ============================================================ */
  /* The map: sixteen times the area it had (4800 × 2400 until 2026-09-11).
     Carson: "it needs to be SO MUCH BIGGER". Both a multiple of the water
     cell, and a level saved on the old map is put at the bottom-left of
     this one when it loads (`migrateWorldSize`), so its ground is still
     the ground and the new room is above and to the right. */
  var WORLD_W = 19200, WORLD_H = 9600;
  var OLD_WORLD_W = 4800, OLD_WORLD_H = 2400;   // what a level file without worldW/worldH was built on
  var VIEW_W = 1400, VIEW_H = 800;
  var START_FLOOR_W = 1600;
  var PLACED_CAP = 1500;
  var BLOCK = 30;
  var BRUSH_R = BLOCK / 2;
  var BRUSH_SPACING = BRUSH_R * 0.85;
  var FUSE_R = BRUSH_R * 2.6; // painting within this of an existing object grows it instead of starting a new one

  // Most materials are dynamic now — real weight, real gravity — the
  // way LBP objects behave until you anchor them. Dark Matter is the
  // one material that has no gravity at all: paint it into (or attach
  // it to) any object and the WHOLE object becomes fixed in place.
  var MATERIALS = {
    wood:      { label:"Timber",       color:"#9C6B3E", dark:"#6E4A29", friction:0.9, restitution:0.05, density:0.006, grabbable:false, hazard:false, floatForce:0, tex:"grain" },
    sponge:    { label:"Grip Sponge",  color:"#D9DD6B", dark:"#9BA23A", friction:0.95,restitution:0.1,  density:0.004, grabbable:true,  hazard:false, floatForce:0, tex:"dots" },
    rubber:    { label:"Bounce",       color:"#E8567A", dark:"#B33455", friction:0.6, restitution:1.05, density:0.004, grabbable:false, hazard:false, floatForce:0, tex:"shine" },
    metal:     { label:"Heavy Metal",  color:"#98A3B3", dark:"#5F6975", friction:0.5, restitution:0.02, density:0.03,  grabbable:false, hazard:false, floatForce:0, tex:"rivets" },
    ice:       { label:"Ice",          color:"#BEE7F2", dark:"#7FB9CE", friction:0.02,restitution:0.05, density:0.005, grabbable:false, hazard:false, floatForce:0, tex:"crystal" },
    dissolve:  { label:"Dissolve",     color:"#C9C2B4", dark:"#8B8374", friction:0.8, restitution:0.05, density:0.005, grabbable:false, hazard:false, floatForce:0, tex:"dashed", dissolve:true },
    floaty:    { label:"Floaty",       color:"#8ED0E8", dark:"#4E9CBB", friction:0.3, restitution:0.4,  density:0.0018,grabbable:false, hazard:false, floatForce:2.1, tex:"bubble" },
    hazard:    { label:"Zap Hazard",   color:"#F2B705", dark:"#1A1A1A", friction:0.8, restitution:0.1,  density:0.005, grabbable:false, hazard:true,  floatForce:0, warn:true },
    darkmatter:{ label:"Dark Matter",  color:"#3A2E52", dark:"#1C1630", friction:0.6, restitution:0,    density:0.01,  grabbable:false, hazard:false, floatForce:0, isDarkMatter:true },
    // See-through, and it doesn't hide what's behind it on any layer.
    glass:     { label:"Glass",        color:"#C7EAF2", dark:"#6FA6B8", friction:0.25,restitution:0.2,  density:0.006, grabbable:false, hazard:false, floatForce:0, glass:true },
    // Not a solid at all: it glows, it holds itself up, and you walk
    // straight through it. Turn the world light down and it comes into
    // its own.
    light:     { label:"Light",        color:"#FFE9A8", dark:"#E0B34A", friction:0.4, restitution:0.1,  density:0.002, grabbable:false, hazard:false, floatForce:0, emitter:true },
    // Water is not a solid at all — painting it pours into the fluid
    // grid instead of building a body. Its density is what everything
    // else floats or sinks against.
    water:     { label:"Water",        color:"#4FA9D6", dark:"#2F86A6", friction:0.02,restitution:0,    density:0.009, grabbable:false, hazard:false, floatForce:0, tex:"wave", isFluid:true },
    // the bodies of drawn things — a creature's, a drawn object's — never in the catalogue; the drawing covers them
    // the bodies of drawn things — never in the catalogue. Not "creature" and
    // "drawn": those are TOOL names too, and matOf(currentTool) finding a
    // material for the Custom creature tool sent a click in a drag-out shape
    // mode down the painting path — a green square instead of a creature
    creaturebody: { label:"Creature",     color:"#8CD17D", dark:"#5F9E5A", friction:0.9, restitution:0.05, density:0.004, grabbable:false, hazard:false, floatForce:0 },
    drawnbody:    { label:"Drawn object", color:"#C9C2B4", dark:"#8B8374", friction:0.8, restitution:0.05, density:0.006, grabbable:false, hazard:false, floatForce:0 },
    // pseudo-materials for painting a creature's areas — never in the catalogue, never a body
    maskweak:  { label:"Weak spot",    color:"#F6ECD9", dark:"#B3870A", friction:0, restitution:0, density:0.001, grabbable:false, hazard:false, floatForce:0, isMask:true },
    maskdanger:{ label:"Danger",       color:"#E4574B", dark:"#B3261E", friction:0, restitution:0, density:0.001, grabbable:false, hazard:false, floatForce:0, isMask:true }
  };
  var MATERIAL_ORDER = ["wood","sponge","rubber","metal","ice","dissolve","floaty","hazard","darkmatter","glass","light","water"];

  /* ---- Colour ---------------------------------------------------------
     Every material can be painted in any of these. It keeps all of its
     physics and simply comes out the colour you picked — and, the way
     LittleBigPlanet does it, the SAME material in a DIFFERENT colour
     counts as a different material while you build: the two sit beside
     each other and cut each other instead of merging, which is the only
     way to draw detail into a shape without losing it.

     A material key is therefore "<base>" for the natural colour, or
     "<base>:<n>" for swatch n. Everything downstream reads the key
     through matOf(), so a colour costs nothing to store and a level
     written before colours existed still loads: a bare "wood" is just
     wood in its natural colour.
     -------------------------------------------------------------------- */
  var MAT_COLORS = [
    "#FFFFFF","#EDE6D6","#CFC7B6","#A39B8B","#6E6759","#413B32","#1E1B16",
    "#F7C9A0","#F2A65A","#E07B39","#C1541F","#F49A9A","#DE5B5B","#A83232",
    "#BEE7F2","#7FC7E8","#3F9BD1","#2A6FA8","#C9B8FF","#9B7FE0","#6B4FB0",
    "#E4EFA8","#C3DD6B","#86C25A","#4E8F3D","#F7E08A","#E8C33F","#B0891F"
  ];
  var MAT_COLOR_NAMES = [
    "White","Bone","Ash","Stone","Slate","Charcoal","Ink",
    "Peach","Apricot","Amber","Rust","Blush","Coral","Brick",
    "Ice","Sky","Cobalt","Deep","Lilac","Violet","Plum",
    "Meadow","Lime","Fern","Forest","Cream","Gold","Bronze"
  ];
  // Darker (f < 0) or lighter (f > 0) — used to derive an edge colour for
  // whatever colour someone picks, so bevels stay right automatically.
  function shadeHex(hex, f){
    var v = parseInt(hex.slice(1), 16);
    var r = (v>>16)&255, g = (v>>8)&255, b = v&255;
    if (f < 0){ r = Math.round(r*(1+f)); g = Math.round(g*(1+f)); b = Math.round(b*(1+f)); }
    else { r = Math.round(r + (255-r)*f); g = Math.round(g + (255-g)*f); b = Math.round(b + (255-b)*f); }
    return "#" + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
  }
  function matBase(key){ var c = (key||"").indexOf(":"); return c > 0 ? key.slice(0, c) : (key||""); }
  function matTint(key){ var c = (key||"").indexOf(":"); return c > 0 ? (parseInt(key.slice(c+1), 10) || 0) : 0; }
  function matKey(base, tint){ return tint ? (base + ":" + tint) : base; }
  var _matCache = {};
  /* ---- Custom materials ---------------------------------------------
     A material you drew: a square tile (a studio drawing) that repeats
     across whatever is painted with it, and its own grip, bounce, weight,
     grabbable, deadly, floats. Ids are "u_<n>" — no colon, so the tint
     parser leaves them alone. `customMats` is everything this session
     knows (this device's own, and any a loaded level carried); `myMats`
     is the ones on this device's palette. A level file embeds the
     definitions of the ones it uses (`materials`), registered before its
     objects unpack, since an unknown material is dropped on load. */
  var customMats = {}, myMats = [];
  try { (JSON.parse(localStorage.getItem("pg_my_mats") || "[]") || []).forEach(function(d){ if (d && d.id) { customMats[d.id] = normalizeCustomMat(d); myMats.push(d.id); } }); } catch(e){ myMats = []; }
  function normalizeCustomMat(d){
    return { id: String(d.id), name: String(d.name || "My material").slice(0, 30),
             tile: normalizeDrawing(d.tile, 10, 10), tilePx: Math.max(16, Math.min(400, +d.tilePx || 64)),
             friction: Math.max(0, Math.min(1.5, +d.friction != null && isFinite(+d.friction) ? +d.friction : 0.8)),
             restitution: Math.max(0, Math.min(1.2, +d.restitution != null && isFinite(+d.restitution) ? +d.restitution : 0.1)),
             density: Math.max(0.0005, Math.min(0.05, +d.density != null && isFinite(+d.density) ? +d.density : 0.006)),
             grabbable: !!d.grabbable, hazard: !!d.hazard, floats: !!d.floats };
  }
  function packCustomMat(d){ return { id: d.id, name: d.name, tile: d.tile, tilePx: d.tilePx, friction: d.friction, restitution: d.restitution, density: d.density, grabbable: d.grabbable, hazard: d.hazard, floats: d.floats }; }
  function persistMyMats(){ try { localStorage.setItem("pg_my_mats", JSON.stringify(myMats.map(function(id){ return customMats[id]; }).filter(Boolean).map(packCustomMat))); } catch(e){ showToast("Couldn't save — storage is full."); } }
  function registerCustomMat(d){
    var def = normalizeCustomMat(d);
    customMats[def.id] = def;
    delete _matCache[def.id];
    def._pattern = null; def._rec = null;
    return def;
  }
  // the average colour of the tile, for the bevel and ink round a shape of it
  function customMatColour(def){
    var cv = drawingCanvas(def.tile, 32, 32), px = cv.getContext("2d").getImageData(0, 0, 32, 32).data, r = 0, g = 0, b = 0, n = 0;
    for (var i = 0; i < px.length; i += 4){ if (px[i + 3] < 40) continue; r += px[i]; g += px[i + 1]; b += px[i + 2]; n++; }
    if (!n) return "#A89F91";
    var hx = function(v){ return ("0" + Math.round(v / n).toString(16)).slice(-2); };
    return "#" + hx(r) + hx(g) + hx(b);
  }
  function customMatRec(id){
    var def = customMats[id];
    if (!def) return null;
    if (def._rec) return def._rec;
    var col = customMatColour(def);
    def._rec = { label: def.name, color: col, dark: shadeHex(col, -0.36), friction: def.friction, restitution: def.restitution, density: def.density,
                 grabbable: def.grabbable, hazard: def.hazard, floatForce: def.floats ? 2.1 : 0, custom: true, id: def.id, tile: def.tile, tilePx: def.tilePx };
    return def._rec;
  }
  // the tile as a repeating pattern, in whatever frame the caller is drawing in
  var _patCtx = null;
  function customMatPattern(rec){
    var def = customMats[rec.id];
    if (!def) return null;
    var key = (def.tile._rev || 0) + ":" + def.tilePx;
    if (def._pattern && def._patKey === key) return def._pattern;
    if (!_patCtx) _patCtx = document.createElement("canvas").getContext("2d");
    var px = Math.max(16, Math.min(512, Math.round(def.tilePx * 2)));
    var cv = drawingCanvas(def.tile, px, px);
    // the pattern's own transform scales the raster to the tile's world size
    var pat = _patCtx.createPattern(cv, "repeat");
    if (pat && pat.setTransform && typeof DOMMatrix !== "undefined") pat.setTransform(new DOMMatrix([def.tilePx / px, 0, 0, def.tilePx / px, 0, 0]));
    def._pattern = pat; def._patKey = key;
    return pat;
  }
  // every object painted with this material re-reads it (a new tile, new props)
  function customMatChanged(id){
    var def = customMats[id]; if (!def) return;
    def._rec = null; def._pattern = null; delete _matCache[id];
    objects.forEach(function(o){
      if (!o.pieces.some(function(pc){ return matBase(pc.m) === id; })) return;
      o.geomRev = (o.geomRev || 0) + 1; o._paths = null;
      refreshObjectPhysics(o);
    });
  }
  function usedCustomMats(){
    var out = {};
    objects.forEach(function(o){ o.pieces.forEach(function(pc){ var b = matBase(pc.m); if (customMats[b]) out[b] = packCustomMat(customMats[b]); }); });
    return out;
  }
  function matOf(key){
    if (!key || typeof key !== "string") return null;
    if (_matCache.hasOwnProperty(key)) return _matCache[key];
    var base = matBase(key), tint = matTint(key);
    var b = MATERIALS[base] || customMatRec(base);
    if (!b){ _matCache[key] = null; return null; }
    if (!tint || tint < 1 || tint > MAT_COLORS.length){ _matCache[key] = b; return b; }
    var col = MAT_COLORS[tint-1], rec = {}, k;
    for (k in b) rec[k] = b[k];
    rec.color = col;
    rec.dark = shadeHex(col, -0.36);
    rec.base = base; rec.tint = tint;
    rec.label = b.label + " · " + MAT_COLOR_NAMES[tint-1];
    _matCache[key] = rec;
    return rec;
  }
  /* The number row, 1 to 9, is the tools: the editing tools first, then
     the connectors and the things reached for most. Carson asked for the
     editing tools on the numbers; the materials came off them to make
     room. Each chip in the Tools bag shows its number. */
  var QUICK_TOOLS = [
    { id:"move",  label:"Move & Select" },
    { id:"erase", label:"Erase" },
    { id:"vacuum", label:"Vacuum" }
  ];
  function quickKeyFor(id){ for (var i = 0; i < QUICK_TOOLS.length; i++) if (QUICK_TOOLS[i].id === id) return i + 1; return 0; }
  MATERIAL_ORDER.forEach(function(id){ if (MATERIALS[id]){ MATERIALS[id].base = id; MATERIALS[id].tint = 0; } });

  /* ---- Character art model -------------------------------------------
     A drawing is a list of SMOOTH BRUSH STROKES, not a pixel grid, so
     the character editor paints the same way the level does. Every
     coordinate is normalised 0..1 inside the drawing's own box, which
     means one drawing renders crisply at any character size, in any
     preview thumbnail, and on the big editor canvas — nothing is ever
     resampled from a fixed pixel resolution.
       stroke = { c: "#rrggbb" (null = eraser), w: width as a fraction
                  of the box height, p: [x0,y0, x1,y1, ...] }
     -------------------------------------------------------------------- */
  function blankDrawing(){ return []; }
  function drawingHasArt(d){ return !!d && d.length > 0; }
  // Old saves stored a flat pixel grid. Rather than throw away art
  // somebody already drew, every filled cell becomes one round dab.
  function pixelsToStrokes(arr, gw, gh){
    var out = [];
    if (!Array.isArray(arr)) return out;
    for (var row = 0; row < gh; row++){
      for (var col = 0; col < gw; col++){
        var c = arr[row*gw + col];
        if (!c || typeof c !== "string") continue;
        out.push({ c:c, w: 1.5/gh, p:[ (col+0.5)/gw, (row+0.5)/gh ] });
      }
    }
    return out;
  }
  function normalizeDrawing(d, gw, gh){
    if (Array.isArray(d) && d.length && (typeof d[0] === "string" || d[0] === null)) return pixelsToStrokes(d, gw, gh);
    if (!Array.isArray(d)) return blankDrawing();
    return d.filter(function(s){ return s && Array.isArray(s.p) && s.p.length >= 2; });
  }
  // Paint a drawing into any 2D context, scaled to a w x h box.
  function paintDrawing(c2d, strokes, w, h){
    if (!strokes || !strokes.length) return;
    c2d.save();
    c2d.lineJoin = "round"; c2d.lineCap = "round";
    for (var i = 0; i < strokes.length; i++){
      var s = strokes[i], pts = s.p;
      if (!pts || pts.length < 2) continue;
      c2d.globalCompositeOperation = s.c ? "source-over" : "destination-out";
      c2d.globalAlpha = s.a != null ? s.a : 1;
      if (s.f){
        // a filled shape: the points are its outline, `h` any holes in it (a bucket fill round an island)
        if (pts.length < 6) continue;
        c2d.fillStyle = s.c || "#000";
        c2d.beginPath();
        c2d.moveTo(pts[0]*w, pts[1]*h);
        for (var q = 2; q < pts.length; q += 2) c2d.lineTo(pts[q]*w, pts[q+1]*h);
        c2d.closePath();
        if (s.h) for (var hi = 0; hi < s.h.length; hi++){
          var hr = s.h[hi]; if (!hr || hr.length < 6) continue;
          c2d.moveTo(hr[0]*w, hr[1]*h);
          for (var hq = 2; hq < hr.length; hq += 2) c2d.lineTo(hr[hq]*w, hr[hq+1]*h);
          c2d.closePath();
        }
        c2d.fill(s.h && s.h.length ? "evenodd" : "nonzero");
        continue;
      }
      c2d.strokeStyle = s.c || "#000";
      c2d.lineWidth = Math.max(0.6, (s.w || 0.1) * h);
      c2d.beginPath();
      c2d.moveTo(pts[0]*w, pts[1]*h);
      if (pts.length === 2) c2d.lineTo(pts[0]*w + 0.01, pts[1]*h); // a single tap is a dot
      else for (var j = 2; j < pts.length; j += 2) c2d.lineTo(pts[j]*w, pts[j+1]*h);
      c2d.stroke();
    }

  function touchDrawing(strokes){ if (strokes) strokes._rev = (strokes._rev || 0) + 1; }

    cv.width = w; cv.height = h;

  /* ---- Batched rebuilds ------------------------------------------------

     one per step. Everything in between still reads correctly, because

  /* Add a world-space polygon of `materialId` to an object, applying

  function addPolyToObject(obj, materialId, worldPoly, tol){
    worldPoly = pgIntersect(worldPoly, WORLD_MP, tol || GEOM_TOL);

    var obj = { id:"o"+(objCounter++), body:null, parts:[], pieces:pieces, layer:layer,

  function newObjectFromPoly(materialId, worldPoly, layer){

    if (!worldPoly || !worldPoly.length) return null;
    worldPoly = pgIntersect(worldPoly, WORLD_MP, GEOM_TOL);   // nothing is built outside the map
    if (!worldPoly || !worldPoly.length) return null;
    var c = pgCentroid(worldPoly);

                pieces:[ { m: materialId, poly: pgTranslate(worldPoly, -body.position.x, -body.position.y) } ],

                decorative: layer !== MID_LAYER, forcedStatic:false, drawing:false, geomRev:0 };
    if (paintAlpha < 1) obj.alpha = paintAlpha;
    body.plugin = { isObject:true, obj:obj };
    World.add(world, body);
    objects.push(obj);

    objects.forEach(function(o){

      var ob = o.body.bounds;
      if (ob.max.x < wb.x - reach || ob.min.x > wb.x2 + reach ||
          ob.max.y < wb.y - reach || ob.min.y > wb.y2 + reach) return;
      var local = objToLocal(o, worldPoly);
      for (var i = 0; i < o.pieces.length; i++){
        if (pgIntersects(o.pieces[i].poly, local)){ hits.push(o); return; }
      }

      // the way a brush stroke that grazes an edge does in LBP

        for (var j = 0; j < o.pieces.length; j++){

  function removeObject(obj){

    gadgets.slice().forEach(function(g){ if (g.obj === obj) removeGadget(g); });
    if (carried === obj) dropCarried();
    links.slice().forEach(function(l){ if (l.objA === obj || l.objB === obj) removeLink(l); });

  // How far outside a shape's edge still counts as clicking on it.

  /* Which object is under this point — a real point-in-polygon test now,

     you cut in it does not. */
  /* Which object is under this point.

     When several overlap, the answer is the one you can actually SEE
     there — drawing a little person on top of a plane and clicking it
     used to hand you the plane, because this walked the list in
     creation order and kept the FIRST match, which is the one drawn
     underneath. Now the pick is ranked: something on the layer you are
     building on wins outright (that is the thing you are working on),
     then the frontmost layer, then whatever was drawn last. Only if

    var near = null, nearMat = null, nearD = slack;
    objects.forEach(function(o, oi){

          y < b.min.y - slack || y > b.max.y + slack) return;
      var lp = worldPtToLocal(o, x, y), i;
      for (i = 0; i < o.pieces.length; i++){

      if (hit || slack <= 0) return;
      for (i = 0; i < o.pieces.length; i++){

        if (d < nearD){ nearD = d; near = o; nearMat = o.pieces[i].m; }

    return near ? { obj: near, materialId: nearMat } : null;
  }
  function mergeObjects(a, b){
    if (a === b) return a;
    // b's regions come across in a's frame, joining their own material
    // and cutting the rest — the same rule painting follows
    var wp = b.pieces.map(function(pc){ return { m: pc.m, world: objToWorld(b, pc.poly) }; });
    a.forcedStatic = a.forcedStatic || b.forcedStatic;
    var idx = objects.indexOf(b);
    if (idx >= 0) objects.splice(idx,1);
    bolts.forEach(function(bo){ if (bo.objA===b) bo.objA=a; if (bo.objB===b) bo.objB=a; });
    if (b.body) World.remove(world, b.body);

    rebuildFromPieces(a);

    var idx = bolts.indexOf(b);

    bolts.splice(idx,1);
  }
  /* ---- Gadgets: switches and sensors -----------------------------

     A gadget sits ON an object and rides with it. Each one has an output,
     0 or 1, and a WIRE carries an output to something that takes an input:
     a motor bolt runs only while its input is on, a wobble bolt swings out
     while on and back when off. Unwired, a receiver behaves as it always
     did. This is LBP's logic in its first, simplest form — analogue
     values and the rest of the family plug into the same two arrays.

       button   on while the player stands on it; STICKY stays on once

       lever    on/off, flipped with the interact key when the player is

  var GADGET_KINDS = ["sensor","button","lever","camera","mover","watersensor","changer","eye","anim","emitter","creature","fan","sticker"];

  /* ---- Skins: drawn, animated looks on things -----------------------
     A creature, an animated object or a particle carries a SKIN: a set of
     drawn states, each a list of frames, drawn in the studio like a
     character. A creature's skin replaces its host's material look, drawn
     over the host's own shape (which stays the hitbox); a particle's is
     the little picture each one is. `action` is the state a wire plays —
     Carson's "animations that can be triggered by levers or buttons or
     sensors". */
  var SKIN_STATES = {
    eye:      [{ id:"idle", label:"Idle", emoji:"🙂" }, { id:"move", label:"Moving", emoji:"🏃" }, { id:"action", label:"Action", emoji:"⚡" }],
    creature: [{ id:"idle", label:"Idle", emoji:"🙂" }, { id:"move", label:"Moving", emoji:"🏃" }, { id:"attack", label:"Attack", emoji:"💢" }, { id:"die", label:"Death", emoji:"💀" }, { id:"action", label:"Action", emoji:"⚡" }],
    anim:     [{ id:"idle", label:"Idle", emoji:"🙂" }, { id:"action", label:"Action", emoji:"⚡" }],
    emitter:  [{ id:"particle", label:"Particle", emoji:"✨" }],

  /* ---- Links: pistons and rope ----------------------------------

    if (s !== null){
      var g = Math.max(0, Math.min(1, (y + r - s) / (2*r)));
      if (g > w) w = g;
    }
    return w;
  }

  // Same per-column surface scan the simulation does, for the cases
  // where water arrives without a step running — undoing an edit, or
  // loading a level while paused.
  function recomputeWaterTops(){
    waterTopY.fill(NaN);
    if (waterCount <= 0 || wMaxRow < 0) return;
    for (var row = wMinRow; row <= wMaxRow; row++){
      for (var col = wMinCol; col <= wMaxCol; col++){
        var lv = waterLevels[row*WCOLS + col];
        if (lv > W_MIN && waterTopY[col] !== waterTopY[col]){
          waterTopY[col] = row*WATER_CELL + WATER_CELL*(1 - Math.min(1, lv));
        }
      }
    }
  }

  /* ---- Splashes -----------------------------------------------------
     Something hitting the water fast throws up a spray and knocks the
     surface: a dip where it went in and a crown either side, which the
     simulation then rolls outward as a ripple. Size and speed scale it. */
  function disturbWater(x, K, amt){
    if (waterCount <= 0) return;
    var c = Math.floor(x / WATER_CELL);
    for (var k = -K; k <= K; k++){
      var col = c + k;
      if (col < 0 || col >= WCOLS) continue;
      var ty = waterTopY[col];
      if (ty !== ty) continue;
      var row = Math.min(WROWS - 1, Math.floor(ty / WATER_CELL)), i = row*WCOLS + col;
      if (waterSolid[i]) continue;
      var w = 1 - Math.abs(k) / (K + 1);
      if (Math.abs(k) <= K * 0.35){ waterLevels[i] = Math.max(0, waterLevels[i] - amt * 0.7 * w); }
      else {
        var d = amt * w, room = W_MAX - waterLevels[i];
        if (d <= room) waterLevels[i] += d;
        else { waterLevels[i] = W_MAX; if (row > 0 && !waterSolid[i - WCOLS]){ waterLevels[i - WCOLS] += d - room; noteWaterCell(col, row - 1); } }
      }
    }
  }
  function splashAt(x, y, size, vy){
    var k = Math.min(1, Math.abs(vy) / 14), big = Math.min(2, Math.max(0.5, size / 40));
    var n = Math.round((5 + 12 * k) * big);
    puff(x, y, n, { color:"#8FD3F0", speed: 1.4 + 2.8*k, g:0.13, angle:-Math.PI/2, spread:1.8, life: 24 + 16*k, r: 2.6, jitter: size * 0.35 });
    puff(x, y, Math.round(n * 0.6), { color:"#EAF8FD", speed: 2 + 3*k, g:0.13, angle:-Math.PI/2, spread:1.1, life: 22, r: 1.7, jitter: size * 0.25 });
    disturbWater(x, Math.max(2, Math.round(size / WATER_CELL)), 0.25 + 0.5 * k);
    if (k > 0.15) sfx("splash");
  }
  // where the surface is at x: painted water's, or the world's
  function waterSurfaceY(x, fallback){
    var s = waterSurfaceAt(x), wl = liveWater();
    if (s !== null && (wl == null || s < wl)) return s;
    return wl != null ? wl : fallback;
  }

  // ---- save / restore ----
  /* A snapshot carries only the box of cells the water is in — on a map
     this size the whole grid is nearly three million cells, and undo
     takes a snapshot per edit. */
  function packWaterBytes(){
    if (waterCount === 0 || wMaxRow < wMinRow) return null;
    var r0 = wMinRow, r1 = wMaxRow, c0 = wMinCol, c1 = wMaxCol, w = c1 - c0 + 1, h = r1 - r0 + 1;
    var out = new Uint8Array(w * h);
    for (var row = r0; row <= r1; row++){
      for (var col = c0; col <= c1; col++){
        var v = waterLevels[row*WCOLS + col];
        out[(row - r0)*w + (col - c0)] = v <= 0 ? 0 : Math.min(255, Math.round(v*200));
      }
    }
    return { r0: r0, c0: c0, w: w, h: h, bytes: out };
  }
  function unpackWaterBytes(box){
    clearWater();
    if (!box || !box.bytes) return;
    var n = 0, bytes = box.bytes;
    for (var row = 0; row < box.h; row++){
      for (var col = 0; col < box.w; col++){
        var b = bytes[row*box.w + col];
        if (!b) continue;
        var R = row + box.r0, C = col + box.c0;
        if (R < 0 || R >= WROWS || C < 0 || C >= WCOLS) continue;
        waterLevels[R*WCOLS + C] = b/200;
        noteWaterCell(C, R);
        n++;
      }
    }
    waterCount = n;
    recomputeWaterTops();
  }
  // JSON-safe form for saved levels: only the wet cells, as index/value pairs.
  function packWaterSparse(){
    var out = [];
    if (waterCount === 0 || wMaxRow < wMinRow) return out;
    for (var row = wMinRow; row <= wMaxRow; row++){
      for (var col = wMinCol; col <= wMaxCol; col++){
        var i = row*WCOLS + col, v = waterLevels[i];
        if (v <= W_MIN) continue;
        out.push(i, Math.min(255, Math.round(v*200)));
      }
    }
    return out;
  }
  function unpackWaterSparse(arr, savedCell, savedW, savedH){
    clearWater();
    if (!arr || !arr.length) return;
    var n = 0, cell = savedCell || WATER_CELL;
    var oldW = savedW || WORLD_W, oldH = savedH || WORLD_H;
    // a file from a smaller map sits at the bottom-left of this one: its rows move down by the difference
    var dRows = Math.round((WORLD_H - oldH) / WATER_CELL);
    if (cell === WATER_CELL && oldW === WORLD_W && dRows === 0){
      for (var k = 0; k + 1 < arr.length; k += 2){
        var i = arr[k];
        if (i < 0 || i >= WCELLS) continue;
        waterLevels[i] = arr[k+1]/200;
        noteWaterCell(i % WCOLS, (i / WCOLS) | 0);
        n++;
      }
    } else {
      // a level saved on a coarser or finer grid, or a smaller map: every
      // old cell covers a block of new ones (or a fraction of one), at the
      // same fullness, moved down to the bottom of this map
      var oldCols = Math.ceil(oldW / cell), ratio = cell / WATER_CELL;
      for (var k2 = 0; k2 + 1 < arr.length; k2 += 2){
        var oi = arr[k2], lv = arr[k2+1]/200;
        var oc = oi % oldCols, orow = (oi / oldCols) | 0;
        var c0 = Math.floor(oc * ratio), c1 = Math.max(c0, Math.ceil((oc + 1) * ratio) - 1);
        var r0 = Math.floor(orow * ratio) + dRows, r1 = Math.max(r0, Math.ceil((orow + 1) * ratio) - 1 + dRows);
        for (var rr = r0; rr <= r1; rr++) for (var cc = c0; cc <= c1; cc++){
          if (cc < 0 || cc >= WCOLS || rr < 0 || rr >= WROWS) continue;
          var ni = rr*WCOLS + cc;
          if (waterLevels[ni] <= W_MIN) n++;
          waterLevels[ni] = Math.min(W_MAX, Math.max(waterLevels[ni], lv));
          noteWaterCell(cc, rr);
        }
      }
    }
    waterCount = n;
    recomputeWaterTops();
  }

  // Buoyancy. Floaty's own lift works in mid-air (it's a balloon), and
  // is separate from water. In water every dab is pushed up by the
  // weight of what it displaces and pulled down by its own weight, so
  // whether something floats falls straight out of its density against
  // water's: Timber, Sponge, Bounce, Ice and Floaty ride on the
  // surface, Heavy Metal goes to the bottom. Forces are applied at each
  // dab's own position, so a long plank tips and rights itself instead
  // of sliding around flat. Dark Matter needs no force at all — it's
  // simply isStatic, so gravity never touches it.
  onStep("beforeUpdate", function(){
    var g = engine.gravity, gscale = (typeof g.scale !== "undefined") ? g.scale : 0.001;
    var noWater = (liveWater() == null) && waterCount === 0;
    objects.forEach(function(o){
      if (o.body.isStatic || o.body.isSensor) return;
      var floatSum = 0;
      o.parts.forEach(function(p){
        var mat = matOf(p.plugin.materialId);
        if (mat.floatForce) floatSum += mat.floatForce;
      });
      if (floatSum){
        Body.applyForce(o.body, o.body.position, { x: 0, y: -o.body.mass*g.y*gscale*(floatSum/o.parts.length) });
      }
      if (noWater){ o.wet = false; return; }
      var wetness = 0;
      o.parts.forEach(function(p){
        var mat = matOf(p.plugin.materialId);
        var r = partR(p);
        var sub = waterAt(p.position.x, p.position.y, r);
        if (sub <= 0.02) return;
        wetness += sub;
        // real area of the chunk, not a circle standing in for it
        var vol = Math.abs(p.area) || (Math.PI*r*r);
        // The FULL weight of the displaced water, not the net — the
        // engine is already pulling the dab down by its own weight, so
        // subtracting it here as well would cancel the lift twice and
        // sink everything. Whether it rises comes out of the two
        // densities meeting in the middle.
        var lift = WATER_DENSITY * vol * g.y * gscale * sub;
        // Safety rail: never lift a dab harder than 2.5x its own weight,
        // so no amount of odd geometry can fling something out of the
        // level. That still leaves plenty of float for the light stuff.
        var maxLift = mat.density * (o.weight == null ? 1 : o.weight) * vol * g.y * gscale * 2.5;
        if (lift > maxLift) lift = maxLift;
        Body.applyForce(o.body, p.position, { x: 0, y: -lift });
      });
      if (wetness > 0){
        // Viscous drag, so things settle and bob instead of pogoing.
        // Damped straight on the velocity: as a force this would be in
        // the wrong units — the engine multiplies force by delta
        // squared, which turns a velocity-proportional "drag" into a
        // couple of hundred times the velocity and throws the object
        // clean out of the world.
        var soak = Math.min(1, wetness / o.parts.length);
        var v = o.body.velocity;
        // just gone in, and fast: a splash where it broke the surface
        if (!o.wet && v.y > 3.5){
          var bb = o.body.bounds;
          splashAt(o.body.position.x, waterSurfaceY(o.body.position.x, bb.min.y), bb.max.x - bb.min.x, v.y);
        }
        o.wet = true;
        Body.setVelocity(o.body, { x: v.x * (1 - 0.05*soak), y: v.y * (1 - 0.06*soak) });
        Body.setAngularVelocity(o.body, o.body.angularVelocity * (1 - 0.06*soak));
      } else o.wet = false;
    });

    // The player floats too — you bob up to the surface and can swim
    // along it rather than trudging around on the bottom.
    if (player && !flying && !noWater){
      var pw = waterAt(player.position.x, player.position.y, PH/2);
      if (pw > 0.02){
        var pvol = PW*PH*0.78;
        var plift = WATER_DENSITY * pvol * g.y * gscale * pw;
        Body.applyForce(player, player.position, { x: 0, y: -plift });
        Body.setVelocity(player, { x: player.velocity.x, y: player.velocity.y * (1 - 0.09*pw) });
      }
    }
  });

  /* ============================================================
     3. Player character
     ============================================================ */
  /* The character's size is a scale on the 40×56 box everything was
     authored in. **Twice that by default** — Carson found it "REALLY
     small" — and anything from half to three and a half times. The old
     Small/Medium/Large are 0.75, 1, 1.3. `charHit` is a drawn hitbox:
     strokes in the character's box, turned into the body's polygon at
     spawn (`buildPlayerBody`); with none drawn the body is the rounded
     box it always was. `charArt` is where the picture is drawn relative
     to the body's centre — with a drawn hitbox the body's centre is that
     shape's, not the box's. */
  var CHAR_BASE_W = 40, CHAR_BASE_H = 56, CHAR_SCALE_MIN = 0.5, CHAR_SCALE_MAX = 3.5;
  var charScale = parseFloat(localStorage.getItem("pg_char_scale") || "0") || 0;
  if (!charScale){
    var oldSz = localStorage.getItem("pg_char_size");
    charScale = oldSz && CHAR_SIZES[oldSz] ? CHAR_SIZES[oldSz].h / CHAR_BASE_H : 2;   // an old choice is kept; a fresh start is twice the old default
  }
  var charSize = "medium";   // kept for older readers of the character data
  var charHit = null;
  try { charHit = normalizeDrawing(JSON.parse(localStorage.getItem("pg_char_hit") || "null"), 10, 14); } catch(e){ charHit = blankDrawing(); }
  if (!charHit) charHit = blankDrawing();
  function persistCharHit(){ try { localStorage.setItem("pg_char_hit", JSON.stringify(charHit)); } catch(e){} }
  var PW, PH, charArt = null;
  function applyCharSize(){
    PW = Math.round(CHAR_BASE_W * charScale); PH = Math.round(CHAR_BASE_H * charScale);
    charArt = { x: -PW/2, y: -PH/2, w: PW, h: PH };
  }
  applyCharSize();
  var player = null;
  var charColor = localStorage.getItem("pg_char_color") || CHAR_COLORS[0];
  var grounded = false;
  var facing = 1;
  /* ---- Grabbing, the LBP way ------------------------------------

     No aiming and no rope. Hold GRAB while touching grabbable material
     and your hands close on it where they are; let go and they open. If
     what you grabbed is hanging — sponge on a rope, on a bolt, on a
     piston — you swing with it. If it is loose on the ground you drag it.
     Grab in mid-air to catch a swinging sponge.

     Grab is a HELD key, as LBP's R1 is: hold Shift, or hold the right
     mouse button in Play. The grip is a short stiff constraint from the
     player's centre to the hold point on the object, the length it was at
     the moment of the grab so nothing snaps, and the player dangles from
     it. While holding, walking input pumps the swing instead of setting
     the speed outright — setting it, as walking does, would kill the
     swing's momentum the instant the key was released.

     `grabConstraint` is the grip; `grabHeld` is the key; `grabProbe` is a
     slightly-larger-than-the-player rectangle, never in the world, used
     only to ask "is grabbable material within reach". */
  var grabConstraint = null, grabHeld = false, grabMouse = false, grabProbe = null;
  var WALK_SPEED = 4.2;
  // the level's own walking and sprinting pace, from World settings
  function walkSpeedNow(){ return WALK_SPEED * worldNum("walkSpeed") * (input.sprint ? worldNum("sprintSpeed") : 1); }
  /* Carrying. A grabbed object that is LIGHT ENOUGH — up to about one and a
     half of the player's own weight — is not pinned to; it is picked up.
     While held it floats to wherever the cursor is, within arm's reach of
     the player, so you can lift it, carry it while walking, set it down,
     or let go on the move and throw it. Heavier things are dragged on a
     pin, as before. `carried` is the object; there is no constraint. */
  var carried = null;
  var CARRY_REACH = 120, CARRY_MASS_RATIO = 3, SWING_MAX_SPEED = 10;
  /* Carrying is at a FIXED distance: the cursor only chooses the direction,
     and the object rides a circle around the player at `carryR`. So it can
     never be pulled into you or pushed away from you — and never overlap
     you, because the radius is at least your reach plus its own size.
     That is what stops an object being used to shove yourself about, and
     it is most of what stopped the clipping. */
  var carryR = 90, carryDir = { x: 1, y: 0 };
  /* And it goes AROUND you, never through you: the direction turns toward
     the cursor at most this much a step, so pointing at the other side of
     yourself swings the object over your head rather than flying it
     through your chest — which is what used to shove you across the room. */
  var CARRY_TURN = 0.11;
  /* While carried, the object and the player do not collide at all. They
     share this negative group, which Matter takes as "never touch". That is
     what makes riding what you hold impossible, and it is the other half
     of the clipping fix: nothing you hold can push on you. */
  var CARRY_GROUP = -9;
  /* How much of a jump is left with the load in hand: nothing off it for
     something feather-light, a hop for something three times your weight. */
  function carryJumpScale(){
    if (!carried || !carried.body || !player) return 1;
    var load = carried.body.mass / Math.max(0.001, player.mass);
    return Math.max(0.2, 1 - load * 0.22);   // height goes with the square, so this is steeper than it looks
  }
  function dropCarried(){
    if (!carried) return;
    if (carried.body && carried.body.collisionFilter && carried.body.collisionFilter.group === CARRY_GROUP) carried.body.collisionFilter.group = 0;
    carried = null;
  }
  /* The carried object does not collide with the player (CARRY_GROUP), so
     when its spot is somewhere it cannot get to — under your feet, with the
     floor in the way — nothing would stop it settling inside you. So the
     one-sided version of a collision is done here by hand: find the
     overlap, and move the OBJECT out by the shortest way, never the player.
     That is what keeps it from ever pushing on you. Run before the step
     with the velocity about to be set, and again after it so the frame
     that gets drawn is clean. Returns the velocity with the inward part
     removed. */
  function carryKeepOut(cb, v){
    var hits = Query.collides(player, [cb]);
    for (var hi = 0; hi < hits.length; hi++){
      var hc = hits[hi], nx = hc.normal.x, ny = hc.normal.y;
      if (nx * (cb.position.x - player.position.x) + ny * (cb.position.y - player.position.y) < 0){ nx = -nx; ny = -ny; }
      Body.translate(cb, { x: nx * hc.depth, y: ny * hc.depth });
      var into = v.x * nx + v.y * ny;
      if (into < 0){ v = { x: v.x - into * nx, y: v.y - into * ny }; }
    }

  }
  onStep("afterUpdate", function(){
    if (!carried || !carried.body || !player) return;
    var cb = carried.body, v = carryKeepOut(cb, cb.velocity);
    if (v !== cb.velocity) Body.setVelocity(cb, v);
  });
  /* A hanging grip is never shorter than the player's own corner reach, so
     the body cannot be pulled onto the thing it holds — the hold point is
     always outside the body. It starts at the true distance (no snap) and
     grows to that over a few steps. */
  function grabMinLen(){ var ch = 16; return Math.hypot(Math.max(0, PW/2 - ch), Math.max(0, PH/2 - ch)) + ch + 2; }
  var GRAB_REACH = 16;   // the default; the level's own is worldSettings.grabReach
  var playerWet = false; // for the splash on the way in
  function grabReach(){ return worldNum("grabReach"); }
  var grabProbeReach = -1;
  var flying = false;
  var mouseWorld = { x: 0, y: 0 };

  // ---- Character creator state (persisted like charColor) ----
  var charMode = localStorage.getItem("pg_char_mode") || "preset"; // "preset" | "simple" | "animated"
  if (charMode === "rig") charMode = "animated";   // the four-part rig mode is gone

  var charFrameCounts = null;
  try { charFrameCounts = JSON.parse(localStorage.getItem("pg_char_frame_counts") || "null"); } catch(e){ charFrameCounts = null; }
  if (!charFrameCounts || typeof charFrameCounts !== "object") charFrameCounts = {};
  ANIM_STATES.forEach(function(s){ if (typeof charFrameCounts[s.id] !== "number") charFrameCounts[s.id] = s.frames; });
  function persistCharFrameCounts(){ localStorage.setItem("pg_char_frame_counts", JSON.stringify(charFrameCounts)); }
  // frames a second, per state — a run cycle wants to be quick, a bored
  // fidget slow
  var charFps = null;
  try { charFps = JSON.parse(localStorage.getItem("pg_char_fps") || "null"); } catch(e){ charFps = null; }
  if (!charFps || typeof charFps !== "object") charFps = {};
  ANIM_STATES.forEach(function(s){ if (typeof charFps[s.id] !== "number") charFps[s.id] = s.id === "run" ? 8 : 2; });
  function persistCharFps(){ localStorage.setItem("pg_char_fps", JSON.stringify(charFps)); }

  var charSprites = null;
  try { charSprites = JSON.parse(localStorage.getItem("pg_char_sprites") || "null"); } catch(e){ charSprites = null; }
  if (!charSprites || typeof charSprites !== "object") charSprites = {};
  ANIM_STATES.forEach(function(s){
    if (!Array.isArray(charSprites[s.id])) charSprites[s.id] = [];
    var fc = charFrameCounts[s.id];
    for (var i = 0; i < fc; i++){
      charSprites[s.id][i] = normalizeDrawing(charSprites[s.id][i], 10, 14);
    }
    charSprites[s.id].length = fc;
  });
  function persistCharMode(){ localStorage.setItem("pg_char_mode", charMode); }
  function persistCharSprites(){
    try { localStorage.setItem("pg_char_sprites", JSON.stringify(charSprites)); } catch(e){}
  }
  function setStateFrameCount(stateId, n){
    n = Math.max(1, Math.min(CHAR_MAX_FRAMES, n));
    charFrameCounts[stateId] = n;
    var arr = charSprites[stateId];
    while (arr.length < n) arr.push(blankDrawing());
    arr.length = n;
    persistCharFrameCounts(); persistCharSprites();
  }

  var activeEmote = null, emoteUntil = 0;
  function triggerEmote(id){
    if (charMode !== "animated"){
      showToast("Draw an Animated character in the Character Creator to use emotes.");
      return;
    }
    activeEmote = id; emoteUntil = performance.now() + 1800;
  }
  // Falls back within the SAME character rather than ever mixing in the
  // generic default look mid-animation: an undrawn frame holds that
  // state's frame 0, an undrawn state holds the idle pose, and only a
  // completely untouched character (nothing drawn anywhere) falls
  // through to the plain default rendering in drawCharacter.
  function pickCharFrame(stateId, idx){
    var frames = charSprites[stateId];
    if (drawingHasArt(frames[idx])) return frames[idx];
    if (drawingHasArt(frames[0])) return frames[0];
    if (drawingHasArt(charSprites.idle[0])) return charSprites.idle[0];
    return null;
  }
  function charPoseId(){
    var stateId = "idle";
    if (grabConstraint) stateId = "swing";
    else if (player && !grounded && player.velocity.y < -1.2) stateId = "jump";
    else if (player && !grounded && player.velocity.y > 1.2) stateId = "fall";
    else if (sliding) stateId = "slide";
    else if (crouching) stateId = "crouch";
    else if (input.left || input.right || (player && Math.abs(player.velocity.x) > 0.6)) stateId = "run";
    return stateId;
  }
  function currentCharAnim(){
    if (charMode === "simple") return { frame: charSprites.idle[0] };
    if (charMode !== "animated") return null;
    if (activeEmote && performance.now() < emoteUntil){
      return { frame: pickCharFrame(activeEmote, 0) };
    }
    if (activeEmote) activeEmote = null;
    var stateId = charPoseId();
    var fc = charFrameCounts[stateId];
    var period = 1000 / Math.max(1, charFps[stateId] || 2);
    var idx = fc > 1 ? Math.floor(performance.now()/period) % fc : 0;
    return { frame: pickCharFrame(stateId, idx), state: stateId };
  }
  // Drawn art is rasterised at 2x the on-screen size and cached, so a
  // smooth brush stroke stays smooth at any character size without
  // re-stroking every path each frame.
  function drawSpriteFrame(frame, mirror){
    var a = charArt || { x: -PW/2, y: -PH/2, w: PW, h: PH };
    var cv = drawingCanvas(frame, Math.min(2048, a.w*2), Math.min(2048, a.h*2));
    ctx.save();
    if (mirror) ctx.scale(-1, 1);
    ctx.drawImage(cv, a.x, a.y, a.w, a.h);
    ctx.restore();
  }

  var FLY_SPEED = 9;
  var SWIM_SPEED = 3.3;
  // How submerged the player is right now, 0..1. Cheap to call every
  // step, and short-circuits when the level has no water at all.
  /* Is there water AT this spot — in the cells around it, or the world's
     flood above it? Not "somewhere up this column". */
  function waterTouching(x, y, r){
    var wl = liveWater();
    if (wl != null && y + r >= wl) return true;
    if (waterCount <= 0) return false;
    var c0 = Math.max(0, Math.floor((x - r)/WATER_CELL)), c1 = Math.min(WCOLS-1, Math.floor((x + r)/WATER_CELL));
    var r0 = Math.max(0, Math.floor((y - r)/WATER_CELL)), r1 = Math.min(WROWS-1, Math.floor((y + r)/WATER_CELL));
    for (var row = r0; row <= r1; row++) for (var col = c0; col <= c1; col++){
      if (waterLevels[row*WCOLS + col] > 0.3) return true;
    }
    return false;
  }

  window.addEventListener("keyup", function(e){

  // ---- Physics-driven movement (runs inside Matter's own step, so it
  // only fires while the sim is unpaused — collisions resolve normally). ----
  onStep("beforeUpdate", function(){
    if (!player || !runner.enabled) return;
    if (grabHeld && !grabConstraint) tryGrab();
    // Sprint is a bit quicker, not a dash — LBP has no sprint at all, so
    // this stays modest enough that levels built at walking pace still work.
    var frozen = cameraFreezesPlayer();   // a camera shot with the controls off
    // crouch: Down on the ground; a slide out of a run keeps the speed for a
    // moment with the keys off; let go of Down and you stand once there is room
    var wantCrouch = input.down && !frozen && !flying && !grabConstraint && grounded && playerWetness() < 0.35;
    if (wantCrouch && !crouching){
      var runSpeed = Math.abs(player.velocity.x - groundVel().x);
      if (runSpeed > walkSpeedNow() * 0.8){ sliding = true; slideUntil = performance.now() + SLIDE_MS; slideDir = player.velocity.x > 0 ? 1 : -1; slideV = runSpeed; sfx("land"); }
      setCrouch(true);
    } else if (crouching && (!input.down || flying || grabConstraint || frozen)){
      if ((standTry++ & 7) === 0) setCrouch(false);   // refused while something is over your head; tried again every few steps (the probe is a whole body build)
    }
    if (sliding && (performance.now() > slideUntil || !grounded || !crouching)) sliding = false;
    var speed = flying ? FLY_SPEED : walkSpeedNow() * (crouching ? 0.5 : 1);
    var vx = 0;

    if (input.right && !frozen) vx += speed;

    if (sliding){ slideV *= SLIDE_DECAY; vx = slideV * slideDir; if (slideV < 1.2) sliding = false; }   // a slide carries you, its own speed easing off; the keys do nothing until it is over
    if (vx !== 0 && !sliding) facing = vx > 0 ? 1 : -1;

    if (carried){

      else {
        var cb = carried.body;
        if (cb.collisionFilter.group !== CARRY_GROUP) cb.collisionFilter.group = CARRY_GROUP;   // re-applied every step: a rebuild hands the object a fresh body
        var tx = mouseWorld.x - player.position.x, ty = mouseWorld.y - player.position.y;
        var td = Math.hypot(tx, ty);
        if (td > 8){

          // toward it at a limited rate — the short way round, or over the
          // top when the cursor is straight across, since under the feet
          // there is usually a floor in the way
          var want = Math.atan2(ty, tx), have = Math.atan2(carryDir.y, carryDir.x);
          var diff = want - have; while (diff > Math.PI) diff -= 2*Math.PI; while (diff < -Math.PI) diff += 2*Math.PI;
          if (Math.abs(diff) > Math.PI - 0.25) diff = Math.abs(diff) * (carryDir.x > 0 ? -1 : 1);

    }

      // capped — unbounded it built up to a speed that clipped the player
      // straight through what it was holding. Jump does nothing here; only
      // letting go of the grab lets go. The queued jump is dropped so it
      // does not fire the instant you release.

      if (grabConstraint.length < gml) grabConstraint.length = Math.min(gml, grabConstraint.length + 1.5);

    }

      var vy = 0;

      if (input.down) vy += FLY_SPEED;
      Body.setVelocity(player, { x: vx, y: vy });
      var g = engine.gravity, gscale = (typeof g.scale !== "undefined") ? g.scale : 0.001;
      Body.applyForce(player, player.position, { x: -player.mass*g.x*gscale, y: -player.mass*g.y*gscale });
    } else {

      // back down, which reads as the game breaking — you drift left and
      // right and never fall. In water you get full directional control
      // instead: sink with Down, rise with Up, and Space is a stroke
      // upward that can breach the surface.
      var wet = playerWetness();
      if (wet > 0.1 && !playerWet && player.velocity.y > 3.5) splashAt(player.position.x, waterSurfaceY(player.position.x, player.position.y), PW * 1.4, player.velocity.y);
      playerWet = wet > 0.1;
      if (wet > 0.35 && !grabConstraint){
        var vy = player.velocity.y;
        if (input.up) vy = -SWIM_SPEED;
        else if (input.down) vy = SWIM_SPEED;
        if (input.jumpQueued){
          vy = -SWIM_SPEED*1.5;
          sfx("splash");

        }

    }

    if (mode === "play" && player.position.y > WORLD_H + 400){

    }
  });

  // ---- Manual, physics-independent movement for while the sim is

  var lastFreeMoveT = performance.now();

  }

  /* ============================================================

     instant you left Build, so Play never leaks back into it — step on
     a dissolve platform in Play and it's whole again the moment you go
     back to building.

  /* An object as plain data: its regions' contours, delta-encoded at

     The thing a creative tool actually lives on: it takes back the last
     EDIT you made, however long ago, and it remembers what that edit
     was so the toast can tell you. Every action that changes the level
     pushes the state it is about to replace, and redo keeps whatever
     undo threw away until the next edit makes it meaningless.

  /* ============================================================
     Drawing a material region.

     LittleBigPlanet doesn't outline its materials — it BEVELS them. The
     rim you read as an outline is a little swept profile running round
     the contour: a band that turns away from the light and so shades
     darker, with the flat face of the material inside it. That is why
     LBP material reads as a solid slab of something rather than a
     coloured shape with a line round it, and it is why a thin sliver
     looks like a thin sliver instead of disappearing under its own
     border.

     Here the same thing falls out of clipping to the region and
     stroking its own contour at twice the bevel width: the outer half
     of the stroke is clipped away, so what lands is a band of exactly
     the bevel's width lying INSIDE the edge, however sharp the corner.
     A second, lighter band nudged upwards catches the top edge the way
     a real bevel catches an overhead light, and a thin ink line on the
     silhouette keeps the hand-drawn feel.

     Materials are flat colour under that. The per-dab grain, rivets and

     was wanted anyway.
     ============================================================ */
  /* Depth is alpha and a side face — NOT a scale.

     The Back layer used to be drawn at 0.88x and the Front at 1.1x, a
     leftover from when depth was faked by shrinking and growing the
     dabs a shape was made of. On real geometry that is a lie: the
     drawn shape stopped matching the polygon underneath it, so a piece
     visibly shrank the moment you let go of the brush, and clicking
     where you could see it missed, because hit-testing and physics were
     using the true size all along. Everything is 1:1 now — what you
     see is exactly where the shape is. `off` is how far the slab's
     shaded side face is thrown, which is what carries the depth. */
  /* Layer peek: with it on, in Build, everything on a layer IN FRONT of

  var layerPeek = false, peekObj = null;   // peekObj: the one object hidden while the middle button is held on it

    // it at one drawing pass per region, which matters: a level's mid

  /* ---- Object bitmaps -------------------------------------------------

     every fill, clip and stroke. Compositing is associative, so baking

  function paintObjectPasses(c, g, depth, alpha){

  /* Trace the shadow every back-facing edge of `o` throws away from the

    var mp = objectShadow(o);
    if (!mp.length) return budget;
    var b = o.body, ca = Math.cos(b.angle), sa = Math.sin(b.angle);
    var ox = b.position.x, oy = b.position.y;
    var FAR = L.r * 2.5;

    for (i = 0; i < mp.length; i++)

        if (budget <= 0) return 0;

        for (k = 0; k < nn; k++){

          pts[k] = [(wx - camX)*sc, (wy - camY)*sc];

        for (k = 0; k < nn; k++){

          // interior normal of a positively wound ring is (-dy, dx);
          // an edge only casts when the light is on the other side
          if ((L.x - p0[0]) * (-dy) + (L.y - p0[1]) * dx >= 0) continue;
          var ax = p0[0]-L.x, ay = p0[1]-L.y, bx = p1[0]-L.x, by = p1[1]-L.y;
          var la = Math.sqrt(ax*ax + ay*ay) || 1, lb = Math.sqrt(bx*bx + by*by) || 1;
          var q2x = p1[0] + bx/lb*FAR, q2y = p1[1] + by/lb*FAR;

          // would cancel each other out under a nonzero fill and punch
          // a bright hole in the middle of the shadow
          var area = (p1[0]-p0[0])*(q2y-p0[1]) - (p1[1]-p0[1])*(q2x-p0[0]);
          c2.moveTo(p0[0], p0[1]);
          if (area >= 0){
            c2.lineTo(p1[0], p1[1]); c2.lineTo(q2x, q2y); c2.lineTo(q3x, q3y);
          } else {
            c2.lineTo(q3x, q3y); c2.lineTo(q2x, q2y); c2.lineTo(p1[0], p1[1]);

      for (j = 0; j < poly.length; j++){

    // Filling them one rect at a time would overlap their edges, and at
    // this alpha each overlap paints twice — drawing a grid of seams

    // a body of water reads as one soft mass with a rounded meniscus
